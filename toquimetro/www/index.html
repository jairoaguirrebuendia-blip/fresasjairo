<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1120">
<title>Toquímetro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:linear-gradient(180deg,#0B1120 0%,#0f172a 55%,#160f28 100%);
  color:#e2e8f0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",sans-serif;
  max-width:430px;
  margin:0 auto;
  position:relative;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

/* ── scrollbar ─────────────────────────────── */
::-webkit-scrollbar{width:0;background:transparent}

/* ── header ────────────────────────────────── */
.header{padding:calc(14px + env(safe-area-inset-top)) 0 4px;text-align:center}
.logo{
  font-size:22px;font-weight:700;letter-spacing:3px;
  background:linear-gradient(135deg,#10b981,#06b6d4);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.tagline{font-size:10px;color:#475569;letter-spacing:3px;margin-top:1px}

/* ── main ──────────────────────────────────── */
.main{padding:0 16px 120px}

/* ── timer ring ────────────────────────────── */
.ring-wrap{
  width:250px;height:250px;border-radius:50%;margin:16px auto 0;
  background:radial-gradient(circle,rgba(16,185,129,.06) 0%,transparent 70%);
  border:2px solid rgba(16,185,129,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;
}
.ring-pulse{
  position:absolute;inset:-10px;border-radius:50%;
  border:1px solid rgba(16,185,129,.1);
  animation:breathe 4s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{opacity:.25;transform:scale(1)}
  50%{opacity:.5;transform:scale(1.04)}
}
.ring-label{font-size:10px;color:#64748b;letter-spacing:2px;margin-bottom:6px}
.digits{display:flex;align-items:baseline;gap:2px}
.digit{font-size:46px;font-weight:200;color:#10b981;font-variant-numeric:tabular-nums}
.digit-sec{color:#6ee7b7}
.colon{font-size:22px;color:#064e3b;margin:0 1px}
.unit-row{display:flex;gap:24px;margin-top:2px}
.unit-lbl{font-size:9px;color:#475569;letter-spacing:1px}
.msg{font-size:13px;color:#94a3b8;text-align:center;margin:20px 0 24px;font-style:italic;min-height:20px}

/* ── CTA ───────────────────────────────────── */
.cta{
  display:block;margin:0 auto;
  background:linear-gradient(135deg,#10b981,#059669);color:#fff;
  border:none;border-radius:50px;padding:15px 44px;
  font-size:15px;font-weight:600;cursor:pointer;
  box-shadow:0 4px 20px rgba(16,185,129,.28);letter-spacing:1px;
}
.cta:active{transform:scale(.97)}

/* ── stat cards row ────────────────────────── */
.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:24px}
.stat-card{
  background:rgba(30,41,59,.55);border-radius:12px;padding:12px 8px;
  border:1px solid rgba(100,116,139,.08);text-align:center;
}
.stat-val{font-size:22px;font-weight:600;margin:0}
.stat-lbl{font-size:9px;color:#64748b;margin-top:3px;letter-spacing:1px}

/* ── section title ─────────────────────────── */
.sec-title{font-size:17px;font-weight:600;margin:10px 0 14px}

/* ── history card ──────────────────────────── */
.hist-list{display:flex;flex-direction:column;gap:8px}
.hist-card{
  background:rgba(30,41,59,.55);border-radius:12px;padding:11px 14px;
  border:1px solid rgba(100,116,139,.08);
}
.hist-top{display:flex;justify-content:space-between;align-items:center}
.hist-left{display:flex;gap:10px;align-items:center}
.hist-emoji{font-size:22px}
.hist-title{font-size:13px;font-weight:600}
.hist-date{font-size:11px;color:#64748b;margin-top:1px}
.hist-right{display:flex;align-items:center;gap:6px}
.hist-mood{font-size:16px}
.hist-del{background:none;border:none;color:#475569;font-size:15px;cursor:pointer;padding:4px}
.hist-del:active{color:#ef4444}
.amount-bar{display:flex;gap:3px;margin-top:8px}
.amount-seg{flex:1;height:4px;border-radius:2px;background:rgba(100,116,139,.15)}
.amount-seg.on{background:#10b981}
.hist-gap{font-size:10px;color:#64748b;margin-top:5px}
.empty{color:#64748b;text-align:center;margin-top:60px;font-size:13px}

/* ── insights cards ────────────────────────── */
.card{
  background:rgba(30,41,59,.55);border-radius:14px;padding:16px;
  border:1px solid rgba(100,116,139,.08);margin-bottom:14px;
}
.card-label{font-size:11px;color:#64748b;letter-spacing:1.5px;margin-bottom:12px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.m-val{font-size:24px;font-weight:600;margin:0}
.m-sub{font-size:10px;color:#64748b;margin-top:2px}

/* ── bar chart ─────────────────────────────── */
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:8px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.bar-space{flex:1;display:flex;align-items:flex-end;width:100%}
.bar{
  width:100%;border-radius:4px 4px 0 0;
  background:linear-gradient(180deg,#10b981,#059669);
  transition:height .4s ease;min-height:2px;
}
.bar-val{font-size:9px;color:#94a3b8;margin-bottom:2px;text-align:center}
.bar-day{font-size:10px;color:#64748b;margin-top:5px}

/* ── SVG area chart ────────────────────────── */
.area-chart{width:100%;overflow:visible}
.trend-msg{font-size:11px;color:#94a3b8;text-align:center;margin-top:6px}

/* ── method breakdown ──────────────────────── */
.method-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.method-emoji{font-size:18px;width:26px}
.method-info{flex:1}
.method-head{display:flex;justify-content:space-between;margin-bottom:3px}
.method-name{font-size:12px;color:#e2e8f0}
.method-count{font-size:11px;color:#64748b}
.method-track{height:4px;background:rgba(100,116,139,.15);border-radius:2px}
.method-fill{height:4px;background:#10b981;border-radius:2px;transition:width .4s}

/* ── reset ─────────────────────────────────── */
.reset-btn{
  width:100%;background:rgba(239,68,68,.08);color:#ef4444;
  border:1px solid rgba(239,68,68,.18);border-radius:12px;
  padding:12px;font-size:13px;cursor:pointer;margin-top:4px;
}

/* ── modal ─────────────────────────────────── */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.65);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;
}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{
  background:linear-gradient(180deg,#1e293b,#0f172a);
  border-radius:22px 22px 0 0;padding:22px 20px 34px;
  width:100%;max-width:430px;max-height:88vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .3s ease;
}
.overlay.open .sheet{transform:translateY(0)}
.handle{width:36px;height:4px;background:#334155;border-radius:2px;margin:0 auto 18px}
.sheet h3{font-size:18px;font-weight:600;margin-bottom:2px}
.sheet .sub{font-size:12px;color:#64748b;margin-bottom:18px}
.field-label{font-size:11px;color:#94a3b8;letter-spacing:1.5px;margin-bottom:8px}

/* ── chips ─────────────────────────────────── */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.chip{
  border-radius:10px;padding:9px 13px;color:#e2e8f0;cursor:pointer;
  font-size:12px;display:flex;align-items:center;gap:5px;
  background:rgba(30,41,59,.6);border:1px solid rgba(100,116,139,.15);
  transition:all .15s;
}
.chip.active-g{background:rgba(16,185,129,.18);border-color:#10b981}
.chip.active-a{background:rgba(245,158,11,.15);border-color:#f59e0b}
.chip:active{transform:scale(.95)}
.chip-emoji{font-size:15px}

/* ── amount buttons ────────────────────────── */
.amt-row{display:flex;gap:6px;margin-bottom:4px}
.amt-btn{
  flex:1;height:38px;border-radius:8px;color:#e2e8f0;font-size:14px;font-weight:600;
  cursor:pointer;border:1px solid rgba(100,116,139,.15);
  background:rgba(30,41,59,.6);transition:all .15s;
}
.amt-btn.on{background:rgba(16,185,129,.25);border-color:rgba(16,185,129,.5)}
.amt-hints{display:flex;justify-content:space-between;margin-bottom:18px}
.amt-hint{font-size:9px;color:#64748b}

/* ── slider ────────────────────────────────── */
.slider-wrap{margin-bottom:4px}
.slider{
  width:100%;-webkit-appearance:none;appearance:none;height:6px;
  border-radius:3px;outline:none;
}
.slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:#10b981;border:2px solid #0f172a;
  box-shadow:0 2px 8px rgba(16,185,129,.4);cursor:pointer;
}
.effect-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.effect-hint{font-size:9px;color:#64748b}
.effect-val{font-size:17px;color:#10b981;font-weight:700}

/* ── modal actions ─────────────────────────── */
.modal-actions{display:flex;gap:10px}
.btn-cancel{
  flex:1;background:rgba(100,116,139,.15);color:#94a3b8;
  border:none;border-radius:12px;padding:14px;font-size:14px;cursor:pointer;
}
.btn-save{
  flex:2;background:linear-gradient(135deg,#10b981,#059669);color:#fff;
  border:none;border-radius:12px;padding:14px;font-size:14px;font-weight:600;
  cursor:pointer;box-shadow:0 4px 14px rgba(16,185,129,.25);
}
.btn-save:active,.btn-cancel:active{transform:scale(.97)}

/* ── bottom nav ────────────────────────────── */
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:430px;
  background:rgba(11,17,32,.94);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-top:1px solid rgba(100,116,139,.08);
  display:flex;padding:6px 0 14px;z-index:40;
}
.nav-btn{
  flex:1;background:none;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;
}
.nav-icon{font-size:20px}
.nav-label{font-size:10px;transition:color .2s}
.nav-label.active{color:#10b981;font-weight:600}
.nav-label.inactive{color:#64748b;font-weight:400}

/* ── safe area ─────────────────────────────── */
@supports(padding-bottom:env(safe-area-inset-bottom)){
  .bottom-nav{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .main{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>

<!-- ═══════════════ HEADER ═══════════════ -->
<div class="header">
  <div class="logo">TOQUÍMETRO</div>
  <div class="tagline">CONSCIENCIA · CONTROL · CAMBIO</div>
</div>

<!-- ═══════════════ MAIN ═════════════════ -->
<div class="main" id="main"></div>

<!-- ═══════════════ MODAL ════════════════ -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="sheet" id="sheet"></div>
</div>

<!-- ═══════════════ NAV ══════════════════ -->
<div class="bottom-nav" id="nav"></div>

<script>
/* ══════════════════════════════════════════
   DATA & STATE
   ══════════════════════════════════════════ */
const METHODS = [
  {id:"joint",label:"Joint",emoji:"🚬"},
  {id:"pipa",label:"Pipa",emoji:"🪈"},
  {id:"bong",label:"Bong",emoji:"🫧"},
  {id:"vape",label:"Vape",emoji:"💨"},
  {id:"comestible",label:"Comestible",emoji:"🍪"},
];
const MOODS = [
  {id:"relajado",label:"Relajado",emoji:"😌"},
  {id:"ansioso",label:"Ansioso",emoji:"😰"},
  {id:"social",label:"Social",emoji:"🤝"},
  {id:"creativo",label:"Creativo",emoji:"🎨"},
  {id:"medicinal",label:"Medicinal",emoji:"💊"},
];

let sessions = [];
let view = "timer";
let tickId = null;
let form = {method:"joint",amount:3,effect:5,mood:"relajado"};

/* ── storage ─────────────────────────────── */
function save(){
  try{localStorage.setItem("toquimetro",JSON.stringify(sessions))}catch(e){}
}
function load(){
  try{const d=localStorage.getItem("toquimetro");if(d)sessions=JSON.parse(d)}catch(e){}
}

/* ── utils ───────────────────────────────── */
function fmtTime(sec){
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  return{h:String(h).padStart(2,"0"),m:String(m).padStart(2,"0"),s:String(s).padStart(2,"0")};
}
function elapsed(){
  if(!sessions.length)return 0;
  return Math.max(0,Math.floor((Date.now()-sessions[sessions.length-1].ts)/1000));
}
function gapLabel(sec){
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);
  return h>0?h+"h "+m+"m":m+"m";
}
function fmtInterval(sec){
  return sec>=3600?Math.round(sec/360)/10+"h":Math.round(sec/60)+"m";
}
function msg(sec,has){
  if(!has)return"Comienza a registrar para conocer tus patrones";
  const h=sec/3600;
  if(h<.5)return"Registra tu consumo con honestidad";
  if(h<2)return"Cada momento de consciencia cuenta";
  if(h<6)return"Buen ritmo — sigue observándote";
  if(h<12)return"Medio día de claridad, vas muy bien";
  if(h<24)return"Un día transformador se construye así";
  if(h<48)return"Más de 24 h — nuevo territorio";
  return"Tu disciplina habla por sí sola";
}
function stats(){
  if(sessions.length<2)return null;
  const iv=[];
  for(let i=1;i<sessions.length;i++)iv.push((sessions[i].ts-sessions[i-1].ts)/1000);
  const avg=iv.reduce((a,b)=>a+b,0)/iv.length;
  const max=Math.max(...iv);
  const now=Date.now();
  const days=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  const daily=[];
  for(let i=6;i>=0;i--){
    const s=new Date(now-i*864e5);s.setHours(0,0,0,0);
    const e=s.getTime()+864e5;
    daily.push({day:days[s.getDay()],count:sessions.filter(x=>x.ts>=s.getTime()&&x.ts<e).length});
  }
  const trend=iv.slice(-12).map((v,i)=>({n:i+1,min:Math.round(v/60)}));
  const mc={};sessions.forEach(s=>{mc[s.method]=(mc[s.method]||0)+1});
  const todayS=new Date(now);todayS.setHours(0,0,0,0);
  const today=sessions.filter(s=>s.ts>=todayS.getTime()).length;
  const weekS=new Date(now);weekS.setDate(weekS.getDate()-weekS.getDay());weekS.setHours(0,0,0,0);
  const week=sessions.filter(s=>s.ts>=weekS.getTime()).length;
  const avgE=Math.round(sessions.reduce((a,s)=>a+s.effect,0)/sessions.length*10)/10;
  return{avg,max,daily,trend,mc,today,week,total:sessions.length,avgE};
}

/* ══════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════ */
const $=id=>document.getElementById(id);

function render(){
  if(view==="timer")renderTimer();
  else if(view==="history")renderHistory();
  else renderInsights();
  renderNav();
}

/* ── Timer ───────────────────────────────── */
function renderTimer(){
  const el=elapsed(),t=fmtTime(el),st=stats();
  let statHtml="";
  if(st){
    statHtml=`<div class="stat-row">
      <div class="stat-card"><p class="stat-val" style="color:#10b981">${st.today}</p><p class="stat-lbl">HOY</p></div>
      <div class="stat-card"><p class="stat-val" style="color:#f59e0b">${st.week}</p><p class="stat-lbl">SEMANA</p></div>
      <div class="stat-card"><p class="stat-val" style="color:#06b6d4">${fmtInterval(st.avg)}</p><p class="stat-lbl">PROMEDIO</p></div>
    </div>`;
  }
  $("main").innerHTML=`
    <div style="text-align:center">
      <div class="ring-wrap">
        <div class="ring-pulse"></div>
        <p class="ring-label">${sessions.length?"DESDE ÚLTIMO TOQUE":"SIN REGISTROS"}</p>
        <div class="digits">
          <span class="digit" id="dh">${t.h}</span><span class="colon">:</span>
          <span class="digit" id="dm">${t.m}</span><span class="colon">:</span>
          <span class="digit digit-sec" id="ds">${t.s}</span>
        </div>
        <div class="unit-row">
          <span class="unit-lbl">HRS</span><span class="unit-lbl">MIN</span><span class="unit-lbl">SEG</span>
        </div>
      </div>
      <p class="msg">${msg(el,sessions.length>0)}</p>
      <button class="cta" onclick="openModal()">🌿&nbsp; REGISTRAR TOQUE</button>
      ${statHtml}
    </div>`;
  startTick();
}

function startTick(){
  clearInterval(tickId);
  if(!sessions.length)return;
  tickId=setInterval(()=>{
    if(view!=="timer"){clearInterval(tickId);return}
    const el=elapsed(),t=fmtTime(el);
    const dh=$("dh"),dm=$("dm"),ds=$("ds");
    if(dh){dh.textContent=t.h;dm.textContent=t.m;ds.textContent=t.s}
  },1000);
}

/* ── History ─────────────────────────────── */
function renderHistory(){
  clearInterval(tickId);
  if(!sessions.length){$("main").innerHTML=`<h2 class="sec-title">Historial</h2><p class="empty">Aún no hay registros.</p>`;return}
  let cards="";
  const rev=[...sessions].reverse().slice(0,30);
  rev.forEach((s,idx)=>{
    const d=new Date(s.ts);
    const mi=METHODS.find(m=>m.id===s.method)||METHODS[0];
    const mo=MOODS.find(m=>m.id===s.mood)||MOODS[0];
    const ri=sessions.length-1-idx;
    let gap="";
    if(ri>0)gap=`<p class="hist-gap">⏱ ${gapLabel((s.ts-sessions[ri-1].ts)/1000)} desde anterior</p>`;
    let bars="";
    for(let n=1;n<=5;n++)bars+=`<div class="amount-seg${n<=s.amount?" on":""}"></div>`;
    cards+=`<div class="hist-card">
      <div class="hist-top">
        <div class="hist-left">
          <span class="hist-emoji">${mi.emoji}</span>
          <div><p class="hist-title">${mi.label} · Efecto ${s.effect}/10</p>
          <p class="hist-date">${d.toLocaleDateString("es-MX",{day:"numeric",month:"short"})} · ${d.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"})}</p></div>
        </div>
        <div class="hist-right">
          <span class="hist-mood">${mo.emoji}</span>
          <button class="hist-del" onclick="delSession('${s.id}')">✕</button>
        </div>
      </div>
      <div class="amount-bar">${bars}</div>
      ${gap}
    </div>`;
  });
  $("main").innerHTML=`<h2 class="sec-title">Historial</h2><div class="hist-list">${cards}</div>`;
}

/* ── Insights ────────────────────────────── */
function renderInsights(){
  clearInterval(tickId);
  const st=stats();
  if(!st){$("main").innerHTML=`<h2 class="sec-title">Análisis</h2><p class="empty">Registra al menos 2 toques para ver análisis.</p>`;return}

  /* bar chart */
  const maxC=Math.max(...st.daily.map(d=>d.count),1);
  let bars="";
  st.daily.forEach(d=>{
    const pct=Math.round(d.count/maxC*100);
    bars+=`<div class="bar-col">
      <div class="bar-space"><div class="bar" style="height:${pct}%"></div></div>
      ${d.count?`<span class="bar-val">${d.count}</span>`:""}
      <span class="bar-day">${d.day}</span>
    </div>`;
  });

  /* SVG area chart */
  let areaHtml="";
  if(st.trend.length>2){
    const w=280,h=100,pad=4;
    const maxV=Math.max(...st.trend.map(t=>t.min),1);
    const pts=st.trend.map((t,i)=>{
      const x=pad+i*(w-2*pad)/(st.trend.length-1);
      const y=h-pad-(t.min/maxV)*(h-2*pad);
      return{x,y};
    });
    const line=pts.map(p=>`${p.x},${p.y}`).join(" ");
    const area=`${pad},${h-pad} ${line} ${pts[pts.length-1].x},${h-pad}`;
    const last=st.trend[st.trend.length-1].min,first=st.trend[0].min;
    let trendMsg="➡️ Se mantienen estables";
    if(last>first*1.15)trendMsg="📈 Intervalos en aumento — buen progreso";
    else if(last<first*.85)trendMsg="📉 Se están acortando — momento de reflexionar";
    areaHtml=`<div class="card">
      <p class="card-label">TENDENCIA DE INTERVALOS (min)</p>
      <svg class="area-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:110px">
        <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
          <stop offset="5%" stop-color="#06b6d4" stop-opacity=".25"/>
          <stop offset="95%" stop-color="#06b6d4" stop-opacity="0"/>
        </linearGradient></defs>
        <polygon points="${area}" fill="url(#ag)"/>
        <polyline points="${line}" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="#06b6d4"/>`).join("")}
      </svg>
      <p class="trend-msg">${trendMsg}</p>
    </div>`;
  }

  /* method breakdown */
  let methHtml="";
  Object.entries(st.mc).sort((a,b)=>b[1]-a[1]).forEach(([method,count])=>{
    const info=METHODS.find(m=>m.id===method)||METHODS[0];
    const pct=Math.round(count/st.total*100);
    methHtml+=`<div class="method-row">
      <span class="method-emoji">${info.emoji}</span>
      <div class="method-info">
        <div class="method-head"><span class="method-name">${info.label}</span><span class="method-count">${count} (${pct}%)</span></div>
        <div class="method-track"><div class="method-fill" style="width:${pct}%"></div></div>
      </div>
    </div>`;
  });

  $("main").innerHTML=`
    <h2 class="sec-title">Análisis</h2>
    <div class="card">
      <p class="card-label">MÉTRICAS CLAVE</p>
      <div class="metrics">
        <div><p class="m-val" style="color:#10b981">${fmtInterval(st.avg)}</p><p class="m-sub">Intervalo promedio</p></div>
        <div><p class="m-val" style="color:#f59e0b">${fmtInterval(st.max)}</p><p class="m-sub">Mejor intervalo 🏆</p></div>
        <div><p class="m-val" style="color:#06b6d4">${st.total}</p><p class="m-sub">Total registros</p></div>
        <div><p class="m-val" style="color:#a78bfa">${st.avgE}</p><p class="m-sub">Efecto promedio</p></div>
      </div>
    </div>
    <div class="card">
      <p class="card-label">ÚLTIMOS 7 DÍAS</p>
      <div class="bar-chart">${bars}</div>
    </div>
    ${areaHtml}
    <div class="card">
      <p class="card-label">MÉTODO DE CONSUMO</p>
      ${methHtml}
    </div>
    <button class="reset-btn" onclick="resetAll()">Reiniciar todos los datos</button>`;
}

/* ── Nav ─────────────────────────────────── */
function renderNav(){
  const tabs=[{id:"timer",label:"Timer",icon:"⏱"},{id:"history",label:"Historial",icon:"📋"},{id:"insights",label:"Análisis",icon:"📊"}];
  $("nav").innerHTML=tabs.map(t=>`
    <button class="nav-btn" onclick="switchView('${t.id}')">
      <span class="nav-icon">${t.icon}</span>
      <span class="nav-label ${view===t.id?"active":"inactive"}">${t.label}</span>
    </button>`).join("");
}

/* ══════════════════════════════════════════
   MODAL
   ══════════════════════════════════════════ */
function openModal(){
  form={method:"joint",amount:3,effect:5,mood:"relajado"};
  renderModal();
  $("overlay").classList.add("open");
}
function closeModal(){$("overlay").classList.remove("open")}

function renderModal(){
  const methodChips=METHODS.map(m=>
    `<button class="chip${form.method===m.id?" active-g":""}" onclick="setForm('method','${m.id}')">
      <span class="chip-emoji">${m.emoji}</span>${m.label}</button>`).join("");
  const moodChips=MOODS.map(m=>
    `<button class="chip${form.mood===m.id?" active-a":""}" onclick="setForm('mood','${m.id}')">
      <span class="chip-emoji">${m.emoji}</span>${m.label}</button>`).join("");
  let amtBtns="";
  for(let n=1;n<=5;n++)amtBtns+=`<button class="amt-btn${n<=form.amount?" on":""}" onclick="setForm('amount',${n})">${n}</button>`;
  const pct=((form.effect-1)/9*100);

  $("sheet").innerHTML=`
    <div class="handle"></div>
    <h3>Registrar consumo</h3>
    <p class="sub">Responde con honestidad — esto es para ti.</p>
    <p class="field-label">MÉTODO</p>
    <div class="chips">${methodChips}</div>
    <p class="field-label">CANTIDAD</p>
    <div class="amt-row">${amtBtns}</div>
    <div class="amt-hints"><span class="amt-hint">Poco</span><span class="amt-hint">Mucho</span></div>
    <p class="field-label">EFECTO PERCIBIDO</p>
    <div class="slider-wrap">
      <input type="range" class="slider" min="1" max="10" value="${form.effect}"
        oninput="setForm('effect',+this.value)"
        style="background:linear-gradient(to right,#10b981 0%,#10b981 ${pct}%,rgba(100,116,139,.25) ${pct}%,rgba(100,116,139,.25) 100%)">
    </div>
    <div class="effect-row">
      <span class="effect-hint">Leve (1)</span>
      <span class="effect-val">${form.effect}</span>
      <span class="effect-hint">Intenso (10)</span>
    </div>
    <p class="field-label">ESTADO DE ÁNIMO</p>
    <div class="chips" style="margin-bottom:24px">${moodChips}</div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveSession()">Guardar registro</button>
    </div>`;
}

/* ══════════════════════════════════════════
   ACTIONS
   ══════════════════════════════════════════ */
function setForm(key,val){
  form[key]=val;
  renderModal();
}
function saveSession(){
  sessions.push({id:Date.now().toString(),ts:Date.now(),...form});
  save();closeModal();render();
}
function delSession(id){
  sessions=sessions.filter(s=>s.id!==id);
  save();render();
}
function resetAll(){
  if(confirm("¿Borrar todos los datos? No se puede deshacer.")){
    sessions=[];save();render();
  }
}
function switchView(v){view=v;render()}

/* ── Android (Capacitor) ─────────────────── */
function isModalOpen(){return $("overlay").classList.contains("open")}
function initNative(){
  const C=window.Capacitor;
  if(!C||!C.isNativePlatform||!C.isNativePlatform())return;
  const App=C.Plugins&&C.Plugins.App;
  if(!App)return;
  // Botón "atrás": cierra el modal, luego vuelve al Timer, luego sale.
  App.addListener("backButton",()=>{
    if(isModalOpen())closeModal();
    else if(view!=="timer")switchView("timer");
    else App.exitApp();
  });
  // Al volver a primer plano, refresca el contador.
  App.addListener("resume",()=>render());
}

/* ── init ────────────────────────────────── */
load();
render();
initNative();
</script>
</body>
</html>
