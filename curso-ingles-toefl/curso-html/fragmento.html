dad) a partir de tu tabla de necesidades, cada uno con su forma de medirlo.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-400\">METO-400 · Análisis de necesidades personal: el TOEFL ITP como target situation<\/a><\/li>\n<li><a href=\"#f-METO-403\">METO-403 · Principios de aprendizaje y secuencia de estudio (repaso espaciado y cuatro estrandas)<\/a><\/li>\n<li><a href=\"#f-METO-405\">METO-405 · Conciencia de género textual académico (estructura retórica de un texto)<\/a><\/li>\n<\/ul>", "quiz": []}, "METO-403": {"id": "METO-403", "titulo": "Principios de aprendizaje y secuencia de estudio (repaso espaciado y cuatro estrandas)", "categoria": "Planificación del estudio", "tema": "Práctica, repaso y memoria", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "Introducing English for Specific Purposes", "autor": "Anthony, Laurence", "edicion": "1st ed., 2018 (Routledge Introductions to English for Specific Purposes)", "capitulo": "Chapter 5 — Deciding learning objectives for ESP courses and programs", "seccion_libro": "Learning and metacognitive skills (Table 5.1) / General principles of sequencing", "paginas": "pp. 84, 87–88", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Introducing English for Specific Purposes<\/em> — Laurence Anthony, Chapter 5, Table 5.1 \"General principles of language learning\" y \"General principles of sequencing\", pp. 84, 87–88.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Ordenar tus objetivos en un plan semanal que use repaso espaciado, equilibre las cuatro \"strands\" y te enseñe a monitorear tu progreso.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p><strong>Tabla 5.1 (p. 84):<\/strong> el aprendizaje es un proceso de <em>decision-making<\/em> (el aprendiz decide \"what, why, how, when, and where to learn\"), <em>building<\/em>, <em>active<\/em>, <em>monitoring<\/em> (se rinde mejor al notar fortalezas y debilidades y reconocer el progreso), <em>emotional<\/em> e <em>incidental<\/em>.<\/p>\n<p><strong>Principios de secuencia<\/strong> (Nation &amp; Macalister, citados en pp. 87–88), entre ellos:\n- \"progressively cover useful language items, skills, and strategies rather than attempt to teach everything at once\"\n- dar \"increasingly spaced, repeated opportunities to retrieve\" los ítems en contextos variados\n- evitar interferencias al aprender ítems juntos; aprovechar el conocimiento previo\n- \"train learners how to monitor their learning gains so that they can become independent language learners\"<\/p>\n<p><strong>Cuatro strands<\/strong> con tiempo equilibrado (p. 88): <em>meaning-focused input<\/em>, <em>meaning-focused output<\/em>, <em>language-focused learning<\/em> y <em>fluency development<\/em>. Anthony advierte que no debe gastarse casi todo el tiempo en estudiar reglas (LFL).<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Una cosa a la vez:<\/strong> 1–2 temas nuevos de gramática por semana, no todo el libro.<\/li>\n<li><strong>Repaso espaciado:<\/strong> revisa cada tema el día 1, 3, 7 y 21 con preguntas tipo ITP (recuperar de memoria, no releer). No mezcles al principio temas que se confunden (p. ej. <em>who/whom<\/em> y <em>which/that<\/em>) hasta dominar uno.<\/li>\n<li><strong>Reparte el tiempo semanal en cuatro bloques:<\/strong>\n   - Input con sentido: lecturas y audios académicos (Reading/Listening).\n   - Output con sentido: resumir en voz alta o por escrito lo leído (ayuda a fijar, aunque el ITP no lo evalúe).\n   - Lenguaje: reglas de Structure y fichas de vocabulario.\n   - Fluidez: secciones cronometradas con material fácil o ya visto, para ganar velocidad.<\/li>\n<li><strong>Monitoreo:<\/strong> una hoja de progreso con aciertos por sección; ver la mejora alimenta la motivación (principio <em>emotional<\/em>).<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Pasar todo el tiempo leyendo explicaciones de gramática sin practicar ni hacer secciones con tiempo.<\/li>\n<li>Repasar releyendo apuntes en vez de responder preguntas (sin <em>retrieval<\/em>).<\/li>\n<li>\"Maratones\" de un tema y luego no volver a verlo.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Arma tu calendario de 7 días con los cuatro bloques y agenda los repasos espaciados de los temas que estudies.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-402\">METO-402 · Convertir necesidades en objetivos de lenguaje y de habilidad<\/a><\/li>\n<li><a href=\"#f-METO-404\">METO-404 · Aprender vocabulario y colocaciones con corpus y AntConc (Data-Driven Learning)<\/a><\/li>\n<\/ul>", "quiz": []}, "METO-404": {"id": "METO-404", "titulo": "Aprender vocabulario y colocaciones con corpus y AntConc (Data-Driven Learning)", "categoria": "Estrategias de vocabulario", "tema": "Estrategias y hábitos de estudio", "seccion": "meto", "nivel": "Todos", "prioridad": "Media", "tipo": "No aplica — método de estudio", "fuente": "Introducing English for Specific Purposes", "autor": "Anthony, Laurence", "edicion": "1st ed., 2018 (Routledge Introductions to English for Specific Purposes)", "capitulo": "Chapter 5 — Deciding learning objectives; Chapter 6 — Deciding materials and methods in ESP", "seccion_libro": "Register analysis (corpus analysis); Addressing the subject knowledge problem; Data-Driven Learning (DDL) in ESP; Task 6.5", "paginas": "pp. 80–81, 93–95, 115–117", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Introducing English for Specific Purposes<\/em> — Laurence Anthony, Chapter 5, pp. 80–81 y 93–95; Chapter 6, \"Data-Driven Learning (DDL) in ESP\" y Task 6.5, pp. 115–117.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Usar un corpus (colección de textos) y un concordanciador gratuito como AntConc para descubrir tú mismo las palabras frecuentes y las combinaciones típicas del inglés académico.<\/p>\n<h2>📘 Idea clave<\/h2>\n<ul>\n<li>Con corpus y herramientas como AntConc se estudian gramática y vocabulario de textos meta \"in a matter of seconds\", y \"the ability to perform a corpus analysis can itself become a goal for learners\" (p. 80). Es el enfoque <strong>Data-Driven Learning (DDL)<\/strong> (p. 81).<\/li>\n<li>En DDL el aprendiz interactúa con el corpus \"through inductive, self-directed exercises\" (pp. 115–116).<\/li>\n<li>AntConc permite ver las palabras y \"multi-word expressions\" más frecuentes, cómo se usan en contexto y en qué construcciones gramaticales aparecen (p. 93); la herramienta <strong>Keyword<\/strong> compara tu corpus con uno general (Figure 5.2, p. 93).<\/li>\n<li>Ejemplo del libro: la vista <strong>KWIC<\/strong> de <em>cleared<\/em> revela las frases \"cleared approach\" y \"cleared for the approach\" (pp. 116–117).<\/li>\n<li>Reto principal: conseguir un corpus adecuado (p. 116).<\/li>\n<\/ul>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Instala AntConc<\/strong> (gratuito, laurenceanthony.net).<\/li>\n<li><strong>Arma tu mini-corpus académico:<\/strong> 20–50 textos tipo TOEFL Reading (artículos de divulgación de biología, historia de EE. UU., geología, arte), guardados en <strong>.txt<\/strong> como indica el libro (pp. 94–95).<\/li>\n<li><strong>Word List:<\/strong> genera la lista por frecuencia; marca las palabras académicas que no conoces y pásalas a tus fichas de vocabulario.<\/li>\n<li><strong>Concordance (KWIC):<\/strong> busca una palabra (p. ej. <em>role<\/em>, <em>evidence<\/em>, <em>due<\/em>) y lee 20 líneas: anota qué preposición o verbo la acompaña (<em>play a role in<\/em>, <em>evidence of/for<\/em>, <em>due to<\/em>). Es exactamente lo que evalúa Written Expression con preposiciones y formas de palabra.<\/li>\n<li><strong>Compara con tu propia escritura<\/strong> (Task 6.5, p. 117): carga textos tuyos, busca verbos/adjetivos comunes y compara tus patrones con los del corpus.<\/li>\n<li><strong>Clusters/N-grams:<\/strong> busca combinaciones de 3–4 palabras frecuentes (<em>as a result of<\/em>, <em>in addition to<\/em>) para reconocerlas rápido al leer.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Usar un corpus que no se parece a la situación meta (chats, letras de canciones) para estudiar inglés académico.<\/li>\n<li>Mirar solo la lista de frecuencia y no leer las líneas de concordancia (el contexto es lo que enseña las colocaciones).<\/li>\n<li>Aprender palabras sueltas sin la preposición o el verbo que las acompaña.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Reúne 20 textos académicos en .txt, cárgalos en AntConc y extrae 10 colocaciones con la vista KWIC.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li>VOCAB-401<\/li>\n<li>VOCAB-400<\/li>\n<li><a href=\"#f-METO-403\">METO-403 · Principios de aprendizaje y secuencia de estudio (repaso espaciado y cuatro estrandas)<\/a><\/li>\n<\/ul>", "quiz": []}, "METO-405": {"id": "METO-405", "titulo": "Conciencia de género textual académico (estructura retórica de un texto)", "categoria": "Estrategias de lectura", "tema": "Estrategias y hábitos de estudio", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "Introducing English for Specific Purposes", "autor": "Anthony, Laurence", "edicion": "1st ed., 2018 (Routledge Introductions to English for Specific Purposes)", "capitulo": "Chapter 5 — Deciding learning objectives; Chapter 9 — Dealing with challenges in ESP", "seccion_libro": "Opening reflection (abstract); Genre analysis; Challenges dealing with specialist vocabulary and subject knowledge (Figures 9.1–9.2)", "paginas": "pp. 78–82, 172–174", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Introducing English for Specific Purposes<\/em> — Laurence Anthony, Chapter 5, pp. 78–82; Chapter 9, \"Challenges dealing with specialist vocabulary and subject knowledge\", pp. 172–174.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Reconocer la estructura típica de los textos académicos (propósito, partes y señales lingüísticas) para leer más rápido y responder preguntas de idea principal, organización y propósito del autor.<\/p>\n<h2>📘 Idea clave<\/h2>\n<ul>\n<li>Swales define un género como \"a class of communicative events, the members of which share some set of communicative purposes\" (p. 81). El análisis de género identifica \"the communicative purpose, structure, style, content, and intended audience\" de los textos (p. 82).<\/li>\n<li>El abstract de química del libro sigue una organización <strong>situation-problem-response<\/strong>, unida por el conector <em>currently<\/em>, en presente, con voz activa y pasiva y frases nominales largas (p. 78).<\/li>\n<li>En el abstract de biociencia (Figure 9.2, p. 174) Anthony etiqueta las partes <strong>[Background] [Problem] [Aim] [Results]<\/strong> y sustituye los términos técnicos por A, B, C: queda el \"esqueleto\" general/académico, p. ej. <em>\"However, predicting precise H in the I is difficult due to the absence of J.\"<\/em><\/li>\n<li>Lo que más falta al aprendiz no son los términos técnicos, sino reconocer cómo se usan \"in appropriate ways that follow the genre conventions of the field\" (p. 173).<\/li>\n<\/ul>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Etiqueta los textos de práctica:<\/strong> en cada lectura TOEFL escribe al margen la función de cada párrafo (<em>background, problem, example, contrast, conclusion<\/em>).<\/li>\n<li><strong>Busca las señales:<\/strong> subraya conectores (<em>however, currently, in this research, as a result<\/em>) — marcan el paso de una parte a otra y son la clave de preguntas de organización.<\/li>\n<li><strong>Técnica A-B-C:<\/strong> reemplaza los términos técnicos difíciles por letras y lee el esqueleto. Si entiendes el esqueleto, puedes responder la mayoría de preguntas sin conocer los términos.<\/li>\n<li><strong>Predice:<\/strong> tras el primer párrafo, adivina qué viene (¿problema? ¿solución?). Comprueba al seguir leyendo.<\/li>\n<li><strong>Banco de plantillas:<\/strong> guarda frases-esqueleto reutilizables (<em>A plays an important role in B<\/em>; <em>X is difficult due to Y<\/em>).<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Leer palabra por palabra y atascarse en términos técnicos que el TOEFL suele explicar o que no se preguntan.<\/li>\n<li>Ignorar los conectores, que revelan contraste, causa o la idea principal.<\/li>\n<li>Creer que entender un texto científico exige saber de ciencia.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Etiqueta la estructura retórica de 3 lecturas académicas y reescribe una con la técnica A-B-C.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li>VOCAB-402<\/li>\n<li><a href=\"#f-METO-402\">METO-402 · Convertir necesidades en objetivos de lenguaje y de habilidad<\/a><\/li>\n<\/ul>", "quiz": []}, "METO-406": {"id": "METO-406", "titulo": "Cómo funcionan los exámenes estandarizados (criterion- vs norm-referenced, washback)", "categoria": "Preparación de exámenes", "tema": "Exámenes: cómo funcionan y cómo prepararse", "seccion": "meto", "nivel": "Todos", "prioridad": "Media", "tipo": "No aplica — método de estudio", "fuente": "Introducing English for Specific Purposes", "autor": "Anthony, Laurence", "edicion": "1st ed., 2018 (Routledge Introductions to English for Specific Purposes)", "capitulo": "Chapter 7 — Evaluating learners, instructors, courses, and programs in ESP; Chapter 9 — Dealing with challenges in ESP", "seccion_libro": "Interpreting results from evaluations; Understanding the three characteristics of effective evaluation; Challenges integrating standardized tests into an ESP course/program", "paginas": "pp. 125–127, 178–179", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Introducing English for Specific Purposes<\/em> — Laurence Anthony, Chapter 7, pp. 125–127; Chapter 9, \"Challenges integrating standardized tests into an ESP course/program\", pp. 178–179.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Entender qué tipo de examen es el TOEFL, qué hace a una prueba confiable y cómo evitar que preparar el examen se coma todo tu aprendizaje.<\/p>\n<h2>📘 Idea clave<\/h2>\n<ul>\n<li><strong>Norm-referenced:<\/strong> compara tu resultado con el de otros (sirve para clasificar por niveles). <strong>Criterion-referenced:<\/strong> compara tu resultado con un estándar fijo (p. 125). Anthony sitúa al TOEFL, IELTS y PTE entre los exámenes de este segundo tipo, y al TOEIC como norm-referenced (pp. 125–126).<\/li>\n<li>Toda evaluación eficaz debe tener <strong>reliability, validity, and practicality<\/strong> (p. 126); es <em>reliable<\/em> si \"it produces similar results when repeated\" (p. 127).<\/li>\n<li>El <strong>washback<\/strong> de un examen estandarizado \"cannot be ignored\" (p. 179). Estrategia del libro: el resultado del test, \"while important\", es solo un componente del aprendizaje; conviene buscar el traslape entre el contenido del test y las habilidades que se estudian (p. 179).<\/li>\n<\/ul>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Piensa en un estándar, no en ganarle a otros:<\/strong> tu meta es 500, un criterio fijo. Mide tu avance contra ese número, no contra compañeros.<\/li>\n<li><strong>Simulacros confiables:<\/strong> usa siempre materiales tipo ITP oficiales o equivalentes, con el mismo tiempo y condiciones, para que la comparación entre simulacros sea <em>reliable<\/em>.<\/li>\n<li><strong>Busca el traslape:<\/strong> cada hábito \"general\" (leer, escuchar podcasts) conéctalo con una sección del ITP (p. ej. lecturas académicas → Reading; podcasts de campus → Listening).<\/li>\n<li><strong>Washback sano:<\/strong> no estudies solo trucos de examen; combina 70 % habilidades reales y 30 % práctica de formato y tiempo. Las habilidades reales también sirven después del examen.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Hacer simulacros en condiciones distintas (sin tiempo, con diccionario) y creer que el puntaje es real.<\/li>\n<li>Estudiar solo \"estrategias para el test\" y no subir el nivel de inglés.<\/li>\n<li>Obsesionarse con un número y dejar de registrar qué tipos de pregunta mejoran.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Fija las condiciones de tus simulacros (tiempo, material, sin ayudas) por escrito y respétalas en el próximo.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-400\">METO-400 · Análisis de necesidades personal: el TOEFL ITP como target situation<\/a><\/li>\n<li><a href=\"#f-METO-401\">METO-401 · Mini análisis 'just in time' y Current Best Shot: no confiar solo en lo que crees necesitar<\/a><\/li>\n<\/ul>", "quiz": []}, "METO-500": {"id": "METO-500", "titulo": "Autonomía y elección: decidir tú cómo estudias", "categoria": "Motivación", "tema": "Motivación y metas", "seccion": "meto", "nivel": "Todos", "prioridad": "Media", "tipo": "No aplica — método de estudio", "fuente": "Inviting Students to Learn: 100 Tips for Talking Effectively with Your Students", "autor": "Edwards, J.", "edicion": "2010 (ASCD)", "capitulo": "Chapter 5: 100 Tips for Talking Effectively with Your Students", "seccion_libro": "Tip 12 Choices; Tip 13 Choosing To", "paginas": "pp. 56–59", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Inviting Students to Learn<\/em> — Edwards, J., Chapter 5, Tips 12 \"Choices\" y 13 \"Choosing To\", pp. 56–59.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Sostener la motivación dándote opciones reales (qué, cómo y cuándo estudiar) y hablándote en términos de \"elijo\" en lugar de \"tengo que\".<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>Edwards sostiene que todos queremos sentir que elegimos: cuantas más opciones, más sensación de control. Además, ofrecer <strong>una<\/strong> sola opción presiona; con <strong>tres o más<\/strong> la persona elige de verdad lo que le funciona.<\/p>\n<blockquote>\n<p>\"The more choices we can give them, the more they will feel in control.\" (p. 56)<\/p>\n<\/blockquote>\n<p>El lenguaje interno también cuenta: \"have to / must / need to\" empuja a unos y frena a otros; la autora se activa con \"I want to\" o \"I am choosing to\".<\/p>\n<blockquote>\n<p>\"We believe what we tell ourselves.\" (p. 58)<\/p>\n<\/blockquote>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Menú de 3+ opciones por bloque de estudio.<\/strong> Para la gramática de la semana, por ejemplo: (a) ejercicios del libro, (b) buscar el patrón en un artículo que te interese, (c) escribir 5 oraciones propias y revisarlas con la ficha. Eliges al empezar la sesión.<\/li>\n<li><strong>Elige el formato de salida.<\/strong> Igual que el libro sugiere dejar escoger \"cómo presentar la información\" (p. 56): resume una lectura en tabla, en mapa mental o en audio de 1 minuto.<\/li>\n<li><strong>Prueba tus frases de arranque.<\/strong> Di en voz alta \"I have to study\", \"I choose to study\", \"It will be fun to study\" (lista de p. 59) y nota cuál te mueve a actuar. Escribe la ganadora en la primera página de tu cuaderno.<\/li>\n<li><strong>Registra tus elecciones positivas.<\/strong> Al cerrar la sesión anota: \"Hoy elegí estudiar 30 min antes del trabajo\". Refuerza la idea de que tú decides (p. 57).<\/li>\n<li><strong>Si una opción no funciona, cambia de opción, no de meta.<\/strong> La meta (TOEFL 500) se mantiene; el camino es elegible.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Seguir un plan rígido ajeno sin margen de elección → abandono a las pocas semanas.<\/li>\n<li>Tener demasiadas opciones abiertas sin decidir (parálisis): el menú es de 3–4, no infinito.<\/li>\n<li>Hablarse con \"debo/tengo que\" por costumbre sin comprobar si te motiva o te frena.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Arma un menú fijo de 3 actividades para cada habilidad (Structure, Reading, Listening) y pégalo junto a tu lugar de estudio. Cada sesión, elige una y escribe la frase de arranque que mejor te funcionó.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-501\">METO-501 · Curiosidad y relevancia: conectar el inglés con tu vida<\/a><\/li>\n<li><a href=\"#f-METO-502\">METO-502 · Metas en pasos pequeños y ritual de estudio<\/a><\/li>\n<\/ul>", "quiz": []}, "METO-501": {"id": "METO-501", "titulo": "Curiosidad y relevancia: conectar el inglés con tu vida", "categoria": "Motivación", "tema": "Motivación y metas", "seccion": "meto", "nivel": "Todos", "prioridad": "Media", "tipo": "No aplica — método de estudio", "fuente": "Inviting Students to Learn: 100 Tips for Talking Effectively with Your Students", "autor": "Edwards, J.", "edicion": "2010 (ASCD)", "capitulo": "Chapter 5: 100 Tips for Talking Effectively with Your Students", "seccion_libro": "Tip 19 Curious; Tip 27 Feeling Smart; Tip 45 Linking Learning with Students' Lives; Tip 100 Zeigarnik Effect", "paginas": "pp. 63, 70–71, 92, 152 (marco motivacional: p. 35)", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Inviting Students to Learn<\/em> — Edwards, J., Chapter 5, Tips 19, 27, 45 y 100, pp. 63, 70–71, 92, 152.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Despertar curiosidad antes de estudiar y vincular cada tema con tu vida, para que el estudio tenga sentido y no se olvide al cerrar el libro.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>El libro cita el marco de Ginsberg y Wlodkowski: inclusión, actitud positiva, <strong>enhancing meaning<\/strong> y <strong>engendering competence<\/strong> (p. 35). Para dar sentido, propone:\n- <strong>Relevancia:<\/strong> preguntar \"How can you relate this to your life?\" (p. 92).\n- <strong>Curiosidad:<\/strong> formular \"I'll be curious to know your reactions to what you are reading\" (p. 63).\n- <strong>Pre-enseñanza para \"sentirse listo\":<\/strong> asomarse al tema antes de estudiarlo a fondo (p. 71).\n- <strong>Efecto Zeigarnik:<\/strong> lo inacabado se recuerda y sigue rondando en la mente.<\/p>\n<blockquote>\n<p>\"when learners have uncompleted tasks, they tend to remember them and are motivated to continue thinking about them\" (p. 152)<\/p>\n<\/blockquote>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Elige lecturas de tus temas.<\/strong> Para la práctica de Reading usa textos (nivel B1) sobre lo que ya te apasiona: tu trabajo, deportes, ciencia, cocina. Los textos del TOEFL son académicos; empieza por divulgación de esas áreas.<\/li>\n<li><strong>Pregunta de relevancia (1 min).<\/strong> Antes de cada tema, escribe: \"¿Dónde usaría esto?\" (p. ej., present perfect para contar tu experiencia laboral en una entrevista).<\/li>\n<li><strong>Pregunta de curiosidad.<\/strong> Antes de leer, anota: \"I'm curious to know…\" y una predicción sobre el texto. Al terminar, compruébala.<\/li>\n<li><strong>Pre-lectura la víspera.<\/strong> El día anterior a un tema nuevo, lee 5 minutos los ejemplos de la ficha o del índice del capítulo; al día siguiente llegarás con algo conocido (p. 71).<\/li>\n<li><strong>Deja una pregunta abierta al cerrar.<\/strong> Termina la sesión con una pregunta pendiente (\"¿Por qué aquí va <em>has<\/em> y no <em>have<\/em>?\") y empieza la siguiente respondiéndola (p. 152).<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Estudiar solo material \"de examen\" aburrido desde el día uno → la motivación cae.<\/li>\n<li>Cerrar cada sesión \"todo terminado\": nada queda tirando de ti para volver.<\/li>\n<li>Saltar directo a ejercicios difíciles de un tema nuevo sin una mirada previa → sensación de \"no sirvo\".<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Escoge 3 artículos cortos en inglés de un tema que te guste. Antes de cada uno escribe una pregunta \"I'm curious to know…\"; al terminar, deja anotada una pregunta abierta para la sesión siguiente.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-500\">METO-500 · Autonomía y elección: decidir tú cómo estudias<\/a><\/li>\n<li><a href=\"#f-METO-503\">METO-503 · Sentido de competencia: el poder de 'yet' y ver tu progreso<\/a><\/li>\n<li><a href=\"#f-METO-505\">METO-505 · Repaso constante en un ambiente de estudio agradable<\/a><\/li>\n<\/ul>", "quiz": []}, "METO-502": {"id": "METO-502", "titulo": "Metas en pasos pequeños y ritual de estudio", "categoria": "Planificación del estudio", "tema": "Estrategias y hábitos de estudio", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "Inviting Students to Learn: 100 Tips for Talking Effectively with Your Students", "autor": "Edwards, J.", "edicion": "2010 (ASCD)", "capitulo": "Chapter 5: 100 Tips for Talking Effectively with Your Students", "seccion_libro": "Tip 62 Planning; Tip 54 Next Steps; Tip 29 Future Pacing", "paginas": "pp. 72–73, 101–102, 110–111", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Inviting Students to Learn<\/em> — Edwards, J., Chapter 5, Tips 62 \"Planning\", 54 \"Next Steps\" y 29 \"Future Pacing\", pp. 72–73, 101–102, 110–111.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Convertir la meta grande (TOEFL ITP 500) en tareas cortas, ordenadas y con tiempo estimado, dentro de un ritual de estudio agradable que puedas repetir.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>A veces el problema no es la motivación sino no saber <strong>cómo<\/strong> hacer la tarea (p. 110). Edwards propone: dividir lo grande en \"bites\", estimar cuánto dura cada uno, decidir el orden y premiar cada paso con un \"joy break\".<\/p>\n<blockquote>\n<p>\"'How do you eat an elephant?' is, of course, 'One bite at a time.'\" (p. 110)<\/p>\n<\/blockquote>\n<p>Dos complementos: conocer el <strong>siguiente paso<\/strong> y para qué sirve lo de hoy (Tip 54, p. 101), e imaginarte en el futuro <strong>mirando hacia atrás<\/strong> para ver qué pasos te llevaron al éxito (Tip 29, p. 73).<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Mirar atrás desde el futuro.<\/strong> Escribe: \"Ya saqué 500 en el TOEFL ITP. Mirando atrás, lo primero que hice fue…\" y lista 5–8 pasos (p. 73). Esa lista es tu borrador de plan.<\/li>\n<li><strong>Trocea hasta 10–25 min.<\/strong> \"Estudiar gramática\" es demasiado grande; \"Subject–verb agreement: leer ficha + 10 ítems\" sí es un bocado. Anota el tiempo de cada tarea (p. 110).<\/li>\n<li><strong>Ordena por energía.<\/strong> Con energía alta, tareas largas (un reading completo); con poca, tareas cortas (repasar tarjetas). Intercala cortas y largas (pp. 110–111).<\/li>\n<li><strong>Ritual fijo de inicio.<\/strong> Mismo lugar, misma hora, mismo gesto (abrir tu planificador, revisar el \"siguiente paso\" anotado ayer). Edwards usa un planificador rojo porque le da energía (p. 111): elige tu propio material que te guste usar.<\/li>\n<li><strong>Joy break tras cada bocado.<\/strong> 5 min de algo que disfrutes (caminar, música) después de cada tarea terminada (p. 110).<\/li>\n<li><strong>Mapa de habilidades a tachar.<\/strong> Como el \"schedule for the year\" para marcar habilidades adquiridas (p. 102): lista los temas del mapa TOEFL y táchalos al dominarlos.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Metas tipo \"mejorar mi inglés\" sin pasos ni tiempos → no se sabe por dónde empezar.<\/li>\n<li>Tareas de 2 horas que nunca se empiezan.<\/li>\n<li>No saber para qué sirve el ejercicio de hoy → se siente como trabajo inútil.<\/li>\n<li>Planificar sin premios ni ritual: el estudio se vuelve pura obligación.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Haz el ejercicio de \"mirar atrás desde el futuro\", conviértelo en 15 tareas de ≤25 minutos con su tiempo estimado y ejecuta una por día con un joy break al final. Al cerrar cada sesión, escribe el siguiente paso.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-500\">METO-500 · Autonomía y elección: decidir tú cómo estudias<\/a><\/li>\n<li><a href=\"#f-METO-503\">METO-503 · Sentido de competencia: el poder de 'yet' y ver tu progreso<\/a><\/li>\n<li><a href=\"#f-METO-505\">METO-505 · Repaso constante en un ambiente de estudio agradable<\/a><\/li>\n<\/ul>", "quiz": []}, "METO-503": {"id": "METO-503", "titulo": "Sentido de competencia: el poder de 'yet' y ver tu progreso", "categoria": "Motivación", "tema": "Motivación y metas", "seccion": "meto", "nivel": "Todos", "prioridad": "Media", "tipo": "No aplica — método de estudio", "fuente": "Inviting Students to Learn: 100 Tips for Talking Effectively with Your Students", "autor": "Edwards, J.", "edicion": "2010 (ASCD)", "capitulo": "Chapter 5: 100 Tips for Talking Effectively with Your Students", "seccion_libro": "Tip 98 Yet, Until Now, But Not for Long; Tip 63 Pointing Out Growth; Tip 58 Owning Successes; Tip 31 High Expectations", "paginas": "pp. 76–77, 104–105, 111–112, 150–151", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Inviting Students to Learn<\/em> — Edwards, J., Chapter 5, Tips 98, 63, 58 y 31, pp. 76–77, 104–105, 111–112, 150–151.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Sentirte capaz mientras aprendes: reformular el \"no puedo\" como \"todavía no\", registrar tu crecimiento y atribuirte tus logros.<\/p>\n<h2>📘 Idea clave<\/h2>\n<ul>\n<li><strong>\"Yet / until now / but not for long\"<\/strong> convierten un límite en algo temporal (p. 150). Ante \"I'm just dumb\", la autora pregunta: \"So . . . not knowing something yet means dumb?\" (p. 151).<\/li>\n<li><strong>Señalar el crecimiento:<\/strong> comparar dónde estabas hace semanas con lo que haces hoy; sentirse competente es clave para la motivación (Ginsberg y Wlodkowski).<blockquote>\n<p>\"help students authentically identify what they know and can do and that give students a sense of hope\" (Ginsberg, citado en p. 112)<\/p>\n<\/blockquote>\n<\/li>\n<li><strong>Los logros son tuyos:<\/strong> \"It must feel good to have succeeded!\" en lugar de trabajar para agradar a otro (pp. 104–105).<\/li>\n<li><strong>Expectativas altas:<\/strong> \"you will be surprised and delighted at just how quickly you have mastered it!\" (p. 77).<\/li>\n<\/ul>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Añade \"yet\" a tu diálogo interno.<\/strong> Cuando pienses \"I can't understand the listening\", completa en voz alta: \"…yet\". Luego pregúntate: \"What might be some of the next steps?\" (p. 151).<\/li>\n<li><strong>Línea base y comparación.<\/strong> Graba hoy un diagnóstico (un mini-test de Structure, tu tiempo leyendo un texto, un audio que entiendes al 40 %). Repite lo mismo cada 4 semanas y compara (p. 111).<\/li>\n<li><strong>Registro de \"antes / ahora\".<\/strong> Una vez por semana escribe una línea: \"Hace un mes no distinguía <em>since/for<\/em>; ahora acierto 8 de 10\".<\/li>\n<li><strong>Celebra para ti.<\/strong> Al lograr algo, dite \"It must feel good to have succeeded\" y anótalo; no esperes la aprobación de otros (p. 104).<\/li>\n<li><strong>Frase de expectativa alta.<\/strong> Pon a la vista: \"Even though this seems a little bit difficult right now, I will be surprised at how quickly I master it.\"<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Etiquetarse (\"soy malo para el inglés\") en vez de describir un estado temporal.<\/li>\n<li>Compararse con otros en lugar de con uno mismo hace un mes.<\/li>\n<li>No guardar evidencia del punto de partida: sin línea base, el progreso es invisible.<\/li>\n<li>Depender del elogio externo para seguir estudiando.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Haz y guarda una línea base (10 ítems de Structure + 1 reading cronometrado). Escribe en tu cuaderno tres frases \"I can't ___ … yet\" con un siguiente paso concreto para cada una.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-502\">METO-502 · Metas en pasos pequeños y ritual de estudio<\/a><\/li>\n<li><a href=\"#f-METO-504\">METO-504 · Retroalimentación con datos y autoevaluación<\/a><\/li>\n<\/ul>", "quiz": []}, "METO-504": {"id": "METO-504", "titulo": "Retroalimentación con datos y autoevaluación", "categoria": "Autoevaluación", "tema": "Estrategias y hábitos de estudio", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "Inviting Students to Learn: 100 Tips for Talking Effectively with Your Students", "autor": "Edwards, J.", "edicion": "2010 (ASCD)", "capitulo": "Chapter 5: 100 Tips for Talking Effectively with Your Students", "seccion_libro": "Tip 26 Feedback; Tip 74 Self-Assessing; Tip 69 Refining Versus Improving", "paginas": "pp. 68–70, 122–123, 127", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Inviting Students to Learn<\/em> — Edwards, J., Chapter 5, Tips 26 \"Feedback\", 74 \"Self-Assessing\" y 69 \"Refining Versus Improving\", pp. 68–70, 122–123, 127.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Darte retroalimentación útil a ti mismo: con datos objetivos y preguntas reflexivas, no con juicios (\"lo hice fatal\"), y revisar tu trabajo con una rúbrica sencilla.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>Siguiendo a Ellison y colegas, Edwards distingue cinco tipos de feedback: juicios, información sobre quien opina, inferencias, <strong>datos<\/strong> y <strong>preguntas reflexivas<\/strong>. Solo los dos últimos enseñan a evaluarse a uno mismo (pp. 68–69).<\/p>\n<blockquote>\n<p>\"students benefit when we provide them with data that nobody could dispute\" (p. 70)<\/p>\n<\/blockquote>\n<p>Tras los datos, una pregunta reflexiva: \"What were some of the strategies that you used…?\" (p. 70). Para revisar: marcar 3 cosas que te gustan y 3 que harías distinto (p. 127), y hablar de <strong>refinar<\/strong> en vez de <strong>mejorar<\/strong> (p. 122).<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Cambia juicios por datos.<\/strong> En lugar de \"fui malísimo en Structure\", anota: \"15 ítems, 9 correctos; 4 errores de concordancia sujeto-verbo, 2 de paralelismo\".<\/li>\n<li><strong>Una pregunta reflexiva por dato.<\/strong> \"¿Qué hice en los ítems que acerté? ¿Qué pista no vi en los de concordancia?\" (p. 70).<\/li>\n<li><strong>Regla 3 + 3.<\/strong> Al revisar un resumen o un test: marca 3 aciertos que quieres repetir y 3 cosas que harías distinto la próxima vez (p. 127).<\/li>\n<li><strong>Rúbrica de 1 a 4.<\/strong> Define 3–4 criterios fijos (p. ej., para Reading: idea principal, vocabulario en contexto, inferencia, tiempo) y puntúate cada semana (p. 127).<\/li>\n<li><strong>Bitácora de errores \"a refinar\".<\/strong> Titula tu lista de errores \"To refine\" y no \"Mis fallos\": el trabajo ya está bien y puede quedar aún mejor (p. 122).<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Corregir con la clave, contar aciertos y pasar de página sin analizar el tipo de error.<\/li>\n<li>Juicios globales (\"no sirvo\") que no dicen qué cambiar.<\/li>\n<li>Inferencias sin datos (\"seguro fue porque estaba cansado\").<\/li>\n<li>Revisar solo lo malo y no anotar lo que funcionó.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Después de cada práctica, registra en una tabla: fecha · ítems · aciertos · tipo de error · 1 pregunta reflexiva. El domingo, puntúate con tu rúbrica de 1 a 4 y elige un solo punto \"to refine\" para la semana siguiente.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-503\">METO-503 · Sentido de competencia: el poder de 'yet' y ver tu progreso<\/a><\/li>\n<li><a href=\"#f-METO-505\">METO-505 · Repaso constante en un ambiente de estudio agradable<\/a><\/li>\n<\/ul>", "quiz": []}, "METO-505": {"id": "METO-505", "titulo": "Repaso constante en un ambiente de estudio agradable", "categoria": "Repaso y memoria", "tema": "Práctica, repaso y memoria", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "Inviting Students to Learn: 100 Tips for Talking Effectively with Your Students", "autor": "Edwards, J.", "edicion": "2010 (ASCD)", "capitulo": "Chapter 5: 100 Tips for Talking Effectively with Your Students", "seccion_libro": "Tip 72 Review, Review, Review; Tip 44 Laughing; Tip 71 Resources", "paginas": "pp. 91, 125–126", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Inviting Students to Learn<\/em> — Edwards, J., Chapter 5, Tips 72 \"Review, Review, Review\", 44 \"Laughing\" y 71 \"Resources\", pp. 91, 125–126.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Asumir que una sola exposición no basta: repasar lo estudiado varias veces, en un ambiente que te haga sentir bien y con los recursos a mano.<\/p>\n<h2>📘 Idea clave<\/h2>\n<ul>\n<li><strong>Repasar:<\/strong> la mente divaga incluso en adultos; oír algo una vez no garantiza aprenderlo. Repetir los conceptos hace aprender \"even more deeply\" (p. 126).<blockquote>\n<p>\"How do we get our students to learn? Review, review, review!\" (p. 126)<\/p>\n<\/blockquote>\n<\/li>\n<li><strong>Clima emocional:<\/strong> el humor construye relación y bienestar; \"Our students will remember the way we make them feel\" (p. 91).<\/li>\n<li><strong>Recursos:<\/strong> cuando alguien se siente atascado, suele creer que le faltan recursos; conviene notar los internos y externos que ya estaban ahí (p. 125).<\/li>\n<\/ul>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Repaso programado.<\/strong> Cada tema nuevo se revisa al día siguiente, a la semana y al mes (5–10 min cada vez): relee la ficha y resuelve 3 ítems sin mirar.<\/li>\n<li><strong>Primeros 5 minutos = repaso.<\/strong> Abre cada sesión repasando lo de la sesión anterior antes de empezar algo nuevo.<\/li>\n<li><strong>Ambiente que invite.<\/strong> Un lugar fijo, ordenado, con buena luz y los materiales listos; un elemento que te guste (tu cuaderno favorito, una bebida). Quita el celular de la vista.<\/li>\n<li><strong>Mete humor en inglés.<\/strong> Un \"joke of the day\" o un clip cómico corto en inglés al final de la sesión (p. 91): practicas listening y asocias el estudio con algo agradable.<\/li>\n<li><strong>Inventario de recursos.<\/strong> Cuando te atasques, lista recursos: externos (diccionario monolingüe, fichas del curso, un foro, un amigo que sepa inglés) e internos (estrategias que te sirvieron para aprender otras cosas) (p. 125).<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>\"Ya lo vi una vez\" → creer que un tema estudiado está aprendido.<\/li>\n<li>Avanzar siempre a material nuevo sin reservar tiempo para repasar.<\/li>\n<li>Estudiar en un sitio incómodo o lleno de distracciones y culpar a la falta de voluntad.<\/li>\n<li>Quedarse atascado sin buscar los recursos que ya tienes.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Crea un calendario de repaso (día +1, +7, +30) para los temas de esta semana y dedica los primeros 5 minutos de cada sesión a repasar. Prepara tu rincón de estudio y escribe tu inventario de recursos en la contraportada del cuaderno.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-501\">METO-501 · Curiosidad y relevancia: conectar el inglés con tu vida<\/a><\/li>\n<li><a href=\"#f-METO-502\">METO-502 · Metas en pasos pequeños y ritual de estudio<\/a><\/li>\n<li><a href=\"#f-METO-504\">METO-504 · Retroalimentación con datos y autoevaluación<\/a><\/li>\n<\/ul>", "quiz": []}, "METO-600": {"id": "METO-600", "titulo": "Modelo expectativa × valor", "categoria": "Motivación", "tema": "Motivación y metas", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "Motivating Students to Learn", "autor": "Brophy, J.", "edicion": "3rd ed., 2010 (Routledge)", "capitulo": "Chapter 1 — Student Motivation: The Teacher's Perspective", "seccion_libro": "Motivation as Expectancy × Value Reasoning, Often Within a Social Context", "paginas": "pp. 15–16", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> Motivating Students to Learn — Brophy, J., Chapter 1, \"Motivation as Expectancy × Value Reasoning\", pp. 15–16.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Diagnosticar por qué bajan tus ganas de estudiar inglés revisando dos factores: si crees que puedes lograrlo (expectativa) y si le ves valor (valor).<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>El esfuerzo que una persona invierte es el <strong>producto<\/strong> (no la suma) de cuánto espera tener éxito y cuánto valora el resultado y el proceso. Si uno de los dos es cero, el esfuerzo es cero.<\/p>\n<blockquote>\n<p>\"Effort investment is viewed as the product rather than the sum of the expectancy and value factors\" (p. 16).<\/p>\n<\/blockquote>\n<p>Brophy añade: nadie invierte esfuerzo en algo que valora mucho \"if they believe that they cannot succeed no matter how hard they try\" (p. 16). Por eso hay que trabajar <strong>ambos<\/strong> lados: ver el valor de la actividad y asegurarse de que el éxito es alcanzable con esfuerzo razonable.<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Mide tus dos factores<\/strong> cada domingo (escala 0–10): \"¿Qué tan seguro estoy de llegar a 500?\" (expectativa) y \"¿Qué tanto me importa hoy?\" (valor).<\/li>\n<li><strong>Si la expectativa está baja:<\/strong> reduce el tamaño de la tarea (p. ej., 10 ítems de Structure en vez de un simulacro completo) para volver a tener éxitos frecuentes (ver <a href=\"#f-METO-601\">METO-601 · Metas próximas, específicas y desafiantes<\/a> y <a href=\"#f-METO-605\">METO-605 · Autoeficacia y sus cuatro fuentes<\/a>).<\/li>\n<li><strong>Si el valor está bajo:<\/strong> escribe en una tarjeta para qué quieres el TOEFL ITP 500 (beca, posgrado, trabajo) y qué te permitirá hacer el inglés más allá del examen (series, viajes, lectura). Léela antes de estudiar.<\/li>\n<li><strong>Valora también el proceso<\/strong>, no solo el resultado: elige materiales (lecturas, podcasts) sobre temas que te interesan para que la tarea misma tenga algo de disfrute.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Intentar \"subir la motivación\" solo con frases inspiradoras (valor) cuando el problema real es que las tareas son demasiado difíciles (expectativa).<\/li>\n<li>Elegir tareas fáciles que no te importan: alta expectativa × valor bajo = esfuerzo mínimo.<\/li>\n<li>Pensar que mucho de un factor compensa la ausencia del otro: es multiplicación, no suma.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Antes de cada sesión, anota dos números (expectativa y valor, 0–10). Si alguno es ≤3, ajusta la sesión (tarea más corta o recordatorio de tu \"para qué\") antes de empezar.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-601\">METO-601 · Metas próximas, específicas y desafiantes<\/a><\/li>\n<li><a href=\"#f-METO-605\">METO-605 · Autoeficacia y sus cuatro fuentes<\/a><\/li>\n<li>METO-608<\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p>Brophy aclara que \"value\" aquí es verbo (apreciar, ver valor), no \"values\" en el sentido de principios éticos (p. 16).<\/p>", "quiz": []}, "METO-601": {"id": "METO-601", "titulo": "Metas próximas, específicas y desafiantes", "categoria": "Motivación", "tema": "Motivación y metas", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "Motivating Students to Learn", "autor": "Brophy, J.", "edicion": "3rd ed., 2010 (Routledge)", "capitulo": "Chapter 3 — Supporting Students' Confidence as Learners", "seccion_libro": "Teach Goal Setting, Performance Appraisal, and Self-Reinforcement — Goal setting; Box 3.1", "paginas": "pp. 55–57", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> Motivating Students to Learn — Brophy, J., Chapter 3, \"Teach Goal Setting…\", pp. 55–57.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Convertir la meta lejana \"TOEFL ITP 500\" en metas semanales y diarias que realmente impulsen el esfuerzo.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>Fijar metas y comprometerse con ellas eleva el desempeño, sobre todo cuando las metas son <strong>próximas<\/strong> (aquí y ahora), <strong>específicas<\/strong> y <strong>desafiantes pero alcanzables<\/strong>:<\/p>\n<blockquote>\n<p>\"goals are (a) proximal rather than distal […], (b) specific […] rather than global […], and (c) challenging (difficult but reachable)\" (p. 55).<\/p>\n<\/blockquote>\n<p>Para una meta lejana, Brophy recomienda establecer metas próximas para cada actividad sucesiva y recordar cómo cada avance conecta con la meta final (\"keeping your eye on the prize\", p. 56). La meta debe venir con <strong>compromiso<\/strong>: \"Goal setting is not enough by itself\" (p. 56). Y la Box 3.1 advierte: para tareas diarias, metas de esfuerzo <strong>razonable<\/strong>, no extraordinario (p. 57).<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Escalera de metas:<\/strong> meta final (ITP 500 en la fecha X) → meta mensual (p. ej., dominar concordancia y tiempos verbales) → meta semanal → meta de la sesión.<\/li>\n<li><strong>Hazlas específicas y medibles:<\/strong> no \"estudiar gramática\", sino \"resolver 20 ítems de error-ID con máximo 4 errores\".<\/li>\n<li><strong>Calibra la dificultad:<\/strong> si aciertas siempre &gt;90 %, sube el reto; si &lt;50 %, bájalo. Busca el punto \"difícil pero alcanzable\".<\/li>\n<li><strong>Compromiso explícito:<\/strong> escribe la meta de la semana en un lugar visible y conecta cada logro con la meta final (\"hoy dominé <em>subject–verb agreement<\/em>: un tema Alta menos\").<\/li>\n<li><strong>Metas cualitativas para tareas complejas:<\/strong> en lectura, más que \"leer 5 textos\", usa metas como \"identificar idea principal y propósito del autor en cada texto\" (Box 3.1, p. 57).<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Quedarse solo con la meta distante (\"sacar 500\") sin metas próximas: se siente lejana y desmotiva.<\/li>\n<li>Metas vagas tipo \"hacer lo mejor que pueda\" (Brophy las llama \"too vague\", p. 56).<\/li>\n<li>Planear sesiones heroicas diarias (3 horas) que no se pueden sostener.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Escribe tu escalera de metas en una hoja y define 5 metas de sesión específicas (tarea + cantidad + criterio de éxito) para los próximos 5 días.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-600\">METO-600 · Modelo expectativa × valor<\/a><\/li>\n<li><a href=\"#f-METO-602\">METO-602 · Autoevaluación, retroalimentación informativa y autorrefuerzo<\/a><\/li>\n<li>METO-609<\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p>Las metas impuestas desde fuera pierden eficacia con el tiempo; Brophy recomienda aprender a evaluar el propio trabajo y <strong>reajustar<\/strong> metas conforme crece la competencia (Box 3.1, p. 57).<\/p>", "quiz": []}, "METO-602": {"id": "METO-602", "titulo": "Autoevaluación, retroalimentación informativa y autorrefuerzo", "categoria": "Estrategias de estudio", "tema": "Estrategias y hábitos de estudio", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "Motivating Students to Learn", "autor": "Brophy, J.", "edicion": "3rd ed., 2010 (Routledge)", "capitulo": "Chapter 3 — Supporting Students' Confidence as Learners", "seccion_libro": "Performance appraisal and feedback; Self-reinforcement", "paginas": "pp. 56–59", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> Motivating Students to Learn — Brophy, J., Chapter 3, \"Performance appraisal and feedback\" y \"Self-reinforcement\", pp. 56–59.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Darte a ti mismo retroalimentación útil (qué fallé y cómo mejorar) y registrar tu progreso para mantener la motivación.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>No toda retroalimentación ayuda: la que solo dice \"qué tan bien te fue\" puede incluso empeorar el desempeño. La útil identifica <strong>qué<\/strong> estuvo mal y <strong>cómo<\/strong> mejorar:<\/p>\n<blockquote>\n<p>\"informative feedback identifies which aspects of their performance were unacceptable and how they will need to improve\" (p. 57).<\/p>\n<\/blockquote>\n<p>Además, conviene compararse con <strong>estándares absolutos o con el propio desempeño anterior<\/strong>, no con otros (p. 58). Quien tiene metas próximas y lenguaje para evaluarse puede <strong>reforzarse a sí mismo<\/strong>: portafolios, gráficas o registros que documenten el progreso tienen efectos positivos en motivación y aprendizaje (p. 59).<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Bitácora de errores:<\/strong> por cada ítem fallado anota: tema (p. ej., <em>parallel structure<\/em>), por qué fallé (no conocía la regla / me confundí / leí rápido) y la regla correcta en inglés.<\/li>\n<li><strong>Corrige con lenguaje preciso:<\/strong> usa las categorías del examen (Structure, Written Expression, Reading — inference, etc.) para describir tus fallas.<\/li>\n<li><strong>Compárate contigo:<\/strong> grafica tu % de aciertos por sección cada semana; no te compares con puntajes de otros en foros.<\/li>\n<li><strong>Autorrefuerzo:<\/strong> al cumplir una meta próxima, márcala y date crédito explícito (\"pasé de 55 % a 70 % en error-ID\").<\/li>\n<li>Con habilidades complejas (lectura), al inicio enfócate en el <strong>proceso<\/strong> (¿apliqué la estrategia?) más que en el puntaje final (p. 57).<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Revisar solo la calificación del simulacro sin analizar por qué se falló cada ítem.<\/li>\n<li>Autoelogio vacío (\"bien, sigue así\") o autocrítica dura sin plan de mejora.<\/li>\n<li>Medir el progreso contra otras personas en vez de contra tu propia línea base.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Crea una hoja con columnas \"fecha | sección | % aciertos | errores típicos | regla a repasar\" y llénala después de cada práctica.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-601\">METO-601 · Metas próximas, específicas y desafiantes<\/a><\/li>\n<li><a href=\"#f-METO-604\">METO-604 · Atribuciones causales: esfuerzo y estrategia, no talento<\/a><\/li>\n<li>METO-609<\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p>Kluger y DeNisi (1998), citados por Brophy, hallaron que la retroalimentación redujo el desempeño más de un tercio de las veces (p. 57): por eso importa que sea informativa.<\/p>", "quiz": []}, "METO-603": {"id": "METO-603", "titulo": "Teorías implícitas de habilidad (mentalidad fija vs. de crecimiento)", "categoria": "Motivación", "tema": "Motivación y metas", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "Motivating Students to Learn", "autor": "Brophy, J.", "edicion": "3rd ed., 2010 (Routledge)", "capitulo": "Chapter 3 — Supporting Students' Confidence as Learners", "seccion_libro": "Implicit Theories of Ability", "paginas": "pp. 47–49", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> Motivating Students to Learn — Brophy, J., Chapter 3, \"Implicit Theories of Ability\", pp. 47–49.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Reemplazar la creencia \"no tengo talento para los idiomas\" por la idea, respaldada por la investigación, de que la habilidad crece con esfuerzo y estrategia.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>Brophy resume el trabajo de Carol Dweck: quienes sostienen una <strong>teoría de entidad<\/strong> ven la habilidad como fija; quienes sostienen una <strong>teoría incremental<\/strong> creen que crece con esfuerzo.<\/p>\n<blockquote>\n<p>\"those who hold an incremental theory believe that ability can be increased incrementally through effort\" (p. 48).<\/p>\n<\/blockquote>\n<p>Los \"entity theorists\" tienden a fijar metas de desempeño y a caer en indefensión ante el fracaso; los incrementales fijan metas de aprendizaje y persisten. Ante una tarea difícil, los niños orientados al dominio veían el fracaso \"as an interlude between past and future successes and as an opportunity for new learning\" (p. 47). Las intervenciones que enseñan que el cerebro forma nuevas conexiones al aprender mejoraron motivación y calificaciones (p. 48). También: se avanza hacia el dominio \"through successive approximations rather than […] in giant steps\" (p. 49).<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Detecta tu frase de entidad<\/strong> (\"soy malo para el listening\") y reescríbela en versión incremental (\"todavía no domino los <em>idioms<\/em> de los diálogos cortos; los estoy practicando\").<\/li>\n<li><strong>Usa el \"todavía\":<\/strong> \"aún no entiendo la inversión\", no \"no entiendo la inversión\".<\/li>\n<li><strong>Lee los errores como información<\/strong>, no como veredicto: cada error de Written Expression indica qué regla ajustar.<\/li>\n<li><strong>Elógiate por el proceso<\/strong>, no por \"ser inteligente\": \"fui cuidadoso al revisar el verbo\" (Brophy, siguiendo a Dweck, desaconseja elogiar la inteligencia, p. 49).<\/li>\n<li><strong>Recuerda la evidencia:<\/strong> revisa tu bitácora de progreso (<a href=\"#f-METO-602\">METO-602 · Autoevaluación, retroalimentación informativa y autorrefuerzo<\/a>) cuando dudes de que puedes mejorar.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Abandonar tras el primer simulacro bajo pensando \"el inglés no es lo mío\".<\/li>\n<li>Compararse con alguien bilingüe y concluir que hay \"gente con don\".<\/li>\n<li>Evitar los temas difíciles para no \"confirmar\" la falta de talento.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Escribe 3 frases fijas que te dices sobre el inglés y reescríbelas en versión incremental. Pégalas junto a tu material.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-604\">METO-604 · Atribuciones causales: esfuerzo y estrategia, no talento<\/a><\/li>\n<li><a href=\"#f-METO-606\">METO-606 · Metas de dominio vs. metas de desempeño (y metas de resultado)<\/a><\/li>\n<li>METO-607<\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p>Según el trabajo citado, en niños y adultos alrededor de 40 % favorece la teoría de entidad, 40 % la incremental y 20 % está indeciso; estas creencias son estables pero modificables con intervenciones (p. 48).<\/p>", "quiz": []}, "METO-604": {"id": "METO-604", "titulo": "Atribuciones causales: esfuerzo y estrategia, no talento", "categoria": "Motivación", "tema": "Motivación y metas", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "Motivating Students to Learn", "autor": "Brophy, J.", "edicion": "3rd ed., 2010 (Routledge)", "capitulo": "Chapter 3 — Supporting Students' Confidence as Learners; Chapter 5 — Rebuilding Discouraged Students' Confidence", "seccion_libro": "Causal Attributions; Box 3.2 Attributional Aspects of Feedback; Attribution retraining", "paginas": "pp. 49–51, 60, 112", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> Motivating Students to Learn — Brophy, J., Chapter 3, \"Causal Attributions\", pp. 49–51; Box 3.2, p. 60; Chapter 5, \"Attribution retraining\", p. 112.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Explicarte tus resultados (buenos y malos) de forma que te impulse a seguir: fallé por falta de conocimiento, de estrategia o de esfuerzo — causas que puedo cambiar.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>Las explicaciones que damos a nuestros resultados afectan la motivación futura. El esfuerzo y la persistencia son mayores cuando atribuimos el desempeño a <strong>causas internas y controlables<\/strong>. Ante el fracaso, lo productivo es atribuirlo a conocimiento o esfuerzo insuficientes; lo dañino es atribuirlo a baja habilidad fija (pp. 50–51).<\/p>\n<p>Los programas más recientes enfatizan la <strong>estrategia<\/strong> más que el esfuerzo, porque la mayoría ya se esfuerza; atribuirlo a una mala estrategia es \"reassuring and re-energizing\" (p. 112):<\/p>\n<blockquote>\n<p>\"you can promote the core idea that effort + strategy = success\" (p. 112).<\/p>\n<\/blockquote>\n<p>Para estudiantes con dificultades: \"Don't work hard, work smart!\" (Box 3.2, p. 60).<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Tras cada error, elige una causa controlable:<\/strong> (a) no conocía la regla, (b) usé mala estrategia (p. ej., leí todas las opciones sin analizar la oración), (c) me faltó concentración. Prohibido \"soy malo\".<\/li>\n<li><strong>Para cada causa, una acción:<\/strong> (a) estudiar la ficha GRAM del tema; (b) cambiar de estrategia (identificar sujeto y verbo primero); (c) sesiones más cortas sin distracciones.<\/li>\n<li><strong>Ante el éxito<\/strong>, reconoce \"tenía lo necesario y apliqué esfuerzo razonable\" para esperar repetirlo, en vez de \"tuve suerte\" o \"era fácil\" (p. 50).<\/li>\n<li><strong>Ensaya \"modelos de afrontamiento\":<\/strong> al revisar un error, verbaliza en voz alta cómo diagnosticarlo y corregirlo (p. 112).<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Atribuir un mal puntaje al \"talento\" (estable, incontrolable) → abandono.<\/li>\n<li>Culpar solo a factores externos (el libro, el audio) → no se cambia nada.<\/li>\n<li>Responder a todo con \"estudiar más horas\" cuando el problema es la estrategia.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Añade a tu bitácora de errores una columna \"causa controlable\" (conocimiento / estrategia / esfuerzo) y otra \"acción concreta\". Llénalas en cada práctica.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-603\">METO-603 · Teorías implícitas de habilidad (mentalidad fija vs. de crecimiento)<\/a><\/li>\n<li><a href=\"#f-METO-602\">METO-602 · Autoevaluación, retroalimentación informativa y autorrefuerzo<\/a><\/li>\n<li>METO-607<\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p>Las atribuciones también generan emociones: fracasos atribuidos a falta de esfuerzo → culpa; a falta de habilidad → vergüenza (p. 50). La vergüenza paraliza más; por eso la atribución a estrategia es la más útil.<\/p>", "quiz": []}, "METO-605": {"id": "METO-605", "titulo": "Autoeficacia y sus cuatro fuentes", "categoria": "Motivación", "tema": "Motivación y metas", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "Motivating Students to Learn", "autor": "Brophy, J.", "edicion": "3rd ed., 2010 (Routledge)", "capitulo": "Chapter 3 — Supporting Students' Confidence as Learners; Chapter 5 — Rebuilding Discouraged Students' Confidence", "seccion_libro": "Self-Efficacy Perceptions; Efficacy training", "paginas": "pp. 51–53, 112–113", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> Motivating Students to Learn — Brophy, J., Chapter 3, \"Self-Efficacy Perceptions\", pp. 51–53; Chapter 5, \"Efficacy training\", pp. 112–113.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Construir de forma deliberada la confianza en que puedes resolver los ítems del TOEFL ITP, usando las cuatro fuentes de autoeficacia.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>Bandura define autoeficacia como:<\/p>\n<blockquote>\n<p>\"beliefs in one's capabilities to organize and execute the courses of action required to produce given attainments\" (p. 51).<\/p>\n<\/blockquote>\n<p>Se adquiere sobre todo por <strong>experiencias de dominio<\/strong> (éxitos atribuidos a causas internas y controlables), pero también por <strong>aprendizaje vicario<\/strong> (ver a personas similares lograrlo), <strong>persuasión<\/strong> (una fuente confiable te convence) y <strong>estado emocional<\/strong> (estar relajado vs. ansioso) (p. 51). El <em>efficacy training<\/em> enseña a fijar metas próximas razonables y acercarse a la meta final por aproximaciones sucesivas, apreciando la pericia que se desarrolla (Table 5.1, p. 111; pp. 112–113).<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Dominio:<\/strong> diseña sesiones con éxito probable (≈70–85 % de aciertos) y registra los logros. Los éxitos repetidos son la fuente más fuerte.<\/li>\n<li><strong>Vicaria:<\/strong> busca testimonios de hispanohablantes adultos que subieron su puntaje ITP con estudio autónomo (gente parecida a ti, no nativos).<\/li>\n<li><strong>Persuasión:<\/strong> comparte tu plan con alguien de confianza (tutor, amigo) que revise tu progreso y te diga con base en datos que vas bien.<\/li>\n<li><strong>Emoción:<\/strong> antes de un simulacro, respira 1–2 minutos y estudia en condiciones tranquilas; la ansiedad reduce la autoeficacia.<\/li>\n<li><strong>Compárate con tu pasado<\/strong>, no con otros: Schunk recomienda enfocarse en cómo el desempeño actual supera el anterior (p. 113).<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Empezar con simulacros completos que generan fracaso y destruyen la confianza.<\/li>\n<li>Exceso de confianza: Brophy advierte que la autoeficacia muy alta puede llevar a la complacencia y a defender ideas erróneas (p. 52). En la <strong>práctica<\/strong>, sé humilde y busca tus errores; el <strong>día del examen<\/strong>, confía.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Escribe una \"evidencia de eficacia\" por día: algo concreto que hoy pudiste hacer en inglés y hace un mes no.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-600\">METO-600 · Modelo expectativa × valor<\/a><\/li>\n<li><a href=\"#f-METO-601\">METO-601 · Metas próximas, específicas y desafiantes<\/a><\/li>\n<li><a href=\"#f-METO-604\">METO-604 · Atribuciones causales: esfuerzo y estrategia, no talento<\/a><\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p>Brophy distingue el contexto de aprendizaje (práctica: conviene autoeficacia realista) del de desempeño (día del partido/examen: conviene confianza alta) (pp. 52–53).<\/p>", "quiz": []}, "METO-606": {"id": "METO-606", "titulo": "Metas de dominio vs. metas de desempeño (y metas de resultado)", "categoria": "Motivación", "tema": "Exámenes: cómo funcionan y cómo prepararse", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "Motivating Students to Learn", "autor": "Brophy, J.", "edicion": "3rd ed., 2010 (Routledge)", "capitulo": "Chapter 4 — Goal Theory", "seccion_libro": "Clarifying the Meanings and Implications of Students' Personal Achievement Goals", "paginas": "pp. 79–81", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> Motivating Students to Learn — Brophy, J., Chapter 4, \"Clarifying the Meanings and Implications of Students' Personal Achievement Goals\", pp. 79–81.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Combinar una meta de <strong>dominio<\/strong> (aprender inglés de verdad) con una meta de <strong>resultado<\/strong> (500 en el ITP) y evitar las metas de \"validación\" (demostrar que soy listo o superar a otros).<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>Brophy distingue tres tipos de metas de desempeño (Grant y Dweck): de <strong>resultado<\/strong> (sacar buena nota), de <strong>habilidad<\/strong> (validar que soy capaz) y <strong>normativas<\/strong> (superar a los demás). Propone separar las de resultado: una meta de resultado concreta moviliza recursos, mientras que la de autovalidación los desvía hacia \"worrying about impressing others or besting your peers\" (p. 80).<\/p>\n<blockquote>\n<p>\"Adopting a specific outcome goal […] helps you to mobilize all of your resources to do what is needed to attain that goal\" (p. 80).<\/p>\n<\/blockquote>\n<p>Quien solo persigue el dominio puede estudiar lo que le interesa y no lo que evalúa el examen; quien se alinea con la \"agenda\" de la evaluación hace preparación estratégica (p. 80). Brophy cita incluso a estudiantes de inglés en Singapur que combinaban comprensión y memorización: \"memorization with understanding\" (p. 81). Aun así, las metas de dominio se asocian con mejores patrones motivacionales en general y con la retención a largo plazo (p. 81).<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Escribe tus dos metas:<\/strong> dominio (\"entender y usar la gramática del inglés académico\") + resultado (\"ITP ≥ 500 el [fecha]\").<\/li>\n<li><strong>Alinea con la agenda del examen:<\/strong> prioriza lo que el ITP evalúa (Structure, Written Expression, Reading, Listening; ver prioridades de la matriz) y practica con su formato de ítems.<\/li>\n<li><strong>Comprende y memoriza:<\/strong> para reglas gramaticales y vocabulario, entiende la lógica y además repasa hasta automatizar.<\/li>\n<li><strong>Descarta las metas de validación:<\/strong> no estudies para demostrar a otros; compárate solo contigo.<\/li>\n<li><strong>Reserva tiempo de dominio:<\/strong> lecturas o audios por interés propio que sostienen la motivación más allá del examen.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Estudiar solo \"lo que me gusta\" (series, conversación) y descuidar Structure, que pesa mucho en el ITP.<\/li>\n<li>Estudiar solo trucos de examen sin comprender: se olvida rápido y frustra.<\/li>\n<li>Convertir el puntaje en prueba de valor personal (\"si no saco 500, soy un fracaso\").<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Revisa tu plan semanal: ¿qué % del tiempo va a secciones del ITP con su formato real? Ajusta para que al menos 2/3 esté alineado con el examen y 1/3 sea inglés por interés.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-603\">METO-603 · Teorías implícitas de habilidad (mentalidad fija vs. de crecimiento)<\/a><\/li>\n<li><a href=\"#f-METO-601\">METO-601 · Metas próximas, específicas y desafiantes<\/a><\/li>\n<li>METO-608<\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p>Brophy recalca que los teóricos de metas recomiendan fomentar metas de dominio y evitar las de \"evitación del desempeño\" (performance-avoidance), p. 81.<\/p>", "quiz": []}, "METO-700": {"id": "METO-700", "titulo": "Aprender con textos conectados, no con palabras sueltas", "categoria": "Cómo se adquiere un idioma", "tema": "Cómo se adquiere un idioma", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "The Practical Study of Languages: A Guide for Teachers and Learners", "autor": "Sweet, H.", "edicion": "Oxford University Press (serie Language and Language Learning), 1964; 2.ª impresión 1972. Original: J. M. Dent & Sons, 1899", "capitulo": "Chapter 10 — Special Principles of Method; Chapter 13 — Texts; the Reading-book", "seccion_libro": "Detached Sentences; Context · Association · Connectedness", "paginas": "pp. 99–103, 168", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>The Practical Study of Languages<\/em> — Henry Sweet (OUP, 1964; orig. 1899), Chapter 10, \"Detached Sentences; Context\" y \"Association\", pp. 99–103; Chapter 13, \"Connectedness\", p. 168.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Basar el estudio diario en textos completos y con sentido (párrafos, diálogos, artículos cortos) en lugar de listas de palabras o frases sueltas sin relación.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>Para Sweet, aprender un idioma es <strong>formar asociaciones<\/strong> entre sonidos, palabras e ideas, y esas asociaciones se fijan mejor dentro de un contexto.<\/p>\n<blockquote>\n<p>\"the main foundation of the practical study of language should be connected texts\" (p. 100)<\/p>\n<p>\"The whole process of learning a language is one of forming associations.\" (p. 102)<\/p>\n<\/blockquote>\n<p>Razones que da: una palabra aislada es ambigua (su forma y su significado dependen del contexto, p. 99–100); en un texto conectado cada repetición de una palabra \"refuerza\" lo ya aprendido (p. 168). Las frases sueltas solo se justifican como ejemplos de una regla gramatical, y deben ser frases que se entiendan solas, como <em>The sun rises in the east and sets in the west<\/em> (p. 100). Critica las frases absurdas de los manuales (<em>Thy sisters ate apples, and mine ate nuts<\/em>, p. 101).<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li>Elige como material central un <strong>texto corto y conectado<\/strong> por semana (150–300 palabras): un pasaje de Reading tipo TOEFL, un artículo sencillo o un diálogo con transcripción.<\/li>\n<li>Lee primero para entender el sentido global; después subraya palabras y estructuras nuevas <strong>dentro de la oración<\/strong> en la que aparecen.<\/li>\n<li>Anota cada palabra nueva con su <strong>frase completa del texto<\/strong>, no sola (ej. <em>look for the keys<\/em>, no \"look for = buscar\").<\/li>\n<li>Cuando estudies una regla gramatical (para Structure), busca ejemplos de ella en tus textos ya leídos.<\/li>\n<li>Relee el mismo texto varios días: cada relectura repite el vocabulario en su contexto natural.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Estudiar listas de \"100 palabras del TOEFL\" sin verlas nunca en un texto.<\/li>\n<li>Usar apps que solo muestran frases sueltas y sin relación entre sí.<\/li>\n<li>Pasar a un texto nuevo cada día sin volver a los anteriores.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Escoge un pasaje de lectura (≈250 palabras). Léelo 4 días seguidos; el último día cubre tus notas y explica en voz alta el contenido usando las frases que anotaste.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-703\">METO-703 · Vocabulario: pocas palabras frecuentes, aprendidas en contexto<\/a><\/li>\n<li><a href=\"#f-METO-704\">METO-704 · Repetición y repaso programado<\/a><\/li>\n<li><a href=\"#f-METO-706\">METO-706 · Lectura lenta-intensiva y lectura extensiva<\/a><\/li>\n<\/ul>\n<h2>🗒️ Notas<\/h2>\n<p>Idea <strong>vigente<\/strong>: la investigación moderna sobre vocabulario (aprendizaje incidental, lectura extensiva) confirma el valor del contexto y de los encuentros repetidos. Matiz moderno: el estudio deliberado de palabras con tarjetas (<em>flashcards<\/em>) también es eficaz si se <strong>combina<\/strong> con lectura, algo que Sweet subestima (ver <a href=\"#f-METO-703\">METO-703 · Vocabulario: pocas palabras frecuentes, aprendidas en contexto<\/a>).<\/p>", "quiz": []}, "METO-701": {"id": "METO-701", "titulo": "Pronunciación y lengua hablada desde el inicio", "categoria": "Cómo se adquiere un idioma", "tema": "Cómo se adquiere un idioma", "seccion": "meto", "nivel": "Todos", "prioridad": "Media", "tipo": "No aplica — método de estudio", "fuente": "The Practical Study of Languages: A Guide for Teachers and Learners", "autor": "Sweet, H.", "edicion": "Oxford University Press (serie Language and Language Learning), 1964; 2.ª impresión 1972. Original: J. M. Dent & Sons, 1899", "capitulo": "Chapter 2 — Phonetics; Chapter 7 — Begin with the Spoken Language; Chapter 10; Chapter 19", "seccion_libro": "Fallacy of Imitation · Fallacy of Minute Distinctions · Practical Considerations · Stages of Progressive Method · Self-instruction (Pronunciation)", "paginas": "pp. 5–6, 49–52, 117, 247–249", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>The Practical Study of Languages<\/em> — Henry Sweet (OUP, 1964; orig. 1899), Chapter 2, \"Fallacy of Imitation\" y \"Fallacy of Minute Distinctions\", pp. 5–6; Chapter 7, pp. 49–52; Chapter 10, p. 117; Chapter 19, \"Methods for Adults; Self-instruction\", pp. 247–249.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Dar a la pronunciación y al inglés hablado un lugar desde el primer día, porque son la base para entender el Listening y para fijar el vocabulario.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>Sweet rechaza dos \"falacias\": que la pronunciación se aprende <strong>solo imitando<\/strong> y que las pequeñas diferencias de sonido <strong>no importan<\/strong>.<\/p>\n<blockquote>\n<p>\"pronunciation can be learnt by mere imitation. This is as if fencing could be learnt by looking on\" (p. 5)<\/p>\n<\/blockquote>\n<p>Las diferencias \"mínimas\" cambian el significado (ej. <em>men / man<\/em>, <em>head / had<\/em>, p. 5–6). Además propone <strong>empezar por la lengua hablada<\/strong> y luego pasar a la escrita (p. 51), porque al escuchar \"we must understand each sentence at once\" (p. 52), mientras que al leer podemos detenernos. Para el autodidacta aconseja: \"read everything aloud\" y escucharse \"as if it were that of a stranger\" (p. 249); y primero escuchar con atención antes de intentar producir el sonido (p. 247).<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li>Aprende los <strong>pares mínimos<\/strong> que más confunden a hispanohablantes: <em>ship/sheep<\/em>, <em>full/fool<\/em>, <em>cat/cut<\/em>, <em>berry/very<\/em>, <em>think/sink<\/em>. Escúchalos y repítelos.<\/li>\n<li>Con cada palabra nueva, consulta su pronunciación (diccionario con audio o IPA) <strong>antes<\/strong> de memorizarla; no la \"inventes\" a partir de la ortografía.<\/li>\n<li>Lee en voz alta 5 minutos diarios un texto que ya entiendes; grábate y compárate con un audio nativo.<\/li>\n<li>Practica primero <strong>escuchar<\/strong>: oye la frase varias veces sin leerla, luego léela, luego repítela (shadowing).<\/li>\n<li>Para el Listening del TOEFL, fíjate en las formas habladas reales (<em>gonna<\/em>, <em>wanna<\/em>, reducciones) y en la entonación de las preguntas.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Aprender palabras solo por escrito y descubrir en el Listening que no se reconocen al oírlas.<\/li>\n<li>Pensar que \"con que me entiendan basta\" y no distinguir vocales que cambian el significado.<\/li>\n<li>Leer siempre en silencio y nunca escuchar la propia voz.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Haz una lista de 10 pares mínimos inglés difíciles para ti; practícalos 5 minutos al día con audio y grábate el día 1 y el día 7 para comparar.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-700\">METO-700 · Aprender con textos conectados, no con palabras sueltas<\/a><\/li>\n<li><a href=\"#f-METO-706\">METO-706 · Lectura lenta-intensiva y lectura extensiva<\/a><\/li>\n<\/ul>\n<h2>🗒️ Notas<\/h2>\n<p><strong>Parcialmente superado.<\/strong> Sweet exigía dominar la fonética (y su transcripción) antes de avanzar en gramática y vocabulario; ya el prefacio de la edición de 1964 (R. Mackin, pp. vi–vii) señala que el uso de símbolos fonéticos dejó de considerarse fundamental. Hoy se prioriza la <strong>inteligibilidad<\/strong> sobre el acento nativo y se enseña pronunciación junto con lo demás, no como etapa previa obligatoria. Sigue vigente: la imitación sola no basta para adultos, y la percepción de contrastes de sonido ayuda mucho a la comprensión auditiva. La TOEFL ITP no evalúa la expresión oral, pero reconocer el inglés hablado es clave para la sección Listening.<\/p>", "quiz": []}, "METO-702": {"id": "METO-702", "titulo": "La gramática como herramienta, estudiada junto a los textos", "categoria": "Estrategias y hábitos de estudio", "tema": "Estrategias y hábitos de estudio", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "The Practical Study of Languages: A Guide for Teachers and Learners", "autor": "Sweet, H.", "edicion": "Oxford University Press (serie Language and Language Learning), 1964; 2.ª impresión 1972. Original: J. M. Dent & Sons, 1899", "capitulo": "Chapter 10 — Special Principles of Method; Chapter 11 — Grammar; Chapter 19 — General Considerations", "seccion_libro": "Paradigms · Relations between Texts, Grammar, and Vocabulary · Grammar Learnt Unconsciously · Self-instruction (The Grammar)", "paginas": "pp. 98, 113–116, 128, 249–251", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>The Practical Study of Languages<\/em> — Henry Sweet (OUP, 1964; orig. 1899), Chapter 10, \"Paradigms\" y \"Relations between Texts, Grammar, and Vocabulary\", pp. 98, 113–116; Chapter 11, \"Grammar Learnt Unconsciously\", p. 128; Chapter 19, \"Self-instruction — The Grammar\", pp. 249–251.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Usar la gramática como un mapa que explica lo que se ve en los textos (y lo que pide la sección Structure), sin confundir \"saber la regla\" con \"saber el idioma\".<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>Sweet defiende la gramática (contra los reformistas que la querían eliminar), pero como herramienta:<\/p>\n<blockquote>\n<p>\"A knowledge of the grammar by no means necessarily implies a knowledge of the language itself\" (p. 98)<\/p>\n<\/blockquote>\n<p>Uno sabe el género de <em>lune<\/em> no al recitar \"sustantivo femenino\", sino al asociarla con <em>la<\/em> (p. 98–99). Lo principal es que \"the texts and the grammar should be intimately associated, and studied as much as possible simultaneously\" (p. 116). Para el autodidacta recomienda: <strong>empezar con una gramática corta<\/strong>, hacer primero un panorama general del idioma para saber dónde están las dificultades (p. 249), tachar lo superfluo y priorizar las reglas que cubren más palabras frecuentes y tienen menos excepciones (p. 250). La gramática se estudia <strong>durante todo el curso<\/strong>: \"there should be no idea of getting up the grammar at one stroke, and then throwing it aside\" (p. 251).<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li>Usa una gramática <strong>corta<\/strong> como base (no un tratado de 600 páginas al inicio) y hojéala completa una vez para tener el panorama.<\/li>\n<li>Prioriza las reglas de alto rendimiento para la TOEFL ITP: concordancia sujeto-verbo, tiempos verbales, paralelismo, cláusulas relativas, artículos.<\/li>\n<li>Cada vez que estudies una regla, busca 3–5 ejemplos en textos que ya leíste (gramática inductiva: del ejemplo a la regla, p. 115–116).<\/li>\n<li>Deja para después las excepciones raras y los usos literarios o arcaicos.<\/li>\n<li>Cuando avances a un tema nuevo (p. ej. verbos después de sustantivos), <strong>relee textos antiguos<\/strong> fijándote en ese tema (p. 251).<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Memorizar tablas y listas de excepciones sin verlas en uso.<\/li>\n<li>Estudiar \"toda la gramática primero\" y postergar la lectura.<\/li>\n<li>Abandonar la gramática al empezar a leer con soltura (Sweet: debe seguir hasta el final).<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Elige una regla de Structure (p. ej. <em>subject-verb agreement<\/em>). Busca 5 ejemplos reales en tus lecturas, cópialos y marca sujeto y verbo en cada uno.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-700\">METO-700 · Aprender con textos conectados, no con palabras sueltas<\/a><\/li>\n<li><a href=\"#f-METO-704\">METO-704 · Repetición y repaso programado<\/a><\/li>\n<li><a href=\"#f-METO-707\">METO-707 · Metas por etapas, ritmo y motivación del adulto<\/a><\/li>\n<\/ul>\n<h2>🗒️ Notas<\/h2>\n<p><strong>Vigente en lo esencial.<\/strong> La investigación actual sobre <em>focus on form<\/em> e instrucción explícita confirma que la gramática explícita ayuda a los adultos, sobre todo cuando se vincula a input con significado — justo lo que propone Sweet. Para la TOEFL ITP, cuya sección Structure &amp; Written Expression es reconocimiento de formas, el estudio explícito de reglas es especialmente rentable.<\/p>", "quiz": []}, "METO-703": {"id": "METO-703", "titulo": "Vocabulario: pocas palabras frecuentes, aprendidas en contexto", "categoria": "Estrategias y hábitos de estudio", "tema": "Estrategias y hábitos de estudio", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "The Practical Study of Languages: A Guide for Teachers and Learners", "autor": "Sweet, H.", "edicion": "Oxford University Press (serie Language and Language Learning), 1964; 2.ª impresión 1972. Original: J. M. Dent & Sons, 1899", "capitulo": "Chapter 8 — Difficulties of Language; Chapter 10; Chapter 12 — The Dictionary; Study of the Vocabulary; Chapter 13", "seccion_libro": "The Real Difficulty is in the Vocabulary · Learning Lists of Words · Memory · Study of the Vocabulary of a Language · Limited Vocabulary · The Most Necessary Elements given First", "paginas": "pp. 64, 99, 109, 157–161, 172–173", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>The Practical Study of Languages<\/em> — Henry Sweet (OUP, 1964; orig. 1899), Chapter 8, p. 64; Chapter 10, \"Learning Lists of Words\" y \"Memory; Repetition\", pp. 99, 109; Chapter 12, \"Study of the Vocabulary of a Language\", pp
