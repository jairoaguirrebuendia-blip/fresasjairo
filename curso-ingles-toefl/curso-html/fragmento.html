. 157–161; Chapter 13, \"Limited Vocabulary\", pp. 172–173.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Construir un vocabulario <strong>limitado pero dominado<\/strong>, empezando por las palabras y combinaciones más frecuentes, y aprendiéndolas en contexto.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>Para Sweet, la verdadera dificultad de un idioma está en el vocabulario (p. 64). Su estrategia es de <strong>economía<\/strong>:<\/p>\n<blockquote>\n<p>\"begin with as small a vocabulary as possible, and to master that vocabulary thoroughly before proceeding to learn new words\" (p. 109)<\/p>\n<\/blockquote>\n<p>Rechaza empezar por listas: \"if I learn two hundred words a day, I shall have a perfect knowledge of German in a fortnight\" es para él la peor forma de aislamiento (p. 99). Calcula que unas <strong>3,000 palabras<\/strong> bien dominadas bastan para hablar de cualquier tema cotidiano (p. 172). Insiste en las <strong>combinaciones idiomáticas<\/strong>: quien aprende por la literatura sabe muchas palabras pero no dice <em>look for<\/em> (sino <em>seek<\/em>) ni <em>get wet<\/em> (sino <em>become wet<\/em>) (p. 172). Las palabras parecidas a las de la propia lengua sirven de \"centros\" alrededor de los cuales se agrupan otras (p. 157); y un repaso posterior organizado por significados (tipo tesauro) refuerza lo ya aprendido, pero <strong>no<\/strong> sustituye la lectura (p. 161).<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li>Empieza por las palabras de <strong>alta frecuencia<\/strong> (General Service List / Academic Word List) antes que por palabras raras \"de examen\".<\/li>\n<li>Aprovecha los <strong>cognados<\/strong> español-inglés (<em>important<\/em>, <em>analysis<\/em>, <em>economy<\/em>), pero verifica los falsos amigos (<em>actually<\/em>, <em>library<\/em>, <em>assist<\/em>).<\/li>\n<li>Registra <strong>colocaciones y phrasal verbs<\/strong> completos: <em>look for<\/em>, <em>take part in<\/em>, <em>depend on<\/em>, <em>get wet<\/em>.<\/li>\n<li>Domina un lote pequeño (20–30 palabras por semana) antes de añadir más; mide el \"dominio\" por si la reconoces y la usas en una frase.<\/li>\n<li>Una vez que tengas una base, agrupa lo aprendido por temas o significado (sinónimos, antónimos) para repasar y afinar matices — útil para <em>vocabulary in context<\/em> del Reading.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Querer aprender 100–200 palabras diarias de una lista y olvidarlas en una semana.<\/li>\n<li>Aprender palabras literarias o raras antes que las básicas.<\/li>\n<li>Anotar la traducción de una palabra suelta sin la preposición o el verbo que la acompaña.<\/li>\n<li>Leer todas las acepciones del diccionario; Sweet aconseja estudiar solo las que ya encontraste en tus textos (p. 157).<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Saca de tus lecturas 20 palabras o colocaciones frecuentes; escribe cada una con su frase original. Al final de la semana cubre el inglés y reconstruye las frases.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-700\">METO-700 · Aprender con textos conectados, no con palabras sueltas<\/a><\/li>\n<li><a href=\"#f-METO-704\">METO-704 · Repetición y repaso programado<\/a><\/li>\n<li><a href=\"#f-METO-706\">METO-706 · Lectura lenta-intensiva y lectura extensiva<\/a><\/li>\n<\/ul>\n<h2>🗒️ Notas<\/h2>\n<p><strong>Muy vigente<\/strong>, y se adelanta a la investigación del siglo XX sobre listas de frecuencia (West, Nation) y sobre colocaciones. <strong>Matiz moderno:<\/strong> Sweet descarta casi por completo el estudio de palabras sueltas; hoy se sabe que el aprendizaje deliberado con tarjetas y repetición espaciada es eficaz <strong>como complemento<\/strong> de la lectura (no como sustituto). La cifra de 3,000 palabras coincide con estimaciones modernas para la comprensión básica; para lectura académica tipo TOEFL se recomienda llegar a 5,000 familias de palabras o más.<\/p>", "quiz": []}, "METO-704": {"id": "METO-704", "titulo": "Repetición y repaso programado", "categoria": "Práctica, repaso y memoria", "tema": "Práctica, repaso y memoria", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "The Practical Study of Languages: A Guide for Teachers and Learners", "autor": "Sweet, H.", "edicion": "Oxford University Press (serie Language and Language Learning), 1964; 2.ª impresión 1972. Original: J. M. Dent & Sons, 1899", "capitulo": "Chapter 10 — Special Principles of Method; Chapter 12; Chapter 19 — General Considerations", "seccion_libro": "Memory; Repetition · Interest · Study of the Vocabulary of a Language · Time and Effort · Self-instruction", "paginas": "pp. 108–111, 161, 236–237, 248, 250–251", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>The Practical Study of Languages<\/em> — Henry Sweet (OUP, 1964; orig. 1899), Chapter 10, \"Memory; Repetition\", pp. 108–111; Chapter 12, p. 161; Chapter 19, \"Time and Effort\", pp. 236–237, y \"Self-instruction\", pp. 248, 250–251.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Organizar un sistema de repaso diario, mensual y semestral para no perder lo aprendido, sin caer en la repetición excesiva que aburre.<\/p>\n<h2>📘 Idea clave<\/h2>\n<blockquote>\n<p>\"Repetition is essential both for forming associations and retaining them in the memory.\" (p. 109)<\/p>\n<\/blockquote>\n<p>Pero hay un límite: la repetición excesiva de un detalle quita tiempo a otros y hace que \"attention ... flag\" (p. 109). Sweet propone un <strong>calendario de repaso<\/strong> muy concreto:<\/p>\n<blockquote>\n<p>\"should always read over again every day what he read the day before\" (p. 237)<\/p>\n<\/blockquote>\n<p>Después de un mes, repasar todo lo del mes; al cabo de unos seis meses, repasar todo el conjunto (p. 237). Reconoce que cada palabra necesita \"its due amount of repetition at regular intervals, by which alone it can be retained\" (p. 161). Sobre memorizar: no aprender de memoria un texto antes de entenderlo y analizarlo (p. 110); mejor releer cada oración \"till it can be repeated without hesitation and without looking at the book\" (p. 250). Desconfía de las mnemotecnias artificiales (<em>memoria technica<\/em>, p. 110).<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Regla diaria:<\/strong> antes de estudiar algo nuevo, relee el texto/las notas del día anterior (5–10 min).<\/li>\n<li><strong>Repaso semanal o mensual:<\/strong> al cerrar una unidad o cada 4 semanas, repasa todo lo visto en ese periodo.<\/li>\n<li><strong>Repaso general<\/strong> cada 3–6 meses (o antes del simulacro del TOEFL): vuelve a los textos y fichas desde el inicio.<\/li>\n<li>Usa un sistema de <strong>repetición espaciada<\/strong> (tarjetas físicas por cajas o app tipo Anki) para palabras y reglas clave, con la frase de contexto en la tarjeta.<\/li>\n<li>Cuando un texto ya no te aporta nada nuevo, pasa a otros textos donde reaparezcan esas palabras en contextos distintos (p. 237).<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Avanzar siempre a material nuevo sin repasar: se olvida casi todo en semanas.<\/li>\n<li>Repetir hasta el aburrimiento lo que ya se sabe y descuidar lo débil.<\/li>\n<li>Memorizar textos o listas sin haberlos entendido.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Pon en tu calendario: (a) 10 min diarios de \"repaso del día anterior\"; (b) una fecha de repaso mensual; (c) una fecha de repaso general a 6 meses o antes de tu simulacro.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-700\">METO-700 · Aprender con textos conectados, no con palabras sueltas<\/a><\/li>\n<li><a href=\"#f-METO-703\">METO-703 · Vocabulario: pocas palabras frecuentes, aprendidas en contexto<\/a><\/li>\n<li><a href=\"#f-METO-706\">METO-706 · Lectura lenta-intensiva y lectura extensiva<\/a><\/li>\n<\/ul>\n<h2>🗒️ Notas<\/h2>\n<p><strong>Vigente y adelantado a su época.<\/strong> El repaso \"a intervalos regulares\" anticipa lo que la psicología cognitiva confirmó después (efecto de espaciado, curva del olvido de Ebbinghaus, 1885). <strong>Matiz moderno:<\/strong> hoy se recomienda que los intervalos sean <strong>crecientes<\/strong> (1 día, 3 días, 1 semana, 1 mes…) y que el repaso sea de <strong>recuperación activa<\/strong> (intentar recordar antes de mirar), no solo releer. El rechazo de Sweet a las mnemotecnias es demasiado tajante: técnicas como la palabra clave pueden ayudar con palabras difíciles.<\/p>", "quiz": []}, "METO-705": {"id": "METO-705", "titulo": "Uso inteligente de la traducción y cómo llegar a pensar en inglés", "categoria": "Estrategias y hábitos de estudio", "tema": "Estrategias y hábitos de estudio", "seccion": "meto", "nivel": "Todos", "prioridad": "Media", "tipo": "No aplica — método de estudio", "fuente": "The Practical Study of Languages: A Guide for Teachers and Learners", "autor": "Sweet, H.", "edicion": "Oxford University Press (serie Language and Language Learning), 1964; 2.ª impresión 1972. Original: J. M. Dent & Sons, 1899", "capitulo": "Chapter 14 — Relations between Different Languages: Translation; Chapter 10; Chapter 12; Chapter 19", "seccion_libro": "Thinking in the Foreign Language; Not Translating · Translation from the Foreign Language · Translation into the Foreign Language; Exercises · Free Composition · Interlinear Translation · Self-instruction", "paginas": "pp. 117, 159, 197–202, 205, 248–249", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>The Practical Study of Languages<\/em> — Henry Sweet (OUP, 1964; orig. 1899), Chapter 14, pp. 197–202, 205; Chapter 10, p. 117; Chapter 12, \"Interlinear Translation\", p. 159; Chapter 19, \"Self-instruction\", pp. 248–249.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Usar la traducción al español como \"muleta\" para entender con exactitud, y luego soltarla para asociar el inglés directamente con su significado, evitando la traducción palabra por palabra.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>Sweet no prohíbe la traducción, pero distingue usos. Traducir <strong>del<\/strong> inglés al español es la forma más clara de explicar un significado (p. 198); traducir <strong>al<\/strong> inglés con ejercicios de frases sueltas desde el principio es una \"falacia\" (p. 201–202). \"Pensar en inglés\" es la meta, no el punto de partida:<\/p>\n<blockquote>\n<p>\"we cannot think in a foreign language till we have a thorough and ready knowledge of it\" (p. 197)<\/p>\n<\/blockquote>\n<p>Una vez entendida la frase por la traducción, hay que \"put aside his explanation-crutches\" y asociarla directamente con su significado (p. 200). La traducción también evita entender a medias: <em>je me demande<\/em> no es \"me pregunto\" enfático sino <em>I wonder<\/em> (p. 200–201). Critica la traducción interlineal palabra por palabra porque fuerza la lengua a un orden antinatural (p. 159); prefiere la <strong>traducción idiomática<\/strong> acompañada de análisis. En lugar de ejercicios de traducción, propone <strong>composición libre<\/strong> y <strong>preguntas y respuestas<\/strong> sobre textos ya estudiados (p. 205). Para el autodidacta: entender cada oración con una traducción fiel antes de analizarla, en vez de \"adivinar\" (p. 248).<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li>Al iniciar un texto difícil, usa una traducción fiable (o traduce tú con ayuda) <strong>solo para comprender<\/strong> el sentido exacto.<\/li>\n<li>Luego guarda la traducción y relee el texto en inglés hasta entenderlo sin ella.<\/li>\n<li>Traduce por <strong>frases o bloques de sentido<\/strong>, no palabra por palabra: <em>I wonder what it means<\/em> = \"¿qué querrá decir?\", no \"yo me pregunto qué significa\".<\/li>\n<li>Para practicar producción, en lugar de traducir frases del español, <strong>responde preguntas en inglés<\/strong> sobre el texto (<em>What is the main idea? Why did...?<\/em>) o resume con tus palabras.<\/li>\n<li>Anota los \"calcos\" del español que más cometes (<em>make a question<\/em> → <em>ask a question<\/em>; <em>depend of<\/em> → <em>depend on<\/em>): son errores típicos de Written Expression.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Traducir mentalmente palabra por palabra durante todo el examen (lento y propenso a errores).<\/li>\n<li>Prohibirse toda traducción y quedarse con comprensiones vagas.<\/li>\n<li>Hacer ejercicios de traducción al inglés antes de tener base, fijando errores.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Toma un párrafo ya estudiado; escribe 5 preguntas en inglés sobre él y respóndelas por escrito sin mirar el español.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-700\">METO-700 · Aprender con textos conectados, no con palabras sueltas<\/a><\/li>\n<li><a href=\"#f-METO-702\">METO-702 · La gramática como herramienta, estudiada junto a los textos<\/a><\/li>\n<li><a href=\"#f-METO-706\">METO-706 · Lectura lenta-intensiva y lectura extensiva<\/a><\/li>\n<\/ul>\n<h2>🗒️ Notas<\/h2>\n<p><strong>Vigente y moderno.<\/strong> Su postura intermedia — ni método de gramática-traducción ni exclusión total de la lengua materna — coincide con la investigación actual sobre el uso <strong>juicioso<\/strong> de la L1 (<em>translanguaging<\/em>, glosas bilingües). Su crítica a la \"interferencia\" (asociaciones cruzadas con la lengua materna, pp. 197) se reformula hoy como transferencia lingüística, que puede ser positiva o negativa.<\/p>", "quiz": []}, "METO-706": {"id": "METO-706", "titulo": "Lectura lenta-intensiva y lectura extensiva", "categoria": "Estrategias y hábitos de estudio", "tema": "Estrategias y hábitos de estudio", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "The Practical Study of Languages: A Guide for Teachers and Learners", "autor": "Sweet, H.", "edicion": "Oxford University Press (serie Language and Language Learning), 1964; 2.ª impresión 1972. Original: J. M. Dent & Sons, 1899", "capitulo": "Chapter 19 — General Considerations; Chapter 13 — Texts; the Reading-book", "seccion_libro": "Time and Effort · Methods for Adults; Self-instruction · Gradation of Difficulties", "paginas": "pp. 177–178, 235–236, 247–251", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>The Practical Study of Languages<\/em> — Henry Sweet (OUP, 1964; orig. 1899), Chapter 19, \"Time and Effort\", pp. 235–236, y \"Methods for Adults; Self-instruction\", pp. 247–251; Chapter 13, \"Gradation of Difficulties\", pp. 177–178.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Combinar dos tipos de lectura con fines distintos: lectura <strong>lenta y repetida<\/strong> de poco texto para dominar gramática y palabras básicas, y lectura <strong>extensa y más rápida<\/strong> para ampliar vocabulario.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>Sweet advierte contra la lectura apresurada, sobre todo en idiomas parecidos al propio (su ejemplo: un principiante de italiano que \"adivina\" párrafos enteros y acaba confundiendo <em>di<\/em> y <em>da<\/em>, p. 235). Distingue dos métodos:<\/p>\n<blockquote>\n<p>\"the former can be acquired only by careful and repeated study of a very limited portion of the literature, while the latter demands an extensive ... reading\" (p. 251)<\/p>\n<\/blockquote>\n<p>Lo primero son las partículas, palabras más comunes y sintaxis; lo segundo, el vocabulario general. Recomienda incluso al estudiante avanzado \"set apart a portion of his time every day for slow and careful reading\" (p. 251). Su rutina diaria para autodidactas (pp. 247–250): al principio menos de <strong>diez líneas<\/strong> al día; primero entender con la traducción, luego analizar cada palabra; al día siguiente releer las oraciones como un todo hasta poder repetirlas sin mirar. Sobre la gradación: empezar por textos <strong>descriptivos<\/strong>, luego diálogos, y como tipo central la narración o el cuento, que mezcla ambos (pp. 177–178).<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Lectura intensiva (diaria, 15–20 min):<\/strong> un párrafo corto. Entiéndelo completo, analiza estructuras (sujeto, verbo, cláusulas) y relee el del día anterior.<\/li>\n<li><strong>Lectura extensiva (3–4 veces por semana, 20–30 min):<\/strong> textos graduados o de nivel algo inferior al tuyo, sin diccionario salvo lo indispensable, buscando volumen.<\/li>\n<li>Usa la intensiva para preparar <strong>Structure<\/strong> y la comprensión fina; la extensiva para <strong>vocabulario en contexto<\/strong> y velocidad en Reading.<\/li>\n<li>Al empezar un tema nuevo (p. ej. textos de biología), lee las primeras páginas con cuidado hasta dominar su vocabulario especial, y luego acelera (p. 251).<\/li>\n<li>Gradúa: descripciones → diálogos → narraciones → textos académicos tipo TOEFL.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Leer rápido \"adivinando\" sin comprobar, y fijar comprensiones falsas.<\/li>\n<li>Hacer solo lectura intensiva (poco volumen) o solo extensiva (sin precisión).<\/li>\n<li>Empezar directamente con textos académicos densos.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Lunes a viernes: 15 min de lectura intensiva (un párrafo nuevo + releer el de ayer). Martes, jueves y sábado: 25 min de lectura extensiva con un libro graduado.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-700\">METO-700 · Aprender con textos conectados, no con palabras sueltas<\/a><\/li>\n<li><a href=\"#f-METO-703\">METO-703 · Vocabulario: pocas palabras frecuentes, aprendidas en contexto<\/a><\/li>\n<li><a href=\"#f-METO-704\">METO-704 · Repetición y repaso programado<\/a><\/li>\n<li><a href=\"#f-METO-705\">METO-705 · Uso inteligente de la traducción y cómo llegar a pensar en inglés<\/a><\/li>\n<\/ul>\n<h2>🗒️ Notas<\/h2>\n<p><strong>Vigente.<\/strong> La distinción intensiva/extensiva es hoy estándar (Palmer, Day &amp; Bamford, Nation). <strong>Matiz moderno:<\/strong> Sweet desconfía de \"adivinar\" el significado; la investigación actual sí valora inferir por contexto <strong>cuando<\/strong> se conoce ~95–98 % de las palabras del texto — por eso la lectura extensiva debe ser con textos fáciles. Su recomendación de usar una traducción completa para autodidactas es útil al inicio, pero conviene dejarla pronto.<\/p>", "quiz": []}, "METO-707": {"id": "METO-707", "titulo": "Metas por etapas, ritmo y motivación del adulto", "categoria": "Motivación y metas", "tema": "Motivación y metas", "seccion": "meto", "nivel": "Todos", "prioridad": "Media", "tipo": "No aplica — método de estudio", "fuente": "The Practical Study of Languages: A Guide for Teachers and Learners", "autor": "Sweet, H.", "edicion": "Oxford University Press (serie Language and Language Learning), 1964; 2.ª impresión 1972. Original: J. M. Dent & Sons, 1899", "capitulo": "Author's Preface; Chapter 9 — General Principles of Method; Chapter 10; Chapter 19 — General Considerations", "seccion_libro": "Author's Preface · The Natural Method · Residence Abroad · Interest · Stages of Progressive Method · Time and Effort · Results; Stages and Degrees of Knowledge", "paginas": "pp. ix, 74–76, 111–112, 116–119, 236–237", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>The Practical Study of Languages<\/em> — Henry Sweet (OUP, 1964; orig. 1899), Author's Preface, p. ix; Chapter 9, \"The Natural Method\" y \"Residence Abroad\", pp. 74–76; Chapter 10, \"Interest\" y \"Stages of Progressive Method\", pp. 111–112, 116–119; Chapter 19, \"Time and Effort\", pp. 236–237.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Plantearse metas realistas por etapas, aprovechar las ventajas del aprendiz adulto y sostener la constancia sin buscar atajos milagrosos.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>Sweet advierte que no hay atajos:<\/p>\n<blockquote>\n<p>\"there is no royal road to languages\" (p. ix)<\/p>\n<\/blockquote>\n<p>El adulto no puede aprender \"como un niño\": ha perdido parte de la capacidad de imitar, pero tiene a cambio \"the power of analysis and generalization—in short, the power of using a grammar and dictionary\" (p. 75). Vivir en el extranjero sin base previa puede fijar errores (p. 76), porque la conversación sirve para practicar lo aprendido más que para aprender cosas nuevas (p. 75). Propone un curso en <strong>etapas<\/strong>: (1) mecánica (pronunciación y frases básicas), (2) gramatical, (3) idiomática y léxica, (4) literaria, (5) arcaica (p. 116). Sobre el ritmo: avanzar \"neither too fast nor too slow\" (p. 235) y trabajar a diario mientras se aproveche el tiempo; cuando el cansancio baja la atención, las asociaciones se debilitan (p. 236). Sobre el interés: basta con interesarse por el idioma mismo y por textos que hagan <strong>progresar<\/strong>, con \"repetition enough to help the memory, and yet variety enough to keep the attention on the alert\" (p. 112).<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li>Define tu meta concreta: <strong>TOEFL ITP 500<\/strong> (~B1) en una fecha; para ti, solo importan las etapas 1–3 de Sweet (pronunciación básica, gramática, vocabulario e idiomas cotidianos y académicos).<\/li>\n<li>Divide el camino en etapas con un indicador cada una (p. ej. \"domino las 1,000 palabras más frecuentes\", \"acierto 70 % en Structure de práctica\").<\/li>\n<li>Estudia <strong>todos los días<\/strong> en bloques que puedas sostener (30–60 min) y para cuando notes que ya no retienes.<\/li>\n<li>Aprovecha tu ventaja de adulto: entiende reglas, compara con el español, organiza tus apuntes.<\/li>\n<li>Elige materiales que te hagan avanzar aunque no sean \"emocionantes\"; la motivación crece al notar progreso medible.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Buscar el \"método milagro\" y cambiar de curso cada mes.<\/li>\n<li>Esperar aprender \"por inmersión\" sin estudio sistemático.<\/li>\n<li>Estudiar 5 horas un día y nada el resto de la semana.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Escribe tu meta (puntaje y fecha), divide el periodo en 3 etapas con un indicador medible para cada una y fija un horario diario realista.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-701\">METO-701 · Pronunciación y lengua hablada desde el inicio<\/a><\/li>\n<li><a href=\"#f-METO-702\">METO-702 · La gramática como herramienta, estudiada junto a los textos<\/a><\/li>\n<li><a href=\"#f-METO-704\">METO-704 · Repetición y repaso programado<\/a><\/li>\n<\/ul>\n<h2>🗒️ Notas<\/h2>\n<p><strong>Mixto.<\/strong> Vigentes: no hay atajos, la constancia diaria, la práctica distribuida y aprovechar la capacidad analítica del adulto. <strong>Superado o matizado:<\/strong> su visión de la residencia en el extranjero es demasiado negativa — hoy se sabe que la inmersión con interacción significativa es muy beneficiosa, sobre todo si hay base previa; y su idea del interés (incluso \"be dull and commonplace, but not too much so\", p. 113) subestima el papel de la motivación intrínseca, que la investigación moderna (Dörnyei, autodeterminación) considera central. Las etapas 4–5 (literaria y arcaica) no son relevantes para la meta TOEFL.<\/p>", "quiz": []}, "METO-800": {"id": "METO-800", "titulo": "Los 10 fenómenos observados en la adquisición de segundas lenguas", "categoria": "Cómo se adquiere un idioma", "tema": "Cómo se adquiere un idioma", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "Theories in Second Language Acquisition: An Introduction", "autor": "VanPatten, B. & Williams, J. (cap. 1 y eds.); Ortega, L. (cap. 13)", "edicion": "2nd ed., 2015 (Routledge)", "capitulo": "Chapter 1 — Introduction: The Nature of Theories; Chapter 13 — Second Language Learning Explained?", "seccion_libro": "Observed phenomena (Observations 1–10); Table 13.1", "paginas": "pp. 9–11; p. 246", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Theories in Second Language Acquisition: An Introduction<\/em> — VanPatten &amp; Williams, Chapter 1, \"Observed phenomena\", pp. 9–11; resumen en Ortega, Chapter 13, Table 13.1, p. 246.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Conocer los 10 hechos que la investigación da por establecidos sobre cómo se aprende una segunda lengua, para tener expectativas realistas y no pelearte con el proceso.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>Los editores resumen (siguiendo a Long, 1990) diez observaciones que toda teoría debe explicar. En lenguaje sencillo:<\/p>\n<ol>\n<li><strong>El input es necesario.<\/strong> \"acquisition will not happen for learners of a second language unless they are exposed to input\" (p. 9). Input = lo que oyes o lees <strong>y atiendes por su significado<\/strong>; un drill mecánico no cuenta.<\/li>\n<li><strong>Mucho se aprende de forma incidental<\/strong>: mientras te concentras en el mensaje (incluida la lectura), \"linguistic features are 'picked up' in the process\" (p. 9).<\/li>\n<li><strong>Llegas a saber más de lo que te enseñaron<\/strong> (p. ej., intuir qué es agramatical).<\/li>\n<li><strong>Hay órdenes y etapas predecibles<\/strong> (p. 10). En inglés, <em>-ing<\/em> se domina antes que el pasado regular, éste antes que el irregular y éste antes que la <em>-s<\/em> de tercera persona. La negación pasa por etapas (<em>No want that<\/em> → <em>He no want that<\/em> → … → <em>He doesn't want that<\/em>). Puede haber desarrollo en \"U\": <em>went<\/em> → <em>goed<\/em> → <em>went<\/em>.<\/li>\n<li><strong>El resultado varía entre personas<\/strong>, incluso con la misma exposición.<\/li>\n<li><strong>Varía entre subsistemas<\/strong>: puedes tener mejor sintaxis que pronunciación, o viceversa.<\/li>\n<li><strong>La frecuencia ayuda, pero tiene límites<\/strong>: algo muy frecuente puede tardar más.<\/li>\n<li><strong>El efecto de la L1 (español) es real pero limitado y selectivo<\/strong> (p. 11).<\/li>\n<li><strong>La instrucción tiene límites<\/strong>: no permite saltarse etapas, pero puede acelerar el avance: \"there appear to be beneficial effects from instruction, but they are not direct\" (p. 11).<\/li>\n<li><strong>El output (hablar/escribir) tiene límites<\/strong>: \"practice makes perfect\" no es del todo cierto (p. 11).<\/li>\n<\/ol>\n<p>Ortega (p. 246) agrupa estos hechos en cinco áreas: conocimiento y cognición, interlengua, L1, entorno lingüístico (input, frecuencia, output) e instrucción.<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Haz del input tu base diaria<\/strong> (obs. 1–2): mínimo 30–45 min/día de lectura o audio en inglés que entiendas y que te interese (artículos académicos sencillos, podcasts, lecturas graduadas). Lee por el mensaje, no solo para \"cazar gramática\".<\/li>\n<li><strong>Estudia gramática, pero sin esperar efectos inmediatos<\/strong> (obs. 9): repasa la regla, luego búscala en lecturas reales. La explicación acelera; no reemplaza la exposición.<\/li>\n<li><strong>Acepta los errores \"de etapa\"<\/strong> (obs. 4): si todavía omites la <em>-s<\/em> de <em>he works<\/em>, es normal; es de lo último que se adquiere. Para el TOEFL ITP, compénsalo con <strong>revisión consciente<\/strong> en Written Expression (ver <a href=\"#f-METO-801\">METO-801 · Teoría del Monitor y conocimiento explícito vs implícito<\/a>).<\/li>\n<li><strong>Mide tu progreso por subsistemas<\/strong> (obs. 6): lleva un registro separado de vocabulario, gramática (Structure) y comprensión auditiva; no te desanimes porque uno vaya atrasado.<\/li>\n<li><strong>Vigila las interferencias del español<\/strong> (obs. 8) en una lista personal (p. ej., omitir sujeto: <em>Is important<\/em> → <em>It is important<\/em>).<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>❌ Creer que \"lo que estudié = lo que ya sé usar\" → ✅ la instrucción ayuda indirectamente; necesitas input y práctica significativa.<\/li>\n<li>❌ Solo hacer ejercicios mecánicos → ✅ los drills sin atención al significado no cuentan como input.<\/li>\n<li>❌ Compararte con otros y frustrarte → ✅ la variabilidad entre aprendices es un hecho observado.<\/li>\n<li>❌ Pensar que retroceder (<em>goed<\/em>) es empeorar → ✅ el desarrollo en \"U\" es señal de que estás generalizando reglas.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Escribe en una tarjeta los 10 fenómenos en una línea cada uno. Cada día, elige uno y anota un ejemplo de tu propio estudio (p. ej., \"hoy aprendí <em>commute<\/em> leyendo, sin buscarlo\": obs. 2).<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-801\">METO-801 · Teoría del Monitor y conocimiento explícito vs implícito<\/a><\/li>\n<li>METO-808<\/li>\n<li>METO-811<\/li>\n<\/ul>", "quiz": []}, "METO-801": {"id": "METO-801", "titulo": "Teoría del Monitor y conocimiento explícito vs implícito", "categoria": "Cómo se adquiere un idioma", "tema": "Cómo se adquiere un idioma", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "Theories in Second Language Acquisition: An Introduction", "autor": "VanPatten, B. & Williams, J. (caps. 1–2 y eds.)", "edicion": "2nd ed., 2015 (Routledge)", "capitulo": "Chapter 2 — Early Theories in SLA; Chapter 1 — Introduction", "seccion_libro": "Monitor Theory (Krashen): five hypotheses; The Explicit/Implicit Debate", "paginas": "pp. 24–27, 30–31; pp. 11–13", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Theories in Second Language Acquisition: An Introduction<\/em> — VanPatten &amp; Williams, Chapter 2, \"Monitor Theory\", pp. 24–27 y 30–31; Chapter 1, \"The Explicit/Implicit Debate\", pp. 11–13.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Distinguir el conocimiento que <em>sabes explicar<\/em> (explícito) del que <em>usas sin pensar<\/em> (implícito), y usar cada uno donde rinde más: el implícito para leer y escuchar con fluidez, el explícito para revisar respuestas del TOEFL.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>Krashen propuso cinco hipótesis (pp. 25–27):\n- <strong>Adquisición vs aprendizaje:<\/strong> la adquisición ocurre de forma natural, fuera de la conciencia, al enfocarse en el significado; el aprendizaje produce conocimiento explícito de reglas. Para Krashen no se conectan nunca (\"noninterface\").\n- <strong>Monitor:<\/strong> el conocimiento aprendido sirve para <strong>editar<\/strong> lo que produces cuando hay tiempo y atención a la corrección, \"for instance, in an untimed writing assignment\" (p. 26).\n- <strong>Orden natural:<\/strong> se adquieren formas en orden predecible; la <em>-s<\/em> de tercera persona es difícil incluso para avanzados (p. 26).\n- <strong>Input:<\/strong> se adquiere \"by understanding messages in the L2\" — <strong>input comprensible<\/strong> (i + 1), un poco por encima de tu nivel (p. 26).\n- <strong>Filtro afectivo:<\/strong> el estrés y la ansiedad \"block[] the learner's processing of input\" (p. 27).<\/p>\n<p><strong>Matices importantes del libro:<\/strong> la teoría es muy criticada porque sus constructos son vagos y difíciles de probar (p. 31); y el debate explícito/implícito sigue abierto: \"most scholars agree that implicit knowledge is the goal of acquisition\" (p. 13), pero no hay consenso sobre si lo explícito se vuelve implícito. Otras teorías del libro (habilidades, METO-804) sí creen en esa conexión.<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Input comprensible abundante:<\/strong> elige textos/audios donde entiendas ~90% y el resto se deduzca. Krashen cita a lectores por placer que superaron a grupos de solo gramática (p. 27): lee por gusto al menos 20 min diarios.<\/li>\n<li><strong>Usa el \"Monitor\" en el examen:<\/strong> en Structure &amp; Written Expression <strong>sí tienes tiempo para consultar reglas<\/strong>. Entrena una checklist rápida: concordancia sujeto–verbo, tiempo verbal, paralelismo, artículo, forma de palabra.<\/li>\n<li><strong>No abandones la gramática explícita<\/strong> (las críticas a Krashen y otras teorías lo respaldan), pero combínala siempre con mucho input donde veas la regla en uso.<\/li>\n<li><strong>Baja tu filtro afectivo:<\/strong> estudia en bloques cortos y sin presión al principio; empieza la sesión con algo que ya dominas.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>❌ \"Si me sé la regla, ya la domino\" → ✅ saber explicarla ≠ usarla rápido; necesitas exposición y práctica.<\/li>\n<li>❌ Solo ver series sin entender casi nada → ✅ el input debe ser <strong>comprensible<\/strong>.<\/li>\n<li>❌ Tomar a Krashen como verdad absoluta y no estudiar gramática para un examen de gramática → ✅ el TOEFL ITP premia justamente el uso consciente de reglas (Monitor).<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Escoge un libro graduado o una serie de artículos de tu nivel y lee 20 min diarios <strong>sin diccionario<\/strong>. Aparte, escribe tu checklist de 5 reglas \"Monitor\" y aplícala a 10 frases de error-ID.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-800\">METO-800 · Los 10 fenómenos observados en la adquisición de segundas lenguas<\/a><\/li>\n<li>METO-804<\/li>\n<li>METO-807<\/li>\n<\/ul>", "quiz": []}, "VOCAB-300": {"id": "VOCAB-300", "titulo": "abandon / desert / relinquish / abolish / repeal", "categoria": "Sinónimos y palabras confusas", "tema": "Sinónimos y palabras confusas", "seccion": "vocabulario", "nivel": "B2", "prioridad": "Media", "tipo": "Reading — vocabulary in context", "fuente": "English Synonyms and Antonyms, With Notes on the Correct Use of Prepositions", "autor": "Fernald, James Champlin", "edicion": "19th ed., Funk & Wagnalls, ©1896 (Project Gutenberg EBook #28900, 2009)", "capitulo": "Part I. Synonyms, Antonyms and Prepositions", "seccion_libro": "ABANDON; ABOLISH", "paginas": "PDF p. 7 (ABANDON); PDF p. 11 (ABOLISH)", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> English Synonyms and Antonyms — Fernald, Part I, entradas ABANDON y ABOLISH, PDF pp. 7 y 11.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Distinguir los verbos de \"dejar / renunciar\" (abandon, desert, give up, relinquish, resign) y los de \"suprimir\" (abolish, repeal, eliminate) para reconocer sus sinónimos en lecturas académicas.<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<ul>\n<li><strong>abandon<\/strong> es el término general: dejar algo de lo que uno era responsable (un plan, un hábito, un lugar).<\/li>\n<li><strong>desert<\/strong> siempre es desfavorable: implica faltar a un deber (abandonar a quien dependía de ti).<\/li>\n<li><strong>relinquish<\/strong> implica que se suelta algo <strong>con desgana<\/strong> (un derecho, un control).<\/li>\n<li><strong>resign<\/strong> se usa para cargos; <strong>surrender<\/strong> ante una fuerza o exigencia; <strong>cede<\/strong> territorio.<\/li>\n<li><strong>abolish<\/strong> = poner fin a una institución, costumbre o condición extendida (slavery, poverty).<\/li>\n<li>Para leyes, Fernald señala que no se dice <em>abolish<\/em>, sino <strong>repeal<\/strong> (lo hace el órgano que la aprobó) o <strong>abrogate<\/strong>. <em>(Ver Notas.)<\/em><\/li>\n<li><strong>prohibit<\/strong> se aplica a lo que quizá nunca existió; <strong>abolish<\/strong>, a algo que ya existe.<\/li>\n<\/ul>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<p><code>abandon + plan/project/habit<\/code> · <code>relinquish + control/claim/right<\/code> · <code>abolish + institution/practice<\/code> · <code>repeal + law/act<\/code><\/p>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>We quit business, give up property, resign office, abandon a habit or a trust.<\/li>\n<li>The creditor relinquishes his claim.<\/li>\n<li>To abolish slavery, ignorance, intemperance, poverty.<\/li>\n<li>The law prohibits what may never have existed; it abolishes an existing evil.<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>The rule was abandoned<\/em> entendido como \"la regla fue desobedecida\" → ✅ significa que se <strong>dejó de aplicar / se descartó<\/strong>.<\/li>\n<li>❌ Confundir <strong>desert<\/strong> (abandonar, verbo, /dɪˈzɜːrt/) con <strong>dessert<\/strong> (postre).<\/li>\n<li>❌ Creer que <em>relinquish<\/em> = <em>receive<\/em> → ✅ es \"ceder, renunciar a\".<\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra<\/th>\n<th>Matiz en español<\/th>\n<th>Ejemplo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>abandon<\/td>\n<td>dejar, desistir (general)<\/td>\n<td>They abandoned the project.<\/td>\n<\/tr>\n<tr>\n<td>desert<\/td>\n<td>abandonar faltando al deber<\/td>\n<td>The soldiers deserted their posts.<\/td>\n<\/tr>\n<tr>\n<td>relinquish<\/td>\n<td>ceder a regañadientes<\/td>\n<td>He relinquished control of the company.<\/td>\n<\/tr>\n<tr>\n<td>give up / quit<\/td>\n<td>dejar (informal, a veces abrupto)<\/td>\n<td>She quit her job.<\/td>\n<\/tr>\n<tr>\n<td>abolish<\/td>\n<td>abolir, suprimir algo establecido<\/td>\n<td>to abolish slavery<\/td>\n<\/tr>\n<tr>\n<td>repeal<\/td>\n<td>derogar una ley<\/td>\n<td>Congress repealed the act.<\/td>\n<\/tr>\n<tr>\n<td>eradicate / stamp out<\/td>\n<td>erradicar<\/td>\n<td>to eradicate a disease<\/td>\n<\/tr>\n<tr>\n<td><strong>Antónimos<\/strong><\/td>\n<td>adopt, maintain, retain, establish, institute<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: Part II, \"ABANDON (page 1)\" QUESTIONS/EXAMPLES, PDF p. 299; \"ABOLISH (page 6)\", PDF p. 302 (rellenar huecos con el sinónimo adecuado).<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li>VOCAB-306<\/li>\n<li>GRAM-701<\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<ul>\n<li>La afirmación de Fernald \"Abolish is not said of laws\" es hoy demasiado estricta: en inglés actual se oye <em>abolish a law/tax<\/em> (sobre todo impuestos). Aun así, para leyes lo más preciso sigue siendo <strong>repeal<\/strong>.<\/li>\n<li><em>Forswear, abjure<\/em> son raros y formales; no los priorices.<\/li>\n<\/ul>", "quiz": [{"tipo": "vocab", "pregunta": "Many states eventually chose to abolish the practice of debtors' prisons. The word 'abolish' is closest in meaning to", "opciones": ["expand", "do away with", "investigate", "postpone"], "respuesta": "B", "explicacion": "'Abolish' = poner fin a una práctica o institución existente → 'do away with'."}, {"tipo": "vocab", "pregunta": "After years of losses, the founder reluctantly relinquished control of the firm. The word 'relinquished' is closest in meaning to", "opciones": ["regained", "gave up", "shared", "tightened"], "respuesta": "B", "explicacion": "'Relinquish' es ceder o renunciar a algo, a menudo con desgana; 'reluctantly' refuerza esa idea."}]}, "VOCAB-301": {"id": "VOCAB-301", "titulo": "apparent / evident / obvious / manifest / likely", "categoria": "Sinónimos y palabras confusas", "tema": "Sinónimos y palabras confusas", "seccion": "vocabulario", "nivel": "B2", "prioridad": "Media", "tipo": "Reading — vocabulary in context", "fuente": "English Synonyms and Antonyms, With Notes on the Correct Use of Prepositions", "autor": "Fernald, James Champlin", "edicion": "19th ed., Funk & Wagnalls, ©1896 (Project Gutenberg EBook #28900, 2009)", "capitulo": "Part I. Synonyms, Antonyms and Prepositions", "seccion_libro": "APPARENT; EVIDENT", "paginas": "PDF p. 48 (APPARENT); PDF p. 135 (EVIDENT)", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> English Synonyms and Antonyms — Fernald, Part I, entradas APPARENT y EVIDENT, PDF pp. 48 y 135.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Reconocer los adjetivos de \"evidencia\" y, sobre todo, el doble sentido de <strong>apparent<\/strong> (evidente vs. aparente/supuesto), que es trampa frecuente en Reading.<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<ul>\n<li><strong>apparent<\/strong> tiene dos sentidos opuestos: (1) claramente visible; (2) que <strong>solo parece<\/strong> ser, pero quizá no lo es (<em>the apparent motion of the sun<\/em>). Delante de un sustantivo suele ser el sentido (2): <em>apparent kindness<\/em> hace dudar de la bondad.<\/li>\n<li>Grado de certeza según Fernald: <strong>seeming<\/strong> (mucha duda) &lt; <strong>apparent<\/strong> &lt; <strong>probable<\/strong>.<\/li>\n<li><strong>evident<\/strong>: la mente queda segura por <strong>inferencia<\/strong> a partir de lo percibido.<\/li>\n<li><strong>obvious<\/strong>: está \"en el camino\", imposible no verlo.<\/li>\n<li><strong>manifest<\/strong>: más fuerte que evident; palpable.<\/li>\n<li><strong>conspicuous<\/strong>: que llama la atención; <strong>discernible<\/strong>: que apenas se distingue con esfuerzo.<\/li>\n<li><strong>likely<\/strong> es el único del grupo que va con infinitivo: <em>it is likely to happen<\/em>.<\/li>\n<\/ul>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<p><code>It is evident/obvious/apparent that + clause<\/code> · <code>be likely to + verb<\/code> · <code>apparent + noun<\/code> (= aparente)<\/p>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>The apparent motion of the sun around the earth.<\/li>\n<li>The application of the remark was obvious.<\/li>\n<li>The ship was discernible through the mist.<\/li>\n<li>It is likely to happen.<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ Traducir siempre <em>apparent<\/em> como \"evidente\" → ✅ en <em>his apparent success<\/em> suele significar \"aparente, supuesto\".<\/li>\n<li>❌ <em>It is probable to happen<\/em> → ✅ <em>It is likely to happen<\/em> / <em>It is probable that it will happen<\/em>.<\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra<\/th>\n<th>Matiz en español<\/th>\n<th>Ejemplo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>apparent<\/td>\n<td>evidente / aparente (según contexto)<\/td>\n<td>an apparent contradiction<\/td>\n<\/tr>\n<tr>\n<td>evident<\/td>\n<td>evidente (por inferencia)<\/td>\n<td>It was evident that he had lied.<\/td>\n<\/tr>\n<tr>\n<td>obvious<\/td>\n<td>obvio, imposible de pasar por alto<\/td>\n<td>an obvious mistake<\/td>\n<\/tr>\n<tr>\n<td>manifest<\/td>\n<td>manifiesto, palpable<\/td>\n<td>a manifest error<\/td>\n<\/tr>\n<tr>\n<td>conspicuous<\/td>\n<td>llamativo, que destaca<\/td>\n<td>conspicuous consumption<\/td>\n<\/tr>\n<tr>\n<td>discernible<\/td>\n<td>perceptible con esfuerzo<\/td>\n<td>a barely discernible change<\/td>\n<\/tr>\n<tr>\n<td>likely / probable<\/td>\n<td>probable<\/td>\n<td>likely to rain<\/td>\n<\/tr>\n<tr>\n<td><strong>Antónimos<\/strong><\/td>\n<td>hidden, concealed, latent, obscure, doubtful<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: Part II, \"APPARENT (page 52)\", PDF p. 324; \"EVIDENT (page 159)\", PDF p. 364.<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li>VOCAB-310<\/li>\n<li>VOCAB-303<\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<ul>\n<li>En la entrada original <em>apparent<\/em> aparece en el sentido \"evidente\" con la preposición <em>to<\/em>: <em>His guilt is apparent ... to all observers<\/em> (PDF p. 48). Sigue vigente.<\/li>\n<\/ul>", "quiz": [{"tipo": "vocab", "pregunta": "By the end of the trial, it was evident that the witness had been mistaken. The word 'evident' is closest in meaning to", "opciones": ["clear", "unlikely", "hidden", "regrettable"], "respuesta": "A", "explicacion": "'Evident' = claro, del que estamos seguros por inferencia."}, {"tipo": "reading", "pregunta": "Despite the apparent stability of the colony, its population was quietly declining. The word 'apparent' is closest in meaning to", "opciones": ["permanent", "seeming", "official", "remarkable"], "respuesta": "B", "explicacion": "El contraste con 'quietly declining' muestra que la estabilidad solo parecía real → 'seeming'."}]}}, "fuentes": [{"titulo": "Intermediate English Grammar and Practice", "n": 9, "autor": "No consta en el documento", "edicion": ""}, {"titulo": "The English Tenses: Practical Grammar Guide", "n": 9, "autor": "Williams, P.", "edicion": "2014 (ebook)"}, {"titulo": "Testing in Language Programs", "n": 8, "autor": "Brown, J. D.", "edicion": "1996 (Prentic /* ---------- Pregunta con óvalos ---------- */
function crearPregunta(q, { modo = "inmediato", numero = null, alResponder = null } = {}) {
  const caja = el("div", { class: "pregunta" });
  const tipo = NOMBRE_TIPO[q.tipo] || q.tipo;
  const f = DATOS.fichas[q.fid];
  caja.append(el("div", { class: "meta-q" },
    el("span", {}, (numero ? numero + " · " : "") + tipo),
    el("a", { href: "#f-" + q.fid }, q.fid + " · " + f.titulo)));

  const enun = el("div", { class: "enunciado" });
  let opciones;
  if (q.tipo === "error-id") {
    const partes = String(q.pregunta).split(/(\{[A-D]\|[^}]+\})/);
    opciones = [];
    for (const p of partes) {
      const m = p.match(/^\{([A-D])\|([^}]+)\}$/);
      if (m) { enun.append(el("span", { class: "seg" }, m[2], el("sub", {}, m[1]))); opciones.push(m[2]); }
      else enun.append(p);
    }
  } else {
    enun.textContent = q.pregunta;
    opciones = q.opciones || [];
  }
  caja.append(enun);

  const lista = el("div", { class: "opciones", role: "group", "aria-label": "Opciones" });
  const botones = opciones.map((txt, i) => el("button", { class: "opcion", type: "button" },
    el("span", { class: "ovalo", "aria-hidden": "true" }, LETRAS[i]), el("span", {}, LETRAS[i] + ") " + txt)));
  lista.append(...botones);
  caja.append(lista);

  const estado = { elegida: null, calificada: false, ok: null };
  function calificar() {
    if (estado.calificada || estado.elegida === null) return;
    estado.calificada = true;
    const correcta = LETRAS.indexOf(String(q.respuesta).trim().toUpperCase());
    estado.ok = estado.elegida === correcta;
    botones.forEach((b, i) => {
      b.disabled = true;
      if (i === correcta) b.classList.add("correcta");
      else if (i === estado.elegida) b.classList.add("incorrecta");
    });
    caja.append(el("div", { class: "explicacion " + (estado.ok ? "bien" : "mal") },
      el("b", {}, estado.ok ? "Correcto. " : `La respuesta es ${LETRAS[correcta]}. `), q.explicacion || ""));
    registrar(q.qid, estado.ok);
    if (alResponder) alResponder(estado.ok);
  }
  botones.forEach((b, i) => b.addEventListener("click", () => {
    if (estado.calificada) return;
    estado.elegida = i;
    botones.forEach((o, j) => o.classList.toggle("marcada", j === i));
    if (modo === "inmediato") calificar();
    else if (alResponder) alResponder(null);
  }));
  caja.calificar = calificar;
  caja.estado = estado;
  return caja;
}

    el("span", { class: "cuenta" }, `${preguntas.length - hechas} por contestar`)); };

      : "Ninguno de tus libros cubre este tema todavía.")));
  if (!t.fichas.length) return v;
  v.push(el("div", { style: "display:flex;flex-direction:column;gap:12px" },
    t.fichas.map((id, i) => tarjetaFicha(DATOS.fichas[id], foco ? id === foco : i === 0))));
  const qs = preguntasDe(t.fichas);
  if (qs.length) v.push(bloqueEjercicios(qs, "Practica este tema"));
  return v;
}

function vistaSimulacro() {
  const todas = preguntasDe(Object.keys(DATOS.fichas));
  const partes = [
    ["Structure", q => q.tipo === "structure", 15],
    ["Written Expression", q => q.tipo === "error-id", 25],
    ["Reading y vocabulario", q => q.tipo === "reading" || q.tipo === "vocab", 15],
    ["Listening (transcripciones)", q => q.tipo === "listening", 10],
  ].map(([nombre, filtro, n]) => ({ nombre, qs: barajar(todas.filter(filtro)).slice(0, n) })).filter(p => p.qs.length);

  const v = [el("header", { class: "cabecera" },
    el("span", { class: "eyebrow" }, "Práctica cronometrada"),
    el("h1", {}, "Mini simulacro"),
    el("p", {}, "Preguntas al azar de todas las fichas, con la misma proporción que la Sección 2 del ITP (15 Structure + 25 Written Expression). Rellena tus óvalos y califica al final. El porcentaje te orienta; no es un puntaje oficial."))];
  const cajas = [];
  let n = 0;
  const reloj = el("span", { class: "num" }, "00:00");
  const inicio = Date.now();
  const tic = setInterval(() => {
    if (!document.body.contains(reloj)) return clearInterval(tic);
    const s = Math.floor((Date.now() - inicio) / 1000);
    reloj.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }, 1000);
  v.push(el("div", { class: "marcador" }, reloj, el("span", { class: "cuenta" }, `${partes.reduce((a, p) => a + p.qs.length, 0)} preguntas`)));
  for (const p of partes) {
    v.push(el("h2", { style: "font-size:22px" }, p.nombre));
    v.push(el("div", { class: "ejercicios" }, p.qs.map(q => { const c = crearPregunta(q, { modo: "examen", numero: ++n }); c.parte = p.nombre; cajas.push(c); return c; })));
  }
  const res = el("div", { class: "resultados" });
  const btn = el("button", { class: "boton", type: "button", onclick: () => {
    clearInterval(tic);
    cajas.forEach(c => c.calificar());
    res.replaceChildren(...partes.map(p => {
      const cs = cajas.filter(c => c.parte === p.nombre);
      const ok = cs.filter(c => c.estado.ok).length;
      return el("div", { class: "resultado" }, el("span", { class: "eyebrow" }, p.nombre),
        el("span", { class: "pct" }, Math.round(ok / cs.length * 100) + "%"), el("span", { class: "cuenta" }, `${ok} de ${cs.length}`));
    }));
    btn.disabled = true; construirNav(); res.scrollIntoView({ behavior: "smooth", block: "center" });
  } }, "Calificar simulacro");
  v.push(el("div", { style: "display:flex;gap:10px;flex-wrap:wrap" }, btn,
    el("button", { class: "boton secundario", type: "button", onclick: () => render(true) }, "Nuevo simulacro")));
  v.push(res);
  return v;
}

function vistaRepaso() {
  const todas = preguntasDe(Object.keys(DATOS.fichas));
  const pendientes = todas.filter(q => progreso.q[q.qid]?.ultimo === false)
    .sort((a, b) => (progreso.q[a.qid].t || 0) - (progreso.q[b.qid].t || 0));
  const v = [el("header", { class: "cabecera" },
    el("span", { class: "eyebrow" }, "Repaso"),
    el("h1", {}, "Banco de errores"),
    el("p", {}, "Aquí llegan las preguntas que fallaste la última vez, de la más antigua a la más reciente. Al contestarlas bien salen del banco."))];
  if (!pendientes.length) v.push(el("p", { class: "vacio-estado" }, "El banco está vacío. Contesta la práctica de un tema o haz un mini simulacro; lo que falles aparecerá aquí."));
  else v.push(bloqueEjercicios(pendientes, `${pendientes.length} por repasar`));
  return v;
}

function vistaFuentes() {
  return [el("header", { class: "cabecera" },
      el("span", { class: "eyebrow" }, "Trazabilidad"),
      el("h1", {}, "Fuentes"),
      el("p", {}, `Libros de los que salieron las fichas. Curso generado el ${DATOS.generado}.`)),
    el("div", { class: "lista-simple" }, DATOS.fuentes.map(f => el("div", {},
      el("span", {}, el("strong", { style: "font-family:var(--f-display)" }, f.titulo), " — ", [f.autor, f.edicion].filter(Boolean).join(", ")),
      el("span", { class: "cuenta" }, f.n + " fichas"))))];
}

function vistaBusqueda(texto) {
  const t = texto.toLowerCase();
  const hits = Object.values(DATOS.fichas).filter(f =>
    (f.titulo + " " + f.categoria + " " + f.tema + " " + f.fuente).toLowerCase().includes(t)).slice(0, 60);
  return [el("header", { class: "cabecera" }, el("span", { class: "eyebrow" }, "Búsqueda"), el("h1", {}, `“${texto}”`),
      el("p", {}, hits.length ? `${hits.length} fichas` : "Sin resultados. Prueba con el nombre en inglés (p. ej. “present perfect”).")),
    el("div", { class: "lista-simple" }, hits.map(f => el("a", { href: "#f-" + f.id },
      el("span", {}, el("strong", { style: "font-family:var(--f-display)" }, f.titulo), " · ", f.tema),
      el("span", { class: "cuenta" }, f.id))))];
}

/* ---------- Router ---------- */
function render(forzar) {
  const h = decodeURIComponent(location.hash.slice(1)) || "inicio";
  let vista, ruta = h, foco = null;
  if (h.startsWith("f-") && DATOS.fichas[h.slice(2)]) {
    foco = h.slice(2); const t = temaDeFicha(foco); ruta = t.slug; vista = vistaTema(t, foco);
  } else if (temaPorSlug[h]) vista = vistaTema(temaPorSlug[h]);
  else if (h === "simulacro") vista = vistaSimulacro();
  else if (h === "repaso") vista = vistaRepaso();
  else if (h === "fuentes") vista = vistaFuentes();
  else { ruta = "inicio"; vista = vistaInicio(); }
  $("#vista").replaceChildren(...vista);
  construirNav(); marcarActual(ruta);
  cerrarMenu();
  if (foco) { const c = document.getElementById("f-" + foco); if (c) { c.classList.add("foco"); c.scrollIntoView({ block: "start" }); } }
  else window.scrollTo(0, 0);
}

function cerrarMenu() { $("#lateral").classList.remove("abierta"); $("#abrir-menu").setAttribute("aria-expanded", "false"); }
$("#abrir-menu").addEventListener("click", () => {
  const abierta = $("#lateral").classList.toggle("abierta");
  $("#abrir-menu").setAttribute("aria-expanded", String(abierta));
});
let espera;
$("#buscar").addEventListener("input", e => {
  clearTimeout(espera);
  const t = e.target.value.trim();
  espera = setTimeout(() => {
    if (t.length < 2) return render();
    $("#vista").replaceChildren(...vistaBusqueda(t)); marcarActual(null);
  }, 180);
});
window.addEventListener("hashchange", () => render());
render();
</script>
