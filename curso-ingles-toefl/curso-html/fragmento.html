mirar su tabla de conversión.<\/li>\n<li>Fijarse solo en el total y no ver qué sección está bajando el promedio.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Toma la tabla de conversión de tu libro de simulacros y calcula cuántos aciertos brutos necesitas en cada sección para un total de 500. Escríbelo como tu meta numérica.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-100\">METO-100 · El TOEFL es una prueba normativa (NRT), no de criterio (CRT)<\/a><\/li>\n<li><a href=\"#f-METO-104\">METO-104 · Error estándar de medición: no sobreinterpretar un simulacro<\/a><\/li>\n<\/ul>", "quiz": []}, "METO-102": {"id": "METO-102", "titulo": "Anatomía de un ítem de opción múltiple: stem, key y distractores", "categoria": "Cómo funcionan los exámenes", "tema": "Exámenes: cómo funcionan y cómo prepararse", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "Testing in Language Programs", "autor": "Brown, J. D.", "edicion": "1996 (Prentice Hall Regents)", "capitulo": "Chapter 3 — Developing and Improving Test Items", "seccion_libro": "Receptive response items: Multiple-choice (Table 3.2)", "paginas": "pp. 54–57", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Testing in Language Programs<\/em> — Brown, J. D., Chapter 3, \"Multiple-choice\" y Table 3.2 \"Guidelines for Receptive Item Formats\", pp. 54–57.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Leer cada pregunta del TOEFL como la lee quien la escribió: saber qué partes tiene y por qué existe cada opción incorrecta.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>Un ítem de opción múltiple tiene <strong>stem<\/strong> (enunciado), <strong>correct answer<\/strong> (la clave) y <strong>distractors<\/strong>: <em>\"called distractors because they should distract, or divert, the students' attention away from the correct answer\"<\/em> (p. 55).<\/p>\n<p>Las reglas que Brown da a quien escribe ítems (Table 3.2, p. 54) son pistas para quien los responde:\n1. <strong>Un solo concepto por ítem.<\/strong> Un buen ítem prueba <em>\"only one concept or skill at a time\"<\/em> (p. 55). → En Structure, cada pregunta tiene <strong>un<\/strong> punto gramatical; tu tarea es identificarlo.\n2. <strong>Distractores plausibles.<\/strong> Los buenos distractores son errores que un estudiante real cometería (p. 55). → Los distractores del TOEFL suelen ser la forma \"casi correcta\": tiempo equivocado, participio mal formado, palabra repetida.\n3. <strong>Sin redundancia en las opciones.<\/strong> Lo común a todas las opciones se pasa al stem (ejemplo del libro: <em>\"The boy stepped on a piece of ice and ___ flat on his face. a. fell b. fall c. felled d. falled\"<\/em>, p. 56). → Si las 4 opciones comparten palabras, <strong>ignóralas<\/strong> y compara solo lo que cambia.\n4. <strong>Orden aleatorio de las respuestas<\/strong> para evitar patrones (p. 56). → No existe \"la C es la más frecuente\".\n5. <strong>Evitar \"none of the above\"<\/strong> (p. 57). → El TOEFL ITP no usa estas opciones; cada opción es una forma concreta.<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li>En cada ítem de Structure, <strong>subraya lo que cambia<\/strong> entre las cuatro opciones: eso revela el punto gramatical evaluado.<\/li>\n<li>Nombra el punto en voz baja (\"es paralelismo\", \"es concordancia\") <strong>antes<\/strong> de elegir.<\/li>\n<li>Al corregir un error, escribe <strong>por qué atrajo el distractor<\/strong> que elegiste (p. ej. \"elegí <em>fall<\/em> porque no vi que la oración estaba en pasado\").<\/li>\n<li>Escribe tú mismo 2 ítems por semana sobre un tema que estés estudiando (enunciado + 1 clave + 3 distractores plausibles): comprobarás el \"Brown's law\" (el último distractor es el más difícil de inventar, p. 55) y entenderás cómo piensan los examinadores.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Leer las cuatro opciones completas una y otra vez en vez de comparar solo la diferencia.<\/li>\n<li>Buscar patrones de letras (\"ya van tres B seguidas\") en lugar de analizar el ítem.<\/li>\n<li>Corregir solo \"la respuesta era C\" sin entender por qué el distractor era atractivo.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Toma 10 ítems de Structure ya resueltos. En cada uno, marca lo que cambia entre opciones y escribe en una palabra el punto gramatical. Después redacta 2 ítems propios con distractores plausibles.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-103\">METO-103 · Estrategia de eliminación de distractores<\/a><\/li>\n<li><a href=\"#f-METO-107\">METO-107 · Diagnóstico por temas: registro de errores<\/a><\/li>\n<\/ul>", "quiz": []}, "METO-103": {"id": "METO-103", "titulo": "Estrategia de eliminación de distractores", "categoria": "Estrategias para presentar exámenes", "tema": "Exámenes: cómo funcionan y cómo prepararse", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "Testing in Language Programs", "autor": "Brown, J. D.", "edicion": "1996 (Prentice Hall Regents)", "capitulo": "Chapter 3 — Developing and Improving Test Items; Chapter 8 — Test Validity and Standards Setting", "seccion_libro": "Multiple-choice guidelines; Distractor Efficiency Analysis; Nedelsky method", "paginas": "pp. 54–55, 71–73, 252–253", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Testing in Language Programs<\/em> — Brown, J. D., Chapter 3 (pp. 54–55, 71–73) y Chapter 8, \"Nedelsky method\" (pp. 252–253).<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Subir la probabilidad de acierto cuando no estás seguro, descartando opciones con criterio en lugar de adivinar al azar.<\/p>\n<h2>📘 Idea clave<\/h2>\n<ul>\n<li>Brown advierte que un distractor poco plausible ayuda a quien adivina: <em>\"those students who are guessing will be able to dismiss that distractor and improve their chances\"<\/em> (p. 55).<\/li>\n<li>El método de Nedelsky para fijar puntajes de corte se basa justo en eso: el juez decide qué opciones <em>\"a minimally competent student could eliminate as not plausible\"<\/em>, y la probabilidad de acierto pasa a ser 1 / (opciones que quedan): si de 4 opciones se eliminan 2, queda 1/2 (pp. 252–253).<\/li>\n<li>El análisis de distractores muestra que, en ítems reales, a veces un distractor <em>\"is not attracting any of the students\"<\/em> (p. 73): casi siempre hay alguna opción descartable.<\/li>\n<li><strong>Pistas de \"absolutismo\"<\/strong> en ítems verdadero/falso: palabras como <em>all, always, never<\/em> suelen indicar una afirmación falsa (p. 54). En Reading del TOEFL, una opción con <em>always/never/all<\/em> que el texto no respalda es candidata fuerte a descartarse.<\/li>\n<\/ul>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Descarta primero, elige después.<\/strong> Tacha mentalmente las opciones imposibles (forma gramatical que no existe: <em>falled<\/em>, <em>felled<\/em> como pasado de <em>fall<\/em>; palabra sin función en la oración).<\/li>\n<li>Cuenta lo que queda: con 4 opciones al azar aciertas 1 de 4 (25 %); si eliminas 2, aciertas 1 de 2 (50 %).<\/li>\n<li><strong>Nunca dejes una respuesta en blanco<\/strong>: en el TOEFL ITP solo cuentan los aciertos, así que siempre conviene marcar la mejor opción restante.<\/li>\n<li>En Reading, desconfía de opciones con términos absolutos o que dicen \"más\" de lo que dice el texto.<\/li>\n<li>Practica con un registro: en cada simulacro marca con \"E\" las preguntas resueltas por eliminación y revisa después cuántas acertaste.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Elegir la primera opción que \"suena bien\" sin revisar las demás.<\/li>\n<li>Dejar preguntas sin contestar por miedo a equivocarse.<\/li>\n<li>Gastar demasiado tiempo en una sola pregunta: elimina, elige y sigue.<\/li>\n<li>Usar la eliminación como sustituto de estudiar: Brown recuerda que los estudiantes <em>\"may know the answer\"<\/em> (p. 253); la meta es saber, y eliminar solo cuando dudas.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>En tu próximo bloque de 25 ítems de Structure, antes de elegir respuesta escribe al lado de cada opción una ✗ si la eliminas. Al corregir, calcula tu porcentaje de acierto en las preguntas donde llegaste a 2 opciones.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-102\">METO-102 · Anatomía de un ítem de opción múltiple: stem, key y distractores<\/a><\/li>\n<li><a href=\"#f-METO-106\">METO-106 · Fuentes de error del examinado y condiciones de simulacro<\/a><\/li>\n<\/ul>", "quiz": []}, "METO-104": {"id": "METO-104", "titulo": "Error estándar de medición: no sobreinterpretar un simulacro", "categoria": "Cómo funcionan los exámenes", "tema": "Exámenes: cómo funcionan y cómo prepararse", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "Testing in Language Programs", "autor": "Brown, J. D.", "edicion": "1996 (Prentice Hall Regents)", "capitulo": "Chapter 7 — Test Reliability; Chapter 8 — Test Validity and Standards Setting", "seccion_libro": "Standard Error of Measurement; introducción del Chapter 8", "paginas": "pp. 206–208, 231", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Testing in Language Programs<\/em> — Brown, J. D., Chapter 7, \"Standard Error of Measurement\", pp. 206–208; Chapter 8, p. 231.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Leer tus puntajes de simulacro como una <strong>banda<\/strong>, no como un número exacto, para no entrar en pánico ni confiarte por una sola prueba.<\/p>\n<h2>📘 Idea clave<\/h2>\n<ul>\n<li>El <strong>SEM<\/strong> define <em>\"a band around a student's score within which that student's score would probably fall if the test were administered to him or her repeatedly\"<\/em> (p. 206).<\/li>\n<li>Regla práctica del libro: el puntaje real cae dentro de <strong>±1 SEM el 68 %<\/strong> de las veces y dentro de <strong>±2 SEM el 95 %<\/strong> (ejemplo de Xiao Lao: 80 con SEM 5 → entre 75 y 85, o entre 70 y 90; p. 207).<\/li>\n<li>Para el TOEFL en papel, Brown cita SEM de 2.2 (Listening), 2.8 (Structure &amp; Written Expression), 2.3 (Reading) y <strong>14.1 para el total<\/strong> (p. 231).<\/li>\n<li>Cuando el puntaje está cerca de un punto de corte, Brown recomienda <strong>buscar más información<\/strong> antes de decidir (p. 208).<\/li>\n<\/ul>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Piensa en ±15 puntos.<\/strong> Si un simulacro te da 485, tu nivel real probablemente está entre ~470 y ~500. Un salto de 10 puntos entre dos simulacros <strong>no<\/strong> es progreso ni retroceso seguro.<\/li>\n<li><strong>Promedia varios simulacros.<\/strong> Usa el promedio de los últimos 3 como tu \"puntaje de trabajo\"; es más estable que uno solo.<\/li>\n<li><strong>Ponte una meta con margen.<\/strong> Si necesitas 500, apunta a un promedio de ~515–530 en simulacros antes de presentar el examen oficial.<\/li>\n<li><strong>Si estás en la frontera<\/strong> (490–510), haz otro simulacro completo antes de decidir la fecha, como sugiere Brown para casos límite.<\/li>\n<li>Mira también la banda por sección: diferencias de 2–3 puntos en una sección están dentro del error.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Celebrar o desesperarse por un solo resultado.<\/li>\n<li>Cambiar todo el plan de estudio porque una sección bajó 2 puntos.<\/li>\n<li>Presentar el examen oficial cuando el último simulacro dio \"justo 500\" (con el error de medición, la probabilidad de quedar por debajo es alta).<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Crea una tabla con columnas: fecha · simulacro · Listening · Structure · Reading · Total · promedio móvil (últimos 3). Llénala con todos los simulacros que hayas hecho hasta ahora.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-101\">METO-101 · Puntaje escalado y percentil: qué significa 500<\/a><\/li>\n<li><a href=\"#f-METO-105\">METO-105 · Confiabilidad: simulacros completos y repetidos<\/a><\/li>\n<li><a href=\"#f-METO-106\">METO-106 · Fuentes de error del examinado y condiciones de simulacro<\/a><\/li>\n<\/ul>", "quiz": []}, "METO-105": {"id": "METO-105", "titulo": "Confiabilidad: simulacros completos y repetidos", "categoria": "Práctica con simulacros", "tema": "Práctica, repaso y memoria", "seccion": "meto", "nivel": "Todos", "prioridad": "Media", "tipo": "No aplica — método de estudio", "fuente": "Testing in Language Programs", "autor": "Brown, J. D.", "edicion": "1996 (Prentice Hall Regents)", "capitulo": "Chapter 7 — Test Reliability", "seccion_libro": "Interpreting Reliability Estimates; Factors Affecting the Reliability of NRTs", "paginas": "pp. 206, 208–209", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Testing in Language Programs<\/em> — Brown, J. D., Chapter 7, \"Factors Affecting the Reliability of NRTs\", pp. 206, 208–209.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Diseñar tu práctica de medición (simulacros) para que los resultados sean confiables y te sirvan para decidir.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>Brown resume qué hace más confiable un NRT. Entre otros: <em>\"a longer test tends to be more reliable than a short one\"<\/em> y <em>\"a well-designed and carefully written test tends to be more reliable than a shoddy one\"<\/em> (p. 209). Además, la confiabilidad depende del grupo y las condiciones en que se aplicó la prueba (p. 206), y un test de 30 ítems da bandas de error distintas a uno de 100 (p. 208).<\/p>\n<p>Traducción para el autodidacta: <strong>un mini-test de 10 preguntas sirve para practicar, pero no para estimar tu puntaje TOEFL<\/strong>. Para medirte necesitas pruebas largas, bien hechas y en condiciones parecidas al examen real.<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Separa práctica y medición.<\/strong> Práctica: ejercicios cortos por tema (diarios). Medición: simulacro <strong>completo<\/strong> (las 3 secciones, ~115 min) cada 2–4 semanas.<\/li>\n<li><strong>Usa material de calidad.<\/strong> Prefiere simulacros oficiales o de editoriales reconocidas; un simulacro mal hecho (\"shoddy\") da puntajes poco confiables.<\/li>\n<li><strong>No estimes tu puntaje con secciones sueltas<\/strong> ni con 15 preguntas de una app.<\/li>\n<li><strong>Repite en condiciones constantes<\/strong> (misma hora, mismo tiempo, sin pausas) para que las diferencias entre simulacros reflejen cambios reales.<\/li>\n<li>Combina con <a href=\"#f-METO-104\">METO-104 · Error estándar de medición: no sobreinterpretar un simulacro<\/a>: promedia los últimos 3.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Sacar conclusiones de un quiz de 10 preguntas (\"ya domino Structure\").<\/li>\n<li>Hacer simulacros a medias (solo Reading, con pausas, con diccionario).<\/li>\n<li>Usar simulacros de baja calidad y tomarlos como predicción fiable.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Agenda en tu calendario el próximo simulacro completo (fecha, hora, lugar). Define qué material usarás y verifica que tenga las tres secciones con su tabla de conversión.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-104\">METO-104 · Error estándar de medición: no sobreinterpretar un simulacro<\/a><\/li>\n<li><a href=\"#f-METO-106\">METO-106 · Fuentes de error del examinado y condiciones de simulacro<\/a><\/li>\n<li>METO-108<\/li>\n<\/ul>", "quiz": []}, "METO-106": {"id": "METO-106", "titulo": "Fuentes de error del examinado y condiciones de simulacro", "categoria": "Hábitos para presentar exámenes", "tema": "Estrategias y hábitos de estudio", "seccion": "meto", "nivel": "Todos", "prioridad": "Media", "tipo": "No aplica — método de estudio", "fuente": "Testing in Language Programs", "autor": "Brown, J. D.", "edicion": "1996 (Prentice Hall Regents)", "capitulo": "Chapter 7 — Test Reliability; Chapter 2 — Adopting, Developing, and Adapting Language Tests", "seccion_libro": "Variance attributable to examinees; Table 2.2 A Testing Program Checklist", "paginas": "pp. 43, 190", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Testing in Language Programs<\/em> — Brown, J. D., Chapter 7, \"Variance attributable to examinees\", p. 190; Chapter 2, Table 2.2, p. 43.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Reducir lo que baja tu puntaje sin tener que ver con tu inglés: cansancio, nervios, desconocimiento del formato, mala logística.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>Brown enumera fuentes de error que dependen del examinado:\n- Físicas: <em>\"fatigue, health, hearing, or vision\"<\/em> (p. 190).\n- Psicológicas: <em>\"motivation, emotional state, memory, concentration, forgetfulness, impulsiveness, carelessness\"<\/em> (p. 190).\n- Experiencia con exámenes (<strong>testwiseness<\/strong>): entender rápido las instrucciones, estrategias de adivinanza y de velocidad (p. 190).\n- Y concluye: <em>\"the issues related to the condition of the students are the responsibility of the students themselves\"<\/em> (p. 190).<\/p>\n<p>La lista de Table 2.2 (p. 43) para organizar un examen —espacio silencioso, horario claro, saber qué llevar (identificación), materiales y equipo probados— sirve al revés como <strong>checklist del candidato<\/strong>.<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Domina las instrucciones antes del día<\/strong>: las instrucciones del TOEFL ITP son siempre iguales; si ya las conoces, puedes usar ese tiempo para adelantar lectura.<\/li>\n<li><strong>Simula el examen real<\/strong>: lugar silencioso, audífonos o bocina como los del examen, hoja de respuestas, lápiz, cronómetro, sin pausas.<\/li>\n<li><strong>Entrena la resistencia<\/strong>: el examen dura ~2 horas seguidas; haz al menos 2 simulacros completos de corrido antes del oficial.<\/li>\n<li><strong>Controla el descuido<\/strong>: reserva 1 minuto al final de cada sección para revisar que las respuestas estén en la fila correcta de la hoja.<\/li>\n<li><strong>Checklist del día del examen<\/strong>: dormir bien, desayunar, identificación, lápices, llegar temprano, saber la dirección exacta.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Practicar siempre con pausas y luego \"romperse\" en la segunda hora del examen real.<\/li>\n<li>Leer las instrucciones por primera vez el día del examen.<\/li>\n<li>Desplazar respuestas en la hoja por saltar una pregunta.<\/li>\n<li>Presentar el simulacro cansado o con prisa y luego interpretar el puntaje como real.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Escribe tu propio \"checklist del candidato\" (10 puntos) a partir de Table 2.2 y úsalo en tu próximo simulacro completo. Anota al final si hubo fatiga, nervios o descuidos.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-103\">METO-103 · Estrategia de eliminación de distractores<\/a><\/li>\n<li><a href=\"#f-METO-104\">METO-104 · Error estándar de medición: no sobreinterpretar un simulacro<\/a><\/li>\n<li><a href=\"#f-METO-105\">METO-105 · Confiabilidad: simulacros completos y repetidos<\/a><\/li>\n<\/ul>", "quiz": []}, "METO-107": {"id": "METO-107", "titulo": "Diagnóstico por temas: registro de errores", "categoria": "Diagnóstico y retroalimentación", "tema": "Estrategias y hábitos de estudio", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "Testing in Language Programs", "autor": "Brown, J. D.", "edicion": "1996 (Prentice Hall Regents)", "capitulo": "Chapter 1 — Types and Uses of Language Tests; Chapter 9 — Testing and Curriculum", "seccion_libro": "Diagnostic decisions; Test structure (CRT subtests); diagnostic CRT del ELI", "paginas": "pp. 6, 14–15, 274", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Testing in Language Programs<\/em> — Brown, J. D., Chapter 1, \"Diagnostic decisions\" y \"Test structure\", pp. 6, 14–15; Chapter 9, p. 274.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Convertir cada simulacro y ejercicio en información sobre <strong>qué tema<\/strong> fallas, para decidir dónde invertir tus horas de estudio.<\/p>\n<h2>📘 Idea clave<\/h2>\n<ul>\n<li>Las decisiones diagnósticas buscan <em>\"promoting strengths and eliminating the weaknesses of individual students\"<\/em> (p. 14).<\/li>\n<li>Lo más útil de un diagnóstico es <em>\"to report the performance level on each objective (in a percentage) to each student so that he or she can decide how and where to invest time and energy most profitably\"<\/em> (p. 15).<\/li>\n<li>Un test de lectura puede reagruparse <strong>por tipo de pregunta<\/strong> (hechos, vocabulario, cohesión, inferencia) en lugar de por pasaje (p. 6).<\/li>\n<li>En el ELI de Hawái, un CRT diagnóstico reveló que <em>\"over 90% of the students had nearly perfect scores on most of the objectives\"<\/em>: el curso planeado era demasiado fácil (p. 274). → Diagnosticar <strong>antes<\/strong> evita estudiar lo que ya sabes.<\/li>\n<\/ul>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Etiqueta cada pregunta<\/strong> de tus simulacros con su tema: en Structure (concordancia, paralelismo, cláusulas relativas, etc.), en Reading (main idea, detail, vocabulary in context, reference, inference) y en Listening (short dialogues, conversations, talks).<\/li>\n<li><strong>Lleva un registro de errores<\/strong> (hoja de cálculo o cuaderno) con columnas: fecha · sección · tema · ítem · mi respuesta · correcta · por qué fallé (no sabía / me confundí / tiempo / descuido).<\/li>\n<li><strong>Calcula el porcentaje de acierto por tema<\/strong> cada 2 semanas, como el reporte \"por objetivo\" que propone Brown.<\/li>\n<li><strong>Prioriza<\/strong>: estudia primero los 3 temas con peor porcentaje y más frecuentes en el examen; deja de repasar los que ya superan ~85–90 %.<\/li>\n<li><strong>Diagnostica antes de empezar<\/strong> un libro o unidad: haz el test inicial; si aciertas casi todo, sube de nivel en vez de repetir material fácil.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Mirar solo el puntaje total y no el desglose por tema.<\/li>\n<li>Repasar siempre los temas cómodos (los que ya dominas) porque \"se siente bien\".<\/li>\n<li>Anotar el error sin la causa: no es lo mismo \"no conocía la regla\" que \"leí rápido\".<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Crea tu registro de errores con las columnas del paso 2 y vacía en él los errores de tu último simulacro o bloque de ejercicios. Al final, identifica tus 3 temas más débiles y planifica la semana siguiente a partir de ellos.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-100\">METO-100 · El TOEFL es una prueba normativa (NRT), no de criterio (CRT)<\/a><\/li>\n<li><a href=\"#f-METO-102\">METO-102 · Anatomía de un ítem de opción múltiple: stem, key y distractores<\/a><\/li>\n<li>METO-108<\/li>\n<\/ul>", "quiz": []}, "METO-200": {"id": "METO-200", "titulo": "Input comprensible: necesario pero no suficiente", "categoria": "Cómo se adquiere un idioma", "tema": "Cómo se adquiere un idioma", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "Handbook of Second Language Acquisition", "autor": "Long, M. H. (cap.); Ritchie, W. C. & Bhatia, T. K. (eds.)", "edicion": "1st ed., Academic Press, 1996", "capitulo": "Chapter 13 — The Role of the Linguistic Environment in Second Language Acquisition", "seccion_libro": "III. The Insufficiency of Comprehensible Input", "paginas": "pp. 421–425", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> Handbook of Second Language Acquisition — M. H. Long (cap. 13), eds. Ritchie &amp; Bhatia, sección III \"The Insufficiency of Comprehensible Input\", pp. 421–425.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Entender por qué leer y escuchar mucho inglés es imprescindible, pero por sí solo no basta para dominar la gramática que evalúa el TOEFL ITP.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>Long revisa la evidencia y concluye que sin input comprensible no hay adquisición, pero que el input solo no lleva a la precisión gramatical, sobre todo en adultos:<\/p>\n<blockquote>\n<p>\"input must be comprehensible for acquisition to occur\" (p. 423)\n\"comprehensible input alone is insufficient, particularly with adults\" (p. 423)<\/p>\n<\/blockquote>\n<p>Los estudiantes de inmersión en Canadá entendían como nativos, pero seguían con errores de tiempos verbales, preposiciones y género \"even after ... nearly 7 years\" (p. 423). El caso de <strong>Wes<\/strong>, un adulto japonés que vivió 5 años en Honolulu, es claro: se comunicaba bien con fórmulas fijas, pero apenas aprendió morfología (p. 424). La paradoja: como el mensaje se entiende por el contexto, <strong>el aprendiz no se fija en las formas<\/strong> (\"Learners may not notice new forms precisely because ... a message is comprehensible\", p. 425).<\/p>\n<p>Además, la ayuda que más sirve para entender es la <strong>elaboración<\/strong> (repetir, parafrasear, hacer explícita la relación entre ideas), no la simplificación que vuelve el texto agramatical (pp. 421–423).<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Mantén una dosis diaria de input comprensible<\/strong> (lectura graduada, podcasts lentos, textos tipo TOEFL): es la base no negociable.<\/li>\n<li><strong>Elige input \"elaborado\", no infantilizado:<\/strong> textos con oraciones completas y explicaciones, no listas de frases telegráficas.<\/li>\n<li><strong>Agrega una segunda pasada con foco en la forma:<\/strong> después de entender el texto, reléelo buscando 2–3 estructuras concretas (tiempos verbales, preposiciones, artículos). Ver <a href=\"#f-METO-201\">METO-201 · Noticing (atención consciente) y focus on form<\/a>.<\/li>\n<li><strong>No midas tu progreso solo por \"lo entendí\":<\/strong> comprueba si podrías <em>reconocer un error<\/em> en esas mismas frases, que es lo que pide Written Expression.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Creer que \"con series y canciones basta\" y no revisar nunca la gramática.<\/li>\n<li>Quedarse con lo que funciona para comunicarse (como Wes) y dejar de mejorar la precisión.<\/li>\n<li>Usar solo materiales sobresimplificados que no tienen la gramática del examen.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Elige un texto corto (200–300 palabras) que ya entiendas. Haz una segunda lectura subrayando <strong>todos los verbos<\/strong> y anota su tiempo verbal. Repite con otro texto el jueves.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-201\">METO-201 · Noticing (atención consciente) y focus on form<\/a><\/li>\n<li><a href=\"#f-METO-203\">METO-203 · Interacción y negociación de significado (Interaction Hypothesis)<\/a><\/li>\n<li>METO-211<\/li>\n<\/ul>", "quiz": []}, "METO-201": {"id": "METO-201", "titulo": "Noticing (atención consciente) y focus on form", "categoria": "Estrategias y hábitos de estudio", "tema": "Estrategias y hábitos de estudio", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "Handbook of Second Language Acquisition", "autor": "Long, M. H. (cap.); Ritchie, W. C. & Bhatia, T. K. (eds.)", "edicion": "1st ed., Academic Press, 1996", "capitulo": "Chapter 13 — The Role of the Linguistic Environment in Second Language Acquisition", "seccion_libro": "IV.A. Attention, Awareness, and Focus on Form", "paginas": "pp. 426–429", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> Handbook of Second Language Acquisition — M. H. Long (cap. 13), eds. Ritchie &amp; Bhatia, sección IV.A \"Attention, Awareness, and Focus on Form\", pp. 426–429.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Aprender a \"fijarse\" deliberadamente en las formas gramaticales mientras lees o escuchas, porque lo que no se nota no se aprende.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>Long resume la hipótesis de Schmidt: el <em>noticing<\/em> (percibir conscientemente una forma) es lo que convierte el input en <em>intake<\/em>. No existe el aprendizaje \"subliminal\":<\/p>\n<blockquote>\n<p>\"there is no such thing as subliminal language learning\" (p. 427)<\/p>\n<\/blockquote>\n<p>En el estudio de Alanen sobre el finés, los que reportaron haber prestado atención a las formas meta las aprendieron, y \"no learners having acquired the targets without having noticed them\" (p. 428). Técnicas que ayudan: instrucciones para atender a forma y significado, ver reglas aplicadas a ejemplos, <strong>resaltar o poner en mayúsculas<\/strong> las formas (<em>input enhancement<\/em>) e \"inundar\" el input con la estructura (<em>input flooding<\/em>) (p. 428).<\/p>\n<p>Long distingue <strong>focus on form<\/strong> (atender a la forma <em>dentro<\/em> de una actividad con significado) de <strong>focus on forms<\/strong> (listas de reglas aisladas): lo eficaz es orientarse \"to both form and meaning, not to either form or meaning alone\" (p. 429).<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Lectura con resaltador:<\/strong> en cada texto, elige UNA estructura objetivo de la semana (p. ej., <em>present perfect<\/em>, artículos) y resáltala cada vez que aparezca.<\/li>\n<li><strong>Input flooding casero:<\/strong> busca 5–10 textos o videos donde la estructura salga muchas veces (p. ej., biografías para el pasado simple).<\/li>\n<li><strong>Regla + ejemplos reales:<\/strong> lee la regla en tu ficha GRAM y luego cázala en un texto auténtico; anota 3 ejemplos en tu cuaderno.<\/li>\n<li><strong>Compara tu producción con el modelo:<\/strong> escribe una frase, búscala en un texto nativo parecido y anota las diferencias (<em>noticing the gap<\/em>).<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Leer solo \"para entender\" sin mirar nunca cómo está dicho.<\/li>\n<li>Irse al otro extremo: estudiar reglas sueltas sin verlas en textos reales (focus on <em>forms<\/em>).<\/li>\n<li>Querer notar todo a la vez; la atención es limitada, mejor 1–2 formas por sesión.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Escoge la estructura <em>subject–verb agreement<\/em>. Durante 5 días, en un artículo corto diario, resalta cada sujeto y su verbo y marca si es singular o plural.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-200\">METO-200 · Input comprensible: necesario pero no suficiente<\/a><\/li>\n<li><a href=\"#f-METO-202\">METO-202 · Feedback correctivo (evidencia negativa) y recasts<\/a><\/li>\n<li>METO-207<\/li>\n<\/ul>", "quiz": []}, "METO-202": {"id": "METO-202", "titulo": "Feedback correctivo (evidencia negativa) y recasts", "categoria": "Práctica, repaso y memoria", "tema": "Práctica, repaso y memoria", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "Handbook of Second Language Acquisition", "autor": "Long, M. H. (cap.); Ritchie, W. C. & Bhatia, T. K. (eds.)", "edicion": "1st ed., Academic Press, 1996", "capitulo": "Chapter 13 — The Role of the Linguistic Environment in Second Language Acquisition", "seccion_libro": "IV.A–B. Negative feedback; Negative Evidence in L2 Acquisition", "paginas": "pp. 424–425, 429–430, 437–445", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> Handbook of Second Language Acquisition — M. H. Long (cap. 13), eds. Ritchie &amp; Bhatia, secciones IV.A–B, pp. 424–425, 429–430 y 437–445.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Buscar activamente corrección de tus errores, porque hay errores que el input por sí solo nunca te va a mostrar.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>Algunas reglas del inglés no se pueden aprender solo con ejemplos correctos: si tu lengua materna permite algo que el inglés no, el input simplemente no te dice que está mal. El ejemplo de Long es la posición del adverbio (<em>I drink every day coffee<\/em>): es perfectamente comprensible, así que nadie lo corrige, y por eso persiste incluso en hablantes muy avanzados (pp. 424–425). Para eso hace falta <strong>evidencia negativa<\/strong>: reglas gramaticales, corrección explícita, <em>recasts<\/em> (reformulación correcta inmediata) o malentendidos seguidos de reparación (p. 428).<\/p>\n<blockquote>\n<p>\"negative feedback is generally facilitative of L2 acquisition, and necessary for the acquisition of specifiable L2 structures\" (p. 430)<\/p>\n<\/blockquote>\n<p>En conversación informal los nativos casi nunca corrigen (p. 438). Sin embargo, cuando hay <em>recasts<\/em>, los aprendices son de 1.6 a 4.5 veces más propensos a producir después la forma correcta (p. 439). Las tareas colaborativas de resolver problemas generan 4–5 veces más correcciones que la conversación libre (p. 438).<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Pide corrección explícitamente<\/strong> a tutores o compañeros de intercambio: \"Please correct my grammar, even small mistakes\".<\/li>\n<li><strong>Escribe y hazte corregir<\/strong> (tutor, corrector, IA) y guarda cada error en un <strong>cuaderno de errores<\/strong> con la versión correcta al lado.<\/li>\n<li><strong>Reescribe la frase corregida<\/strong> en voz alta 3 veces y crea una frase nueva con la misma estructura (incorporar el <em>recast<\/em>).<\/li>\n<li><strong>Prefiere tareas con un objetivo<\/strong> (describir diferencias entre dos imágenes, resolver un problema) en lugar de charla libre: producen más feedback.<\/li>\n<li><strong>Revisa el cuaderno de errores<\/strong> cada semana: esos errores son candidatos perfectos para preguntas de <em>error identification<\/em>.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Pensar que \"si me entienden, está bien\": los errores comprensibles son justo los que se fosilizan.<\/li>\n<li>Recibir la corrección y no registrarla ni reutilizarla.<\/li>\n<li>Pedir corrección solo de la pronunciación y no de la gramática.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Escribe 5 párrafos cortos (uno por día) sobre tu rutina y consigue que alguien (o una herramienta) los corrija. Abre tu cuaderno de errores con al menos 10 entradas.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-201\">METO-201 · Noticing (atención consciente) y focus on form<\/a><\/li>\n<li><a href=\"#f-METO-203\">METO-203 · Interacción y negociación de significado (Interaction Hypothesis)<\/a><\/li>\n<li>METO-211<\/li>\n<\/ul>", "quiz": []}, "METO-203": {"id": "METO-203", "titulo": "Interacción y negociación de significado (Interaction Hypothesis)", "categoria": "Cómo se adquiere un idioma", "tema": "Cómo se adquiere un idioma", "seccion": "meto", "nivel": "Todos", "prioridad": "Media", "tipo": "No aplica — método de estudio", "fuente": "Handbook of Second Language Acquisition", "autor": "Long, M. H. (cap.); Ritchie, W. C. & Bhatia, T. K. (eds.)", "edicion": "1st ed., Academic Press, 1996", "capitulo": "Chapter 13 — The Role of the Linguistic Environment in Second Language Acquisition", "seccion_libro": "V. Negotiation for Meaning and Acquisition — A. The Role of Conversation; B. The Interaction Hypothesis", "paginas": "pp. 445, 451–453", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> Handbook of Second Language Acquisition — M. H. Long (cap. 13), eds. Ritchie &amp; Bhatia, sección V \"Negotiation for Meaning and Acquisition\", pp. 445, 451–453.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Usar la conversación (y sus malentendidos) como una herramienta de aprendizaje, no solo como uso final del idioma.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>Long retoma la idea de Hatch de que la gramática no se aprende primero para usarla después, sino que \"language learning evolves OUT of learning how to carry on conversations\" (p. 445). Su <strong>Interaction Hypothesis<\/strong> propone que negociar el significado (pedir aclaración, reformular, confirmar) ayuda porque:<\/p>\n<blockquote>\n<p>\"it connects input, internal learner capacities, particularly selective attention, and output in productive ways\" (pp. 451–452)<\/p>\n<\/blockquote>\n<p>Cuando el interlocutor repite, amplía o reformula lo que dijiste, la forma correcta aparece justo cuando tú ya sabes lo que querías decir; así te sobra atención para fijarte en <em>cómo<\/em> se dice (p. 452). Además, puedes probar de inmediato una hipótesis nueva en tu siguiente frase y recibir feedback (p. 452).<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Practica con alguien al menos 1–2 veces por semana<\/strong> (intercambio, tutor, club de conversación); si no es posible, conversa por escrito.<\/li>\n<li><strong>No finjas que entendiste:<\/strong> usa <em>Sorry, could you say that again?<\/em>, <em>Do you mean...?<\/em>, <em>What does ... mean?<\/em> Cada aclaración es input ajustado a ti.<\/li>\n<li><strong>Escucha la reformulación:<\/strong> cuando te repitan tu idea de forma correcta, repítela tú también.<\/li>\n<li><strong>Usa tareas con vacío de información<\/strong> (describir una foto que el otro no ve, explicar una ruta, comparar dos imágenes).<\/li>\n<li><strong>Para el TOEFL:<\/strong> las preguntas de reformulación (<em>Do you mean...?<\/em>, <em>So you're saying...<\/em>) son muy comunes en los diálogos cortos del Listening; practicarlas te entrena a reconocer paráfrasis.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Evitar hablar hasta \"saber suficiente gramática\".<\/li>\n<li>Asentir aunque no se entienda, perdiendo la oportunidad de negociar.<\/li>\n<li>Conversar solo de temas fáciles y repetidos, sin retos de información.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Agenda una sesión de 30 minutos de conversación y proponte usar al menos 5 veces una frase de aclaración o confirmación. Anota las reformulaciones que te hicieron.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-200\">METO-200 · Input comprensible: necesario pero no suficiente<\/a><\/li>\n<li><a href=\"#f-METO-202\">METO-202 · Feedback correctivo (evidencia negativa) y recasts<\/a><\/li>\n<\/ul>", "quiz": []}, "METO-300": {"id": "METO-300", "titulo": "Hábito de lectura diaria y registro de lectura", "categoria": "Estrategias de lectura", "tema": "Estrategias y hábitos de estudio", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "Inspired English Teaching: A Practical Guide for Teachers", "autor": "West, Keith", "edicion": "2010 (Continuum)", "capitulo": "Chapter 3 — Getting to grips with school issues", "seccion_libro": "Literacy as a whole-school issue / Reading times", "paginas": "pp. 23–24", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Inspired English Teaching<\/em> — Keith West, Chapter 3, \"Literacy as a whole-school issue\" y \"Reading times\", pp. 23–24.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Instalar un hábito diario de lectura en inglés (15 min) con un registro breve, como base para la sección Reading del TOEFL ITP.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>West da a sus alumnos una lista de \"puntos de partida\" para pensar su propia lectura: leer bien cuesta trabajo, hay que buscar el significado, apoyarse en lo ya leído y saber para qué se escribió el texto.<\/p>\n<blockquote>\n<p>\"Reading is about understanding as well as recognizing words.\" (p. 23)<\/p>\n<p>\"Students are then asked to read quietly for 15 minutes [...]\" y \"keep a log of their reading, which will amount to more than just the blurb\" (p. 24)<\/p>\n<\/blockquote>\n<p>Además: no hace falta leer libros más difíciles para mejorar (\"I don't have to read harder books to become a better reader\", p. 23), y vale tanto ficción como no ficción: \"It does not matter – as long as they are reading!\" (p. 24).<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Bloque fijo de 15 minutos al día<\/strong> (misma hora, p. ej. al desayunar). Cronómetro; lectura en silencio, sin traducir palabra por palabra.<\/li>\n<li><strong>Elige textos a tu nivel o apenas por encima<\/strong> (B1): artículos divulgativos, textos de ciencias naturales, historia o biografías — los temas típicos del TOEFL ITP Reading.<\/li>\n<li><strong>Antes de leer<\/strong>, pregúntate: <em>¿para qué se escribió este texto?<\/em> (informar, persuadir, entretener). Es la misma pregunta del ítem \"author's purpose\".<\/li>\n<li><strong>Mientras lees<\/strong>, busca el significado de la frase completa antes de ir al diccionario; usa lo que ya sabes del tema.<\/li>\n<li><strong>Al terminar, escribe en tu registro<\/strong> (3–4 líneas, en inglés si puedes): título/fuente, idea principal en una frase, 2–3 palabras nuevas, y si te resultó fácil/difícil. Más que \"la contraportada\": tu propia síntesis.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Creer que solo sirven textos \"difíciles\" o académicos densos: frustran y cortan el hábito.<\/li>\n<li>Leer sin registro: no hay forma de ver progreso ni de repasar vocabulario.<\/li>\n<li>Dejar que la lectura \"se deslice\" (West observa que sin un tiempo protegido la lectura se pierde).<\/li>\n<li>Detenerse en cada palabra desconocida: se pierde la idea general.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Lee 15 minutos durante 7 días seguidos y llena 7 entradas de registro (fuente, idea principal en 1 frase, 3 palabras nuevas). El domingo relee el registro completo.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-301\">METO-301 · Preguntas al texto: de lo literal a la inferencia<\/a><\/li>\n<li><a href=\"#f-METO-302\">METO-302 · Resumir un texto: eventos principales y estructura<\/a><\/li>\n<li><a href=\"#f-METO-305\">METO-305 · Vocabulario activo: explicar con tus palabras y usar palabras nuevas<\/a><\/li>\n<\/ul>", "quiz": []}, "METO-301": {"id": "METO-301", "titulo": "Preguntas al texto: de lo literal a la inferencia", "categoria": "Estrategias de lectura", "tema": "Estrategias y hábitos de estudio", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "Inspired English Teaching: A Practical Guide for Teachers", "autor": "West, Keith", "edicion": "2010 (Continuum)", "capitulo": "Chapter 5 — Making the assessment focus work; Chapter 7 — Lessons that really work", "seccion_libro": "Reading AF2 (retrieve information) / AF3 (deduce, infer or interpret) / A comprehension to inspire less-able students", "paginas": "pp. 81–84, 133", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Inspired English Teaching<\/em> — Keith West, Chapter 5, Reading AF2 y AF3, pp. 81–84; Chapter 7, \"A comprehension to inspire less-able students\", p. 133.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Interrogar cada texto con una escalera de preguntas — primero datos literales (detail), luego inferencias (inference) y predicción — que reproduce los tipos de ítem del TOEFL Reading.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>West separa dos destrezas de lectura evaluadas: <strong>recuperar información<\/strong> (\"Understand, describe, select or retrieve information [...] and use quotation and reference to texts\", AF2, p. 81) y <strong>deducir o inferir<\/strong> (\"Deduce, infer or interpret information, events or ideas from texts\", AF3, p. 83).<\/p>\n<p>Su comprensión \"Trapped\" (p. 133) muestra la escalera: preguntas literales (\"What three things did Wayne have in his pocket?\"), de detalle descriptivo (\"What does the old man look like?\") y una final de inferencia/predicción (\"What do you think will happen next?\"). Con el texto \"At the Gate\" pide deducir temas, personajes principales y \"What might happen next?\" (p. 83).<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Nivel 1 — Literal (detail):<\/strong> tras leer un párrafo, escribe 2 preguntas <em>Who/What/When/Where<\/em> cuya respuesta esté <strong>escrita<\/strong> en el texto, y subraya la línea exacta que la contesta (la \"reference to texts\" de AF2).<\/li>\n<li><strong>Nivel 2 — Inferencia:<\/strong> escribe 1 pregunta cuya respuesta <strong>no<\/strong> esté escrita pero se deduzca (\"What can be inferred about...?\"). Anota la frase que sirve de evidencia.<\/li>\n<li><strong>Nivel 3 — Predicción/tema:<\/strong> ¿de qué tratará el resto? ¿cuál es el tema general? Después comprueba leyendo.<\/li>\n<li><strong>Compara dos versiones del mismo hecho<\/strong> (como las dos crónicas del partido, pp. 81–82): lee dos noticias del mismo suceso y lista las diferencias en datos y en enfoque.<\/li>\n<li><strong>Regla de oro TOEFL:<\/strong> toda respuesta debe poder señalarse en el texto. Si no puedes citar la línea, la respuesta es una suposición tuya.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Responder con conocimiento propio en vez de con el texto.<\/li>\n<li>Confundir \"inferir\" con \"imaginar\": la inferencia del TOEFL siempre se apoya en una frase concreta.<\/li>\n<li>Quedarse solo en preguntas literales: el ITP también pregunta lo implícito.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Con 3 textos cortos (300–400 palabras) escribe para cada uno 2 preguntas literales + 1 de inferencia + 1 de predicción, con la línea de evidencia subrayada. Respóndelas al día siguiente sin mirar tus notas.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-300\">METO-300 · Hábito de lectura diaria y registro de lectura<\/a><\/li>\n<li><a href=\"#f-METO-302\">METO-302 · Resumir un texto: eventos principales y estructura<\/a><\/li>\n<li><a href=\"#f-METO-303\">METO-303 · Propósito del autor, punto de vista y hecho vs opinión<\/a><\/li>\n<\/ul>", "quiz": []}, "METO-302": {"id": "METO-302", "titulo": "Resumir un texto: eventos principales y estructura", "categoria": "Estrategias de lectura", "tema": "Estrategias y hábitos de estudio", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "Inspired English Teaching: A Practical Guide for Teachers", "autor": "West, Keith", "edicion": "2010 (Continuum)", "capitulo": "Chapter 5 — Making the assessment focus work; Chapter 7 — Lessons that really work", "seccion_libro": "Reading AF4 (structure and organization of texts) / Writing AF4 (paragraphs) / Trapped: Reading and speaking", "paginas": "pp. 78, 84–85, 134", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Inspired English Teaching<\/em> — Keith West, Chapter 5, Writing AF4 (p. 78) y Reading AF4 (pp. 84–85); Chapter 7, \"Trapped — Reading and speaking\", p. 134.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Resumir lo leído en una lista de puntos principales y reconocer por qué el texto cambia de párrafo, para responder ítems de idea principal y de organización del texto.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>West pide a los alumnos releer un cuento, <strong>hacer una lista de los eventos principales<\/strong> y volver a contarlo mirando solo esa lista:<\/p>\n<blockquote>\n<p>\"re-read 'Trapped' and make a list of the main events in the story. They can now take it in turns to retell the story – just looking at the list\" (p. 134)<\/p>\n<\/blockquote>\n<p>Para la organización, enseña que se abre un párrafo nuevo por \"a change of speaker; a change of place; a change of time; a change of topic\" (p. 78), y con un texto desordenado (\"A visit to Colchester\") pregunta: \"Was it easy or difficult to follow? Why?\" (p. 85). Un texto se entiende cuando los hechos aparecen \"as they happened\".<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Lee una vez completo<\/strong> sin anotar (visión general).<\/li>\n<li><strong>Relee y lista 4–6 puntos principales<\/strong>, uno por párrafo, en inglés y con tus palabras (no copies frases).<\/li>\n<li><strong>Cierra el texto y \"recuéntalo\"<\/strong> en voz alta o por escrito solo con tu lista. Si te atascas, tu lista no captó lo esencial.<\/li>\n<li><strong>Marca en el margen por qué cambia cada párrafo<\/strong>: tema, tiempo, lugar u otra voz. En textos expositivos del TOEFL casi siempre es <em>cambio de tema<\/em> — eso te da la estructura.<\/li>\n<li><strong>Escribe una sola frase-resumen<\/strong> (main idea) que cubra todos los puntos. Compárala con las opciones típicas: una muy estrecha (un solo detalle) y una muy amplia.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Resumir copiando frases del texto: no prueba comprensión.<\/li>\n<li>Elegir como idea principal un detalle llamativo del primer párrafo.<\/li>\n<li>Ignorar los cambios de párrafo, que son la pista más fácil de la organización.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Escoge 4 textos expositivos. Para cada uno: lista de puntos (1 por párrafo), recuento sin mirar, y una frase-resumen de máximo 20 palabras.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-300\">METO-300 · Hábito de lectura diaria y registro de lectura<\/a><\/li>\n<li><a href=\"#f-METO-301\">METO-301 · Preguntas al texto: de lo literal a la inferencia<\/a><\/li>\n<li><a href=\"#f-METO-307\">METO-307 · Sesión de estudio con objetivo, arranque y cierre<\/a><\/li>\n<\/ul>", "quiz": []}, "METO-303": {"id": "METO-303", "titulo": "Propósito del autor, punto de vista y hecho vs opinión", "categoria": "Estrategias de lectura", "tema": "Estrategias y hábitos de estudio", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "Inspired English Teaching: A Practical Guide for Teachers", "autor": "West, Keith", "edicion": "2010 (Continuum)", "capitulo": "Chapter 5 — Making the assessment focus work; Chapter 8 — For the older students", "seccion_libro": "Reading AF6 (writer's purposes and viewpoints) / Fact and opinion / Looking at audience and purpose", "paginas": "pp. 86–88, 147–148", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Inspired English Teaching<\/em> — Keith West, Chapter 5, Reading AF6, pp. 86–88; Chapter 8, \"Fact and opinion\" y \"Looking at audience and purpose\", pp. 147–148.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Identificar para qué escribe el autor, cuál es su postura y qué parte del texto es hecho comprobable y cuál opinión — base de los ítems de <em>author's purpose / attitude<\/em> del TOEFL.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>West resume lo que el lector debe hacer con un texto de no ficción: entender el sentido literal, \"the texts' purpose and recognize their target audience\", y apoyar sus juicios \"using evidence from the texts\" (p. 147). Su distinción clave:<\/p>\n<blockquote>\n<p>\"fact is something that can be proved to be true [...] Opinion is somebody's belief. It can be an interpretation of events.\" (p. 147)<\/p>\n<\/blockquote>\n<p>En el texto sobre el cuco, las palabras valorativas delatan la opinión: \"'nasty', 'rudely dump' and 'gets away with it' are the opinions of the writer\" (p. 148), y de ahí se deduce el propósito: \"persuade the reader that cuckoos are not pleasant birds\" (p. 148). Con el artículo sobre Wimbledon pide \"briefly state the viewpoint of the article and list the main points of the argument\" y preguntarse si hay sesgo: \"Is the article showing bias?\" (pp. 87–88).<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Pregunta de propósito<\/strong> al terminar cada texto: ¿informa, explica, persuade, critica, describe? Escribe el verbo (<em>inform, explain, persuade, argue, describe<\/em>).<\/li>\n<li><strong>Caza de palabras valorativas:<\/strong> subraya adjetivos y adverbios con carga (<em>nasty, superb, unfortunately, clearly<\/em>). Muchas → texto de opinión/persuasivo; casi ninguna → texto informativo.<\/li>\n<li><strong>Tabla Fact / Opinion:<\/strong> dos columnas; clasifica 5 frases del texto. Criterio: ¿se puede comprobar?<\/li>\n<li><strong>Postura en una frase:<\/strong> \"The author believes that...\" + 2 argumentos que la apoyan.<\/li>\n<li><strong>Compara dos fuentes del mismo hecho<\/strong> (como las crónicas \"A Deserved Victory\" / \"We Were Robbed\", pp. 81–82): mismo dato, distinta actitud. Así se entrena el ítem de <em>tone/attitude<\/em>.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Confundir el <strong>tema<\/strong> (de qué habla) con el <strong>propósito<\/strong> (para qué lo escribe).<\/li>\n<li>Tomar como hecho una afirmación solo porque suena segura o trae un número.<\/li>\n<li>Elegir en el examen un tono extremo (<em>furious, ecstatic<\/em>): los textos académicos del TOEFL suelen ser <em>objective, informative<\/em> o moderadamente críticos.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Lee 2 editoriales de opinión y 2 artículos informativos. Para cada uno: verbo de propósito, 3 palabras valorativas (o \"ninguna\"), tabla de 5 frases hecho/opinión y una frase de postura del autor.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-301\">METO-301 · Preguntas al texto: de lo literal a la inferencia<\/a><\/li>\n<li><a href=\"#f-METO-304\">METO-304 · Reconocer tono y técnicas de estilo<\/a><\/li>\n<\/ul>", "quiz": []}, "METO-304": {"id": "METO-304", "titulo": "Reconocer tono y técnicas de estilo", "categoria": "Estrategias de lectura", "tema": "Estrategias y hábitos de estudio", "seccion": "meto", "nivel": "Todos", "prioridad": "Media", "tipo": "No aplica — método de estudio", "fuente": "Inspired English Teaching: A Practical Guide for Teachers", "autor": "West, Keith", "edicion": "2010 (Continuum)", "capitulo": "Chapter 8 — For the older students", "seccion_libro": "Exam practice / Looking at stylistic techniques", "paginas": "pp. 148–151", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Inspired English Teaching<\/em> — Keith West, Chapter 8, \"Exam practice\" y \"Looking at stylistic techniques\", pp. 148–151.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Reconocer los recursos con que un autor crea tono e implica ideas (preguntas retóricas, lenguaje emotivo, ironía, inferencia, contraste…), para responder ítems de <em>tone<\/em>, <em>attitude<\/em> e <em>inference<\/em>.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>West señala que el recurso usado depende de la intención: \"whether a writer of a text is attempting to persuade, argue, advise, inform, explain, describe, review or analyse\" (p. 149). Su lista de técnicas incluye, entre otras:<\/p>\n<ul>\n<li><em>Rhetorical questions<\/em> — \"usually added for impact\" (p. 149)<\/li>\n<li><em>Emotive language<\/em> — \"meant to touch the readers' feelings\" (p. 149)<\/li>\n<li><em>Irony<\/em> — \"clever mockery\" (p. 149)<\/li>\n<li><em>Ambiguity<\/em> — \"more than one interpretation\" (p. 149)<\/li>\n<li><em>Inference<\/em> — \"things are suggested rather than stated\" (p. 150)<\/li>\n<\/ul>\n<p>Lo que distingue una buena lectura: los recursos \"are not only identified but discussed\" y el análisis \"focuses on precise aspects of the language\" (p. 149). Mnemotecnia del autor: <strong>A FOREST<\/strong> = \"Alliteration, fact, opinion, rhetorical questions, exaggeration, statistics, triplets\" (p. 151).<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Ten la lista a mano<\/strong> (rhetorical question, emotive language, irony, exaggeration, contrast, colloquial language, inference, statistics). Pégala en tu cuaderno.<\/li>\n<li><strong>Con textos cortos<\/strong> (un párrafo de opinión, una columna), marca cada recurso que encuentres con su nombre.<\/li>\n<li><strong>Para cada recurso, escribe \"¿para qué?\"<\/strong> en una línea: <em>The rhetorical question suggests that... / The statistic is used to support...<\/em> Identificar sin explicar no basta.<\/li>\n<li><strong>Traduce el efecto a un adjetivo de tono<\/strong>: <em>critical, sarcastic, enthusiastic, objective, nostalgic, skeptical<\/em>. Arma tu lista de adjetivos de tono en inglés.<\/li>\n<li><strong>Distingue lo dicho de lo implicado:<\/strong> reescribe en una frase lo que el autor <em>sugiere<\/em> sin decirlo (como \"Fishing is a lively and exciting pastime\" = la pesca es aburrida, pp. 149–150).<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Etiquetar recursos sin explicar su efecto.<\/li>\n<li>Leer la ironía literalmente y elegir la respuesta opuesta.<\/li>\n<li>No conocer en inglés los adjetivos de tono que aparecen en las opciones del examen.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Toma 3 columnas de opinión breves. En cada una identifica al menos 3 recursos de la lista, escribe su efecto en una línea y asigna un adjetivo de tono al texto completo.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-303\">METO-303 · Propósito del autor, punto de vista y hecho vs opinión<\/a><\/li>\n<li><a href=\"#f-METO-301\">METO-301 · Preguntas al texto: de lo literal a la inferencia<\/a><\/li>\n<\/ul>", "quiz": []}, "METO-305": {"id": "METO-305", "titulo": "Vocabulario activo: explicar con tus palabras y usar palabras nuevas", "categoria": "Vocabulario", "tema": "Práctica, repaso y memoria", "seccion": "meto", "nivel": "Todos", "prioridad": "Media", "tipo": "No aplica — método de estudio", "fuente": "Inspired English Teaching: A Practical Guide for Teachers", "autor": "West, Keith", "edicion": "2010 (Continuum)", "capitulo": "Chapter 4 — Making it all seem like fun; Chapter 7 — Lessons that really work", "seccion_libro": "Non-fiction material (Foxes: vocabulary exercise) / Wordbag / Starter lessons: The connectives story", "paginas": "pp. 67, 142–144", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Inspired English Teaching<\/em> — Keith West, Chapter 4, ejercicio de vocabulario sobre \"Foxes\", p. 67; Chapter 7, \"Wordbag\" y \"The connectives story\", pp. 142–144.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Pasar las palabras nuevas de \"reconocidas\" a \"dominadas\": explicarlas con tus propias palabras y usarlas en un texto propio, incluidos los conectores que el TOEFL pregunta.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>Tras una ficha informativa sobre zorros, West convierte el texto en ejercicio de vocabulario: \"In your own words, explain the following. You may use a dictionary if necessary\" (p. 67), con palabras como <em>abandoned, sacred, retractable claws, environment<\/em>.<\/p>\n<p>En \"Wordbag\" los alumnos reciben una bolsa de palabras y deben crear una historia: \"They are presented with new vocabulary and given the chance to use dictionaries\" y pueden añadir \"their own words, especially connectives\" (p. 142). En \"The connectives story\" cada oración debe empezar con un conector (<em>Alternatively, Meanwhile, Furthermore, Therefore, Although<\/em>…), porque \"it stops students using words such as then, so or and\" (p. 143).<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>De cada lectura, saca 8–10 palabras<\/strong> (sale de tu registro, METO-300).<\/li>\n<li><strong>Explícalas en inglés con tus palabras<\/strong> (una línea cada una) <em>antes<\/em> de consultar el diccionario; luego verifica y corrige. Esto es exactamente el ítem <em>vocabulary in context<\/em>: deducir por el contexto.<\/li>\n<li><strong>\"Wordbag\" semanal:<\/strong> mezcla 10–12 palabras de la semana y escribe un párrafo de 100–150 palabras que las use todas.<\/li>\n<li><strong>Conectores:<\/strong> escribe 6–8 oraciones, cada una iniciada con un conector distinto (<em>However, Therefore, Meanwhile, Although, Furthermore, Similarly<\/em>). Anota al lado qué relación expresa (contraste, causa, adición, tiempo).<\/li>\n<li><strong>Repasa<\/strong> al cabo de 2–3 días: tapa la explicación y vuelve a definir.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Hacer listas palabra–traducción sin usarlas nunca en una oración.<\/li>\n<li>Ir al diccionario antes de intentar deducir por el contexto.<\/li>\n<li>Abusar de <em>and, then, so<\/em> y no reconocer conectores formales (frecuentes en Structure y Reading).<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Construye tu \"wordbag\" con 12 palabras de tus lecturas: definición propia de cada una, un párrafo que las use todas y 6 oraciones iniciadas con conectores distintos.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-300\">METO-300 · Hábito de lectura diaria y registro de lectura<\/a><\/li>\n<li><a href=\"#f-METO-307\">METO-307 · Sesión de estudio con objetivo, arranque y cierre<\/a><\/li>\n<\/ul>", "quiz": []}, "METO-306": {"id": "METO-306", "titulo": "Autoevaluación con criterios explícitos y dos metas de mejora", "categoria": "Autoevaluación", "tema": "Motivación y metas", "seccion": "meto", "nivel": "Todos", "prioridad": "Media", "tipo": "No aplica — método de estudio", "fuente": "Inspired English Teaching: A Practical Guide for Teachers", "autor": "West, Keith", "edicion": "2010 (Continuum)", "capitulo": "Chapter 2 — Taking charge of your classroom; Chapter 3 — Getting to grips with school issues", "seccion_libro": "Planning teaching and learning in English / Assessment in English / Self-assessment", "paginas": "pp. 20–21, 24–26", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Inspired English Teaching<\/em> — Keith West, Chapter 2, \"Planning teaching and learning in English\", pp. 20–21; Chapter 3, \"Assessment in English\" y \"Self-assessment\", pp. 24–26.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Evaluar tu propio avance contra los criterios reales del examen y convertir cada revisión en <strong>dos metas concretas<\/strong> para la siguiente sesión.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>West defiende \"making them responsible for their own learning\" (p. 20) y observa que el trabajo mejora cuando el alumno lee los comentarios y \"write[s] down two targets for improvement\" (p. 21). Las metas deben ser específicas: \"Take care when you punctuate\" es \"too vague\" (p. 21).<\/p>\n<p>Sobre evaluación: \"do make sure that the students know what they are being assessed on\" (p. 25), y a los alumnos de examen les da \"a copy of the course syllabus and the assessment criteria\" (p. 25). Su hoja de autoevaluación (p. 26) pregunta: progreso, fortalezas, \"two areas in which I feel I have made progress\", \"two areas where I feel I need to improve\" y \"My two targets are: 1. 2.\"<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Conoce los criterios:<\/strong> consigue la descripción oficial del TOEFL ITP (secciones, número de ítems, tiempo, tipos de pregunta). Es tu \"syllabus\".<\/li>\n<li><strong>Corrige tus prácticas por categoría<\/strong>, no solo por puntaje: anota cada error con su tipo (p. ej. <em>subject–verb agreement<\/em>, <em>inference<\/em>, <em>vocabulary in context<\/em>).<\/li>\n<li><strong>Cada fin de semana, llena la hoja de West<\/strong> en tu cuaderno:\n   - ¿Cuánto avancé esta semana? (de 1 a 5)\n   - Mis fortalezas\n   - 2 áreas en que mejoré\n   - 2 áreas que debo mejorar\n   - <strong>Mis 2 metas:<\/strong> 1. … 2. …<\/li>\n<li><strong>Redacta metas específicas<\/strong> al estilo del \"buen comentario\" de West: no \"mejorar gramática\", sino \"revisar concordancia sujeto–verbo cuando el sujeto lleva <em>of<\/em>\" o \"subrayar la línea de evidencia en cada pregunta de inferencia\".<\/li>\n<li><strong>Empieza la siguiente práctica releyendo tus 2 metas<\/strong> y compruébalas al terminar.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Mirar solo el puntaje total, sin saber qué tipo de pregunta falla.<\/li>\n<li>Metas vagas o demasiadas (diez metas = ninguna).<\/li>\n<li>Estudiar sin conocer el formato del examen y sus criterios.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Haz una mini-práctica (20–30 ítems), clasifica tus errores por tipo y escribe tu hoja de autoevaluación con 2 metas específicas. Pégala en la primera página de tu cuaderno.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-307\">METO-307 · Sesión de estudio con objetivo, arranque y cierre<\/a><\/li>\n<li><a href=\"#f-METO-301\">METO-301 · Preguntas al texto: de lo literal a la inferencia<\/a><\/li>\n<\/ul>", "quiz": []}, "METO-307": {"id": "METO-307", "titulo": "Sesión de estudio con objetivo, arranque y cierre", "categoria": "Planificación del estudio", "tema": "Estrategias y hábitos de estudio", "seccion": "meto", "nivel": "Todos", "prioridad": "Media", "tipo": "No aplica — método de estudio", "fuente": "Inspired English Teaching: A Practical Guide for Teachers", "autor": "West, Keith", "edicion": "2010 (Continuum)", "capitulo": "Chapter 2 — Taking charge of your classroom; Chapter 3; Chapter 7; Chapter 8", "seccion_libro": "Planning teaching and learning / Use of plenary sessions / Starter lessons (or revision exercises) / Exam practice", "paginas": "pp. 21, 28, 143, 148", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Inspired English Teaching<\/em> — Keith West, Chapter 2, p. 21; Chapter 3, \"Use of plenary sessions\", p. 28; Chapter 7, \"Starter lessons (or revision exercises)\", p. 143; Chapter 8, \"Exam practice\", p. 148.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Estructurar cada sesión de estudio en tres partes — objetivo + arranque cronometrado, bloque principal con práctica en fragmentos cortos, y cierre en el que resumes lo aprendido.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>West traslada a la clase una estructura que sirve igual al autodidacta:<\/p>\n<ol>\n<li><strong>Objetivo explícito al inicio:<\/strong> \"telling them at the start of the lesson what we hope they will have achieved by the end\" (p. 21).<\/li>\n<li><strong>Arranque corto y cronometrado:<\/strong> los <em>starters<\/em> \"will last no longer than 15 minutes\", con \"a definite time allocation\"; la idea es \"work and learn fast\" (p. 143). El propio título los presenta como \"revision exercises\".<\/li>\n<li><strong>Práctica en fragmentos, no en exámenes interminables:<\/strong> los alumnos \"do not respond well to working on and going through endless past papers\"; es \"more effective to focus on some areas of the exam and give them snippets or short extracts\" (p. 148).<\/li>\n<li><strong>Cierre (plenary):<\/strong> comprobar si se aprendió algo y reforzarlo — \"in your own words, what have we learned today?\" (p. 28).<\/li>\n<\/ol>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<p>Sesión modelo de 60 minutos:\n1. <strong>Minuto 0–2 — Objetivo:<\/strong> escribe en una línea qué podrás hacer al final (\"Distinguir <em>who/which/that<\/em> en cláusulas relativas\"). Relee tus 2 metas (METO-306).\n2. <strong>Minuto 2–15 — Arranque de repaso<\/strong> (máx. 15 min, con cronómetro): flashcards de vocabulario, 10 ítems rápidos de un tema ya visto, o el ejercicio de conectores.\n3. <strong>Minuto 15–50 — Bloque principal en fragmentos:<\/strong> un solo tipo de ítem o un solo pasaje, no un examen completo. Reserva los simulacros completos para una vez cada 2–3 semanas.\n4. <strong>Minuto 50–60 — Cierre:<\/strong> sin mirar el material, escribe \"Today I learned...\" con 2–3 puntos y un ejemplo propio de cada uno. Si no puedes, ese tema vuelve mañana al arranque.<\/p>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Sentarse a \"estudiar inglés\" sin un objetivo concreto para esa sesión.<\/li>\n<li>Hacer solo exámenes completos uno tras otro: cansan y no muestran qué fallar.<\/li>\n<li>Terminar sin resumen: se pierde la consolidación (y la pista de qué repasar).<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Haz 5 sesiones con la estructura objetivo → arranque (≤15 min) → bloque en fragmentos → cierre \"Today I learned\". Guarda los 5 cierres; el siguiente arranque sale de ellos.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-306\">METO-306 · Autoevaluación con criterios explícitos y dos metas de mejora<\/a><\/li>\n<li><a href=\"#f-METO-305\">METO-305 · Vocabulario activo: explicar con tus palabras y usar palabras nuevas<\/a><\/li>\n<li><a href=\"#f-METO-302\">METO-302 · Resumir un texto: eventos principales y estructura<\/a><\/li>\n<\/ul>", "quiz": []}, "METO-400": {"id": "METO-400", "titulo": "Análisis de necesidades personal: el TOEFL ITP como target situation", "categoria": "Metas y planificación", "tema": "Motivación y metas", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "Introducing English for Specific Purposes", "autor": "Anthony, Laurence", "edicion": "1st ed., 2018 (Routledge Introductions to English for Specific Purposes)", "capitulo": "Chapter 4 — Identifying needs in the design of ESP courses and programs", "seccion_libro": "Basic concepts in needs analysis / The meaning of 'needs' / Four views of needs", "paginas": "pp. 65–69", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Introducing English for Specific Purposes<\/em> — Laurence Anthony, Chapter 4, \"Basic concepts in needs analysis\" y \"The meaning of 'needs'\", pp. 65–69.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Hacer tu propio análisis de necesidades: definir qué exige el TOEFL ITP (necessities), qué te falta hoy (lacks) y qué quieres tú (wants), para estudiar solo lo que mueve tu puntaje.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>Para Anthony, lo que distingue a ESP del inglés general es partir de necesidades claras y específicas. Cita a Brown: el análisis de necesidades es<\/p>\n<blockquote>\n<p>\"the systematic collection and analysis of all information used for defining and validating a defensible curriculum\" (p. 65).<\/p>\n<\/blockquote>\n<p>Usa tres términos de Hutchinson &amp; Waters (pp. 66–67):\n- <strong>Necessities<\/strong> (vista <em>diagnostic<\/em>): lo que la situación meta exige; lleva a <strong>ordenar objetivos<\/strong> en \"imprescindibles / deseables / irrelevantes\".\n- <strong>Lacks<\/strong> (vista <em>discrepancy<\/em>): la brecha entre lo que puedes hacer hoy y lo que exige la situación meta; por eso existen los <em>placement tests<\/em>.\n- <strong>Wants<\/strong> (vista <em>democratic<\/em>): lo que quieres del curso; si no es \"interesting, enjoyable, manageable, and relevant\", baja la motivación (p. 67).<\/p>\n<p>La tabla 4.1 (p. 69) da preguntas guía para el estudiante: <em>What is their level of English? How do they prefer to study? What is necessary for them to be successful? What knowledge and skills do they currently lack?<\/em><\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Define la target situation:<\/strong> TOEFL ITP, escala 310–677, meta 500. Secciones: Listening, Structure &amp; Written Expression, Reading. Fecha del examen y horas por semana disponibles (preguntas de <em>Setting<\/em> de la tabla 4.1).<\/li>\n<li><strong>Necessities:<\/strong> anota lo que el examen pide (p. ej. reconocer errores de concordancia, vocabulario en contexto, inferencia en diálogos cortos). Ordénalas: imprescindible → deseable → irrelevante (p. ej. ensayo y producción oral = irrelevante para el ITP).<\/li>\n<li><strong>Lacks:<\/strong> haz un examen diagnóstico completo con tiempo real. Registra aciertos por sección y por tipo de pregunta: esa es tu brecha.<\/li>\n<li><strong>Wants:<\/strong> escribe qué te motiva (series, temas, horarios). Úsalo para elegir <em>materiales<\/em> (lecturas sobre temas que te gustan), no para decidir <em>qué<\/em> estudiar.<\/li>\n<li>Junta todo en una tabla de una página: <em>necessity — lack (dato del diagnóstico) — prioridad<\/em>. Esa tabla es tu \"currículo defendible\".<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Estudiar \"inglés en general\" (listas largas, temas del libro) sin preguntar qué pide el examen.<\/li>\n<li>Confundir wants con necessities: \"quiero practicar conversación\" no sube puntos en el ITP.<\/li>\n<li>No medir los lacks: decidir por intuición en vez de por el resultado de un diagnóstico.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Haz un simulacro diagnóstico del TOEFL ITP y llena tu tabla <em>necessities / lacks / wants<\/em> con al menos 3 filas por sección.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-401\">METO-401 · Mini análisis 'just in time' y Current Best Shot: no confiar solo en lo que crees necesitar<\/a><\/li>\n<li><a href=\"#f-METO-402\">METO-402 · Convertir necesidades en objetivos de lenguaje y de habilidad<\/a><\/li>\n<li><a href=\"#f-METO-406\">METO-406 · Cómo funcionan los exámenes estandarizados (criterion- vs norm-referenced, washback)<\/a><\/li>\n<\/ul>", "quiz": []}, "METO-401": {"id": "METO-401", "titulo": "Mini análisis 'just in time' y Current Best Shot: no confiar solo en lo que crees necesitar", "categoria": "Metas y planificación", "tema": "Estrategias y hábitos de estudio", "seccion": "meto", "nivel": "Todos", "prioridad": "Media", "tipo": "No aplica — método de estudio", "fuente": "Introducing English for Specific Purposes", "autor": "Anthony, Laurence", "edicion": "1st ed., 2018 (Routledge Introductions to English for Specific Purposes)", "capitulo": "Chapter 4 — Identifying needs in the design of ESP courses and programs", "seccion_libro": "Conducting a small-scale 'just in time' needs analysis / Evaluating a needs analysis / Contentious issues: isn't a learner survey enough?", "paginas": "pp. 68, 70–74", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Introducing English for Specific Purposes<\/em> — Laurence Anthony, Chapter 4, \"Conducting a small-scale 'just in time' needs analysis\", \"Evaluating a needs analysis\" y \"isn't a learner survey enough?\", pp. 68, 70–74.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Mantener actualizado tu análisis de necesidades con revisiones rápidas, basadas en evidencia (muestras de tu desempeño) y no solo en tu opinión.<\/p>\n<h2>📘 Idea clave<\/h2>\n<ul>\n<li>No hace falta un análisis perfecto: basta un <strong>Current Best Shot (CBS)<\/strong>, que capta la información más útil para planear \"but makes no claim of being the complete picture\" (p. 68).<\/li>\n<li>Un buen análisis debe ser <strong>reliable, valid, and practical<\/strong> (p. 71), igual que un test; si sus resultados no se aplican, \"the endeavor is effectively worthless\" (p. 71).<\/li>\n<li>En la versión rápida, Anthony recomienda pedir una <strong>muestra del output<\/strong> y diagnosticar \"to what extent they can already achieve this goal\", y seguir monitoreando en cada clase (p. 71).<\/li>\n<li>Advertencia clave (p. 74): los aprendices pueden equivocarse sobre su debilidad; en un curso de aviación creían necesitar más términos técnicos, cuando el problema real era \"their poor pronunciation of already known technical terms\".<\/li>\n<\/ul>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Tu CBS en 30 minutos:<\/strong> con el diagnóstico de <a href=\"#f-METO-400\">METO-400 · Análisis de necesidades personal: el TOEFL ITP como target situation<\/a>, elige las 3 debilidades con más preguntas falladas. No esperes a tener el plan perfecto.<\/li>\n<li><strong>Evidencia, no impresión:<\/strong> cada 2 semanas haz una sección cronometrada (p. ej. 40 ítems de Structure) y compara. Que la medición sea <em>reliable<\/em> (mismo formato y tiempo), <em>valid<\/em> (ítems tipo ITP real) y <em>practical<\/em> (cabe en tu semana).<\/li>\n<li><strong>Análisis de errores:<\/strong> clasifica cada fallo por causa (no conocía la regla / leí mal / me faltó tiempo / vocabulario). A menudo la causa real no es la que creías, como en el ejemplo de la aviación.<\/li>\n<li><strong>Ajusta \"just in time\":<\/strong> si aparece un lack nuevo (p. ej. fallas siempre en <em>pronoun reference<\/em>), muévelo arriba de tu lista esa misma semana.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Planear todo el curso basándote solo en lo que \"sientes\" que te falta (el equivalente a la encuesta de aprendices que Anthony critica).<\/li>\n<li>Pasar semanas diseñando el plan ideal en vez de empezar con un CBS.<\/li>\n<li>Medir con pruebas distintas cada vez y no poder comparar resultados.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Revisa tus últimos 20 errores, clasifícalos por causa y reescribe tu top 3 de prioridades.<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-400\">METO-400 · Análisis de necesidades personal: el TOEFL ITP como target situation<\/a><\/li>\n<li><a href=\"#f-METO-406\">METO-406 · Cómo funcionan los exámenes estandarizados (criterion- vs norm-referenced, washback)<\/a><\/li>\n<\/ul>", "quiz": []}, "METO-402": {"id": "METO-402", "titulo": "Convertir necesidades en objetivos de lenguaje y de habilidad", "categoria": "Metas y planificación", "tema": "Motivación y metas", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "Introducing English for Specific Purposes", "autor": "Anthony, Laurence", "edicion": "1st ed., 2018 (Routledge Introductions to English for Specific Purposes)", "capitulo": "Chapter 5 — Deciding learning objectives for ESP courses and programs", "seccion_libro": "Foundations for deciding learning objectives: register analysis, rhetorical analysis, learning and metacognitive skills (Table 5.2)", "paginas": "pp. 79–81, 85–86", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Introducing English for Specific Purposes<\/em> — Laurence Anthony, Chapter 5, \"Foundations for deciding learning objectives\" y Table 5.2, pp. 79–81, 85–86.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Traducir tu análisis de necesidades en objetivos concretos y verificables, separando objetivos <strong>de lenguaje<\/strong> (gramática, vocabulario, organización del texto) y objetivos <strong>de habilidad<\/strong> (sub-skills de lectura y escucha).<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>En los cursos de inglés general los objetivos suelen ser reglas gramaticales y listas largas de vocabulario, y \"much of this might have little to do with the language that they need in real-world target settings\" (p. 79). En ESP los objetivos se vinculan directamente al análisis de necesidades y se apoyan en:\n- <strong>Register analysis<\/strong> (p. 79–80): rasgos de gramática y vocabulario típicos de un contexto; en lo académico, oraciones complejas, frases nominales largas, nominalizaciones, conectores lógicos, <em>hedging<\/em>.\n- <strong>Rhetorical analysis<\/strong> (p. 81): por qué aparecen ciertos rasgos; meta: desarrollar \"rhetorical awareness\" para textos \"as yet unseen\".\n- <strong>Learning and metacognitive skills<\/strong> (pp. 83–86): planificar, elegir estrategias, autocorregirse; la tabla 5.2 lista sub-skills, p. ej. de lectura: <em>identifying main ideas, supporting ideas, and examples; predicting, inferring, and guessing from context; scanning for specific information; identifying and understanding cohesive and discourse markers<\/em> (p. 85).<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li>Toma cada necessity priorizada en tu tabla de METO-400 y escribe <strong>dos tipos de objetivo<\/strong>:\n   - <em>Lenguaje:<\/em> \"Reconocer errores de concordancia sujeto-verbo con sujetos largos (<em>The number of …<\/em>)\".\n   - <em>Habilidad:<\/em> \"Responder preguntas de inferencia en Reading en &lt; 1 min\" (sub-skill <em>predicting, inferring, and guessing from context<\/em>).<\/li>\n<li>Usa la tabla 5.2 como <strong>checklist<\/strong>: marca los sub-skills de Reading y Listening que el TOEFL ITP mide (idea principal, detalle, inferencia, referencia, vocabulario en contexto) y descarta los de escritura/habla que no entran.<\/li>\n<li>Añade un objetivo <strong>metacognitivo<\/strong> por semana (p. ej. \"revisar mis errores cada domingo\").<\/li>\n<li>Formula cada objetivo como algo observable y medible (qué, cómo lo compruebo, para cuándo).<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Objetivos vagos (\"mejorar mi gramática\") que no se pueden comprobar.<\/li>\n<li>Solo objetivos de lenguaje (reglas) y ninguno de habilidad (estrategias de lectura/escucha bajo tiempo).<\/li>\n<li>Copiar el índice de un libro de gramática general como si fuera tu lista de objetivos.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Escribe 5 objetivos (3 de lenguaje, 2 de habili
