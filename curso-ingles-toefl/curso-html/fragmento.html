<title>Ruta TOEFL 500</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: hoja de respuestas TOEFL ITP — barra lateral de secciones como índice del cuadernillo,
   área de lectura a la derecha; los ejercicios se contestan rellenando óvalos A–D. */
:root {
  --papel: #F5F6F2;        /* fondo: papel de cuadernillo, gris con sesgo verde-azul */
  --hoja: #FFFFFF;         /* superficies de lectura */
  --tinta: #1B2A33;        /* texto principal */
  --tinta-2: #55646B;      /* texto secundario */
  --linea: #D6DCD8;        /* reglas y bordes */
  --acento: #1E6470;       /* tinta de formulario ETS: verde azulado */
  --acento-suave: #E2EEEE;
  --lapiz: #F2C230;        /* marca de lápiz/resaltador, uso puntual */
  --bien: #2F7A3E;  --bien-suave: #E3F1E4;
  --mal: #B3392F;   --mal-suave: #F7E4E1;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-texto: "Literata", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radio: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papel: #12191D; --hoja: #182227; --tinta: #E3E9E6; --tinta-2: #9AABAE; --linea: #2B3A40;
    --acento: #6FB8C2; --acento-suave: #1D3337; --lapiz: #E7B925;
    --bien: #74C07F; --bien-suave: #1B3220; --mal: #EE8A7F; --mal-suave: #3A201D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papel: #12191D; --hoja: #182227; --tinta: #E3E9E6; --tinta-2: #9AABAE; --linea: #2B3A40;
  --acento: #6FB8C2; --acento-suave: #1D3337; --lapiz: #E7B925;
  --bien: #74C07F; --bien-suave: #1B3220; --mal: #EE8A7F; --mal-suave: #3A201D;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--papel); color: var(--tinta);
  font-family: var(--f-texto); font-size: 16px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--acento); }
a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible {
  outline: 2px solid var(--acento); outline-offset: 2px;
}
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
.mono, .eyebrow { font-family: var(--f-mono); }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-2); }

/* ---------- Estructura ---------- */
.app { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: 100vh; }
.lateral {
  border-right: 1px solid var(--linea); background: var(--papel);
  position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto;
  padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
  display: flex; flex-direction: column; gap: 20px;
}
.marca { display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: var(--tinta); }
.marca strong { font-family: var(--f-display); font-size: 22px; letter-spacing: -.01em; }
.marca span { font-family: var(--f-mono); font-size: 12px; color: var(--tinta-2); }
.buscar input {
  width: 100%; font: 14px var(--f-mono); padding: 9px 10px; border-radius: var(--radio);
  border: 1px solid var(--linea); background: var(--hoja); color: var(--tinta);
}
.nav-principal { display: flex; flex-direction: column; gap: 2px; }
.nav-principal a, .tema-link {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  text-decoration: none; color: var(--tinta); font-family: var(--f-display); font-size: 15px;
  padding: 6px 8px; border-radius: var(--radio);
}
.nav-principal a:hover, .tema-link:hover { background: var(--acento-suave); }
.nav-principal a[aria-current="page"], .tema-link[aria-current="page"] {
  background: var(--acento); color: var(--hoja);
}
.nav-principal a[aria-current="page"] .cuenta, .tema-link[aria-current="page"] .cuenta { color: var(--hoja); }
.cuenta { font-family: var(--f-mono); font-size: 12px; color: var(--tinta-2); font-variant-numeric: tabular-nums; }
.grupo { display: flex; flex-direction: column; gap: 2px; }
.grupo h2 { font-size: 12px; font-family: var(--f-mono); font-weight: 500; letter-spacing: .08em;
  text-transform: uppercase; color: var(--tinta-2); padding: 0 8px 4px; }
.tema-link { font-size: 14px; font-family: var(--f-texto); }
.tema-link.vacio { color: var(--tinta-2); }

.principal {
  min-width: 0; padding-block: 32px 64px;
  padding-left: max(16px, 4vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 4vw);
}
.contenido { max-width: 820px; display: flex; flex-direction: column; gap: 28px; }

.barra-movil { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .lateral {
    position: fixed; inset: 0; z-index: 20; height: 100%; transform: translateX(-100%);
    transition: transform .2s ease; padding-top: calc(env(safe-area-inset-top, 0px) + 20px);
    padding-right: max(16px, env(safe-area-inset-right, 0px)); border-right: 0;
  }
  .lateral.abierta { transform: none; }
  .barra-movil {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
    background: var(--papel); border-bottom: 1px solid var(--linea);
    padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    z-index: 11; background: var(--papel); }
  .barra-movil strong { font-family: var(--f-display); font-size: 18px; }
  .principal { padding-top: 20px; }
}
@media (prefers-reduced-motion: reduce) { .lateral { transition: none; } }

.boton {
  font: 500 14px var(--f-display); padding: 9px 14px; border-radius: var(--radio); cursor: pointer;
  border: 1px solid var(--acento); background: var(--acento); color: var(--hoja);
}
.boton.secundario { background: transparent; color: var(--acento); }
.boton:disabled { opacity: .5; cursor: default; }

/* ---------- Encabezados de vista ---------- */
.cabecera { display: flex; flex-direction: column; gap: 10px; }
.cabecera h1 { font-size: clamp(30px, 5vw, 44px); letter-spacing: -.02em; }
.cabecera p { margin: 0; max-width: 62ch; color: var(--tinta-2); }

/* Escala TOEFL ITP 310–677 */
.escala { display: flex; flex-direction: column; gap: 6px; }
.escala-barra { position: relative; height: 10px; border-radius: 5px; background: var(--linea); }
.escala-barra .meta { position: absolute; top: -5px; width: 3px; height: 20px; background: var(--tinta); border-radius: 2px; }
.escala-barra .rango { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--acento); }
.escala-etiquetas { display: flex; justify-content: space-between; font: 12px var(--f-mono); color: var(--tinta-2); font-variant-numeric: tabular-nums; }

.secciones-resumen { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.sec-tarjeta {
  background: var(--hoja); border: 1px solid var(--linea); border-radius: var(--radio);
  padding: 16px; display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: var(--tinta);
}
.sec-tarjeta h3 { font-size: 17px; }
.sec-tarjeta .fila { display: flex; justify-content: space-between; font: 13px var(--f-mono); color: var(--tinta-2); }
.medidor { height: 6px; border-radius: 3px; background: var(--linea); overflow: hidden; }
.medidor > i { display: block; height: 100%; background: var(--acento); }

/* Plan de semanas */
.plan { display: flex; flex-direction: column; border-top: 1px solid var(--linea); }
.semana { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 16px; padding-block: 14px; border-bottom: 1px solid var(--linea); }
.semana .num { font: 500 13px var(--f-mono); color: var(--tinta-2); padding-top: 3px; }
.semana h3 { font-size: 17px; }
.semana p { margin: 4px 0 0; color: var(--tinta-2); font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip {
  font: 12px var(--f-mono); padding: 3px 8px; border-radius: 999px; text-decoration: none;
  border: 1px solid var(--linea); color: var(--tinta); background: var(--hoja);
}
.chip.vacio { color: var(--tinta-2); border-style: dashed; background: transparent; }
.chip.hecho { border-color: var(--acento); color: var(--acento); }

.aviso { background: var(--acento-suave); border-radius: var(--radio); padding: 14px 16px; font-size: 15px; }
.aviso strong { font-family: var(--f-display); }

/* ---------- Fichas ---------- */
.ficha { background: var(--hoja); border: 1px solid var(--linea); border-radius: var(--radio); }
.ficha > summary {
  list-style: none; cursor: pointer; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px;
}
.ficha > summary::-webkit-details-marker { display: none; }
.ficha > summary .linea1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; }
.ficha > summary h3 { font-size: 19px; }
.ficha .id { font: 12px var(--f-mono); color: var(--tinta-2); }
.ficha .fuente { font: 13px var(--f-mono); color: var(--tinta-2); }
.ficha .etiquetas { display: flex; flex-wrap: wrap; gap: 6px; }
.etq { font: 11px var(--f-mono); letter-spacing: .04em; padding: 2px 7px; border-radius: 4px; background: var(--acento-suave); color: var(--tinta); }
.etq.alta { background: var(--lapiz); color: #1B2A33; }
.ficha[open] > summary { border-bottom: 1px solid var(--linea); }
.ficha .cuerpo { padding: 4px 18px 18px; overflow-wrap: anywhere; }
.cuerpo h2 { font-size: 16px; margin: 20px 0 6px; }
.cuerpo blockquote { margin: 12px 0; padding: 6px 14px; border-left: 3px solid var(--linea); color: var(--tinta-2); font-size: 15px; }
.cuerpo code { font-family: var(--f-mono); font-size: 14px; background: var(--acento-suave); padding: 1px 5px; border-radius: 3px; }
.cuerpo pre { overflow-x: auto; background: var(--acento-suave); padding: 10px; border-radius: var(--radio); }
.cuerpo pre code { background: none; padding: 0; }
.cuerpo ul, .cuerpo ol { padding-left: 22px; }
.tabla { overflow-x: auto; margin: 10px 0; }
.tabla table { border-collapse: collapse; font-size: 14px; min-width: 100%; }
.tabla th, .tabla td { border-bottom: 1px solid var(--linea); padding: 6px 10px; text-align: left; vertical-align: top; }
.tabla th { font-family: var(--f-display); font-weight: 500; }
.ficha .pie { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center;
  border-top: 1px solid var(--linea); padding: 12px 18px; font: 13px var(--f-mono); color: var(--tinta-2); }
.ficha.foco { outline: 2px solid var(--lapiz); outline-offset: 2px; }

/* ---------- Ejercicios: óvalos de hoja de respuestas ---------- */
.ejercicios { display: flex; flex-direction: column; gap: 14px; }
.pregunta {
  background: var(--hoja); border: 1px solid var(--linea); border-radius: var(--radio);
  padding: 16px 18px; display: flex; flex-direction: column; gap: 12px;
}
.pregunta .meta-q { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font: 12px var(--f-mono); color: var(--tinta-2); }
.pregunta .meta-q a { color: var(--tinta-2); }
.enunciado { font-size: 17px; line-height: 1.7; white-space: pre-line; }
.seg { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1.5px; position: relative; }
.seg sub { font: 600 11px var(--f-mono); color: var(--acento); margin-left: 2px; }
.opciones { display: flex; flex-direction: column; gap: 6px; }
.opcion {
  display: grid; grid-template-columns: 30px minmax(0, 1fr); align-items: center; gap: 10px;
  text-align: left; font: inherit; font-size: 16px; color: var(--tinta); background: transparent;
  border: 1px solid transparent; border-radius: var(--radio); padding: 6px 8px; cursor: pointer;
}
.opcion:hover:not(:disabled) { border-color: var(--linea); }
.ovalo {
  width: 28px; height: 20px; border-radius: 50%; border: 1.5px solid var(--tinta-2);
  display: grid; place-items: center; font: 500 11px var(--f-mono); color: var(--tinta-2);
}
.opcion.marcada .ovalo { background: var(--tinta); border-color: var(--tinta); color: var(--hoja); }
.opcion.correcta { background: var(--bien-suave); }
.opcion.correcta .ovalo { background: var(--bien); border-color: var(--bien); color: var(--hoja); }
.opcion.incorrecta { background: var(--mal-suave); }
.opcion.incorrecta .ovalo { background: var(--mal); border-color: var(--mal); color: var(--hoja); }
.opcion:disabled { cursor: default; }
.explicacion { font-size: 15px; border-top: 1px dashed var(--linea); padding-top: 10px; }
.explicacion b { font-family: var(--f-display); }
.explicacion.bien b { color: var(--bien); }
.explicacion.mal b { color: var(--mal); }

.marcador { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font: 14px var(--f-mono); }
.marcador .num { font-size: 22px; font-family: var(--f-display); font-variant-numeric: tabular-nums; }

.resultados { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.resultado { background: var(--hoja); border: 1px solid var(--linea); border-radius: var(--radio); padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.resultado .pct { font: 700 30px var(--f-display); font-variant-numeric: tabular-nums; }

.lista-simple { display: flex; flex-direction: column; border-top: 1px solid var(--linea); }
.lista-simple > * { padding-block: 10px; border-bottom: 1px solid var(--linea); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.lista-simple a { text-decoration: none; }
.vacio-estado { color: var(--tinta-2); font-style: italic; }
</style>

<div class="app">
  <header class="barra-movil">
    <strong>Ruta TOEFL 500</strong>
    <button class="boton secundario" id="abrir-menu" type="button" aria-controls="lateral" aria-expanded="false">Temas</button>
  </header>

  <nav class="lateral" id="lateral" aria-label="Índice del curso">
    <a class="marca" href="#inicio"><strong>Ruta TOEFL 500</strong><span>TOEFL ITP · 310–677 · meta 500</span></a>
    <div class="buscar"><input id="buscar" type="search" placeholder="Buscar tema o regla…" aria-label="Buscar en las fichas"></div>
    <div class="nav-principal" id="nav-principal"></div>
    <div id="nav-temas" style="display:flex;flex-direction:column;gap:18px"></div>
  </nav>

  <main class="principal"><div class="contenido" id="vista"></div></main>
</div>

slug": "estrategias-y-habitos-de-estudio", "nombre": "Estrategias y hábitos de estudio", "fichas": ["METO-107", "METO-201", "METO-300", "METO-301", "METO-302", "METO-303", "METO-405", "METO-502", "METO-504", "METO-602", "METO-702", "METO-703", "METO-706", "METO-106", "METO-304", "METO-307", "METO-401", "METO-404", "METO-705"]}, {"slug": "practica-repaso-y-memoria", "nombre": "Práctica, repaso y memoria", "fichas": ["METO-202", "METO-403", "METO-505", "METO-704", "METO-105", "METO-305"]}, {"slug": "examenes-como-funcionan-y-como-prepararse", "nombre": "Exámenes: cómo funcionan y cómo prepararse", "fichas": ["METO-100", "METO-102", "METO-103", "METO-104", "METO-606", "METO-101", "METO-406"]}]}], "fichas": {"FUNC-100": {"id": "FUNC-100", "titulo": "Pedir y dar información personal (preguntas en present simple)", "categoria": "Lenguaje funcional", "tema": "Short dialogues: idioms & implied meaning", "seccion": "listening", "nivel": "A2", "prioridad": "Media", "tipo": "Listening — short dialogues (implied meaning)", "fuente": "Reward Pre-intermediate Resource Pack", "autor": "Ilegible en el OCR (portada: iusan Kab / The Lake School of English; posiblemente Susan Kay — sin confirmar)", "edicion": "1999 (© Macmillan Publishers Limited)", "capitulo": "Worksheets 1a y 1b", "seccion_libro": "Who am I? — Asking for and giving personal information", "paginas": "s/p — Worksheet 1, teacher's notes", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Reward Pre-intermediate Resource Pack<\/em> — Macmillan, 1999, Worksheets 1a/1b \"Who am I?\", teacher's notes (s/p).<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Reconocer y producir las preguntas básicas de información personal y entender sus respuestas en diálogos cortos (sobre todo <em>What do you do?<\/em> = trabajo).<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<p>Las preguntas de información personal usan <strong>present simple<\/strong>: con palabra interrogativa (<em>what, where, how old<\/em>) o sin ella (pregunta de sí/no con <em>Are you…? / Do you…?<\/em>). Clave para Listening: <strong>What do you do?<\/strong> pregunta por la <strong>profesión<\/strong>, no por lo que la persona está haciendo ahora.<\/p>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<ul>\n<li><code>Wh- word + do/does + subject + verb?<\/code> → <em>Where do you live?<\/em><\/li>\n<li><code>Are you + noun/adjective?<\/code> / <code>Do you + verb?<\/code> → respuestas cortas <em>Yes, I am / No, I don't.<\/em><\/li>\n<\/ul>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>What's your name? / How old are you?<\/li>\n<li>What do you do? (job)<\/li>\n<li>Where do you come from? / Where do you live?<\/li>\n<li>Do you have any sisters and brothers?<\/li>\n<li>Are you a secretary? / Do you come from Belfast?<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>Where you live?<\/em> → ✅ <em>Where <strong>do<\/strong> you live?<\/em> (falta el auxiliar)<\/li>\n<li>❌ <em>How many years do you have?<\/em> (calco del español) → ✅ <em>How old are you?<\/em><\/li>\n<li>❌ Interpretar <em>What do you do?<\/em> como \"¿qué estás haciendo?\" → es \"¿a qué te dedicas?\" (para la acción actual: <em>What are you doing?<\/em>)<\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>come from<\/td>\n<td>ser de / venir de<\/td>\n<td><em>Where do you come from?<\/em> = <em>Where are you from?<\/em><\/td>\n<\/tr>\n<tr>\n<td>What do you do?<\/td>\n<td>¿a qué te dedicas?<\/td>\n<td>respuesta: <em>I'm a pilot.<\/em><\/td>\n<\/tr>\n<tr>\n<td>information sheet<\/td>\n<td>ficha de datos<\/td>\n<td>vocabulario de la actividad<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: Worksheet 1a (identity cards) y 1b (information sheet): actividad de \"mill drill\" para completar la ficha preguntando a compañeros.<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li>GRAM-600<\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p>El OCR de la hoja de alumno (identity cards) está bastante legible; las notas del profesor son la fuente de los ejemplos.<\/p>", "quiz": [{"tipo": "listening", "pregunta": "Man: So, what do you do, Lisa? Woman: I fly planes for a small airline — mostly short trips to the islands. What does the woman mean?", "opciones": ["She is going on a trip to the islands.", "She works as a pilot.", "She is afraid of flying.", "She is buying a plane ticket."], "respuesta": "B", "explicacion": "'What do you do?' pregunta por la profesión; 'I fly planes for an airline' = es piloto. Las otras opciones toman palabras sueltas del diálogo (trips, islands) como distractores."}]}, "FUNC-101": {"id": "FUNC-101", "titulo": "Mostrar acuerdo y desacuerdo: So do I / Neither do I", "categoria": "Lenguaje funcional", "tema": "Short dialogues: idioms & implied meaning", "seccion": "listening", "nivel": "A2", "prioridad": "Alta", "tipo": "Listening — short dialogues (agreement / implied meaning)", "fuente": "Reward Pre-intermediate Resource Pack", "autor": "Ilegible en el OCR (portada: iusan Kab / The Lake School of English; posiblemente Susan Kay — sin confirmar)", "edicion": "1999 (© Macmillan Publishers Limited)", "capitulo": "Worksheet 4", "seccion_libro": "Likes and dislikes — Agreeing and disagreeing", "paginas": "s/p — Worksheet 4, teacher's notes", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Reward Pre-intermediate Resource Pack<\/em> — Macmillan, 1999, Worksheet 4 \"Likes and dislikes\", teacher's notes (s/p).<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Entender cuándo el segundo hablante <strong>coincide<\/strong> o <strong>no coincide<\/strong> con el primero al hablar de gustos — un tipo de pregunta muy frecuente en los diálogos cortos del TOEFL.<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<ul>\n<li>Para <strong>coincidir<\/strong> con una afirmación positiva: <em>So do I.<\/em> Con una negativa: <em>Neither/Nor do I.<\/em><\/li>\n<li>Para <strong>no coincidir<\/strong>: se responde con el auxiliar contrario: <em>I like… → I don't.<\/em> / <em>I don't like… → I do.<\/em><\/li>\n<li>El auxiliar copia el tiempo del primer hablante (<em>do/does/did, am, have, can…<\/em>), y en <em>So/Neither<\/em> va <strong>invertido<\/strong> (auxiliar antes del sujeto).<\/li>\n<\/ul>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Hablante A<\/th>\n<th>Acuerdo<\/th>\n<th>Desacuerdo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>I like…<\/td>\n<td>So do I.<\/td>\n<td>I don't.<\/td>\n<\/tr>\n<tr>\n<td>I don't like…<\/td>\n<td>Neither/Nor do I.<\/td>\n<td>I do.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>A: Do you like going to the cinema? — B: Yes, I do. — A: So do I. / I don't.<\/li>\n<li>A: Do you like doing homework? — B: No, I don't. — A: Neither/Nor do I. / I do.<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>So I do.<\/em> → ✅ <em>So do I.<\/em> (inversión obligatoria)<\/li>\n<li>❌ <em>Neither I don't.<\/em> → ✅ <em>Neither do I.<\/em> (<em>neither<\/em> ya es negativo: sin doble negación)<\/li>\n<li>❌ <em>I don't like it. — Me too.<\/em> → en inglés cuidado: ✅ <em>Me neither.<\/em> / <em>Neither do I.<\/em><\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>So do I / So am I / So can I<\/td>\n<td>yo también<\/td>\n<td>el auxiliar cambia según el verbo<\/td>\n<\/tr>\n<tr>\n<td>Neither/Nor do I<\/td>\n<td>yo tampoco<\/td>\n<td>tras oración negativa<\/td>\n<\/tr>\n<tr>\n<td>Me neither<\/td>\n<td>yo tampoco (informal)<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: Worksheet 4, \"mill drill\" con tarjetas de actividades (going to the cinema, doing homework…).<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-FUNC-104\">FUNC-104 · Pedir permiso y responder (Can I…? / Would you mind if I…?)<\/a><\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p>El mismo patrón de inversión (<em>So/Neither + aux + subject<\/em>) aparece en Structure (word order &amp; inversion).<\/p>", "quiz": [{"tipo": "listening", "pregunta": "Man: I really can't stand those long meetings on Monday mornings. Woman: Neither can I. What does the woman mean?", "opciones": ["She doesn't go to the Monday meetings.", "She also dislikes the Monday meetings.", "She thinks the meetings should be longer.", "She can't attend the meeting on Monday."], "respuesta": "B", "explicacion": "'Neither can I' tras una oración negativa (can't stand) significa 'yo tampoco (lo soporto)': está de acuerdo, a ella tampoco le gustan."}, {"tipo": "listening", "pregunta": "Woman: I don't really enjoy science fiction films. Man: Oh, I do! What does the man mean?", "opciones": ["He likes science fiction films.", "He doesn't enjoy films at all.", "He agrees with the woman.", "He wants to see a different film."], "respuesta": "A", "explicacion": "Responder 'I do' a una oración negativa expresa desacuerdo: a él sí le gustan."}]}, "FUNC-102": {"id": "FUNC-102", "titulo": "Pedir y dar direcciones; preposiciones de lugar", "categoria": "Lenguaje funcional", "tema": "Short dialogues: idioms & implied meaning", "seccion": "listening", "nivel": "A2", "prioridad": "Media", "tipo": "Listening — short dialogues / longer conversations (location details)", "fuente": "Reward Pre-intermediate Resource Pack", "autor": "Ilegible en el OCR (portada: iusan Kab / The Lake School of English; posiblemente Susan Kay — sin confirmar)", "edicion": "1999 (© Macmillan Publishers Limited)", "capitulo": "Worksheets 14a y 14b", "seccion_libro": "Where's the Park School of English? — Following directions; asking and saying where places are", "paginas": "s/p — Worksheets 14a/14b, teacher's notes", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Reward Pre-intermediate Resource Pack<\/em> — Macmillan, 1999, Worksheets 14a \"Map dictation\" y 14b \"Place cards\", teacher's notes (s/p).<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Seguir instrucciones de ubicación habladas y entender dónde está un lugar a partir de preposiciones de lugar.<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<p>Para pedir ubicación: <em>Excuse me, where's…, please?<\/em> Para responder se combinan <strong>imperativos de movimiento<\/strong> (<em>go past, turn right, take the second turning<\/em>) y <strong>preposiciones de lugar<\/strong> (<em>opposite, next to, between, behind, on the corner of, in front of<\/em>).<\/p>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<ul>\n<li><code>Excuse me, where's + place (+ please)?<\/code><\/li>\n<li><code>It's + preposition + landmark.<\/code> → <em>It's next to the restaurant.<\/em><\/li>\n<li><code>Go past… / Turn right… / Take the first/second turning on the left/right. / Go to the end of…<\/code><\/li>\n<\/ul>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>Excuse me, where's the Park School of English, please? — It's next to the Italian restaurant, opposite the cinema.<\/li>\n<li>Go past the hospital on the left and cross over the River Thames.<\/li>\n<li>At the roundabout, turn right.<\/li>\n<li>Take the second turning on the right. Go to the end and the museum is in front of you.<\/li>\n<li>Opposite the theatre is St Paul's church and next to that is the Black Prince pub.<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>in front of<\/em> = \"enfrente de (al otro lado de la calle)\" → eso es ✅ <em>opposite<\/em>; <em>in front of<\/em> = delante de.<\/li>\n<li>❌ <em>next of<\/em> → ✅ <em>next to<\/em><\/li>\n<li>❌ <em>between the museum with the river<\/em> → ✅ <em>between the museum <strong>and<\/strong> the river<\/em><\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>opposite<\/td>\n<td>enfrente (cruzando)<\/td>\n<td>falso amigo con <em>in front of<\/em><\/td>\n<\/tr>\n<tr>\n<td>on the corner of X and Y<\/td>\n<td>en la esquina de X y Y<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>roundabout / crossroads<\/td>\n<td>glorieta / cruce<\/td>\n<td>británico; en EE. UU. <em>traffic circle / intersection<\/em><\/td>\n<\/tr>\n<tr>\n<td>turning<\/td>\n<td>calle (para girar)<\/td>\n<td><em>take the second turning<\/em><\/td>\n<\/tr>\n<tr>\n<td>It's not very far.<\/td>\n<td>no está muy lejos<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: Worksheet 14a (dictado de mapa: el profesor lee direcciones) y 14b (tarjetas de lugares para preguntar y ubicar).<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-FUNC-100\">FUNC-100 · Pedir y dar información personal (preguntas en present simple)<\/a><\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p>El texto del dictado tiene caracteres corruptos (p. ej. \"Ihumes\" por <em>Thames<\/em>, \"inpont ofyou\" por <em>in front of you<\/em>); se reconstruyeron solo frases seguras.<\/p>", "quiz": [{"tipo": "listening", "pregunta": "Woman: Excuse me, is the post office near here? Man: Sure. It's right across the street from the bank, on the corner. What does the man say about the post office?", "opciones": ["It is inside the bank.", "It is opposite the bank.", "It is behind the bank.", "It is far from the bank."], "respuesta": "B", "explicacion": "'Across the street from' = opposite (enfrente, al otro lado de la calle). Es una paráfrasis típica del TOEFL."}]}, "FUNC-103": {"id": "FUNC-103", "titulo": "Hacer, aceptar y rechazar invitaciones", "categoria": "Lenguaje funcional", "tema": "Short dialogues: idioms & implied meaning", "seccion": "listening", "nivel": "A2", "prioridad": "Alta", "tipo": "Listening — short dialogues (invitations, implied acceptance/refusal)", "fuente": "Reward Pre-intermediate Resource Pack", "autor": "Ilegible en el OCR (portada: iusan Kab / The Lake School of English; posiblemente Susan Kay — sin confirmar)", "edicion": "1999 (© Macmillan Publishers Limited)", "capitulo": "Worksheet 16", "seccion_libro": "Invitation dominoes — Making invitations; prepositions of time and place", "paginas": "s/p — Worksheet 16, teacher's notes", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Reward Pre-intermediate Resource Pack<\/em> — Macmillan, 1999, Worksheet 16 \"Invitation dominoes\", teacher's notes (s/p).<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Reconocer las fórmulas de invitación y deducir si la otra persona <strong>acepta o rechaza<\/strong> aunque no diga \"yes\" o \"no\" directamente.<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<p>Invitaciones con <em>Would you like to + verb…?<\/em> y <em>How about + -ing…?<\/em>, seguidas de tiempo y lugar con la preposición correcta: <strong>at<\/strong> (hora, <em>the weekend<\/em> en británico, lugares puntuales), <strong>on<\/strong> (días y fechas), <strong>in<\/strong> (partes del día, meses, años, ciudades).<\/p>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<ul>\n<li><code>Would you like to + base verb + (time/place)?<\/code><\/li>\n<li><code>How about + verb-ing + (time/place)?<\/code><\/li>\n<li><code>at 8pm / at the weekend · on Monday / on 31 July · in the morning / in June / in 1996 · at the theatre · in London<\/code><\/li>\n<\/ul>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>Would you like to play tennis at the weekend?<\/li>\n<li>How about coming to the cinema with me on Thursday evening?<\/li>\n<li>Prepositions of time: at the weekend / 8pm, on 31 July / Monday, in the morning / June / 1996.<\/li>\n<li>Prepositions of place: at the theatre, in London.<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>How about to come…?<\/em> → ✅ <em>How about <strong>coming<\/strong>…?<\/em> (gerundio)<\/li>\n<li>❌ <em>Would you like come…?<\/em> → ✅ <em>Would you like <strong>to<\/strong> come…?<\/em><\/li>\n<li>❌ <em>in Monday<\/em> / <em>on the morning<\/em> → ✅ <em>on Monday<\/em> / <em>in the morning<\/em> (pero <em>on Thursday evening<\/em>)<\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Would you like to…?<\/td>\n<td>¿te gustaría…?<\/td>\n<td>invitación cortés<\/td>\n<\/tr>\n<tr>\n<td>How about…?<\/td>\n<td>¿qué tal si…?<\/td>\n<td>+ -ing o sustantivo<\/td>\n<\/tr>\n<tr>\n<td>I'd love to.<\/td>\n<td>me encantaría<\/td>\n<td>aceptación<\/td>\n<\/tr>\n<tr>\n<td>I'd love to, but…<\/td>\n<td>me encantaría, pero…<\/td>\n<td>rechazo cortés (respuesta = no)<\/td>\n<\/tr>\n<tr>\n<td>Rain check (ejemplo propio)<\/td>\n<td>dejarlo para otra ocasión<\/td>\n<td>idiom frecuente en TOEFL<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: Worksheet 16, dominó de preposiciones con tarjetas \"Make an invitation\".<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-FUNC-105\">FUNC-105 · Hacer peticiones y ofrecimientos (Could you…? / Shall I…?)<\/a><\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p><em>at the weekend<\/em> es británico; en inglés americano (TOEFL) se oye <em>on the weekend<\/em>. El vocabulario \"I'd love to, but…\" y \"rain check\" es añadido (no aparece en la hoja).<\/p>", "quiz": [{"tipo": "listening", "pregunta": "Man: Would you like to come to the concert with us on Friday night? Woman: I'd love to, but I promised my sister I'd help her move. What does the woman mean?", "opciones": ["She will go to the concert with her sister.", "She can't go to the concert.", "She is moving to a new apartment on Friday.", "She would like to change the date of the concert."], "respuesta": "B", "explicacion": "'I'd love to, but…' es un rechazo cortés: tiene otro compromiso (ayudar a su hermana a mudarse), así que no irá. Es su hermana, no ella, quien se muda."}]}, "FUNC-104": {"id": "FUNC-104", "titulo": "Pedir permiso y responder (Can I…? / Would you mind if I…?)", "categoria": "Lenguaje funcional", "tema": "Short dialogues: idioms & implied meaning", "seccion": "listening", "nivel": "B1", "prioridad": "Alta", "tipo": "Listening — short dialogues (implied meaning: yes/no answers to 'Would you mind…?')", "fuente": "Reward Pre-intermediate Resource Pack", "autor": "Ilegible en el OCR (portada: iusan Kab / The Lake School of English; posiblemente Susan Kay — sin confirmar)", "edicion": "1999 (© Macmillan Publishers Limited)", "capitulo": "Worksheet 30", "seccion_libro": "Would you mind…? — Asking for permission; agreeing and refusing", "paginas": "s/p — Worksheet 30, teacher's notes", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Reward Pre-intermediate Resource Pack<\/em> — Macmillan, 1999, Worksheet 30 \"Would you mind…?\", teacher's notes (s/p).<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Identificar fórmulas de permiso de distinto grado de formalidad y, sobre todo, interpretar bien las respuestas a <em>Would you mind…?<\/em>, donde <strong>\"No\" significa \"sí, adelante\"<\/strong>.<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<ul>\n<li>Permiso, de menos a más formal: <em>Can I…? · Could I…? · May I…? · Is it all right if I…? · Would you mind if I…?<\/em><\/li>\n<li>Respuestas a <em>Can/Could/May I…?<\/em>: <strong>sí<\/strong> = <em>Yes, of course. / Yes, go ahead. / By all means.<\/em>; <strong>no<\/strong> = <em>(I'm sorry) I'm afraid you can't. / I'm afraid not.<\/em><\/li>\n<li>Respuestas a <em>Would you mind if I…?<\/em> (= ¿te molesta si…?): <strong>sí, puedes<\/strong> = <em>No, of course not. / No, go ahead.<\/em>; <strong>no puedes<\/strong> = <em>I'm sorry, I'm afraid I do (mind).<\/em><\/li>\n<li>El libro señala que algunas fórmulas son formales: se usan con alguien que no conoces bien o de mayor rango (familia anfitriona, jefe, desconocido).<\/li>\n<\/ul>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<ul>\n<li><code>Can/Could/May I + base verb?<\/code><\/li>\n<li><code>Is it all right if I + present simple?<\/code><\/li>\n<li><code>Would you mind if I + past simple?<\/code> (ejemplo propio: <em>Would you mind if I opened the window?<\/em>)<\/li>\n<\/ul>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>Can I put the television on, please? — Yes, of course.<\/li>\n<li>Could I call a taxi? — No, I'm afraid not.<\/li>\n<li>Agreeing: Yes, of course. Yes, go ahead. By all means. / No, of course not. No, go ahead.<\/li>\n<li>Refusing: (I'm sorry) I'm afraid I/you can't. I'm afraid not. / I'm sorry, I'm afraid I do (mind).<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ Oír <em>\"Not at all\"<\/em> tras <em>Would you mind…?<\/em> y pensar que es negativa → ✅ significa <strong>permiso concedido<\/strong>.<\/li>\n<li>❌ <em>Would you mind if I open…?<\/em> en registro cuidado → ✅ <em>…if I <strong>opened<\/strong>…?<\/em> (pasado hipotético; en habla informal se oye presente).<\/li>\n<li>❌ <em>May I to use…?<\/em> → ✅ <em>May I use…?<\/em> (modal + base sin <em>to<\/em>)<\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Go ahead.<\/td>\n<td>adelante<\/td>\n<td>permiso<\/td>\n<\/tr>\n<tr>\n<td>By all means.<\/td>\n<td>por supuesto<\/td>\n<td>permiso, formal<\/td>\n<\/tr>\n<tr>\n<td>I'm afraid not.<\/td>\n<td>me temo que no<\/td>\n<td>rechazo cortés<\/td>\n<\/tr>\n<tr>\n<td>Not at all. (ejemplo propio)<\/td>\n<td>para nada (= no me molesta)<\/td>\n<td>respuesta afirmativa a <em>mind<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: Worksheet 30, \"mill drill\" con tarjetas (<em>put the television on, call a taxi, phone my mother, cook dinner…<\/em>) con ✓/✗ al reverso.<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-FUNC-105\">FUNC-105 · Hacer peticiones y ofrecimientos (Could you…? / Shall I…?)<\/a><\/li>\n<li>GRAM-606<\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p>El OCR corrompe varias fórmulas (\"I won&amp; ifyou could\" = <em>I wonder if you could<\/em>; \"Tkt's very kind of you\" = <em>That's very kind of you<\/em>); se reconstruyeron solo las de lectura segura.<\/p>", "quiz": [{"tipo": "listening", "pregunta": "Man: Would you mind if I borrowed your notes from yesterday's lecture? Woman: Not at all. They're in my blue folder. What does the woman mean?", "opciones": ["She doesn't have any notes.", "The man may borrow her notes.", "She minds lending her notes.", "She didn't attend the lecture."], "respuesta": "B", "explicacion": "'Not at all' responde a 'Would you mind…?': no le molesta, o sea, le da permiso. Además le dice dónde están."}, {"tipo": "listening", "pregunta": "Woman: Is it all right if I park here for a few minutes? Man: I'm afraid this space is reserved for the manager. What does the man imply?", "opciones": ["The woman can park there for a few minutes.", "The woman should not park there.", "The manager is not at work today.", "He will move his car for her."], "respuesta": "B", "explicacion": "'I'm afraid…' introduce un rechazo cortés: el lugar está reservado, así que ella no debe estacionarse ahí."}]}, "FUNC-105": {"id": "FUNC-105", "titulo": "Hacer peticiones y ofrecimientos (Could you…? / Shall I…?)", "categoria": "Lenguaje funcional", "tema": "Short dialogues: idioms & implied meaning", "seccion": "listening", "nivel": "B1", "prioridad": "Alta", "tipo": "Listening — short dialogues (requests, offers, implied meaning)", "fuente": "Reward Pre-intermediate Resource Pack", "autor": "Ilegible en el OCR (portada: iusan Kab / The Lake School of English; posiblemente Susan Kay — sin confirmar)", "edicion": "1999 (© Macmillan Publishers Limited)", "capitulo": "Worksheet 30", "seccion_libro": "Would you mind…? — Asking people to do things; offering", "paginas": "s/p — Worksheet 30, teacher's notes", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Reward Pre-intermediate Resource Pack<\/em> — Macmillan, 1999, Worksheet 30 \"Would you mind…?\", teacher's notes (s/p).<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Distinguir una <strong>petición<\/strong> (<em>Could you…?<\/em> = quiero que tú lo hagas) de un <strong>ofrecimiento<\/strong> (<em>Shall I…?<\/em> = yo lo hago por ti) y entender cómo se aceptan o rechazan.<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<ul>\n<li>Peticiones: <em>Can you…? · Could you…? · I wonder if you could…? · Would you mind + -ing?<\/em><\/li>\n<li>Ofrecimientos: <em>Shall I do that?<\/em> — respuestas: <em>That's very kind of you. Thank you.<\/em> (acepta) / <em>No, it's all right, thank you. No, I'll do it.<\/em> (rechaza).<\/li>\n<li><em>Would you mind + -ing?<\/em> pide que <strong>el otro<\/strong> haga algo; <em>Would you mind if I…?<\/em> pide permiso para hacerlo <strong>yo<\/strong> (ver FUNC-104).<\/li>\n<\/ul>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<ul>\n<li><code>Can/Could you + base verb?<\/code><\/li>\n<li><code>I wonder if you could + base verb.<\/code><\/li>\n<li><code>Would you mind + verb-ing?<\/code><\/li>\n<li><code>Shall I + base verb?<\/code><\/li>\n<\/ul>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>Can you…? / Could you…? / I wonder if you could…? / Would you mind -ing?<\/li>\n<li>Shall I do that? — That's very kind of you.<\/li>\n<li>Thank you. / No, it's all right, thank you. / No, I'll do it.<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>Would you mind to close the door?<\/em> → ✅ <em>Would you mind <strong>closing<\/strong> the door?<\/em> (mind + gerundio)<\/li>\n<li>❌ Confundir quién actúa: <em>Shall I…?<\/em> = lo hace el hablante; <em>Could you…?<\/em> = lo hace el oyente.<\/li>\n<li>❌ <em>I wonder if could you help me.<\/em> → ✅ <em>I wonder if <strong>you could<\/strong> help me.<\/em> (orden afirmativo en pregunta indirecta)<\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>I wonder if you could…<\/td>\n<td>me pregunto si podría…<\/td>\n<td>petición muy cortés<\/td>\n<\/tr>\n<tr>\n<td>Shall I…?<\/td>\n<td>¿quiere que (yo)…?<\/td>\n<td>ofrecimiento<\/td>\n<\/tr>\n<tr>\n<td>That's very kind of you.<\/td>\n<td>muy amable<\/td>\n<td>acepta<\/td>\n<\/tr>\n<tr>\n<td>No, it's all right.<\/td>\n<td>no hace falta<\/td>\n<td>rechaza<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: Worksheet 30, misma \"mill drill\" que FUNC-104, variando a peticiones y ofrecimientos.<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-FUNC-104\">FUNC-104 · Pedir permiso y responder (Can I…? / Would you mind if I…?)<\/a><\/li>\n<li><a href=\"#f-FUNC-103\">FUNC-103 · Hacer, aceptar y rechazar invitaciones<\/a><\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p>\"Give someone a hand\" es ejemplo propio (no aparece en el libro), muy común en el Listening del TOEFL.<\/p>", "quiz": [{"tipo": "listening", "pregunta": "Woman: These boxes are so heavy, and I still have six more in the car. Man: Shall I give you a hand? What does the man mean?", "opciones": ["He wants the woman to help him.", "He is offering to help carry the boxes.", "He thinks she bought too many things.", "He needs to borrow her car."], "respuesta": "B", "explicacion": "'Shall I…?' es un ofrecimiento y 'give someone a hand' = ayudar: se ofrece a cargar las cajas."}, {"tipo": "listening", "pregunta": "Man: Would you mind turning the music down a little? I'm trying to study. Woman: Oh, sorry, I didn't realize it was so loud. What will the woman probably do?", "opciones": ["Turn up the music.", "Lower the volume.", "Help the man study.", "Leave the room with the man."], "respuesta": "B", "explicacion": "'Would you mind + -ing' es una petición para que ella baje el volumen; su disculpa indica que lo hará."}]}, "FUNC-200": {"id": "FUNC-200", "titulo": "Presentarse, saludar y despedirse", "categoria": "Interacción social", "tema": "Short dialogues: idioms & implied meaning", "seccion": "listening", "nivel": "A2", "prioridad": "Media", "tipo": "Listening Part A — short dialogues (respuestas sociales)", "fuente": "Spoken English: Flourish Your Language", "autor": "Carmen, Robert (ed. y comp.)", "edicion": "Revised Edition, 2010 (Abhishek Publications, Chandigarh)", "capitulo": "Chapter 6 — Conversation", "seccion_libro": "Introductions; Hello and Goodbye: three short conversations", "paginas": "pp. 71–72", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> Spoken English: Flourish Your Language — Carmen, R. (ed.), Chapter 6 \"Conversation\", Introductions / Hello and Goodbye, pp. 71–72.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Reconocer las fórmulas de presentación, saludo y despedida y sus respuestas esperadas, para no confundirlas con contenido informativo en un diálogo corto.<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<p>Saludos y despedidas son <strong>pares adyacentes<\/strong>: a cada fórmula le corresponde una respuesta casi automática (<em>How are you? → Fine, thanks. And you?<\/em>; <em>Have a nice evening → Thanks, you too!<\/em>). En el TOEFL estas fórmulas casi nunca son la respuesta; sirven de \"relleno\" antes de la información clave.<\/p>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<ul>\n<li>Presentarse: <code>My name's + nombre. What's your name?<\/code> · <code>Where are you from? — I'm from + lugar.<\/code><\/li>\n<li>Saludo: <code>How are you? — Fine, thanks. How are you?<\/code><\/li>\n<li>Despedida: <code>See you tomorrow! / Have a nice evening. — Thanks, you too!<\/code><\/li>\n<\/ul>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>\"Hello. My name's Peter. What's your name?\" (p. 71)<\/li>\n<li>\"Where are you from Janet?\" — \"I'm from Seattle.\" (p. 71)<\/li>\n<li>\"Fine, thanks. How are you?\" (p. 72)<\/li>\n<li>\"Goodbye, Janet. See you tomorrow!\" — \"Bye bye, Peter. Have a nice evening.\" — \"Thanks, you too!\" (p. 72)<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>How is going everything?<\/em> → ✅ <em>How is everything going?<\/em> (orden en la pregunta; cap. 7, p. 104)<\/li>\n<li>❌ <em>How are you this week?<\/em> → ✅ <em>How have you been this week?<\/em> (periodo que llega hasta ahora → present perfect; cap. 7, p. 109)<\/li>\n<li>❌ <em>OK, I will see you late!<\/em> → ✅ <em>See you later!<\/em> (cap. 7, p. 101)<\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>My name's…<\/td>\n<td>me llamo…<\/td>\n<td>contracción de <em>name is<\/em><\/td>\n<\/tr>\n<tr>\n<td>See you tomorrow / later<\/td>\n<td>nos vemos mañana / luego<\/td>\n<td>despedida informal<\/td>\n<\/tr>\n<tr>\n<td>Have a nice evening/day<\/td>\n<td>que tengas buena tarde/día<\/td>\n<td>respuesta: <em>You too!<\/em><\/td>\n<\/tr>\n<tr>\n<td>How have you been?<\/td>\n<td>¿cómo has estado?<\/td>\n<td>tras un tiempo sin verse<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: diálogos \"Introductions\" y \"Hello / Goodbye\", pp. 71–72 (sin ejercicios; dialogo modelo).<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-FUNC-201\">FUNC-201 · Pedir algo cortésmente, agradecer y responder al agradecimiento<\/a><\/li>\n<li>FUNC-211<\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p>El diálogo del libro tiene una incoherencia (el hablante dice ser de Madrid y luego responde \"Yes, I am\" a <em>Are you American?<\/em>). Se usan solo las fórmulas, no el contenido.<\/p>", "quiz": [{"tipo": "listening", "pregunta": "Man: I haven't seen you since the conference. How have you been? Woman: Busier than ever, but I can't complain. What does the woman mean?", "opciones": ["She has been very busy but is basically fine.", "She did not attend the conference.", "She wants to complain about her job.", "She has been sick since the conference."], "respuesta": "A", "explicacion": "'I can't complain' = estoy bien, no tengo motivos de queja. Aunque esté ocupada, su estado general es bueno; no quiere quejarse."}]}, "FUNC-201": {"id": "FUNC-201", "titulo": "Pedir algo cortésmente, agradecer y responder al agradecimiento", "categoria": "Interacción social", "tema": "Short dialogues: idioms & implied meaning", "seccion": "listening", "nivel": "A2", "prioridad": "Media", "tipo": "Listening Part A — short dialogues (respuestas sociales)", "fuente": "Spoken English: Flourish Your Language", "autor": "Carmen, Robert (ed. y comp.)", "edicion": "Revised Edition, 2010 (Abhishek Publications, Chandigarh)", "capitulo": "Chapter 6 — Conversation", "seccion_libro": "What time is it? I–II; Directions I–II", "paginas": "pp. 72–75", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> Spoken English: Flourish Your Language — Carmen, R. (ed.), Chapter 6 \"Conversation\", What time is it? / Directions, pp. 72–75.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Reconocer las peticiones corteses con <em>Excuse me… Can you…?<\/em> y las respuestas al <em>thank you<\/em> (<em>You're welcome, No problem, Don't mention it<\/em>).<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<p>Una petición cortés suele abrirse con <strong>Excuse me<\/strong> y usar un modal (<em>Can you tell me…, please?<\/em>). Las tres respuestas a <em>Thank you<\/em> del libro son equivalentes: <strong>You're welcome<\/strong> (neutra), <strong>No problem<\/strong> (informal), <strong>Don't mention it<\/strong> (informal/amable). <em>Yes, of course<\/em> indica aceptación inmediata de la petición.<\/p>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<p><code>Excuse me. Can you tell me + objeto, please?<\/code> → <code>Yes, of course. …<\/code> → <code>Thank you.<\/code> → <code>You're welcome / No problem / Don't mention it.<\/code><\/p>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>\"Excuse me. Can you tell me the time, please?\" — \"Yes, of course. It's seven o'clock.\" (p. 72)<\/li>\n<li>\"Thank you.\" — \"No problem.\" (p. 72)<\/li>\n<li>\"Thanks.\" — \"You're welcome.\" (p. 72)<\/li>\n<li>\"Thank you.\" — \"Don't mention it.\" (p. 75)<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>Give me a favour!<\/em> → ✅ <em>Please do me a favour!<\/em> (colocación <em>do someone a favor<\/em>; cap. 7, p. 102)<\/li>\n<li>❌ <em>Could you correct me this letter?<\/em> → ✅ <em>Would you correct this letter for me?<\/em> (cap. 7, p. 113)<\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Excuse me<\/td>\n<td>disculpe (para llamar la atención)<\/td>\n<td>no es disculpa por un error<\/td>\n<\/tr>\n<tr>\n<td>Don't mention it<\/td>\n<td>no hay de qué<\/td>\n<td>no significa \"no lo menciones\"<\/td>\n<\/tr>\n<tr>\n<td>No problem<\/td>\n<td>no hay problema / de nada<\/td>\n<td>informal<\/td>\n<\/tr>\n<tr>\n<td>half past three<\/td>\n<td>las tres y media<\/td>\n<td>p. 72<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: diálogos pp. 72–75.<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-FUNC-200\">FUNC-200 · Presentarse, saludar y despedirse<\/a><\/li>\n<li><a href=\"#f-FUNC-202\">FUNC-202 · Pedir y dar indicaciones<\/a><\/li>\n<li>LIST-100<\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p><em>Excuse me<\/em> (para pedir algo) ≠ <em>I'm sorry<\/em> (para disculparse). En el libro aparece <em>Have a nice day!<\/em> como cierre de servicio, muy americano.<\/p>", "quiz": [{"tipo": "listening", "pregunta": "Man: Thanks so much for lending me your notes. Woman: Don't mention it. What does the woman mean?", "opciones": ["She is glad to help.", "She does not want him to tell anyone.", "She forgot about the notes.", "She wants the notes back now."], "respuesta": "A", "explicacion": "'Don't mention it' es una respuesta fija a 'thank you' = de nada. La opción B toma la frase de forma literal, trampa típica del TOEFL."}]}, "FUNC-202": {"id": "FUNC-202", "titulo": "Pedir y dar indicaciones", "categoria": "Interacción social", "tema": "Short dialogues: idioms & implied meaning", "seccion": "listening", "nivel": "A2", "prioridad": "Baja", "tipo": "Listening Part A — short dialogues (lugar / detalle)", "fuente": "Spoken English: Flourish Your Language", "autor": "Carmen, Robert (ed. y comp.)", "edicion": "Revised Edition, 2010 (Abhishek Publications, Chandigarh)", "capitulo": "Chapter 6 — Conversation", "seccion_libro": "Directions I; Directions II", "paginas": "pp. 74–75", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> Spoken English: Flourish Your Language — Carmen, R. (ed.), Chapter 6 \"Conversation\", Directions I–II, pp. 74–75.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Entender preguntas y respuestas sobre ubicación (<em>Is there… near here? How do I get there? Is it far?<\/em>) y respuestas atenuadas como <em>Not really<\/em>.<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<p>Para preguntar por un lugar se usa <strong>Is there a + lugar + near here?<\/strong>; para la ruta, <strong>How do I get there?<\/strong> Las indicaciones usan imperativos (<em>take the first left, go straight on<\/em>) y preposiciones de lugar (<em>on the corner, on the left, at the traffic lights<\/em>). <em>Not really<\/em> = \"no mucho\", negación suave.<\/p>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<p><code>Excuse me. Is there a ___ near here?<\/code> · <code>How do I get there?<\/code> · <code>At the ___, take the first left and go straight on. It's on the left.<\/code><\/p>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>\"Excuse me. Is there a bank near here?\" — \"Yes. There's a bank on the corner.\" (p. 74)<\/li>\n<li>\"At the traffic lights, take the first left and go straight on. It's on the left.\" (p. 74)<\/li>\n<li>\"Is it far?\" — \"Not really.\" (pp. 74–75)<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>It's in the corner<\/em> (para una calle) → ✅ <em>It's on the corner<\/em> (esquina exterior).<\/li>\n<li>❌ <em>My house is to ten minute of her.<\/em> → ✅ <em>It is a ten-minute drive from my house to hers.<\/em> (cap. 7, p. 101; adjetivo compuesto <em>ten-minute<\/em> sin -s)<\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>near here<\/td>\n<td>cerca de aquí<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>on the corner<\/td>\n<td>en la esquina<\/td>\n<td>preposición <em>on<\/em><\/td>\n<\/tr>\n<tr>\n<td>go straight on<\/td>\n<td>sigue derecho<\/td>\n<td>BrE; en AmE más común <em>go straight ahead<\/em><\/td>\n<\/tr>\n<tr>\n<td>Not really<\/td>\n<td>no mucho / no tanto<\/td>\n<td>negación suave<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: pp. 74–75.<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-FUNC-201\">FUNC-201 · Pedir algo cortésmente, agradecer y responder al agradecimiento<\/a><\/li>\n<li>VOCAB-107<\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p>\"Go straight on\" es más británico; en inglés americano estándar se oye <em>go straight ahead<\/em> o <em>keep going straight<\/em>.<\/p>", "quiz": [{"tipo": "listening", "pregunta": "Woman: Is the library far from here? Man: Not really. It's just past the second traffic light. What does the man mean?", "opciones": ["The library is fairly close.", "He doesn't really know where the library is.", "The library is far away.", "The library is closed today."], "respuesta": "A", "explicacion": "'Not really' contesta 'Is it far?' con una negación suave: no está lejos. La B confunde 'not really' con 'no lo sé'."}]}, "GRAM-100": {"id": "GRAM-100", "titulo": "Subject-verb agreement: reglas básicas (and, or, as well as, medidas)", "categoria": "Concordancia", "tema": "Subject–verb agreement", "seccion": "structure", "nivel": "B1", "prioridad": "Alta", "tipo": "Written Expression — error ID / Structure — completion", "fuente": "Oxford Guide to English Grammar", "autor": "Eastwood, J.", "edicion": "1st ed., 1994 (7th impression, 2002)", "capitulo": "Chapter 18 — Agreement", "seccion_libro": "§151 Singular and plural verbs; §152 Singular and plural subjects", "paginas": "§151–152, pp. 191–193", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> Oxford Guide to English Grammar — Eastwood, J., Chapter 18, §151–152, pp. 191–193.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Elegir el verbo singular o plural correcto identificando el <strong>verdadero sujeto<\/strong>, aunque haya frases intermedias, <code>and<\/code>, <code>or<\/code> o expresiones de medida.<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<ul>\n<li>La concordancia se da con la <strong>primera palabra del verbo finito<\/strong> en 3.ª persona: <code>is/are<\/code>, <code>has/have<\/code>, <code>-s<\/code> del present simple. En pasado solo hay concordancia con <code>was/were<\/code>. Los modales nunca cambian.<\/li>\n<li>Un sustantivo <strong>incontable<\/strong> lleva verbo singular.<\/li>\n<li>Dos frases unidas por <strong>and<\/strong> → plural (salvo que formen una sola cosa: <em>bread and butter<\/em>).<\/li>\n<li>Con <strong>or / either…or / not only…but also<\/strong> → el verbo concuerda con el elemento <strong>más cercano<\/strong>.<\/li>\n<li>Una <strong>medida<\/strong> (distancia, dinero, tiempo) se ve como un todo → singular. Títulos y nombres de una sola cosa → singular.<\/li>\n<li><strong>as well as / together with / with<\/strong> y la aposición <strong>no<\/strong> hacen plural al sujeto.<\/li>\n<li>Si hay una frase después del sustantivo, el verbo concuerda con el <strong>primer sustantivo<\/strong> (el núcleo).<\/li>\n<li>Una frase o cláusula como sujeto (gerundio, frase preposicional) → singular.<\/li>\n<li>Aunque el sujeto vaya después del verbo, el verbo concuerda con el sujeto.<\/li>\n<\/ul>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<p><code>[núcleo del sujeto] + (of/with/as well as…  ignorado) + verbo que concuerda con el núcleo<\/code>\n<code>A or B + verbo según B<\/code><\/p>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>Jamie and Emma <strong>go<\/strong> sailing at weekends. / Bread and butter <strong>was<\/strong> all we had.<\/li>\n<li>Either my sister or the neighbours <strong>are<\/strong> looking after the dog.<\/li>\n<li>Ten miles <strong>is<\/strong> too far to walk.<\/li>\n<li>George, together with some of his friends, <strong>is<\/strong> buying a race-horse.<\/li>\n<li>The house between the two bungalows <strong>is<\/strong> empty. / Opening my presents <strong>was<\/strong> exciting.<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>The results of the survey <strong>shows<\/strong>…<\/em> → ✅ <em>The results of the survey <strong>show<\/strong>…<\/em> (núcleo = results)<\/li>\n<li>❌ <em>The professor, as well as his students, <strong>are<\/strong> attending.<\/em> → ✅ <em>…<strong>is<\/strong> attending.<\/em><\/li>\n<li>❌ <em>Five dollars <strong>are<\/strong> a fair price.<\/em> → ✅ <em>Five dollars <strong>is<\/strong>…<\/em> (medida = singular)<\/li>\n<li>❌ <em>Either the manager or the clerks <strong>is<\/strong>…<\/em> → ✅ <em>…<strong>are<\/strong>…<\/em> (concuerda con el más cercano)<\/li>\n<li>❌ <em>Studying languages <strong>are<\/strong> useful.<\/em> → ✅ <em>…<strong>is<\/strong> useful.<\/em> (gerundio como sujeto)<\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>as well as / together with<\/td>\n<td>además de / junto con<\/td>\n<td>no suman al sujeto<\/td>\n<\/tr>\n<tr>\n<td>either … or / neither … nor<\/td>\n<td>o … o / ni … ni<\/td>\n<td>verbo = el más cercano<\/td>\n<\/tr>\n<tr>\n<td>not only … but also<\/td>\n<td>no solo … sino también<\/td>\n<td>verbo = el más cercano<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: el libro no incluye ejercicios en este capítulo; repasar ejemplos de pp. 191–193.<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-GRAM-101\">GRAM-101 · Agreement con one of, a number of / the number of, every, each, none, there<\/a><\/li>\n<li><a href=\"#f-GRAM-102\">GRAM-102 · Agreement con sustantivos en -s singulares, pair nouns y group nouns<\/a><\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<ul>\n<li>Inversión: <em>A great attraction <strong>are<\/strong> the antique shops…<\/em> — el sujeto real es <em>the antique shops<\/em>.<\/li>\n<li>Subjuntivo (§242): <em>We recommend that the pupil <strong>receive<\/strong> a special award.<\/em> (sin -s). Ver GRAM-123.<\/li>\n<\/ul>", "quiz": [{"tipo": "structure", "pregunta": "The collection of rare coins that the museum acquired last year ____ worth millions.", "opciones": ["are", "is", "have been", "were"], "respuesta": "B", "explicacion": "El núcleo del sujeto es 'collection' (singular); 'of rare coins' y la relativa no cambian la concordancia."}, {"tipo": "error-id", "pregunta": "The senator, {A|together with} several of his advisers, {B|are} expected {C|to arrive} {D|shortly}.", "opciones": null, "respuesta": "B", "explicacion": "'together with' no hace plural al sujeto; el sujeto es 'The senator' → 'is expected'."}, {"tipo": "structure", "pregunta": "Neither the director nor the actors ____ satisfied with the final scene.", "opciones": ["was", "is", "were", "has been"], "respuesta": "C", "explicacion": "Con neither…nor el verbo concuerda con el elemento más cercano: 'the actors' (plural) → were."}]}, "GRAM-101": {"id": "GRAM-101", "titulo": "Agreement con one of, a number of / the number of, every, each, none, there", "categoria": "Concordancia", "tema": "Subject–verb agreement", "seccion": "structure", "nivel": "B1", "prioridad": "Alta", "tipo": "Written Expression — error ID / Structure — completion", "fuente": "Oxford Guide to English Grammar", "autor": "Eastwood, J.", "edicion": "1st ed., 1994 (7th impression, 2002)", "capitulo": "Chapter 18 — Agreement", "seccion_libro": "§153 One of, a number of, every, there etc", "paginas": "§153, pp. 193–194", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> Oxford Guide to English Grammar — Eastwood, J., Chapter 18, §153, pp. 193–194.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Resolver la concordancia en sujetos con expresiones de cantidad, pronombres indefinidos y <code>there is/are<\/code>.<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<ul>\n<li><strong>one of + plural<\/strong> → verbo <strong>singular<\/strong> (el sujeto es <em>one<\/em>).<\/li>\n<li><strong>a number of / the majority of / a lot of + plural<\/strong> → verbo <strong>plural<\/strong> (expresan cantidad).<\/li>\n<li><strong>the number of<\/strong> (= la cifra) → <strong>singular<\/strong>. <strong>amount<\/strong> concuerda con <em>amount<\/em>.<\/li>\n<li>Fracciones: el verbo concuerda con el sustantivo que sigue (<em>three quarters of a potato is / half the plants were<\/em>).<\/li>\n<li><strong>every, each<\/strong> y compuestos <strong>everyone, someone, anything, nothing…<\/strong> → <strong>singular<\/strong>. Pero <em>all / some + plural<\/em> → plural. Si <em>each<\/em> va <strong>después<\/strong> de un sujeto plural → plural.<\/li>\n<li><strong>none of / neither of / either of / any of + plural<\/strong>: singular o plural (plural = más informal; en el examen, el singular es la opción \"segura\").<\/li>\n<li><strong>there + be<\/strong> concuerda con el <strong>complemento<\/strong> que sigue.<\/li>\n<\/ul>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<p><code>One of the + N plural + V singular<\/code> · <code>A number of + N plural + V plural<\/code> · <code>The number of + N plural + V singular<\/code> · <code>There is + N sing / There are + N pl<\/code><\/p>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>One of these letters <strong>is<\/strong> for you.<\/li>\n<li>A large number of letters <strong>were<\/strong> received. / The number of letters we receive <strong>is<\/strong> increasing.<\/li>\n<li>Every pupil <strong>has<\/strong> to take a test. / All the pupils <strong>have<\/strong> to take a test.<\/li>\n<li>The pupils each <strong>have<\/strong> to take a test.<\/li>\n<li>There <strong>was<\/strong> an accident. There <strong>were<\/strong> some accidents.<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>One of the most important inventions <strong>were<\/strong>…<\/em> → ✅ <em>…<strong>was<\/strong>…<\/em><\/li>\n<li>❌ <em>The number of applicants <strong>have<\/strong> doubled.<\/em> → ✅ <em>…<strong>has<\/strong> doubled.<\/em><\/li>\n<li>❌ <em>Each of the students <strong>have<\/strong> a locker.<\/em> → ✅ <em>…<strong>has<\/strong>…<\/em><\/li>\n<li>❌ <em>There <strong>is<\/strong> many reasons…<\/em> → ✅ <em>There <strong>are<\/strong> many reasons…<\/em><\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>a number of<\/td>\n<td>varios, muchos<\/td>\n<td>+ plural<\/td>\n<\/tr>\n<tr>\n<td>the number of<\/td>\n<td>el número (la cifra) de<\/td>\n<td>+ singular<\/td>\n<\/tr>\n<tr>\n<td>the majority of<\/td>\n<td>la mayoría de<\/td>\n<td>plural con N plural<\/td>\n<\/tr>\n<tr>\n<td>an amount of<\/td>\n<td>una cantidad de<\/td>\n<td>con incontables; concuerda con amount<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: sin ejercicios; ejemplos en pp. 193–194.<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-GRAM-100\">GRAM-100 · Subject-verb agreement: reglas básicas (and, or, as well as, medidas)<\/a><\/li>\n<li>GRAM-132<\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<ul>\n<li><em>Who/What<\/em> como sujeto → singular: <em>Who knows the answer?<\/em> Con <em>which/what + N<\/em>, concuerda con el sustantivo.<\/li>\n<li>Informalmente se oye <em>There's some friends of yours outside<\/em>, pero no es la forma de examen.<\/li>\n<\/ul>", "quiz": [{"tipo": "structure", "pregunta": "The number of species threatened by habitat loss ____ every decade.", "opciones": ["increase", "are increasing", "increases", "have increased"], "respuesta": "C", "explicacion": "'The number of' (la cifra) es singular → increases."}, {"tipo": "error-id", "pregunta": "One of the {A|earliest} settlements in the region {B|were} {C|founded} near the {D|river}.", "opciones": null, "respuesta": "B", "explicacion": "El sujeto es 'One' → singular: 'was founded'."}, {"tipo": "structure", "pregunta": "In the basement of the old library ____ several boxes of unpublished letters.", "opciones": ["there is", "there are", "it is", "they are"], "respuesta": "B", "explicacion": "Tras 'there', el verbo concuerda con el complemento 'several boxes' (plural) → there are."}]}, "GRAM-102": {"id": "GRAM-102", "titulo": "Agreement con sustantivos en -s singulares, pair nouns y group nouns", "categoria": "Concordancia", "tema": "Subject–verb agreement", "seccion": "structure", "nivel": "B2", "prioridad": "Alta", "tipo": "Written Expression — error ID", "fuente": "Oxford Guide to English Grammar", "autor": "Eastwood, J.", "edicion": "1st ed., 1994 (7th impression, 2002)", "capitulo": "Chapter 18 — Agreement", "seccion_libro": "§154 Nouns with a plural form; §155 Pair nouns; §156 Group nouns; §157 Number in the subject and object", "paginas": "§154–157, pp. 194–197", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> Oxford Guide to English Grammar — Eastwood, J., Chapter 18, §154–157, pp. 194–197.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Reconocer sustantivos que \"parecen\" plurales pero son singulares (y viceversa) para no fallar la concordancia.<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<ul>\n<li><strong>Siempre plurales (verbo plural):<\/strong> belongings, clothes, congratulations, earnings, goods, outskirts, premises, remains, riches, surroundings, thanks, troops.<\/li>\n<li><strong>Forma en -s pero verbo singular:<\/strong> <em>news<\/em>; materias (<em>mathematics, statistics, physics, politics, economics<\/em>); deportes y juegos (<em>athletics, gymnastics, billiards<\/em>); enfermedades (<em>measles, mumps<\/em>).<\/li>\n<li><strong>Misma forma singular y plural:<\/strong> barracks, crossroads, headquarters, means, series, species, works.<\/li>\n<li><strong>Pair nouns<\/strong> (trousers, glasses, scissors, jeans, pyjamas…): plural, sin <em>a<\/em> ni números; se cuentan con <strong>a pair of<\/strong> (que es singular).<\/li>\n<li><strong>Group nouns<\/strong> (family, team, government, committee, staff…): en inglés británico admiten singular o plural; en <strong>inglés americano<\/strong> (el del TOEFL) normalmente <strong>singular<\/strong>. Mantén la coherencia: singular → <em>it/its/which<\/em>; plural → <em>they/their/who<\/em>.<\/li>\n<li><strong>police, people, cattle, livestock, poultry<\/strong> → siempre <strong>plural<\/strong>.<\/li>\n<\/ul>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<p><code>The news is…<\/code> · <code>Economics is…<\/code> · <code>These trousers are… / This pair of trousers is…<\/code> · <code>The police are…<\/code><\/p>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>The news <strong>isn't<\/strong> very good, I'm afraid.<\/li>\n<li>These trousers <strong>need<\/strong> cleaning. / This pair of trousers <strong>needs<\/strong> cleaning.<\/li>\n<li>The government wants to improve <strong>its<\/strong> image. / The government want to improve <strong>their<\/strong> image.<\/li>\n<li>The police <strong>are<\/strong> questioning a man. / Some cattle <strong>have<\/strong> got out into the road.<\/li>\n<li>Each town has <strong>its own<\/strong> mayor.<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>Economics <strong>are<\/strong> a difficult subject.<\/em> → ✅ <em>Economics <strong>is<\/strong>…<\/em><\/li>\n<li>❌ <em>The police <strong>is<\/strong> investigating.<\/em> → ✅ <em>The police <strong>are<\/strong> investigating.<\/em><\/li>\n<li>❌ <em>The committee has made <strong>their<\/strong> decision.<\/em> → ✅ <em>…<strong>its<\/strong> decision.<\/em> (no mezclar singular con <em>their<\/em>)<\/li>\n<li>❌ <em>a scissor<\/em> → ✅ <em>a pair of scissors<\/em><\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>species / series / means<\/td>\n<td>especie(s) / serie(s) / medio(s)<\/td>\n<td>igual en singular y plural<\/td>\n<\/tr>\n<tr>\n<td>premises<\/td>\n<td>local, instalaciones<\/td>\n<td>siempre plural<\/td>\n<\/tr>\n<tr>\n<td>outskirts<\/td>\n<td>afueras<\/td>\n<td>siempre plural<\/td>\n<\/tr>\n<tr>\n<td>livestock<\/td>\n<td>ganado<\/td>\n<td>plural, sin -s<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: sin ejercicios; listas en pp. 194–197.<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-GRAM-100\">GRAM-100 · Subject-verb agreement: reglas básicas (and, or, as well as, medidas)<\/a><\/li>\n<li>GRAM-130<\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<ul>\n<li><em>These statistics are complicated<\/em> (= estas cifras) sí es plural. <em>His politics are left-wing<\/em> (= sus opiniones) también.<\/li>\n<li><em>The United States<\/em> normalmente lleva singular.<\/li>\n<\/ul>", "quiz": [{"tipo": "error-id", "pregunta": "Statistics {A|are} a branch of mathematics that {B|deals} with {C|the collection} and analysis of {D|numerical data}.", "opciones": null, "respuesta": "A", "explicacion": "'Statistics' como materia de estudio es singular → 'is'."}, {"tipo": "structure", "pregunta": "The committee has finally announced ____ decision on the new budget.", "opciones": ["its", "their", "it's", "theirs"], "respuesta": "A", "explicacion": "El verbo 'has' marca al group noun como singular, así que el posesivo debe ser 'its' (no 'their'). 'it's' = it is."}]}, "GRAM-200": {"id": "GRAM-200", "titulo": "Simple, compound and complex sentences", "categoria": "Estructura de la oración", "tema": "Sentence structure", "seccion": "structure", "nivel": "B1", "prioridad": "Alta", "tipo": "Structure — completion (missing subject/verb) / Written Expression — error ID", "fuente": "Intermediate English Grammar and Practice", "autor": "No consta en el documento", "edicion": "", "capitulo": "Unit 1", "seccion_libro": "Clause and sentence structure", "paginas": "Unit 1, p. 4", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> Intermediate English Grammar and Practice — Unit 1, \"Clause and sentence structure\", p. 4.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Reconocer las partes obligatorias de una cláusula (sujeto + verbo) y distinguir oraciones simples, compuestas y complejas, para detectar en el TOEFL oraciones a las que les falta el sujeto, el verbo o el conector.<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<ul>\n<li>Una <strong>oración simple<\/strong> tiene una sola cláusula: un <strong>noun group<\/strong> como sujeto + un <strong>verb group<\/strong>. Puede llevar <strong>objeto<\/strong>, <strong>complemento<\/strong> (tras verbos copulativos como <em>be, become, feel, seem<\/em>) y <strong>adverbial<\/strong> (cómo, cuándo, dónde).<\/li>\n<li>El orden cambia según sea afirmación, pregunta u orden; en las órdenes se omite el sujeto.<\/li>\n<li>Una <strong>oración compuesta<\/strong> une dos o más cláusulas principales (igual de importantes) con <em>and<\/em>, <em>but<\/em> u <em>or<\/em>. Si el sujeto es el mismo, normalmente se omite en la segunda cláusula.<\/li>\n<li>Una <strong>oración compleja<\/strong> tiene al menos una cláusula principal + una <strong>subordinada<\/strong>, introducida por una conjunción (<em>because, if, that<\/em>) o una palabra <em>wh-<\/em>. La subordinada puede ir antes, después o dentro de la principal.<\/li>\n<\/ul>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<ul>\n<li>Simple: <code>Subject + Verb (+ Object/Complement) (+ Adverbial)<\/code><\/li>\n<li>Compuesta: <code>Clause 1 + and/but/or + Clause 2<\/code><\/li>\n<li>Compleja: <code>Main clause + conjunction + Subordinate clause<\/code> · <code>Conjunction + Subordinate clause, + Main clause<\/code><\/li>\n<\/ul>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>She married a young engineer. (objeto)<\/li>\n<li>He was angry. (complemento)<\/li>\n<li>I wanted to go but felt too ill. (sujeto omitido en la 2.ª cláusula)<\/li>\n<li>When he stopped, no one said anything.<\/li>\n<li>The man who came into the room was small. (subordinada dentro de la principal)<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>Because it was more comfortable.<\/em> (fragmento: subordinada sin principal) → ✅ <em>They went by car because it was more comfortable.<\/em><\/li>\n<li>❌ <em>The man who came into the room small.<\/em> (falta el verbo principal) → ✅ <em>The man who came into the room <strong>was<\/strong> small.<\/em><\/li>\n<li>❌ Dos cláusulas principales sin conector: <em>He met Jane at the station, went shopping.<\/em> → ✅ <em>He met Jane at the station <strong>and<\/strong> went shopping.<\/em><\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>main clause<\/td>\n<td>cláusula principal<\/td>\n<td>puede ir sola<\/td>\n<\/tr>\n<tr>\n<td>subordinate clause<\/td>\n<td>cláusula subordinada<\/td>\n<td>necesita una principal<\/td>\n<\/tr>\n<tr>\n<td>complement<\/td>\n<td>complemento (atributo)<\/td>\n<td>tras <em>be, become, seem, feel<\/em><\/td>\n<\/tr>\n<tr>\n<td>adverbial / adjunct<\/td>\n<td>complemento circunstancial<\/td>\n<td>cómo, cuándo, dónde<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: Unit 1, p. 4 (explicación \"Main points\" y puntos 1–6).<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-GRAM-201\">GRAM-201 · Subject-verb agreement<\/a><\/li>\n<li>GRAM-224<\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p>El cambio de orden de dos cláusulas coordinadas puede cambiar el significado (<em>He went shopping and met Jane<\/em> ≠ <em>He met Jane and went shopping<\/em>): el orden indica secuencia.<\/p>", "quiz": [{"tipo": "structure", "pregunta": "The car that my brother bought last year ____ already broken down twice.", "opciones": ["it has", "has", "which has", "having"], "respuesta": "B", "explicacion": "El sujeto es 'The car that my brother bought last year'; falta solo el verbo principal 'has'. 'it has' repite el sujeto, 'which has' deja la oración sin verbo principal y 'having' no es verbo conjugado."}, {"tipo": "error-id", "pregunta": "{A|Because} the museum {B|was closed} on Monday, {C|and} we {D|visited} the park instead.", "opciones": null, "respuesta": "C", "explicacion": "Una subordinada con 'because' ya se une a la principal con una coma; añadir 'and' es un conector de más. Correcto: 'Because the museum was closed on Monday, we visited the park instead.'"}, {"tipo": "structure", "pregunta": "____ in the city, she moved to a small village.", "opciones": ["She had lived", "After living", "Living she", "She lived"], "respuesta": "B", "explicacion": "Antes de la coma se necesita una subordinada o frase, no otra cláusula independiente (que crearía un run-on). 'After living in the city' es correcta."}]}, "GRAM-201": {"id": "GRAM-201", "titulo": "Subject-verb agreement", "categoria": "Concordancia", "tema": "Subject–verb agreement", "seccion": "structure", "nivel": "B1", "prioridad": "Alta", "tipo": "Written Expression — error ID / Structure — completion", "fuente": "Intermediate English Grammar and Practice", "autor": "No consta en el documento", "edicion": "", "capitulo": "Units 2, 13, 14, 15, 18, 21", "seccion_libro": "The noun group; Count nouns; Singular and plural; Uncount nouns; Impersonal 'there'; Indefinite pronouns", "paginas": "Unit 2, p. 5; Unit 13, p. 16; Unit 14, p. 17; Unit 15, p. 18; Unit 18, p. 21; Unit 21, p. 24", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> Intermediate English Grammar and Practice — Units 2, 13, 14, 15, 18 y 21 (pp. 5, 16, 17, 18, 21, 24).<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Hacer concordar el verbo con el núcleo del sujeto (singular/plural), incluso con sustantivos incontables, indefinidos, colectivos y con <em>there is/are<\/em>.<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<ul>\n<li>Un noun group singular lleva verbo singular; uno plural, verbo plural (Unit 2 §7; Unit 13 §6).<\/li>\n<li>Los <strong>incontables<\/strong> llevan verbo singular, aunque terminen en <em>-s<\/em> (<em>physics, athletics, measles, news<\/em>) (Unit 15 §3–4).<\/li>\n<li>Los <strong>pronombres indefinidos<\/strong> (<em>everyone, anybody, nothing...<\/em>) como sujeto llevan <strong>siempre verbo singular<\/strong>, aunque se refieran a varias personas (Unit 21 §3).<\/li>\n<li><strong>Colectivos<\/strong> (<em>family, team, government, staff<\/em>): verbo singular o plural según se vea al grupo como unidad o como individuos (Unit 14 §4). <em>Police<\/em> es siempre plural.<\/li>\n<li><strong>There + be<\/strong>: el verbo concuerda con el sustantivo que sigue; plural ante <em>a number of, a lot of, a few<\/em>; singular si el primer sustantivo es singular o incontable (Unit 18 §3–4).<\/li>\n<\/ul>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<ul>\n<li><code>singular/uncount subject + singular verb<\/code> · <code>plural subject + plural verb<\/code><\/li>\n<li><code>Everyone / Nobody / Something + verb-s<\/code><\/li>\n<li><code>There is + singular/uncount noun<\/code> · <code>There are + plural noun<\/code><\/li>\n<\/ul>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>His son plays football for the school. / Her letters are always very short.<\/li>\n<li>Mathematics is too diffic
