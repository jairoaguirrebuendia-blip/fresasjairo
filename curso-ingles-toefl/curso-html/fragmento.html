ult for me.<\/li>\n<li>Everyone knows that.<\/li>\n<li>The police were informed immediately.<\/li>\n<li>There are many reasons for this. / There was a sofa and two chairs.<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>The address on the letters were wrong.<\/em> → ✅ <em>The address on the letters <strong>was<\/strong> wrong.<\/em> (el núcleo es <em>address<\/em>, no <em>letters<\/em>)<\/li>\n<li>❌ <em>Physics are difficult.<\/em> → ✅ <em>Physics <strong>is<\/strong> difficult.<\/em><\/li>\n<li>❌ <em>Everybody have a ticket.<\/em> → ✅ <em>Everybody <strong>has<\/strong> a ticket.<\/em><\/li>\n<li>❌ <em>There is many reasons.<\/em> → ✅ <em>There <strong>are<\/strong> many reasons.<\/em><\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>collective noun<\/td>\n<td>sustantivo colectivo<\/td>\n<td><em>family, team, staff<\/em><\/td>\n<\/tr>\n<tr>\n<td>news, physics, measles<\/td>\n<td>noticias, física, sarampión<\/td>\n<td>incontables con -s<\/td>\n<\/tr>\n<tr>\n<td>a number of<\/td>\n<td>varios<\/td>\n<td>verbo plural<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: Unit 2, p. 5; Unit 13, p. 16; Unit 14, p. 17; Unit 15, p. 18; Unit 18, p. 21; Unit 21, p. 24.<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-GRAM-206\">GRAM-206 · Count and uncount nouns<\/a><\/li>\n<li><a href=\"#f-GRAM-207\">GRAM-207 · Singular nouns, plural nouns and collective nouns<\/a><\/li>\n<li>GRAM-209<\/li>\n<li>GRAM-211<\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p>Con <em>none of<\/em> + plural, y <em>neither of<\/em> + plural, el libro admite verbo singular o plural (Units 27–28); en el examen la opción singular es la más segura en registro formal.<\/p>", "quiz": [{"tipo": "error-id", "pregunta": "The results of the new survey {A|on} consumer habits {B|shows} that {C|most} shoppers prefer {D|lower} prices.", "opciones": null, "respuesta": "B", "explicacion": "El núcleo del sujeto es 'results' (plural); 'of the new survey' es solo un modificador. Debe ser 'show'."}, {"tipo": "structure", "pregunta": "There ____ a large number of applicants for the scholarship this year.", "opciones": ["is", "was", "were", "has been"], "respuesta": "C", "explicacion": "Con 'a number of' + plural el verbo va en plural; de las opciones, solo 'were' es plural."}, {"tipo": "error-id", "pregunta": "{A|Economics} {B|are} one of the {C|most popular} subjects {D|at} this university.", "opciones": null, "respuesta": "B", "explicacion": "'Economics' es incontable singular (materia de estudio terminada en -s): 'is'."}]}, "GRAM-202": {"id": "GRAM-202", "titulo": "Word order in yes/no and wh-questions", "categoria": "Orden de palabras", "tema": "Word order & inversion", "seccion": "structure", "nivel": "B1", "prioridad": "Media", "tipo": "Structure — completion / Written Expression — error ID", "fuente": "Intermediate English Grammar and Practice", "autor": "No consta en el documento", "edicion": "", "capitulo": "Units 5–6", "seccion_libro": "Questions; 'Wh'-questions", "paginas": "Unit 5, p. 8; Unit 6, p. 9", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> Intermediate English Grammar and Practice — Unit 5 \"Questions\", p. 8; Unit 6 \"'Wh'-questions\", p. 9.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Formar preguntas directas con la inversión correcta (auxiliar antes del sujeto) y saber cuándo <strong>no<\/strong> se usa <em>do/does/did<\/em> (wh-word como sujeto).<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<ul>\n<li>En las preguntas, el <strong>primer verbo<\/strong> (auxiliar o modal) va antes del sujeto; el resto del verbo va después.<\/li>\n<li>Si solo hay verbo principal, se añade <em>do/does/did<\/em> + <strong>forma base<\/strong>. Con <em>be<\/em> (presente/pasado simple) se invierte el propio verbo.<\/li>\n<li>Si la <strong>wh-word es el sujeto<\/strong>, va primero y luego el verbo, <strong>sin<\/strong> <em>do<\/em>: <em>What happened?<\/em><\/li>\n<li>Si la wh-word es objeto o adverbial (<em>when, where, why, how<\/em>), se aplica la inversión como en yes/no.<\/li>\n<li>La preposición suele ir al final; con <em>whom<\/em> va delante (<em>With whom...<\/em>).<\/li>\n<li><em>How<\/em> + adjetivo/adverbio pregunta grado, tamaño, edad, distancia, frecuencia (<em>How old, How far, How long, How often<\/em>).<\/li>\n<\/ul>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<ul>\n<li><code>Aux/Modal + Subject + main verb ...?<\/code><\/li>\n<li><code>Wh-word (object) + aux + subject + verb ...?<\/code><\/li>\n<li><code>Wh-word (subject) + verb ...?<\/code><\/li>\n<\/ul>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>Will you have finished by lunchtime?<\/li>\n<li>Did he go to the fair?<\/li>\n<li>What happened? / Who could have done it?<\/li>\n<li>Where did you get that from?<\/li>\n<li>How far is it to Montreal from here?<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>Who did discover this?<\/em> (wh- sujeto) → ✅ <em>Who discovered this?<\/em><\/li>\n<li>❌ <em>Did he went to the fair?<\/em> → ✅ <em>Did he <strong>go<\/strong>...?<\/em> (forma base tras <em>did<\/em>)<\/li>\n<li>❌ <em>Where you got that?<\/em> → ✅ <em>Where <strong>did you get<\/strong> that?<\/em><\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>whom<\/td>\n<td>a quién<\/td>\n<td>formal; objeto<\/td>\n<\/tr>\n<tr>\n<td>what ... for<\/td>\n<td>para qué / por qué<\/td>\n<td>propósito<\/td>\n<\/tr>\n<tr>\n<td>which way / which direction ... in<\/td>\n<td>por dónde<\/td>\n<td>dirección<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: Unit 5, p. 8; Unit 6, p. 9.<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-GRAM-203\">GRAM-203 · Indirect and reported questions<\/a><\/li>\n<li><a href=\"#f-GRAM-204\">GRAM-204 · So/neither + auxiliary + subject<\/a><\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p>No se suele decir <em>How small / How young / How near<\/em>: se pregunta con el adjetivo \"neutro\" (<em>How big / How old / How far<\/em>).<\/p>", "quiz": [{"tipo": "structure", "pregunta": "How long ____ in this city before you moved to the capital?", "opciones": ["you had lived", "had you lived", "you lived", "lived you"], "respuesta": "B", "explicacion": "Pregunta directa con wh-word adverbial: auxiliar antes del sujeto → 'had you lived'."}, {"tipo": "error-id", "pregunta": "{A|Who} {B|did} {C|invent} the first practical telephone {D|in} 1876?", "opciones": null, "respuesta": "B", "explicacion": "'Who' es el sujeto; no se usa 'did'. Correcto: 'Who invented the first practical telephone?'"}]}, "GRAM-203": {"id": "GRAM-203", "titulo": "Indirect and reported questions", "categoria": "Orden de palabras", "tema": "Word order & inversion", "seccion": "structure", "nivel": "B1", "prioridad": "Alta", "tipo": "Structure — completion / Written Expression — error ID", "fuente": "Intermediate English Grammar and Practice", "autor": "No consta en el documento", "edicion": "", "capitulo": "Units 9, 75", "seccion_libro": "Indirect questions; Reported questions", "paginas": "Unit 9, p. 12; Unit 75, p. 78", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> Intermediate English Grammar and Practice — Unit 9 \"Indirect questions\", p. 12; Unit 75 \"Reported questions\", p. 78.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Usar el orden de <strong>afirmación<\/strong> (sujeto + verbo) dentro de preguntas indirectas y reportadas, y elegir correctamente <em>if/whether<\/em>. Es uno de los ítems más frecuentes del Structure del TOEFL.<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<ul>\n<li>Las preguntas indirectas (<em>Could you tell me..., Do you know..., I wonder...<\/em>) y las reportadas (<em>She asked..., He wanted to know...<\/em>) <strong>no invierten<\/strong>: el sujeto va <strong>antes<\/strong> del verbo.<\/li>\n<li><strong>No<\/strong> se usa el auxiliar <em>do/does/did<\/em> (salvo para énfasis, y nunca antes del sujeto).<\/li>\n<li>Las preguntas yes/no indirectas se introducen con <strong>if<\/strong> o <strong>whether<\/strong>; <em>whether<\/em> se prefiere cuando hay alternativas. <em>or not<\/em> puede ir justo después de <em>whether<\/em>, pero <strong>no<\/strong> después de <em>if<\/em>.<\/li>\n<li>En las reportadas, el verbo suele ir en pasado; puede quedar en presente/futuro si la pregunta sigue vigente.<\/li>\n<\/ul>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<ul>\n<li><code>Do you know / I wonder / She asked + wh-word + subject + verb<\/code><\/li>\n<li><code>... + if / whether + subject + verb<\/code><\/li>\n<li><code>whether or not + subject + verb<\/code><\/li>\n<\/ul>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>Could you tell me how far it is to the bank?<\/li>\n<li>Do you know where Jane is?<\/li>\n<li>I wonder what he feels about it.<\/li>\n<li>She asked him if his parents spoke French.<\/li>\n<li>I wonder whether or not we are so different from our ancestors.<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>Do you know where is Jane?<\/em> → ✅ <em>Do you know where <strong>Jane is<\/strong>?<\/em><\/li>\n<li>❌ <em>She asked me why was I late.<\/em> → ✅ <em>She asked me why <strong>I was<\/strong> late.<\/em><\/li>\n<li>❌ <em>I wonder what does he feel.<\/em> → ✅ <em>I wonder what <strong>he feels<\/strong>.<\/em><\/li>\n<li>❌ <em>I wonder if or not...<\/em> → ✅ <em>I wonder <strong>whether or not<\/strong>...<\/em><\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>I wonder if/whether<\/td>\n<td>me pregunto si<\/td>\n<td>también petición cortés<\/td>\n<\/tr>\n<tr>\n<td>enquire / inquire<\/td>\n<td>preguntar, indagar<\/td>\n<td>formal = ask<\/td>\n<\/tr>\n<tr>\n<td>want to know<\/td>\n<td>querer saber<\/td>\n<td>introduce pregunta reportada<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: Unit 9, p. 12; Unit 75, p. 78.<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-GRAM-202\">GRAM-202 · Word order in yes/no and wh-questions<\/a><\/li>\n<li>GRAM-233<\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p><em>do<\/em> puede aparecer para énfasis o contraste, pero después del sujeto: <em>He wondered whether it really did make any difference.<\/em><\/p>", "quiz": [{"tipo": "structure", "pregunta": "Scientists still do not know exactly ____ in the early universe.", "opciones": ["how did the first stars form", "how the first stars formed", "how formed the first stars", "the first stars how formed"], "respuesta": "B", "explicacion": "Pregunta indirecta (cláusula nominal): wh-word + sujeto + verbo, sin 'did' ni inversión."}, {"tipo": "error-id", "pregunta": "The reporter asked the mayor {A|when} {B|would the new bridge} be {C|opened} {D|to traffic}.", "opciones": null, "respuesta": "B", "explicacion": "En pregunta reportada no hay inversión: 'when the new bridge would be opened'."}, {"tipo": "structure", "pregunta": "The committee has not decided ____ to accept the proposal.", "opciones": ["if or not", "whether or not", "that", "what"], "respuesta": "B", "explicacion": "'or not' puede ir inmediatamente después de 'whether', pero no después de 'if'. 'whether' además va bien ante infinitivo."}]}, "GRAM-204": {"id": "GRAM-204", "titulo": "So/neither + auxiliary + subject", "categoria": "Orden de palabras", "tema": "Word order & inversion", "seccion": "structure", "nivel": "B1", "prioridad": "Media", "tipo": "Structure — completion / Written Expression — error ID", "fuente": "Intermediate English Grammar and Practice", "autor": "No consta en el documento", "edicion": "", "capitulo": "Unit 10", "seccion_libro": "Short answers", "paginas": "Unit 10, p. 13", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> Intermediate English Grammar and Practice — Unit 10 \"Short answers\", p. 13.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Usar respuestas cortas con el auxiliar correcto y la inversión tras <em>so / neither / nor<\/em> para indicar que algo también aplica a otra persona.<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<ul>\n<li>Las respuestas cortas usan pronombre + auxiliar, modal o <em>be<\/em> (<em>Yes, she does<\/em>). Si la frase original no tiene auxiliar, se usa <em>do/does/did<\/em>.<\/li>\n<li>Para decir \"yo también / yo tampoco\": <em>so<\/em> (afirmativo) y <em>neither / nor<\/em> (negativo) + <strong>auxiliar + sujeto<\/strong> (inversión), con el mismo auxiliar del enunciado.<\/li>\n<li>Con <em>not ... either<\/em> <strong>no<\/strong> hay inversión: <em>We don't either.<\/em><\/li>\n<li>Tras <em>think, hope, expect, suppose, imagine<\/em> se usa <em>so<\/em> (<em>I hope so<\/em>); negativos: <em>I don't think so<\/em>, pero <em>I hope not / I'm afraid not<\/em>.<\/li>\n<\/ul>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<ul>\n<li><code>So + aux + subject<\/code> · <code>Neither/Nor + aux + subject<\/code><\/li>\n<li><code>Subject + negative aux + either<\/code><\/li>\n<\/ul>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>'You were different then.' – 'So were you.'<\/li>\n<li>'I don't normally drink at lunch.' – 'Neither do I.'<\/li>\n<li>'I can't do it.' – 'Nor can I.'<\/li>\n<li>'He doesn't understand.' – 'We don't either.'<\/li>\n<li>'Is it raining?' – 'I'm afraid so.'<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>Neither I do.<\/em> → ✅ <em>Neither <strong>do I<\/strong>.<\/em><\/li>\n<li>❌ <em>So I am.<\/em> (para \"yo también\") → ✅ <em>So <strong>am I<\/strong>.<\/em><\/li>\n<li>❌ <em>Neither don't I.<\/em> (doble negación) → ✅ <em>Neither do I.<\/em><\/li>\n<li>❌ <em>I don't hope so.<\/em> → ✅ <em>I hope not.<\/em><\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>so do I<\/td>\n<td>yo también<\/td>\n<td>afirmativo<\/td>\n<\/tr>\n<tr>\n<td>neither / nor do I<\/td>\n<td>yo tampoco<\/td>\n<td>negativo, con inversión<\/td>\n<\/tr>\n<tr>\n<td>not ... either<\/td>\n<td>tampoco<\/td>\n<td>sin inversión<\/td>\n<\/tr>\n<tr>\n<td>I'm afraid so / not<\/td>\n<td>me temo que sí / no<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: Unit 10, p. 13.<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-GRAM-202\">GRAM-202 · Word order in yes/no and wh-questions<\/a><\/li>\n<li><a href=\"#f-GRAM-205\">GRAM-205 · Negative words and double negatives<\/a><\/li>\n<li>GRAM-246<\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p>Una respuesta corta (<em>Yes, I will<\/em>) es más cortés que un simple <em>Yes<\/em>; repetir toda la pregunta puede sonar impaciente.<\/p>", "quiz": [{"tipo": "structure", "pregunta": "Maria had never visited Asia before, and ____.", "opciones": ["neither had her husband", "neither her husband had", "her husband hadn't neither", "so had her husband"], "respuesta": "A", "explicacion": "Enunciado negativo ('never') → 'neither' + auxiliar 'had' + sujeto (inversión)."}, {"tipo": "error-id", "pregunta": "Lions {A|hunt} mainly at night, and {B|so} {C|tigers do} {D|in most regions}.", "opciones": null, "respuesta": "C", "explicacion": "Tras 'so' se invierte: 'so do tigers'."}]}, "GRAM-205": {"id": "GRAM-205", "titulo": "Negative words and double negatives", "categoria": "Negación", "tema": "Redundancy & word choice", "seccion": "structure", "nivel": "B1", "prioridad": "Media", "tipo": "Written Expression — error ID", "fuente": "Intermediate English Grammar and Practice", "autor": "No consta en el documento", "edicion": "", "capitulo": "Units 11–12", "seccion_libro": "Sentences with 'not'; Negative words", "paginas": "Unit 11, p. 14; Unit 12, p. 15", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> Intermediate English Grammar and Practice — Unit 11 \"Sentences with 'not'\", p. 14; Unit 12 \"Negative words\", p. 15.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Colocar <em>not<\/em> y <em>never<\/em> en la posición correcta y evitar la doble negación (muy común en hispanohablantes: \"no vi nada\").<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<ul>\n<li><em>not<\/em> va después del <strong>primer<\/strong> verbo del verb group (<em>I was not smiling<\/em>). Si solo hay verbo principal (≠ <em>be<\/em>), se usa <em>do not / does not / did not<\/em> + forma base.<\/li>\n<li><em>not<\/em> va antes de un <em>-ing<\/em> o un <em>to<\/em>-infinitivo: <em>Try not to worry.<\/em><\/li>\n<li><em>never<\/em> va después del primer auxiliar, antes del verbo simple, y después de <em>be<\/em>.<\/li>\n<li>Palabras negativas: <em>not, no, never, nobody, no one, nothing, none, nowhere, neither, nor<\/em>.<\/li>\n<li><strong>No<\/strong> se usan dos palabras negativas en la misma cláusula: tras una negación se usa <em>any, anything, anyone, anywhere<\/em>.<\/li>\n<li>Excepción: <em>neither ... nor<\/em> sí van juntas.<\/li>\n<\/ul>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<ul>\n<li><code>aux + not + verb<\/code> · <code>do/does/did + not + base form<\/code><\/li>\n<li><code>negative word + any-word<\/code> (no <code>negative + no-word<\/code>)<\/li>\n<\/ul>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>He does not speak English very well.<\/li>\n<li>We stood there, not knowing what to do.<\/li>\n<li>I've never had such a horrible meal.<\/li>\n<li>No-one can find Howard or Barbara anywhere.<\/li>\n<li>It won't do any good.<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>Nobody could see nothing.<\/em> → ✅ <em>Nobody could see <strong>anything<\/strong>.<\/em><\/li>\n<li>❌ <em>It won't do no good.<\/em> → ✅ <em>It won't do <strong>any<\/strong> good.<\/em><\/li>\n<li>❌ <em>He not speaks English.<\/em> → ✅ <em>He <strong>does not speak<\/strong> English.<\/em><\/li>\n<li>❌ <em>She goes never abroad.<\/em> → ✅ <em>She <strong>never goes<\/strong> abroad.<\/em><\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>none (of)<\/td>\n<td>ninguno<\/td>\n<td>pronombre<\/td>\n<\/tr>\n<tr>\n<td>nowhere<\/td>\n<td>en ningún lugar<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>hardly / not ... any<\/td>\n<td>apenas / ningún<\/td>\n<td>con <em>any<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: Unit 11, p. 14; Unit 12, p. 15.<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-GRAM-204\">GRAM-204 · So/neither + auxiliary + subject<\/a><\/li>\n<li>GRAM-215<\/li>\n<li>GRAM-216<\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p>En respuestas a preguntas negativas, <em>Yes<\/em> confirma lo afirmativo y <em>No<\/em> lo negativo: 'Isn't Tracey going to get bored?' – 'Yes.' (sí se aburrirá).<\/p>", "quiz": [{"tipo": "error-id", "pregunta": "Early settlers in the region {A|did not have} {B|no} reliable {C|maps} of the {D|surrounding} mountains.", "opciones": null, "respuesta": "B", "explicacion": "Doble negación: tras 'did not' se usa 'any'. Correcto: 'did not have any reliable maps'."}, {"tipo": "structure", "pregunta": "The survivors waited for hours, but ____ came to rescue them.", "opciones": ["anybody", "nobody", "not anybody", "somebody not"], "respuesta": "B", "explicacion": "Se necesita sujeto negativo: 'nobody came'. 'Anybody' no puede ser sujeto de una oración negativa y aquí además no hay negación."}]}, "GRAM-206": {"id": "GRAM-206", "titulo": "Count and uncount nouns", "categoria": "Sustantivos", "tema": "Nouns: count/noncount", "seccion": "structure", "nivel": "B1", "prioridad": "Alta", "tipo": "Written Expression — error ID", "fuente": "Intermediate English Grammar and Practice", "autor": "No consta en el documento", "edicion": "", "capitulo": "Units 13, 15", "seccion_libro": "Count nouns; Uncount nouns", "paginas": "Unit 13, p. 16; Unit 15, p. 18", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> Intermediate English Grammar and Practice — Unit 13 \"Count nouns\", p. 16; Unit 15 \"Uncount nouns\", p. 18.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Distinguir sustantivos contables e incontables, formar plurales correctamente y saber qué determinantes acepta cada tipo.<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<p><strong>Contables (Unit 13):<\/strong>\n- Tienen singular y plural; se usan con números.\n- El <strong>singular contable nunca va solo<\/strong>: necesita determinante (<em>a, the, another, every...<\/em>).\n- El plural va sin determinante cuando se habla en general (<em>The film is not suitable for children<\/em>).\n- Plurales: <em>-s<\/em>; <em>-es<\/em> tras <em>-ss, -ch, -s, -sh, -x<\/em>; consonante + <em>-y<\/em> → <em>-ies<\/em>; vocal + <em>-y<\/em> → <em>-s<\/em>; irregulares (<em>child → children, foot → feet, mouse → mice<\/em>).<\/p>\n<p><strong>Incontables (Unit 15):<\/strong>\n- Una sola forma, verbo singular, sin <em>a/an<\/em> ni números.\n- Se cuantifican con <em>some<\/em> o con expresiones como <em>a piece of, a loaf of, a bit of<\/em>.\n- Falsos amigos para hispanohablantes (incontables en inglés): <em>advice, baggage, equipment, furniture, homework, information, knowledge, luggage, machinery, money, news, traffic<\/em>.\n- Algunos son contables al referirse a una porción o un caso concreto: <em>coffee / two coffees; victory / a convincing victory<\/em>.<\/p>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<ul>\n<li><code>a/the/every + singular count noun<\/code> · <code>(Ø/some/many) + plural count noun<\/code><\/li>\n<li><code>(Ø/some/much) + uncount noun + singular verb<\/code> · <code>a piece of + uncount noun<\/code><\/li>\n<\/ul>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>He was eating another apple.<\/li>\n<li>Let me give you some advice.<\/li>\n<li>He gave me a very good piece of advice.<\/li>\n<li>Electricity is dangerous.<\/li>\n<li>We asked for two coffees. (count)<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>She gave me many informations.<\/em> → ✅ <em>She gave me <strong>a lot of information<\/strong>.<\/em><\/li>\n<li>❌ <em>an advice<\/em> → ✅ <em>a piece of advice / some advice<\/em><\/li>\n<li>❌ <em>I parked car over there.<\/em> → ✅ <em>I parked <strong>the<\/strong> car...<\/em> (singular contable sin determinante)<\/li>\n<li>❌ <em>three furnitures<\/em> → ✅ <em>three pieces of furniture<\/em><\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>equipment<\/td>\n<td>equipo, material<\/td>\n<td>incontable<\/td>\n<\/tr>\n<tr>\n<td>a piece of advice<\/td>\n<td>un consejo<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>a loaf of bread<\/td>\n<td>una barra de pan<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>a bit of<\/td>\n<td>un poco de<\/td>\n<td>coloquial<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: Unit 13, p. 16; Unit 15, p. 18.<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-GRAM-201\">GRAM-201 · Subject-verb agreement<\/a><\/li>\n<li><a href=\"#f-GRAM-207\">GRAM-207 · Singular nouns, plural nouns and collective nouns<\/a><\/li>\n<li>GRAM-217<\/li>\n<li>GRAM-213<\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p>Sustantivos en <em>-o<\/em>: unos llevan <em>-s<\/em> (<em>photos, pianos<\/em>) y otros <em>-es<\/em> (<em>heroes, potatoes<\/em>).<\/p>", "quiz": [{"tipo": "error-id", "pregunta": "The laboratory {A|recently} purchased {B|several} new {C|equipments} for {D|its} research projects.", "opciones": null, "respuesta": "C", "explicacion": "'Equipment' es incontable: no tiene plural. Correcto: 'several new pieces of equipment'."}, {"tipo": "structure", "pregunta": "Before the trip, the guide gave us ____ about the local customs.", "opciones": ["an useful advice", "some useful advice", "a useful advices", "many useful advice"], "respuesta": "B", "explicacion": "'Advice' es incontable: va con 'some', sin 'a/an' ni plural, y no con 'many'."}]}, "GRAM-207": {"id": "GRAM-207", "titulo": "Singular nouns, plural nouns and collective nouns", "categoria": "Sustantivos", "tema": "Nouns: count/noncount", "seccion": "structure", "nivel": "B1", "prioridad": "Media", "tipo": "Written Expression — error ID", "fuente": "Intermediate English Grammar and Practice", "autor": "No consta en el documento", "edicion": "", "capitulo": "Unit 14", "seccion_libro": "Singular and plural", "paginas": "Unit 14, p. 17", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> Intermediate English Grammar and Practice — Unit 14 \"Singular and plural\", p. 17.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Reconocer sustantivos que solo existen en singular o en plural (en cierto significado) y los colectivos, para concordar verbo y pronombre.<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<ul>\n<li><strong>Singular nouns<\/strong>: solo en singular con determinante; unos con <em>the<\/em> por ser únicos (<em>the sun, the sky, the world, the future<\/em>), otros con <em>a<\/em> (<em>a wash, a walk, a rest, a chance<\/em>).<\/li>\n<li><strong>Plural nouns<\/strong>: solo en plural en ese significado (<em>clothes, troops, goods, expenses, feelings<\/em>). <em>Police<\/em> es plural aunque no termine en <em>-s<\/em>.<\/li>\n<li>Objetos de <strong>dos partes<\/strong> (<em>trousers, scissors, glasses, jeans<\/em>) son plurales; para uno se dice <em>a pair of<\/em>.<\/li>\n<li><strong>Colectivos<\/strong> (<em>army, audience, committee, family, government, staff, team, public<\/em>): verbo y pronombre en singular o plural según se vea el grupo como unidad o como individuos.<\/li>\n<\/ul>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<ul>\n<li><code>These scissors are...<\/code> · <code>a pair of + plural noun (+ singular verb)<\/code><\/li>\n<li><code>The police are/were...<\/code><\/li>\n<li><code>collective noun + singular verb (unidad) / plural verb (individuos)<\/code><\/li>\n<\/ul>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>The sun was shining.<\/li>\n<li>His clothes looked terribly dirty.<\/li>\n<li>The police were informed immediately.<\/li>\n<li>These scissors are sharp.<\/li>\n<li>Our family isn't poor any more. / My family are perfectly normal.<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>The police was informed.<\/em> → ✅ <em>The police <strong>were<\/strong> informed.<\/em><\/li>\n<li>❌ <em>This trousers is too long.<\/em> → ✅ <em>These trousers <strong>are<\/strong> too long.<\/em> / <em>This pair of trousers is...<\/em><\/li>\n<li>❌ <em>a clothe<\/em> → ✅ <em>a piece of clothing / an item of clothing<\/em><\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>goods<\/td>\n<td>mercancías<\/td>\n<td>solo plural<\/td>\n<\/tr>\n<tr>\n<td>expenses<\/td>\n<td>gastos<\/td>\n<td>solo plural<\/td>\n<\/tr>\n<tr>\n<td>staff<\/td>\n<td>personal<\/td>\n<td>colectivo<\/td>\n<\/tr>\n<tr>\n<td>a pair of<\/td>\n<td>un par de<\/td>\n<td>objetos de dos partes<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: Unit 14, p. 17.<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-GRAM-201\">GRAM-201 · Subject-verb agreement<\/a><\/li>\n<li><a href=\"#f-GRAM-206\">GRAM-206 · Count and uncount nouns<\/a><\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p>Nombres de organizaciones y equipos (<em>the BBC, Liverpool<\/em>) se usan a menudo con verbo plural en inglés británico hablado; en el TOEFL (inglés americano) se prefiere el singular.<\/p>", "quiz": [{"tipo": "error-id", "pregunta": "The local police {A|has} {B|asked} residents {C|to report} any {D|suspicious} activity.", "opciones": null, "respuesta": "A", "explicacion": "'Police' es un sustantivo plural: 'have asked'."}, {"tipo": "structure", "pregunta": "The goods ____ shipped from the factory yesterday morning.", "opciones": ["was", "were", "is", "has been"], "respuesta": "B", "explicacion": "'Goods' (mercancías) solo existe en plural → 'were'."}]}, "GRAM-208": {"id": "GRAM-208", "titulo": "Personal pronouns: case and agreement", "categoria": "Pronombres", "tema": "Pronouns", "seccion": "structure", "nivel": "B1", "prioridad": "Alta", "tipo": "Written Expression — error ID", "fuente": "Intermediate English Grammar and Practice", "autor": "No consta en el documento", "edicion": "", "capitulo": "Units 16, 19", "seccion_libro": "Personal pronouns; Demonstrative pronouns", "paginas": "Unit 16, p. 19; Unit 19, p. 22", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> Intermediate English Grammar and Practice — Unit 16 \"Personal pronouns\", p. 19; Unit 19 \"Demonstrative pronouns\", p. 22.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Elegir el pronombre de sujeto u objeto correcto y hacerlo concordar en número con su antecedente.<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<ul>\n<li><strong>Sujeto<\/strong>: <em>I, you, he, she, it, we, they<\/em>. <strong>Objeto<\/strong>: <em>me, you, him, her, it, us, them<\/em> (objeto directo/indirecto y <strong>después de preposición<\/strong>).<\/li>\n<li>Tras <em>be<\/em> en inglés moderno se usa el objeto: <em>It's me.<\/em><\/li>\n<li><em>he/she<\/em> se refieren a personas; casi nunca a cosas (→ <em>it<\/em>).<\/li>\n<li>Un pronombre singular remite a un noun group singular y uno plural a un plural. Se admite plural (<em>they/them<\/em>) para referirse a indefinidos (<em>anybody<\/em>) y a colectivos.<\/li>\n<li><em>you<\/em> y <em>they<\/em> pueden referirse a la gente en general.<\/li>\n<li><em>one / ones<\/em> sustituyen a un sustantivo ya mencionado: <em>My car is the blue one.<\/em> (Unit 19)<\/li>\n<\/ul>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<ul>\n<li><code>verb / preposition + object pronoun<\/code><\/li>\n<li><code>singular antecedent → it/he/she/its<\/code> · <code>plural antecedent → they/them/their<\/code><\/li>\n<\/ul>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>John took the book and opened it.<\/li>\n<li>We were all sitting in a cafe with him.<\/li>\n<li>There was only John, Baz, and me in the room.<\/li>\n<li>If anybody comes, tell them I'm not in.<\/li>\n<li>Are the new curtains longer than the old ones?<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>between you and I<\/em> → ✅ <em>between you and <strong>me<\/strong><\/em> (objeto tras preposición)<\/li>\n<li>❌ <em>The company changed their logo; it...<\/em> (mezcla) → ✅ mantener el mismo número: <em>The company changed <strong>its<\/strong> logo.<\/em><\/li>\n<li>❌ <em>The birds built its nest.<\/em> → ✅ <em>...built <strong>their<\/strong> nests.<\/em><\/li>\n<li>❌ <em>My mother she works...<\/em> (sujeto duplicado) → ✅ <em>My mother works...<\/em><\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>subject pronoun<\/td>\n<td>pronombre sujeto<\/td>\n<td><em>I, he, they<\/em><\/td>\n<\/tr>\n<tr>\n<td>object pronoun<\/td>\n<td>pronombre objeto<\/td>\n<td><em>me, him, them<\/em><\/td>\n<\/tr>\n<tr>\n<td>one / ones<\/td>\n<td>uno(s)<\/td>\n<td>sustituye a un sustantivo contable<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: Unit 16, p. 19; Unit 19, p. 22.<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li>GRAM-210<\/li>\n<li>GRAM-211<\/li>\n<li>GRAM-212<\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p>En inglés formal se usa <em>one<\/em> para la gente en general: <em>One never knows what to say in such situations.<\/em><\/p>", "quiz": [{"tipo": "error-id", "pregunta": "The professor divided the work {A|between} {B|my partner} and {C|I}, so we {D|finished} quickly.", "opciones": null, "respuesta": "C", "explicacion": "Después de la preposición 'between' se usa pronombre objeto: 'my partner and me'."}, {"tipo": "error-id", "pregunta": "Honeybees {A|communicate} the location of food {B|by} performing a dance {C|that} tells other bees where {D|it} can find nectar.", "opciones": null, "respuesta": "D", "explicacion": "El antecedente es 'other bees' (plural): 'where they can find nectar'."}]}, "GRAM-400": {"id": "GRAM-400", "titulo": "Bare infinitive tras do/did/will y modales", "categoria": "Tiempos verbales", "tema": "Verb tenses & forms", "seccion": "structure", "nivel": "A2", "prioridad": "Alta", "tipo": "Written Expression — error ID / Structure — completion", "fuente": "The English Tenses: Practical Grammar Guide", "autor": "Williams, P.", "edicion": "2014 (ebook)", "capitulo": "Forming Tenses — 1. Grammar Words", "seccion_libro": "1.1 The Bare Infinitive (incl. 'Do' Auxiliaries, Modal Verbs)", "paginas": "s/p — 1.1 The Bare Infinitive", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> The English Tenses: Practical Grammar Guide — Williams, P., Forming Tenses — 1. Grammar Words, 1.1 The Bare Infinitive, s/p.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Reconocer que después de un auxiliar <em>do/does/did<\/em>, de <em>will<\/em> o de un modal el verbo va en <strong>bare infinitive<\/strong> (forma base, sin <em>to<\/em> y sin cambios).<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<p>El infinitivo (<em>to read<\/em>) \"nunca cambia\". El <strong>bare infinitive<\/strong> es el mismo infinitivo sin <em>to<\/em> (<em>read<\/em>). Como es un infinitivo, <strong>no se ve afectado por el tiempo ni por la concordancia sujeto-verbo<\/strong>.\n- Se usa para formar preguntas y negativas del presente y pasado simple con el auxiliar <strong>do<\/strong> (<em>do, does, did, don't, doesn't, didn't<\/em>).\n- El auxiliar <em>do<\/em> solo marca tiempo y sujeto; no aporta significado (distinto de <em>do<\/em> verbo principal = \"hacer/completar\").\n- También va tras <strong>will / be going to<\/strong> y tras modales: <em>can, could, may, might, must, shall, should, have to, ought to, used to<\/em>.\n- <em>didn't eat<\/em> no es \"mezcla de pasado y presente\": el pasado lo lleva <em>did<\/em>; <em>eat<\/em> es bare infinitive.<\/p>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<p><code>do/does/did (+ not) + subject? + bare infinitive<\/code> · <code>will / modal + bare infinitive<\/code><\/p>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li><strong>Did<\/strong> they <strong>go<\/strong> to the zoo?<\/li>\n<li>He <strong>didn't eat<\/strong> meat.<\/li>\n<li><strong>Will<\/strong> we <strong>be<\/strong> on time?<\/li>\n<li>I <strong>did<\/strong> my homework. (main verb) vs. <strong>Did<\/strong> you <strong>finish<\/strong> your homework? (auxiliary)<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>He didn't ate meat.<\/em> → ✅ <em>He didn't eat meat.<\/em> (el pasado ya está en <em>did<\/em>)<\/li>\n<li>❌ <em>Does she likes it?<\/em> → ✅ <em>Does she like it?<\/em> (la -s va en <em>does<\/em>, no en el verbo)<\/li>\n<li>❌ <em>She can speaks French.<\/em> → ✅ <em>She can speak French.<\/em><\/li>\n<li>❌ <em>We will to arrive soon.<\/em> → ✅ <em>We will arrive soon.<\/em> (sin <em>to<\/em>)<\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>bare infinitive<\/td>\n<td>infinitivo sin <em>to<\/em><\/td>\n<td>forma base: <em>go, read, be<\/em><\/td>\n<\/tr>\n<tr>\n<td>auxiliary (\"do\" auxiliary)<\/td>\n<td>verbo auxiliar<\/td>\n<td>marca tiempo y persona, sin significado propio<\/td>\n<\/tr>\n<tr>\n<td>modal verb<\/td>\n<td>verbo modal<\/td>\n<td><em>can, must, should…<\/em> + bare infinitive<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: el ebook no trae ejercicios; usar los ejemplos de 1.1 y comparar <em>did<\/em> (verbo principal) vs <em>did<\/em> (auxiliar).<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-GRAM-401\">GRAM-401 · Participios pasado y presente<\/a><\/li>\n<li><a href=\"#f-GRAM-402\">GRAM-402 · Patrones de formación de los 12 tiempos<\/a><\/li>\n<li>GRAM-413<\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p>El libro aclara que <em>do<\/em> y <em>will<\/em> son los auxiliares clave para los tiempos; los demás modales y sus usos quedan fuera de su alcance.<\/p>", "quiz": [{"tipo": "structure", "pregunta": "Did your sister ____ the letter before she left for the airport?", "opciones": ["sent", "send", "sends", "sending"], "respuesta": "B", "explicacion": "Tras el auxiliar 'did' el verbo va en bare infinitive: 'send'. El pasado ya lo marca 'did'."}, {"tipo": "error-id", "pregunta": "He {A|didn't} {B|wanted} to {C|go} to the museum {D|last} week.", "opciones": null, "respuesta": "B", "explicacion": "Después de 'didn't' se usa la forma base: 'didn't want'. 'wanted' duplica el pasado."}, {"tipo": "structure", "pregunta": "Researchers believe the new vaccine ____ thousands of lives.", "opciones": ["will saving", "will saves", "will save", "will to save"], "respuesta": "C", "explicacion": "'will' + bare infinitive (sin -ing, sin -s, sin 'to'): 'will save'."}]}, "GRAM-401": {"id": "GRAM-401", "titulo": "Participios pasado y presente", "categoria": "Tiempos verbales", "tema": "Verb tenses & forms", "seccion": "structure", "nivel": "A2", "prioridad": "Alta", "tipo": "Written Expression — error ID (forma verbal)", "fuente": "The English Tenses: Practical Grammar Guide", "autor": "Williams, P.", "edicion": "2014 (ebook)", "capitulo": "Forming Tenses — 1. Grammar Words", "seccion_libro": "1.2 The Past Participle; 1.3 The Present Participle", "paginas": "s/p — 1.2 The Past Participle / 1.3 The Present Participle", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> The English Tenses: Practical Grammar Guide — Williams, P., Forming Tenses — 1. Grammar Words, 1.2 The Past Participle / 1.3 The Present Participle, s/p.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Identificar qué participio exige cada auxiliar: <em>have<\/em> + past participle (tiempos perfectos) y <em>be<\/em> + present participle (tiempos continuos).<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<ul>\n<li><strong>Past participle<\/strong> (\"tercera forma\" del verbo): regular en <strong>-ed<\/strong>; los irregulares <strong>no siguen regla<\/strong> (quizá la mitad de los verbos) y deben memorizarse. Se usa con <strong>to have<\/strong> para los tiempos <strong>perfect<\/strong>.<\/li>\n<li><strong>Present participle<\/strong>: raíz + <strong>-ing<\/strong>. Se usa con <strong>to be<\/strong> para los tiempos <strong>continuous<\/strong>.<\/li>\n<li>Ambos participios <strong>nunca cambian<\/strong> y <strong>no concuerdan con el sujeto<\/strong>: lo que cambia es el auxiliar (<em>have/has/had<\/em>, <em>am/is/are/was/were<\/em>).<\/li>\n<\/ul>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<p><code>have/has/had/will have + past participle<\/code> · <code>be (am/is/are/was/were/will be/have been) + V-ing<\/code><\/p>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>I <strong>have wanted<\/strong> this book for years.<\/li>\n<li>We <strong>had broken<\/strong> the rules. (irregular)<\/li>\n<li>He <strong>has known<\/strong> about the party for two days.<\/li>\n<li>He <strong>is cleaning<\/strong> the car.<\/li>\n<li>They <strong>will have been reading<\/strong> for too long.<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>She has went home.<\/em> → ✅ <em>She has gone home.<\/em> (participio irregular)<\/li>\n<li>❌ <em>They have broke the rules.<\/em> → ✅ <em>They have broken the rules.<\/em><\/li>\n<li>❌ <em>He is clean the car.<\/em> → ✅ <em>He is cleaning the car.<\/em> (<em>be<\/em> exige -ing)<\/li>\n<li>❌ <em>She has been read on the train.<\/em> → ✅ <em>She has been reading…<\/em> (en voz activa)<\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>past participle<\/td>\n<td>participio pasado<\/td>\n<td><em>walked, known, given, broken<\/em><\/td>\n<\/tr>\n<tr>\n<td>present participle<\/td>\n<td>participio presente (-ing)<\/td>\n<td><em>walking, reading<\/em><\/td>\n<\/tr>\n<tr>\n<td>irregular verb<\/td>\n<td>verbo irregular<\/td>\n<td>memorizar sus 3 formas<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: sin ejercicios; repasar los ejemplos de 1.2–1.3 y el glosario del Appendix 1.<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-GRAM-400\">GRAM-400 · Bare infinitive tras do/did/will y modales<\/a><\/li>\n<li><a href=\"#f-GRAM-402\">GRAM-402 · Patrones de formación de los 12 tiempos<\/a><\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p><em>been<\/em> también es un past participle (de <em>be<\/em>), por eso aparece en todos los perfect continuous: <em>have been + V-ing<\/em>.<\/p>", "quiz": [{"tipo": "structure", "pregunta": "The board members have ____ carefully about the merger proposal.", "opciones": ["think", "thinking", "thought", "thinked"], "respuesta": "C", "explicacion": "'have' + past participle; 'think' es irregular: think-thought-thought."}, {"tipo": "error-id", "pregunta": "Since noon she {A|has} {B|been} {C|read} the report {D|in} her office.", "opciones": null, "respuesta": "C", "explicacion": "'has been' + present participle forma el present perfect continuous: 'has been reading'."}, {"tipo": "error-id", "pregunta": "The children {A|had} {B|already} {C|ate} lunch {D|when} we arrived.", "opciones": null, "respuesta": "C", "explicacion": "'had' exige past participle: 'had eaten' (eat-ate-eaten)."}]}, "GRAM-402": {"id": "GRAM-402", "titulo": "Patrones de formación de los 12 tiempos", "categoria": "Tiempos verbales", "tema": "Verb tenses & forms", "seccion": "structure", "nivel": "B1", "prioridad": "Alta", "tipo": "Structure — completion / Written Expression — error ID", "fuente": "The English Tenses: Practical Grammar Guide", "autor": "Williams, P.", "edicion": "2014 (ebook)", "capitulo": "Forming Tenses — 2. Tense Forms", "seccion_libro": "2.1 Simple Forms; 2.2 Continuous Forms; 2.3 Perfect Forms; 2.4 Perfect Continuous Forms", "paginas": "s/p — 2.1–2.4 Tense Forms", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> The English Tenses: Practical Grammar Guide — Williams, P., Forming Tenses — 2. Tense Forms, 2.1–2.4, s/p.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Construir (y detectar errores en) afirmativas, preguntas, negativas y preguntas negativas de los cuatro aspectos en pasado, presente y futuro.<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<p>Los 12 tiempos salen de 4 patrones aplicados a 3 tiempos (past / present / future):\n- <strong>Simple:<\/strong> verbo en pasado/presente; futuro con <em>will<\/em> / <em>be going to<\/em> + bare infinitive. Preguntas y negativas con <em>do/does/did<\/em>; con <em>to be<\/em> no se usa <em>do<\/em> (<em>Are you happy?<\/em>).\n- <strong>Continuous (progressive):<\/strong> <em>be<\/em> + present participle; futuro <em>will be<\/em> + V-ing.\n- <strong>Perfect:<\/strong> <em>have<\/em> + past participle; futuro <em>will have<\/em> + past participle.\n- <strong>Perfect continuous:<\/strong> <em>have been<\/em> + V-ing; futuro <em>will have been<\/em> + V-ing.\n- Solo el primer auxiliar concuerda con el sujeto o marca el tiempo; <em>will<\/em>, <em>be<\/em>, <em>have<\/em>, <em>been<\/em> y los participios no cambian.\n- <strong>Preguntas negativas:<\/strong> sin contracción, <em>not<\/em> va <strong>después<\/strong> del sujeto (<em>Are you not…?<\/em>, formal); contraída, toda la contracción va <strong>antes<\/strong> del sujeto (<em>Aren't you…?<\/em>, lo más común).\n- <strong>Will vs shall:<\/strong> ante la duda, <em>will<\/em>. En preguntas, <em>shall<\/em> solo con <em>I/we<\/em> para ofrecer o sugerir (<em>Shall we dance?<\/em>).<\/p>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<p><code>(will) + be + V-ing<\/code> · <code>(will) + have + V3<\/code> · <code>(will) + have + been + V-ing<\/code> · <code>Aux + n't + subject…?<\/code> / <code>Aux + subject + not…?<\/code><\/p>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>Are you not going to the party? / <strong>Aren't you<\/strong> going to the party?<\/li>\n<li>She <strong>will have arrived<\/strong> by this time tomorrow.<\/li>\n<li><strong>Haven't we tried<\/strong> this already?<\/li>\n<li>We <strong>will have been walking<\/strong> for hours.<\/li>\n<li><strong>Shall I<\/strong> open the window for you?<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>Don't you are happy?<\/em> → ✅ <em>Aren't you happy?<\/em> (con <em>be<\/em> no se usa <em>do<\/em>)<\/li>\n<li>❌ <em>Do not you want to go?<\/em> → ✅ <em>Don't you want to go?<\/em> / <em>Do you not want to go?<\/em><\/li>\n<li>❌ <em>She will has arrived.<\/em> → ✅ <em>She will have arrived.<\/em> (tras <em>will<\/em>, <em>have<\/em> no cambia)<\/li>\n<li>❌ <em>Shall you pass me that book?<\/em> → ✅ <em>Will you pass me that book?<\/em><\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>aspect<\/td>\n<td>aspecto<\/td>\n<td>simple, continuous, perfect, perfect continuous<\/td>\n<\/tr>\n<tr>\n<td>progressive<\/td>\n<td>= continuous<\/td>\n<td>nombre alterno<\/td>\n<\/tr>\n<tr>\n<td>negative question<\/td>\n<td>pregunta negativa<\/td>\n<td>la contracción va antes del sujeto<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: las tablas de forma de cada tiempo (secciones 3, 5, 8, 11, 15, 17, 20, 25, 31, 32, 36, 39, 41) no aparecen en esta versión convertida (probablemente eran imágenes).<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-GRAM-400\">GRAM-400 · Bare infinitive tras do/did/will y modales<\/a><\/li>\n<li><a href=\"#f-GRAM-401\">GRAM-401 · Participios pasado y presente<\/a><\/li>\n<li>GRAM-416<\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p><em>Shall<\/em> es poco común en inglés moderno (aún menos en inglés americano, que es el del TOEFL) y no suele usarse con palabras interrogativas.<\/p>", "quiz": [{"tipo": "structure", "pregunta": "____ going to the conference tonight? I thought you had registered.", "opciones": ["Aren't you", "Don't you", "You aren't", "Not are you"], "respuesta": "A", "explicacion": "Pregunta negativa contraída: la contracción completa va antes del sujeto. Con 'be' + going no se usa 'do'."}, {"tipo": "structure", "pregunta": "By next month, the engineers ____ the new bridge.", "opciones": ["will finish have", "will have finished", "will has finished", "have will finished"], "respuesta": "B", "explicacion": "Future perfect: will + have (invariable) + past participle."}, {"tipo": "error-id", "pregunta": "{A|Will} they not {B|have} {C|been} {D|work} on the project all week?", "opciones": null, "respuesta": "D", "explicacion": "Perfect continuous: have + been + present participle → 'been working'."}]}, "GRAM-403": {"id": "GRAM-403", "titulo": "Past simple: acciones terminadas y tiempo específico", "categoria": "Tiempos verbales", "tema": "Verb tenses & forms", "seccion": "structure", "nivel": "A2", "prioridad": "Alta", "tipo": "Written Expression — error ID / Structure — completion", "fuente": "The English Tenses: Practical Grammar Guide", "autor": "Williams, P.", "edicion": "2014 (ebook)", "capitulo": "The Past — The Past Simple", "seccion_libro": "3. Past Simple Form; 4. Past Simple Uses (4.1 Completed actions, 4.2 Emphasising detail, 4.3 States)", "paginas": "s/p — 3–4 The Past Simple", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> The English Tenses: Practical Grammar Guide — Williams, P., The Past — The Past Simple, secciones 3–4, s/p.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Usar el past simple para acciones, eventos o estados terminados, sobre todo cuando hay una <strong>expresión de tiempo pasado específica<\/strong>.<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<ul>\n<li><strong>4.1 Completed actions:<\/strong> la acción o estado terminó y ya no afecta directamente al presente.<\/li>\n<li>Suele ir con un <strong>tiempo pasado<\/strong> (<em>last week, in 1982, on Monday, at 9.30pm<\/em>) o una <strong>time clause<\/strong> con <em>when<\/em>.<\/li>\n<li><strong>4.2 Emphasising detail:<\/strong> si otro tiempo es posible, el past simple <strong>subraya que terminó<\/strong> y cuándo; también puede enfatizar <em>quién<\/em> lo hizo o expresar fastidio.<\/li>\n<li><strong>4.3 States:<\/strong> con verbos de estado (<em>have, be, seem, look, smell…<\/em>) se usa past simple, no continuo, aunque el estado pudiera seguir.<\/li>\n<li>Preguntas/negativas con <em>was/were<\/em> no llevan <em>did<\/em>.<\/li>\n<\/ul>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<p><code>subject + V-ed / V2<\/code> · <code>did (+ not) + bare infinitive<\/code> · <code>was/were (+ not)<\/code><\/p>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>They <strong>went<\/strong> home at 9.30pm.<\/li>\n<li>It was too bright <strong>when they turned on<\/strong> the main lights.<\/li>\n<li>I have seen this film. / I <strong>saw<\/strong> this film <strong>last week<\/strong>.<\/li>\n<li>She <strong>seemed<\/strong> happy when I saw her.<\/li>\n<li>You <strong>were not<\/strong> quick enough.<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>I have seen this film last week.<\/em> → ✅ <em>I saw this film last week.<\/em> (tiempo pasado específico)<\/li>\n<li>❌ <em>Did you were at home?<\/em> → ✅ <em>Were you at home?<\/em><\/li>\n<li>❌ <em>Your hair was looking fantastic.<\/em> (como estado) → ✅ <em>Your hair looked fantastic.<\/em><\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>last week / in 1982 / ago<\/td>\n<td>la semana pasada / en 1982 / hace<\/td>\n<td>marcadores de past simple<\/td>\n<\/tr>\n<tr>\n<td>time clause (when…)<\/td>\n<td>cláusula temporal<\/td>\n<td><em>when they gave him a piece of cake<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: sin ejercicios; tablas de forma (3.1–3.4) no disponibles en esta conversión.<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-GRAM-404\">GRAM-404 · Past continuous vs past simple<\/a><\/li>\n<li>GRAM-409<\/li>\n<li>GRAM-411<\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p>En 4.2 el texto dice \"the past perfect is usually used to discuss visited locations… 'I have been to France'\": por el ejemplo, se refiere al <strong>present perfect<\/strong> (errata del libro).<\/p>", "quiz": [{"tipo": "structure", "pregunta": "The city museum ____ its doors to the public in 1982.", "opciones": ["has opened", "opens", "opened", "had been opening"], "respuesta": "C", "explicacion": "Fecha pasada específica (in 1982) → past simple 'opened'."}, {"tipo": "error-id", "pregunta": "She {A|has watched} the documentary {B|on} television {C|last} night and {D|enjoyed} it.", "opciones": null, "respuesta": "A", "explicacion": "'last night' es tiempo pasado específico → 'watched', no present perfect."}]}, "GRAM-404": {"id": "GRAM-404", "titulo": "Past continuous vs past simple", "categoria": "Tiempos verbales", "tema": "Verb tenses & forms", "seccion": "structure", "nivel": "B1", "prioridad": "Alta", "tipo": "Structure — completion / Written Expression — error ID", "fuente": "The English Tenses: Practical Grammar Guide", "autor": "Williams, P.", "edicion": "2014 (ebook)", "capitulo": "The Past — The Past Continuous", "seccion_libro": "6. Past Continuous Uses (6.1–6.3); 7. Past Continuous and Past Simple", "paginas": "s/p — 5–7 The Past Continuous", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> The English Tenses: Practical Grammar Guide — Williams, P., The Past — The Past Continuous, secciones 6–7, s/p.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Elegir entre <em>was/were + V-ing<\/em> (acción en progreso o interrumpida) y past simple (acción terminada / interrupción).<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<ul>\n<li><strong>6.1 Temporary actions:<\/strong> acción temporal que <strong>había empezado antes<\/strong> de un punto del pasado y estaba en curso; puede ser interrumpida por un evento en past simple.<\/li>\n<li><strong>6.2 Ongoing processes:<\/strong> acción repetida o progresiva durante un periodo (<em>all day, every night for months<\/em>); con <em>forever/always<\/em> expresa fastidio.<\/li>\n<li><strong>6.3 Narratives:<\/strong> da el <strong>fondo<\/strong> de una historia; el evento principal va en past simple (a menudo en una time clause con <em>when<\/em>).<\/li>\n<li><strong>7.<\/strong> Past simple = algo <strong>terminó<\/strong>; past continuous = algo <strong>estaba en progreso<\/strong> (había empezado).<\/li>\n<li>Verbos de estado (<em>be, have, seem, look, sound<\/em>) → past simple aunque el estado sea temporal. Excepción: <em>feel<\/em> admite ambos.<\/li>\n<\/ul>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<p><code>was/were + V-ing … when + past simple<\/code><\/p>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>I <strong>was walking<\/strong> home at 3pm.<\/li>\n<li>They <strong>were eating<\/strong> dinner <strong>when<\/strong> the phone <strong>rang<\/strong>.<\/li>\n<li>He <strong>was taking<\/strong> a bath when the police <strong>knocked<\/strong> on the door.<\/li>\n<li>I was happy before the phone rang. (not <em>I was being happy<\/em>)<\/li>\n<li>I felt sad yesterday. / I was feeling sad yesterday.<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>While I walked home, it was starting to rain.<\/em> → ✅ <em>While I was walking home, it started to rain.<\/em><\/li>\n<li>❌ <em>He was seeming angry.<\/em> → ✅ <em>He seemed angry.<\/em><\/li>\n<li>❌ <em>When the phone was ringing, they ate dinner.<\/em> (invierte fondo e interrupción) → ✅ <em>They were eating dinner when the phone rang.<\/em><\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>when / while<\/td>\n<td>cuando / mientras<\/td>\n<td><em>while<\/em> + continuo (fondo); <em>when<\/em> + simple (interrupción)<\/td>\n<\/tr>\n<tr>\n<td>forever / always + V-ing<\/td>\n<td>siempre (queja)<\/td>\n<td>matiz negativo<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: sin ejercicios; tablas 5.1–5.4 no disponibles en esta conversión.<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-GRAM-403\">GRAM-403 · Past simple: acciones terminadas y tiempo específico<\/a><\/li>\n<li><a href=\"#f-GRAM-406\">GRAM-406 · Past perfect continuous y contrastes<\/a><\/li>\n<li>GRAM-409<\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p>El libro advierte que \"simple = completo, continuo = en curso\" es una simplificación: el continuo también puede mostrar una acción <strong>interrumpida<\/strong> (que por tanto terminó).<\/p>", "quiz": [{"tipo": "structure", "pregunta": "We ____ dinner when the lights suddenly went out.", "opciones": ["are eating", "were eating", "have eaten", "had been eat"], "respuesta": "B", "explicacion": "Acción en progreso interrumpida por un evento puntual en past simple → past continuous 'were eating'."}, {"tipo": "error-id", "pregunta": "When I {A|saw} him at the station, he {B|was seeming} {C|extremely} {D|tired}.", "opciones": null, "respuesta": "B", "explicacion": "'seem' es verbo de estado: se usa en forma simple → 'seemed'."}]}, "GRAM-405": {"id": "GRAM-405", "titulo": "Past perfect: secuencia de eventos pasados", "categoria": "Tiempos verbales", "tema": "Verb tenses & forms", "seccion": "structure", "nivel": "B1", "prioridad": "Alta", "tipo": "Structure — completion / Written Expression — error ID", "fuente": "The English Tenses: Practical Grammar Guide", "autor": "Williams, P.", "edicion": "2014 (ebook)", "capitulo": "The Past — The Past Perfect", "seccion_libro": "9. Past Perfect Uses (9.1–9.3); 10. Past Perfect and Past Simple", "paginas": "s/p — 8–10 The Past Perfect", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> The English Tenses: Practical Grammar Guide — Williams, P., The Past — The Past Perfect, secciones 9–10, s/p.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Usar <em>had + past participle<\/em> para un evento <strong>terminado antes de otro evento pasado<\/strong>, y saber cuándo basta el past simple.<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<ul>\n<li><strong>9.1 Past event sequences:<\/strong> el past perfect va unido a un evento en past simple, con <em>and, that, because, so, when, before, already<\/em>. Suele implicar que el primer evento <strong>influyó<\/strong> en el segundo.<\/li>\n<li><strong>9.2 States:<\/strong> con verbos de estado (<em>be, know, understand, want<\/em>) muestra duración/grado hasta otro evento pasado: <em>had known… for two days when…<\/em><\/li>\n<li><strong>9.3 Background information:<\/strong> en narraciones, aporta hechos anteriores a la línea principal (que va en past simple).<\/li>\n<li><strong>10.<\/strong> Si el orden es obvio o no importa, a menudo sirve cualquiera de los dos (<em>before<\/em> ya marca el orden). El past perfect enfatiza la conexión/causa; en pasiva (<em>had been broken<\/em>) indica que alguien realizó la acción.<\/li>\n<\/ul>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<p><code>had + past participle … (before/when/by the time) + past simple<\/code><\/p>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>I <strong>had left<\/strong> my book at home <strong>so<\/strong> I did not study in the cafe.<\/li>\n<li>He <strong>had put on<\/strong> too much aftershave <strong>before<\/strong> he went out.<\/li>\n<li>I <strong>had known<\/strong> about the problem for two days when the printer broke.<\/li>\n<li>Jim arrived at the crime scene. He found a man who <strong>had been shot<\/strong>.<\/li>\n<li>I had travelled / I travelled for two miles before I ran out of petrol. (ambas aceptables)<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>By the time we arrived, the film has started.<\/em> → ✅ <em>…the film had started.<\/em><\/li>\n<li>❌ <em>She had went out.<\/em> → ✅ <em>She had gone out.<\/em><\/li>\n<li>❌ Usar past perfect sin ningún otro punto pasado de referencia: <em>I had visited Rome.<\/em> (aislado) → ✅ <em>I visited Rome.<\/em><\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>by the time<\/td>\n<td>para cuando<\/td>\n<td>típico disparador de past perfect<\/td>\n<\/tr>\n<tr>\n<td>before / already<\/td>\n<td>antes / ya<\/td>\n<td>ordenan los eventos<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: sin ejercicios; tablas 8.1–8.4 no disponibles en esta conversión.<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-GRAM-403\">GRAM-403 · Past simple: acciones terminadas y tiempo específico<\/a><\/li>\n<li><a href=\"#f-GRAM-406\">GRAM-406 · Past perfect continuous y contrastes<\/a><\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p>Según el libro, en la práctica muchos hablantes entienden igual el past simple y el past perfect cuando <em>before/after<\/em> ya deja claro el orden.<\/p>", "quiz": [{"tipo": "structure", "pregunta": "When the guests finally arrived, the cook ____ all the bread.", "opciones": ["has already burned", "had already burned", "was already burn", "already burns"], "respuesta": "B", "explicacion": "Evento terminado antes de otro evento pasado (arrived) → past perfect 'had already burned'."}, {"tipo": "error-id", "pregunta": "By the time the police {A|arrived}, the thieves {B|have} {C|escaped} {D|through} the back door.", "opciones": null, "respuesta": "B", "explicacion": "'By the time' + past simple exige past perfect en la otra cláusula: 'had escaped'."}]}, "GRAM-406": {"id": "GRAM-406", "titulo": "Past perfect continuous y contrastes", "categoria": "Tiempos verbales", "tema": "Verb tenses & forms", "seccion": "structure", "nivel": "B2", "prioridad": "Media", "tipo": "Structure — completion / Written Expression — error ID", "fuente": "The English Tenses: Practical Grammar Guide", "autor": "Williams, P.", "edicion": "2014 (ebook)", "capitulo": "The Past — The Past Perfect Continuous", "seccion_libro": "12. Past Perfect Continuous Uses; 13. …and Past Continuous; 14. …and Past Perfect", "paginas": "s/p — 11–14 The Past Perfect Continuous", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> The English Tenses: Practical Grammar Guide — Williams, P., The Past — The Past Perfect Continuous, secciones 12–14, s/p.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Usar <em>had been + V-ing<\/em> para la <strong>duración<\/strong> de una actividad hasta un punto del pasado, y distinguirlo del past continuous y del past perfect.<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<ul>\n<li><strong>12.1 Duration:<\/strong> actividad continua o repetida en curso hasta otro evento pasado que la termina o interrumpe; suele ir con <em>for<\/em> / <em>since<\/em>.<\/li>\n<li><strong>12.2 Completed past processes:<\/strong> proceso terminado poco antes de un punto pasado cuyo resultado se nota (pelo mojado, cansancio); enfatiza la actividad; puede expresar irritación.<\/li>\n<li><strong>13. vs past continuous:<\/strong> el past continuous con duración indica <strong>simultaneidad<\/strong> (<em>for an hour while she spoke<\/em>); el past perfect continuous indica que la actividad <strong>empezó antes<\/strong> y llevaba tiempo.<\/li>\n<li><strong>14. vs past perfect:<\/strong> past perfect = <strong>resultado/completitud<\/strong> (<em>for twelve people<\/em>); past perfect continuous = <strong>proceso/duración<\/strong> (<em>for two hours<\/em>).<\/li>\n<\/ul>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<p><code>had been + V-ing (+ for/since …) + when/before + past simple<\/code><\/p>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>I <strong>had been reading for hours<\/strong> when I fell asleep.<\/li>\n<li>Her hair was wet because she <strong>had been swimming<\/strong>.<\/li>\n<li>I <strong>had been washing<\/strong> the car <strong>for an hour<\/strong> when she phoned.<\/li>\n<li>I had cooked dinner for twelve people. / I <strong>had been cooking<\/strong> dinner for two hours.<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>I was washing the car for an hour when she phoned.<\/em> → ✅ <em>I had been washing the car for an hour when she phoned.<\/em><\/li>\n<li>❌ <em>They had been work all day.<\/em> → ✅ <em>They had been working all day.<\/em><\/li>\n<li>❌ <em>She had been knowing him for years.<\/em> (estado) → ✅ <em>She had known him for years.<\/em><\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>for + periodo<\/td>\n<td>durante<\/td>\n<td><em>for an hour, for months<\/em><\/td>\n<\/tr>\n<tr>\n<td>since + punto<\/td>\n<td>desde<\/td>\n<td><em>since the night before<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: sin ejercicios; tablas 11.1–11.4 no disponibles en esta conversión.<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-GRAM-404\">GRAM-404 · Past continuous vs past simple<\/a><\/li>\n<li><a href=\"#f-GRAM-405\">GRAM-405 · Past perfect: secuencia de eventos pasados<\/a><\/li>\n<li>GRAM-412<\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p>La diferencia 14 (proceso vs completitud) es la misma que entre past continuous y past simple, desplazada a \"antes de otro evento pasado\".<\/p>", "quiz": [{"tipo": "structure", "pregunta": "Her eyes were red because she ____ for most of the afternoon.", "opciones": ["has been crying", "had been crying", "was cried", "had cry"], "respuesta": "B", "explicacion": "Proceso anterior a un punto pasado (were red) cuyo efecto se ve → past perfect continuous."}, {"tipo": "error-id", "pregunta": "The workers {A|had been} {B|strike} {C|for} three weeks {D|before} the company agreed to their demands.", "opciones": null, "respuesta": "B", "explicacion": "'had been' + present participle: 'had been striking'."}]}, "GRAM-407": {"id": "GRAM-407", "titulo": "Present simple: hechos generales y frecuencia", "categoria": "Tiempos verbales", "tema": "Verb tenses & forms", "seccion": "structure", "nivel": "A2", "prioridad": "Alta", "tipo": "Structure — completion / Written Expression — error ID", "fuente": "The English Tenses: Practical Grammar Guide", "autor": "Williams, P.", "edicion": "2014 (ebook)", "capitulo": "The Present — The Present Simple", "seccion_libro": "16. Present Simple Uses (16.1–16.6)", "paginas": "s/p — 15–16 The Present Simple", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> The English Tenses: Practical Grammar Guide — Williams, P., The Present — The Present Simple, sección 16, s/p.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Usar el present simple para hechos atemporales, hábitos/frecuencia y sus usos especiales (comentarios, narración, verbos performativos).<\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<ul>\n<li><strong>16.1 General facts:<\/strong> verdades atemporales, reglas, horarios, aficiones (<em>I play golf<\/em>).<\/li>\n<li><strong>16.2 Frequency:<\/strong> actividades repetidas; <strong>adverbios de frecuencia<\/strong> (<em>usually, often, always, sometimes<\/em>) <strong>antes del verbo<\/strong>; expresiones con <em>every/most<\/em> o <em>at the weekend / on Tuesday afternoons<\/em> al final.<\/li>\n<li><strong>16.3 States:<\/strong> verbos de estado en presente simple aunque sean temporales (ver GRAM-409).<\/li>\n<li><strong>16.4 Commentaries:<\/strong> narración deportiva en vivo.<\/li>\n<li><strong>16.5 Storytelling:<\/strong> relatos informales y resúmenes de tramas de películas/libros.<\/li>\n<li><strong>16.6 Spoken actions:<\/strong> la acción se cumple al decirla (<em>promise, suggest, apologise, agree<\/em>) y verbos performativos (<em>declare, pronounce, arrest<\/em>).<\/li>\n<\/ul>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<p><code>subject + V / V-s (3ª persona)<\/code> · <code>subject + frequency adverb + V<\/code> · <code>do/does (+ not) + bare infinitive<\/code><\/p>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>When you heat water, it <strong>boils<\/strong>.<\/li>\n<li>Jane <strong>usually buys<\/strong> our milk.<\/li>\n<li>She <strong>works<\/strong> at the weekend.<\/li>\n<li>Ronnie <strong>passes<\/strong> to Jim, he <strong>shoots<\/strong>, he <strong>scores<\/strong>!<\/li>\n<li>I <strong>declare<\/strong> this supermarket open.<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>Jane buys usually our milk.<\/em> → ✅ <em>Jane usually buys our milk.<\/em> (adverbio antes del verbo principal)<\/li>\n<li>❌ <em>Water is boiling at 100 °C.<\/em> (hecho general) → ✅ <em>Water boils at 100 °C.<\/em><\/li>\n<li>❌ <em>She work at the weekend.<\/em> → ✅ <em>She works…<\/em> (-s de 3ª persona)<\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>usually / often / sometimes<\/td>\n<td>normalmente / a menudo / a veces<\/td>\n<td>antes del verbo<\/td>\n<\/tr>\n<tr>\n<td>every / most + tiempo<\/td>\n<td>cada / casi todos<\/td>\n<td>al final de la oración<\/td>\n<\/tr>\n<tr>\n<td>performative verbs<\/td>\n<td>verbos performativos<\/td>\n<td><em>declare, pronounce, baptise, arrest<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: sin ejercicios; tablas 15.1–15.4 no disponibles en esta conversión.<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-GRAM-408\">GRAM-408 · Present continuous vs present simple<\/a><\/li>\n<li>GRAM-409<\/li>\n<li>GRAM-414<\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p>El present simple presenta algo como hecho aunque sea opinión (<em>All lizards look the same<\/em>).<\/p>", "quiz": [{"tipo": "structure", "pregunta": "At sea level, pure water ____ at 100 degrees Celsius.", "opciones": ["boil", "is boiling", "boils", "has boiled"], "respuesta": "C", "explicacion": "Hecho científico general y atemporal → present simple con -s: 'boils'."}, {"tipo": "error-id", "pregunta": "Maria {A|usually} {B|take} the bus {C|to} work, but today she {D|is walking}.", "opciones": null, "respuesta": "B", "explicacion": "Hábito en 3ª persona singular → 'takes'. 'is walking' es correcto (temporal, hoy)."}]}, "GRAM-408": {"id": "GRAM-408", "titulo": "Present continuous vs present simple", "categoria": "Tiempos verbales", "tema": "Verb tenses & forms", "seccion": "structure", "nivel": "B1", "prioridad": "Alta", "tipo": "Structure — completion / Written Expression — error ID", "fuente": "The English Tenses: Practical Grammar Guide", "autor": "Williams, P.", "edicion": "2014 (ebook)", "capitulo": "The Present — The Present Continuous", "seccion_libro": "18. Present Continuous Uses (18.1–18.4); 19. Present Continuous and Present Simple", "paginas": "s/p — 17–19 The Present Continuous", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> The English Tenses: Practical Grammar Guide — Williams, P., The Present — The Present Continuous, secciones 18–19, s/p.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Decidir entre <em>am/is/are + V-ing<\/em> y present simple con la pregunta clave del libro: <strong>¿es temporal?<\/strong><\/p>\n<h2>📘 Regla / Concepto<\/h2>\n<ul>\n<li><strong>18.1 Temporary actions:<\/strong> acción empezada y no terminada, en un periodo que <strong>incluye ahora<\/strong> (no necesariamente en este instante: <em>We are learning to speak English<\/em>).<\/li>\n<li><strong>18.2 Processes of change:<\/strong> con <em>increase, decrease, become, develop, expand, get, grow<\/em> (<em>Unemployment is rising<\/em>). Pregunta: ¿el proceso puede terminar? Sí → continuo; regla general → simple.<\/li>\n<li><strong>18.3 Repeated actions:<\/strong> con <em>always, forever, constantly<\/em> el continuo expresa <strong>irritación<\/strong>; el simple es neutro.<\/li>\n<li><strong>18.4 Temporary states:<\/strong> coloquial (<em>I'm loving this burger<\/em>); el libro recomienda a los estudiantes <strong>evitarlo<\/strong>.<\/li>\n<li><strong>19.<\/strong> Simple = atemporal; continuo = temporal (actual).<\/li>\n<\/ul>\n<h2>🧩 Estructura / Fórmula<\/h2>\n<p><code>am/is/are (+ not) + V-ing<\/code><\/p>\n<h2>💬 Ejemplos (del texto)<\/h2>\n<ul>\n<li>I read books. / I <strong>am reading<\/strong> a book.<\/li>\n<li>That dog runs very fast. / That dog <strong>is running<\/strong> very fast. (on this occasion)<\/li>\n<li>Howard <strong>is getting<\/strong> fat. / Howard <strong>gets<\/strong> fat when he eats chocolate.<\/li>\n<li>They <strong>are constantly arguing<\/strong>. / They constantly argue.<\/li>\n<\/ul>\n<h2>⚠️ Errores comunes (clave TOEFL)<\/h2>\n<ul>\n<li>❌ <em>Look! The baby sleeps.<\/em> → ✅ <em>Look! The baby is sleeping.<\/em><\/li>\n<li>❌ <em>Prices rise sharply this month.<\/em> → ✅ <em>Prices are rising sharply this month.<\/em> (proceso temporal)<\/li>\n<li>❌ <em>I am understanding the question.<\/em> → ✅ <em>I understand the question.<\/em> (estado)<\/li>\n<\/ul>\n<h2>🔤 Vocabulario clave<\/h2>\n<div class=\"tabla\"><table>\n<thead>\n<tr>\n<th>Palabra/colocación<\/th>\n<th>Significado<\/th>\n<th>Nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>at the moment / now / currently<\/td>\n<td>en este momento<\/td>\n<td>disparadores del continuo<\/td>\n<\/tr>\n<tr>\n<td>constantly / forever<\/td>\n<td>constantemente<\/td>\n<td>+ V-ing = queja<\/td>\n<\/tr>\n<tr>\n<td>rise, grow, get, become<\/td>\n<td>subir, crecer, volverse<\/td>\n<td>verbos de cambio<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>📝 Práctica<\/h2>\n<ul>\n<li>Ref. libro: sin ejercicios; tablas 17.1–17.4 no disponibles en esta conversión.<\/li>\n<\/ul>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-GRAM-407\">GRAM-407 · Present simple: hechos generales y frecuencia<\/a><\/li>\n<li>GRAM-409<\/li>\n<li>GRAM-414<\/li>\n<\/ul>\n<h2>🗒️ Notas / Excepciones<\/h2>\n<p>Para el examen, trata <em>I'm loving / I'm liking<\/em> como incorrecto: el libro lo llama \"grammatically questionable\".<\/p>", "quiz": [{"tipo": "structure", "pregunta": "According to the latest report, unemployment in the region ____ steadily at the moment.", "opciones": ["rises", "is rising", "rose", "has been rise"], "respuesta": "B", "explicacion": "Proceso de cambio temporal en curso ('at the moment') → present continuous 'is rising'."}, {"tipo": "error-id", "pregunta": "Right now my brother {A|reads} a novel {B|in} his room, so {C|please} don't {D|disturb} him.", "opciones": null, "respuesta": "A", "explicacion": "'Right now' indica acción en curso → 'is reading'."}]}, "METO-100": {"id": "METO-100", "titulo": "El TOEFL es una prueba normativa (NRT), no de criterio (CRT)", "categoria": "Cómo funcionan los exámenes", "tema": "Exámenes: cómo funcionan y cómo prepararse", "seccion": "meto", "nivel": "Todos", "prioridad": "Alta", "tipo": "No aplica — método de estudio", "fuente": "Testing in Language Programs", "autor": "Brown, J. D.", "edicion": "1996 (Prentice Hall Regents)", "capitulo": "Chapter 1 — Types and Uses of Language Tests", "seccion_libro": "Norm-referenced and criterion-referenced tests", "paginas": "pp. 3–7", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Testing in Language Programs<\/em> — Brown, J. D., Chapter 1, \"Norm-referenced and criterion-referenced tests\", pp. 3–7.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Entender qué tipo de examen es el TOEFL ITP para prepararlo con la estrategia correcta: habilidad general amplia, no una lista cerrada de temas.<\/p>\n<h2>📘 Idea clave<\/h2>\n<p>Brown distingue dos familias de pruebas:<\/p>\n<ul>\n<li><strong>NRT (norm-referenced test):<\/strong> compara a cada estudiante con un grupo de referencia y \"reparte\" los puntajes en una curva normal. Mide habilidades <strong>generales<\/strong>. Brown pone al TOEFL como ejemplo: <em>\"The Test of English as a Foreign Language (1994) (TOEFL) is a good example of such a test.\"<\/em> (p. 5).<\/li>\n<li><strong>CRT (criterion-referenced test):<\/strong> mide cuánto del material de un curso domina el estudiante (en porcentaje), como un examen final de clase.<\/li>\n<\/ul>\n<p>Consecuencias para quien presenta un NRT:\n- El contenido es amplio e impredecible: <em>\"Students rarely know in any detail what content to expect on an NRT.\"<\/em> (p. 7). Se conoce el <strong>formato<\/strong>, no los puntos exactos.\n- Cada sección es larga (30–50 preguntas) y mezcla contenidos muy variados (p. 6).\n- Las preguntas se eligen para <strong>diferenciar<\/strong> entre candidatos: habrá preguntas fáciles, medias y difíciles a propósito.<\/p>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li><strong>Estudia el formato al 100 %<\/strong> (eso sí es predecible): número de preguntas, tiempo y tipo de ítem por sección (Listening, Structure &amp; Written Expression, Reading).<\/li>\n<li><strong>Estudia el contenido \"en amplitud\"<\/strong>: recorre todo el mapa de cobertura del curso (gramática, lectura, listening) en lugar de memorizar 20 preguntas de un libro.<\/li>\n<li><strong>Usa mini-pruebas tipo CRT para aprender<\/strong> (5–10 preguntas de un solo tema, p. ej. \"subject–verb agreement\") y <strong>pruebas tipo NRT para medirte<\/strong> (simulacros completos y mezclados).<\/li>\n<li><strong>Acepta que no lo sabrás todo<\/strong>: en un NRT es normal fallar las preguntas más difíciles; el objetivo para 500 no es la perfección.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Creer que \"si me sé el libro X, saco 500\": el TOEFL no evalúa un libro, sino habilidad general.<\/li>\n<li>Practicar solo ejercicios por tema y nunca un simulacro mezclado y cronometrado.<\/li>\n<li>Frustrarse por no reconocer algunas preguntas: el NRT está diseñado para que casi nadie acierte todo.<\/li>\n<\/ul>\n<h2>📝 Acción para esta semana<\/h2>\n<p>Escribe en una hoja la estructura oficial del TOEFL ITP (secciones, número de preguntas, minutos). Luego clasifica tu material de estudio en dos columnas: \"para aprender (CRT, por tema)\" y \"para medirme (NRT, simulacro completo)\".<\/p>\n<h2>🔗 Relacionado<\/h2>\n<ul>\n<li><a href=\"#f-METO-101\">METO-101 · Puntaje escalado y percentil: qué significa 500<\/a><\/li>\n<li><a href=\"#f-METO-107\">METO-107 · Diagnóstico por temas: registro de errores<\/a><\/li>\n<li>METO-109<\/li>\n<\/ul>", "quiz": []}, "METO-101": {"id": "METO-101", "titulo": "Puntaje escalado y percentil: qué significa 500", "categoria": "Cómo funcionan los exámenes", "tema": "Exámenes: cómo funcionan y cómo prepararse", "seccion": "meto", "nivel": "Todos", "prioridad": "Media", "tipo": "No aplica — método de estudio", "fuente": "Testing in Language Programs", "autor": "Brown, J. D.", "edicion": "1996 (Prentice Hall Regents)", "capitulo": "Chapter 1 — Types and Uses of Language Tests; Chapter 5 — Interpreting Test Scores", "seccion_libro": "Percentage vs percentile; The Importance of Standardized Scores", "paginas": "pp. 4, 136–137", "html": "<blockquote>\n<p><strong>Fuente:<\/strong> <em>Testing in Language Programs<\/em> — Brown, J. D., Chapter 1 (p. 4) y Chapter 5, \"The Importance of Standardized Scores\", pp. 136–137.<\/p>\n<\/blockquote>\n<h2>🎯 Objetivo<\/h2>\n<p>Interpretar correctamente un puntaje TOEFL (o de un simulacro): no es un \"porcentaje de aciertos\", sino una posición en una escala.<\/p>\n<h2>📘 Idea clave<\/h2>\n<ul>\n<li><strong>Porcentaje vs percentil.<\/strong> En un CRT importa el <em>porcentaje<\/em> de material dominado; en un NRT importa el <em>percentil<\/em>, la posición frente a los demás: <em>\"A student scored in the 84th percentile, which means that the student scored better than 84 out of 100 students\"<\/em> (p. 4).<\/li>\n<li><strong>Escalas estandarizadas.<\/strong> Brown explica que el TOEFL reporta las secciones en una escala tipo T (media 50) y el total en una escala tipo CEEB (media 500): <em>\"my example 'average' student might have a total TOEFL score of 500.\"<\/em> (p. 137).<\/li>\n<li>Por eso <strong>un mismo número de aciertos no siempre da el mismo puntaje<\/strong>: los aciertos brutos (raw score) se convierten a la escala con tablas propias de cada forma del examen.<\/li>\n<\/ul>\n<blockquote>\n<p>Nota del curso: Brown describe el TOEFL en papel de los años 90; el TOEFL ITP actual usa la misma escala total 310–677 y secciones en escala aproximada 31–68. Las tablas de conversión cambian entre formas.<\/p>\n<\/blockquote>\n<h2>🛠️ Cómo aplicarlo como autodidacta<\/h2>\n<ol>\n<li>Al corregir un simulacro, <strong>anota dos números<\/strong>: aciertos brutos por sección y el puntaje escalado según la tabla de ese simulacro.<\/li>\n<li><strong>Nunca conviertas por regla de tres<\/strong> (\"acerté 60 %, entonces saco 60 % de 677\"): usa siempre la tabla de conversión del material.<\/li>\n<li>Piensa en 500 como \"habilidad intermedia sólida, cerca del promedio de la escala\", no como \"aprobar con 5/10\".<\/li>\n<li>Fíjate metas <strong>por sección<\/strong> (p. ej. Structure 50, Reading 50, Listening 49): la escala de cada sección se promedia para formar el total.<\/li>\n<\/ol>\n<h2>⚠️ Errores comunes del autodidacta<\/h2>\n<ul>\n<li>Confundir porcentaje de aciertos con puntaje TOEFL.<\/li>\n<li>Comparar puntajes de simulacros de distintas editoriales sin
