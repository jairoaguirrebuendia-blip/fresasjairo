<title>Ruta TOEFL 500</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: hoja de respuestas TOEFL ITP — barra lateral de secciones como índice del cuadernillo,
   área de lectura a la derecha; los ejercicios se contestan rellenando óvalos A–D. */
:root {
  --papel: #F5F6F2;        /* fondo: papel de cuadernillo, gris con sesgo verde-azul */
  --hoja: #FFFFFF;         /* superficies de lectura */
  --tinta: #1B2A33;        /* texto principal */
  --tinta-2: #55646B;      /* texto secundario */
  --linea: #D6DCD8;        /* reglas y bordes */
  --acento: #1E6470;       /* tinta de formulario ETS: verde azulado */
  --acento-suave: #E2EEEE;
  --lapiz: #F2C230;        /* marca de lápiz/resaltador, uso puntual */
  --bien: #2F7A3E;  --bien-suave: #E3F1E4;
  --mal: #B3392F;   --mal-suave: #F7E4E1;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-texto: "Literata", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radio: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papel: #12191D; --hoja: #182227; --tinta: #E3E9E6; --tinta-2: #9AABAE; --linea: #2B3A40;
    --acento: #6FB8C2; --acento-suave: #1D3337; --lapiz: #E7B925;
    --bien: #74C07F; --bien-suave: #1B3220; --mal: #EE8A7F; --mal-suave: #3A201D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papel: #12191D; --hoja: #182227; --tinta: #E3E9E6; --tinta-2: #9AABAE; --linea: #2B3A40;
  --acento: #6FB8C2; --acento-suave: #1D3337; --lapiz: #E7B925;
  --bien: #74C07F; --bien-suave: #1B3220; --mal: #EE8A7F; --mal-suave: #3A201D;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--papel); color: var(--tinta);
  font-family: var(--f-texto); font-size: 16px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--acento); }
a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible {
  outline: 2px solid var(--acento); outline-offset: 2px;
}
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
.mono, .eyebrow { font-family: var(--f-mono); }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-2); }

/* ---------- Estructura ---------- */
.app { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: 100vh; }
.lateral {
  border-right: 1px solid var(--linea); background: var(--papel);
  position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto;
  padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
  display: flex; flex-direction: column; gap: 20px;
}
.marca { display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: var(--tinta); }
.marca strong { font-family: var(--f-display); font-size: 22px; letter-spacing: -.01em; }
.marca span { font-family: var(--f-mono); font-size: 12px; color: var(--tinta-2); }
.buscar input {
  width: 100%; font: 14px var(--f-mono); padding: 9px 10px; border-radius: var(--radio);
  border: 1px solid var(--linea); background: var(--hoja); color: var(--tinta);
}
.nav-principal { display: flex; flex-direction: column; gap: 2px; }
.nav-principal a, .tema-link {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  text-decoration: none; color: var(--tinta); font-family: var(--f-display); font-size: 15px;
  padding: 6px 8px; border-radius: var(--radio);
}
.nav-principal a:hover, .tema-link:hover { background: var(--acento-suave); }
.nav-principal a[aria-current="page"], .tema-link[aria-current="page"] {
  background: var(--acento); color: var(--hoja);
}
.nav-principal a[aria-current="page"] .cuenta, .tema-link[aria-current="page"] .cuenta { color: var(--hoja); }
.cuenta { font-family: var(--f-mono); font-size: 12px; color: var(--tinta-2); font-variant-numeric: tabular-nums; }
.grupo { display: flex; flex-direction: column; gap: 2px; }
.grupo h2 { font-size: 12px; font-family: var(--f-mono); font-weight: 500; letter-spacing: .08em;
  text-transform: uppercase; color: var(--tinta-2); padding: 0 8px 4px; }
.tema-link { font-size: 14px; font-family: var(--f-texto); }
.tema-link.vacio { color: var(--tinta-2); }

.principal {
  min-width: 0; padding-block: 32px 64px;
  padding-left: max(16px, 4vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 4vw);
}
.contenido { max-width: 820px; display: flex; flex-direction: column; gap: 28px; }

.barra-movil { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .lateral {
    position: fixed; inset: 0; z-index: 20; height: 100%; transform: translateX(-100%);
    transition: transform .2s ease; padding-top: calc(env(safe-area-inset-top, 0px) + 20px);
    padding-right: max(16px, env(safe-area-inset-right, 0px)); border-right: 0;
  }
  .lateral.abierta { transform: none; }
  .barra-movil {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
    background: var(--papel); border-bottom: 1px solid var(--linea);
    padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    z-index: 11; background: var(--papel); }
  .barra-movil strong { font-family: var(--f-display); font-size: 18px; }
  .principal { padding-top: 20px; }
}
@media (prefers-reduced-motion: reduce) { .lateral { transition: none; } }

.boton {
  font: 500 14px var(--f-display); padding: 9px 14px; border-radius: var(--radio); cursor: pointer;
  border: 1px solid var(--acento); background: var(--acento); color: var(--hoja);
}
.boton.secundario { background: transparent; color: var(--acento); }
.boton:disabled { opacity: .5; cursor: default; }

/* ---------- Encabezados de vista ---------- */
.cabecera { display: flex; flex-direction: column; gap: 10px; }
.cabecera h1 { font-size: clamp(30px, 5vw, 44px); letter-spacing: -.02em; }
.cabecera p { margin: 0; max-width: 62ch; color: var(--tinta-2); }

/* Escala TOEFL ITP 310–677 */
.escala { display: flex; flex-direction: column; gap: 6px; }
.escala-barra { position: relative; height: 10px; border-radius: 5px; background: var(--linea); }
.escala-barra .meta { position: absolute; top: -5px; width: 3px; height: 20px; background: var(--tinta); border-radius: 2px; }
.escala-barra .rango { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--acento); }
.escala-etiquetas { display: flex; justify-content: space-between; font: 12px var(--f-mono); color: var(--tinta-2); font-variant-numeric: tabular-nums; }

.secciones-resumen { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.sec-tarjeta {
  background: var(--hoja); border: 1px solid var(--linea); border-radius: var(--radio);
  padding: 16px; display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: var(--tinta);
}
.sec-tarjeta h3 { font-size: 17px; }
.sec-tarjeta .fila { display: flex; justify-content: space-between; font: 13px var(--f-mono); color: var(--tinta-2); }
.medidor { height: 6px; border-radius: 3px; background: var(--linea); overflow: hidden; }
.medidor > i { display: block; height: 100%; background: var(--acento); }

/* Plan de semanas */
.plan { display: flex; flex-direction: column; border-top: 1px solid var(--linea); }
.semana { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 16px; padding-block: 14px; border-bottom: 1px solid var(--linea); }
.semana .num { font: 500 13px var(--f-mono); color: var(--tinta-2); padding-top: 3px; }
.semana h3 { font-size: 17px; }
.semana p { margin: 4px 0 0; color: var(--tinta-2); font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip {
  font: 12px var(--f-mono); padding: 3px 8px; border-radius: 999px; text-decoration: none;
  border: 1px solid var(--linea); color: var(--tinta); background: var(--hoja);
}
.chip.vacio { color: var(--tinta-2); border-style: dashed; background: transparent; }
.chip.hecho { border-color: var(--acento); color: var(--acento); }

.aviso { background: var(--acento-suave); border-radius: var(--radio); padding: 14px 16px; font-size: 15px; }
.aviso strong { font-family: var(--f-display); }

/* ---------- Fichas ---------- */
.ficha { background: var(--hoja); border: 1px solid var(--linea); border-radius: var(--radio); }
.ficha > summary {
  list-style: none; cursor: pointer; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px;
}
.ficha > summary::-webkit-details-marker { display: none; }
.ficha > summary .linea1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; }
.ficha > summary h3 { font-size: 19px; }
.ficha .id { font: 12px var(--f-mono); color: var(--tinta-2); }
.ficha .fuente { font: 13px var(--f-mono); color: var(--tinta-2); }
.ficha .etiquetas { display: flex; flex-wrap: wrap; gap: 6px; }
.etq { font: 11px var(--f-mono); letter-spacing: .04em; padding: 2px 7px; border-radius: 4px; background: var(--acento-suave); color: var(--tinta); }
.etq.alta { background: var(--lapiz); color: #1B2A33; }
.ficha[open] > summary { border-bottom: 1px solid var(--linea); }
.ficha .cuerpo { padding: 4px 18px 18px; overflow-wrap: anywhere; }
.cuerpo h2 { font-size: 16px; margin: 20px 0 6px; }
.cuerpo blockquote { margin: 12px 0; padding: 6px 14px; border-left: 3px solid var(--linea); color: var(--tinta-2); font-size: 15px; }
.cuerpo code { font-family: var(--f-mono); font-size: 14px; background: var(--acento-suave); padding: 1px 5px; border-radius: 3px; }
.cuerpo pre { overflow-x: auto; background: var(--acento-suave); padding: 10px; border-radius: var(--radio); }
.cuerpo pre code { background: none; padding: 0; }
.cuerpo ul, .cuerpo ol { padding-left: 22px; }
.tabla { overflow-x: auto; margin: 10px 0; }
.tabla table { border-collapse: collapse; font-size: 14px; min-width: 100%; }
.tabla th, .tabla td { border-bottom: 1px solid var(--linea); padding: 6px 10px; text-align: left; vertical-align: top; }
.tabla th { font-family: var(--f-display); font-weight: 500; }
.ficha .pie { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center;
  border-top: 1px solid var(--linea); padding: 12px 18px; font: 13px var(--f-mono); color: var(--tinta-2); }
.ficha.foco { outline: 2px solid var(--lapiz); outline-offset: 2px; }

/* ---------- Ejercicios: óvalos de hoja de respuestas ---------- */
.ejercicios { display: flex; flex-direction: column; gap: 14px; }
.pregunta {
  background: var(--hoja); border: 1px solid var(--linea); border-radius: var(--radio);
  padding: 16px 18px; display: flex; flex-direction: column; gap: 12px;
}
.pregunta .meta-q { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font: 12px var(--f-mono); color: var(--tinta-2); }
.pregunta .meta-q a { color: var(--tinta-2); }
.enunciado { font-size: 17px; line-height: 1.7; white-space: pre-line; }
.seg { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1.5px; position: relative; }
.seg sub { font: 600 11px var(--f-mono); color: var(--acento); margin-left: 2px; }
.opciones { display: flex; flex-direction: column; gap: 6px; }
.opcion {
  display: grid; grid-template-columns: 30px minmax(0, 1fr); align-items: center; gap: 10px;
  text-align: left; font: inherit; font-size: 16px; color: var(--tinta); background: transparent;
  border: 1px solid transparent; border-radius: var(--radio); padding: 6px 8px; cursor: pointer;
}
.opcion:hover:not(:disabled) { border-color: var(--linea); }
.ovalo {
  width: 28px; height: 20px; border-radius: 50%; border: 1.5px solid var(--tinta-2);
  display: grid; place-items: center; font: 500 11px var(--f-mono); color: var(--tinta-2);
}
.opcion.marcada .ovalo { background: var(--tinta); border-color: var(--tinta); color: var(--hoja); }
.opcion.correcta { background: var(--bien-suave); }
.opcion.correcta .ovalo { background: var(--bien); border-color: var(--bien); color: var(--hoja); }
.opcion.incorrecta { background: var(--mal-suave); }
.opcion.incorrecta .ovalo { background: var(--mal); border-color: var(--mal); color: var(--hoja); }
.opcion:disabled { cursor: default; }
.explicacion { font-size: 15px; border-top: 1px dashed var(--linea); padding-top: 10px; }
.explicacion b { font-family: var(--f-display); }
.explicacion.bien b { color: var(--bien); }
.explicacion.mal b { color: var(--mal); }

.marcador { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font: 14px var(--f-mono); }
.marcador .num { font-size: 22px; font-family: var(--f-display); font-variant-numeric: tabular-nums; }

.resultados { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.resultado { background: var(--hoja); border: 1px solid var(--linea); border-radius: var(--radio); padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.resultado .pct { font: 700 30px var(--f-display); font-variant-numeric: tabular-nums; }

.lista-simple { display: flex; flex-direction: column; border-top: 1px solid var(--linea); }
.lista-simple > * { padding-block: 10px; border-bottom: 1px solid var(--linea); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.lista-simple a { text-decoration: none; }
.vacio-estado { color: var(--tinta-2); font-style: italic; }
</style>

<div class="app">
  <header class="barra-movil">
    <strong>Ruta TOEFL 500</strong>
    <button class="boton secundario" id="abrir-menu" type="button" aria-controls="lateral" aria-expanded="false">Temas</button>
  </header>

  <nav class="lateral" id="lateral" aria-label="Índice del curso">
    <a class="marca" href="#inicio"><strong>Ruta TOEFL 500</strong><span>TOEFL ITP · 310–677 · meta 500</span></a>
    <div class="buscar"><input id="buscar" type="search" placeholder="Buscar tema o regla…" aria-label="Buscar en las fichas"></div>
    <div class="nav-principal" id="nav-principal"></div>
    <div id="nav-temas" style="display:flex;flex-direction:column;gap:18px"></div>
  </nav>

  <main class="principal"><div class="contenido" id="vista"></div></main>
</div>

<script>
const DATOS = /*__DATOS__*/null;
const CLAVE = "ruta-toefl-500-v1";

/* ---------- Progreso local (solo en este navegador) ---------- */
function leerProgreso() {
  try { return JSON.parse(localStorage.getItem(CLAVE)) || { q: {}, vistas: {} }; }
  catch (e) { return { q: {}, vistas: {} }; }
}
let progreso = leerProgreso();
function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(progreso)); } catch (e) {} }
function registrar(qid, ok) {
  const r = progreso.q[qid] || { ok: 0, mal: 0 };
  ok ? r.ok++ : r.mal++;
  r.ultimo = ok; r.t = Date.now();
  progreso.q[qid] = r; guardar();
}

/* ---------- Utilidades ---------- */
const $ = (sel, raiz = document) => raiz.querySelector(sel);
function el(tag, attrs = {}, ...hijos) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) e.setAttribute(k, v);
  }
  for (const h of hijos.flat()) if (h !== null && h !== undefined && h !== false) e.append(h.nodeType ? h : document.createTextNode(h));
  return e;
}
const LETRAS = ["A", "B", "C", "D"];
const NOMBRE_TIPO = { structure: "Structure", "error-id": "Written Expression", vocab: "Vocabulary", reading: "Reading", listening: "Listening" };
const todosTemas = DATOS.secciones.flatMap(s => s.temas.map(t => ({ ...t, seccion: s })));
const temaPorSlug = Object.fromEntries(todosTemas.map(t => [t.slug, t]));
function temaDeFicha(fid) { return todosTemas.find(t => t.fichas.includes(fid)); }
function preguntasDe(ids) {
  return ids.flatMap(fid => DATOS.fichas[fid].quiz.map((q, i) => ({ ...q, qid: `${fid}#${i}`, fid })));
}
function barajar(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fuenteCorta(f) { return [f.fuente, f.capitulo, f.paginas].filter(Boolean).join(" · "); }

/* ---------- Pregunta con óvalos ---------- */
function crearPregunta(q, { modo = "inmediato", numero = null, alResponder = null } = {}) {
  const caja = el("div", { class: "pregunta" });
  const tipo = NOMBRE_TIPO[q.tipo] || q.tipo;
  const f = DATOS.fichas[q.fid];
  caja.append(el("div", { class: "meta-q" },
    el("span", {}, (numero ? numero + " · " : "") + tipo),
    el("a", { href: "#f-" + q.fid }, q.fid + " · " + f.titulo)));

  const enun = el("div", { class: "enunciado" });
  let opciones;
  if (q.tipo === "error-id") {
    const partes = String(q.pregunta).split(/(\{[A-D]\|[^}]+\})/);
    opciones = [];
    for (const p of partes) {
      const m = p.match(/^\{([A-D])\|([^}]+)\}$/);
      if (m) { enun.append(el("span", { class: "seg" }, m[2], el("sub", {}, m[1]))); opciones.push(m[2]); }
      else enun.append(p);
    }
  } else {
    enun.textContent = q.pregunta;
    opciones = q.opciones || [];
  }
  caja.append(enun);

  const lista = el("div", { class: "opciones", role: "group", "aria-label": "Opciones" });
  const botones = opciones.map((txt, i) => el("button", { class: "opcion", type: "button" },
    el("span", { class: "ovalo", "aria-hidden": "true" }, LETRAS[i]), el("span", {}, LETRAS[i] + ") " + txt)));
  lista.append(...botones);
  caja.append(lista);

  const estado = { elegida: null, calificada: false, ok: null };
  function calificar() {
    if (estado.calificada || estado.elegida === null) return;
    estado.calificada = true;
    const correcta = LETRAS.indexOf(String(q.respuesta).trim().toUpperCase());
    estado.ok = estado.elegida === correcta;
    botones.forEach((b, i) => {
      b.disabled = true;
      if (i === correcta) b.classList.add("correcta");
      else if (i === estado.elegida) b.classList.add("incorrecta");
    });
    caja.append(el("div", { class: "explicacion " + (estado.ok ? "bien" : "mal") },
      el("b", {}, estado.ok ? "Correcto. " : `La respuesta es ${LETRAS[correcta]}. `), q.explicacion || ""));
    registrar(q.qid, estado.ok);
    if (alResponder) alResponder(estado.ok);
  }
  botones.forEach((b, i) => b.addEventListener("click", () => {
    if (estado.calificada) return;
    estado.elegida = i;
    botones.forEach((o, j) => o.classList.toggle("marcada", j === i));
    if (modo === "inmediato") calificar();
    else if (alResponder) alResponder(null);
  }));
  caja.calificar = calificar;
  caja.estado = estado;
  return caja;
}

function bloqueEjercicios(preguntas, titulo) {
  const marcador = el("div", { class: "marcador" });
  let bien = 0, hechas = 0;
  const pintar = () => { marcador.replaceChildren(
    el("span", {}, el("span", { class: "num" }, `${bien}/${hechas}`), " correctas"),
    el("span", { class: "cuenta" }, `${preguntas.length - hechas} por contestar`)); };
  pintar();
  const lista = el("div", { class: "ejercicios" },
    preguntas.map((q, i) => crearPregunta(q, { numero: i + 1, alResponder: ok => { hechas++; if (ok) bien++; pintar(); } })));
  return el("section", { class: "cabecera", id: "practica" },
    el("h2", { style: "font-size:24px" }, titulo), marcador, lista);
}

/* ---------- Navegación ---------- */
function construirNav() {
  const enBanco = Object.values(progreso.q).filter(r => r.ultimo === false).length;
  const items = [["inicio", "Inicio y plan"], ["simulacro", "Mini simulacro"], ["repaso", "Banco de errores", enBanco || ""], ["fuentes", "Fuentes"]];
  $("#nav-principal").replaceChildren(...items.map(([h, t, c]) =>
    el("a", { href: "#" + h, "data-ruta": h }, el("span", {}, t), c !== undefined ? el("span", { class: "cuenta" }, String(c)) : null)));
  $("#nav-temas").replaceChildren(...DATOS.secciones.map(s => el("div", { class: "grupo" },
    el("h2", {}, s.nombre),
    s.temas.map(t => el("a", { class: "tema-link" + (t.fichas.length ? "" : " vacio"), href: "#" + t.slug, "data-ruta": t.slug },
      el("span", {}, t.nombre), el("span", { class: "cuenta" }, String(t.fichas.length)))))));
}
function marcarActual(ruta) {
  document.querySelectorAll("[data-ruta]").forEach(a => a.toggleAttribute("aria-current", a.dataset.ruta === ruta) || a.removeAttribute("aria-current"));
  document.querySelectorAll("[data-ruta]").forEach(a => { if (a.dataset.ruta === ruta) a.setAttribute("aria-current", "page"); });
}

/* ---------- Vistas ---------- */
function avanceTema(t) {
  const qs = preguntasDe(t.fichas);
  const ok = qs.filter(q => progreso.q[q.qid]?.ultimo === true).length;
  return { total: qs.length, ok };
}

function vistaInicio() {
  const v = [];
  const totalF = Object.keys(DATOS.fichas).length;
  const totalQ = Object.values(DATOS.fichas).reduce((n, f) => n + f.quiz.length, 0);
  v.push(el("header", { class: "cabecera" },
    el("span", { class: "eyebrow" }, "Curso autodidacta · TOEFL ITP"),
    el("h1", {}, "De tus libros a 500 puntos"),
    el("p", {}, `${totalF} fichas sacadas de ${DATOS.fuentes.length} libros, con ${totalQ} preguntas originales estilo TOEFL. Cada ficha dice de qué libro y página salió.`)));

  const pct = (500 - 310) / (677 - 310) * 100;
  v.push(el("section", { class: "escala", "aria-label": "Escala del TOEFL ITP" },
    el("span", { class: "eyebrow" }, "Escala TOEFL ITP Level 1"),
    el("div", { class: "escala-barra" }, el("i", { class: "rango", style: `width:${pct}%` }), el("i", { class: "meta", style: `left:calc(${pct}% - 1px)` })),
    el("div", { class: "escala-etiquetas" }, el("span", {}, "310"), el("span", {}, "500 ≈ B1 · tu meta"), el("span", {}, "677"))));

  v.push(el("section", { class: "cabecera" }, el("h2", { style: "font-size:24px" }, "Tu avance por sección"),
    el("div", { class: "secciones-resumen" }, DATOS.secciones.map(s => {
      const fichas = s.temas.flatMap(t => t.fichas);
      const qs = preguntasDe(fichas);
      const ok = qs.filter(q => progreso.q[q.qid]?.ultimo === true).length;
      const primero = s.temas.find(t => t.fichas.length) || s.temas[0];
      return el("a", { class: "sec-tarjeta", href: "#" + primero.slug },
        el("h3", {}, s.nombre),
        el("div", { class: "fila" }, el("span", {}, `${fichas.length} fichas`), el("span", {}, qs.length ? `${ok}/${qs.length} dominadas` : "sin preguntas")),
        el("div", { class: "medidor" }, el("i", { style: `width:${qs.length ? ok / qs.length * 100 : 0}%` })));
    }))));

  v.push(el("div", { class: "aviso" }, el("strong", {}, "Cómo usar el curso. "),
    "Sigue una semana a la vez: lee las fichas de cada tema, contesta su práctica y revisa el banco de errores antes de empezar algo nuevo. Sesión sugerida: 20 min de ficha y práctica, 20 min de lectura o audio real en inglés, 10 min de banco de errores. Tu avance se guarda solo en este navegador."));

  v.push(el("section", { class: "cabecera" }, el("h2", { style: "font-size:24px" }, "Plan de 12 semanas"),
    el("p", {}, "Ordenado por lo que más sube el puntaje: primero gramática (Structure), luego lectura, al final listening."),
    el("div", { class: "plan" }, DATOS.plan.map(w => el("div", { class: "semana" },
      el("div", { class: "num" }, "Sem " + String(w.semana).padStart(2, "0")),
      el("div", {}, el("h3", {}, w.foco), el("p", {}, w.nota),
        el("div", { class: "chips" }, w.temas.map(sl => {
          const t = temaPorSlug[sl]; const a = avanceTema(t);
          const hecho = a.total && a.ok === a.total;
          return el("a", { class: "chip" + (t.fichas.length ? "" : " vacio") + (hecho ? " hecho" : ""), href: "#" + sl },
            t.nombre + (t.fichas.length ? (a.total ? ` · ${a.ok}/${a.total}` : "") : " · sin fichas"));
        }))))))));

  if (DATOS.faltantes.length) v.push(el("div", { class: "aviso" }, el("strong", {}, "Temas sin fichas todavía. "),
    "Tus libros no cubren: " + DATOS.faltantes.join(", ") + ". Un libro de preparación TOEFL ITP los completaría."));
  return v;
}

function tarjetaFicha(f, abierta) {
  const det = el("details", { class: "ficha", id: "f-" + f.id }, null);
  if (abierta) det.open = true;
  det.append(el("summary", {},
    el("div", { class: "linea1" }, el("h3", {}, f.titulo), el("span", { class: "id" }, f.id)),
    el("div", { class: "fuente" }, fuenteCorta(f)),
    el("div", { class: "etiquetas" },
      f.nivel ? el("span", { class: "etq" }, f.nivel === "Todos" ? "Todos los niveles" : "CEFR " + f.nivel) : null,
      f.prioridad ? el("span", { class: "etq" + (f.prioridad === "Alta" ? " alta" : "") }, "Prioridad " + f.prioridad.toLowerCase()) : null,
      f.quiz.length ? el("span", { class: "etq" }, f.quiz.length + " preguntas") : null)));
  det.append(el("div", { class: "cuerpo", html: f.html }));
  det.append(el("div", { class: "pie" },
    el("span", {}, [f.autor, f.edicion, f.seccion_libro].filter(Boolean).join(" · ")),
    progreso.vistas[f.id] ? el("span", {}, "Leída") : null));
  det.addEventListener("toggle", () => { if (det.open && !progreso.vistas[f.id]) { progreso.vistas[f.id] = true; guardar(); } });
  return det;
}

function vistaTema(t, foco) {
  const v = [];
  const fuentes = [...new Set(t.fichas.map(id => DATOS.fichas[id].fuente))];
  v.push(el("header", { class: "cabecera" },
    el("span", { class: "eyebrow" }, t.seccion.nombre),
    el("h1", {}, t.nombre),
    el("p", {}, t.fichas.length
      ? `${t.fichas.length} fichas de ${fuentes.length} ${fuentes.length === 1 ? "libro" : "libros"}. Léelas en orden y luego contesta la práctica.`
      : "Ninguno de tus libros cubre este tema todavía.")));
  if (!t.fichas.length) return v;
  v.push(el("div", { style: "display:flex;flex-direction:column;gap:12px" },
    t.fichas.map((id, i) => tarjetaFicha(DATOS.fichas[id], foco ? id === foco : i === 0))));
  const qs = preguntasDe(t.fichas);
  if (qs.length) v.push(bloqueEjercicios(qs, "Practica este tema"));
  return v;
}

function vistaSimulacro() {
  const todas = preguntasDe(Object.keys(DATOS.fichas));
  const partes = [
    ["Structure", q => q.tipo === "structure", 15],
    ["Written Expression", q => q.tipo === "error-id", 25],
    ["Reading y vocabulario", q => q.tipo === "reading" || q.tipo === "vocab", 15],
    ["Listening (transcripciones)", q => q.tipo === "listening", 10],
  ].map(([nombre, filtro, n]) => ({ nombre, qs: barajar(todas.filter(filtro)).slice(0, n) })).filter(p => p.qs.length);

  const v = [el("header", { class: "cabecera" },
    el("span", { class: "eyebrow" }, "Práctica cronometrada"),
    el("h1", {}, "Mini simulacro"),
    el("p", {}, "Preguntas al azar de todas las fichas, con la misma proporción que la Sección 2 del ITP (15 Structure + 25 Written Expression). Rellena tus óvalos y califica al final. El porcentaje te orienta; no es un puntaje oficial."))];
  const cajas = [];
  let n = 0;
  const reloj = el("span", { class: "num" }, "00:00");
  const inicio = Date.now();
  const tic = setInterval(() => {
    if (!document.body.contains(reloj)) return clearInterval(tic);
    const s = Math.floor((Date.now() - inicio) / 1000);
    reloj.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }, 1000);
  v.push(el("div", { class: "marcador" }, reloj, el("span", { class: "cuenta" }, `${partes.reduce((a, p) => a + p.qs.length, 0)} preguntas`)));
  for (const p of partes) {
    v.push(el("h2", { style: "font-size:22px" }, p.nombre));
    v.push(el("div", { class: "ejercicios" }, p.qs.map(q => { const c = crearPregunta(q, { modo: "examen", numero: ++n }); c.parte = p.nombre; cajas.push(c); return c; })));
  }
  const res = el("div", { class: "resultados" });
  const btn = el("button", { class: "boton", type: "button", onclick: () => {
    clearInterval(tic);
    cajas.forEach(c => c.calificar());
    res.replaceChildren(...partes.map(p => {
      const cs = cajas.filter(c => c.parte === p.nombre);
      const ok = cs.filter(c => c.estado.ok).length;
      return el("div", { class: "resultado" }, el("span", { class: "eyebrow" }, p.nombre),
        el("span", { class: "pct" }, Math.round(ok / cs.length * 100) + "%"), el("span", { class: "cuenta" }, `${ok} de ${cs.length}`));
    }));
    btn.disabled = true; construirNav(); res.scrollIntoView({ behavior: "smooth", block: "center" });
  } }, "Calificar simulacro");
  v.push(el("div", { style: "display:flex;gap:10px;flex-wrap:wrap" }, btn,
    el("button", { class: "boton secundario", type: "button", onclick: () => render(true) }, "Nuevo simulacro")));
  v.push(res);
  return v;
}

function vistaRepaso() {
  const todas = preguntasDe(Object.keys(DATOS.fichas));
  const pendientes = todas.filter(q => progreso.q[q.qid]?.ultimo === false)
    .sort((a, b) => (progreso.q[a.qid].t || 0) - (progreso.q[b.qid].t || 0));
  const v = [el("header", { class: "cabecera" },
    el("span", { class: "eyebrow" }, "Repaso"),
    el("h1", {}, "Banco de errores"),
    el("p", {}, "Aquí llegan las preguntas que fallaste la última vez, de la más antigua a la más reciente. Al contestarlas bien salen del banco."))];
  if (!pendientes.length) v.push(el("p", { class: "vacio-estado" }, "El banco está vacío. Contesta la práctica de un tema o haz un mini simulacro; lo que falles aparecerá aquí."));
  else v.push(bloqueEjercicios(pendientes, `${pendientes.length} por repasar`));
  return v;
}

function vistaFuentes() {
  return [el("header", { class: "cabecera" },
      el("span", { class: "eyebrow" }, "Trazabilidad"),
      el("h1", {}, "Fuentes"),
      el("p", {}, `Libros de los que salieron las fichas. Curso generado el ${DATOS.generado}.`)),
    el("div", { class: "lista-simple" }, DATOS.fuentes.map(f => el("div", {},
      el("span", {}, el("strong", { style: "font-family:var(--f-display)" }, f.titulo), " — ", [f.autor, f.edicion].filter(Boolean).join(", ")),
      el("span", { class: "cuenta" }, f.n + " fichas"))))];
}

function vistaBusqueda(texto) {
  const t = texto.toLowerCase();
  const hits = Object.values(DATOS.fichas).filter(f =>
    (f.titulo + " " + f.categoria + " " + f.tema + " " + f.fuente).toLowerCase().includes(t)).slice(0, 60);
  return [el("header", { class: "cabecera" }, el("span", { class: "eyebrow" }, "Búsqueda"), el("h1", {}, `“${texto}”`),
      el("p", {}, hits.length ? `${hits.length} fichas` : "Sin resultados. Prueba con el nombre en inglés (p. ej. “present perfect”).")),
    el("div", { class: "lista-simple" }, hits.map(f => el("a", { href: "#f-" + f.id },
      el("span", {}, el("strong", { style: "font-family:var(--f-display)" }, f.titulo), " · ", f.tema),
      el("span", { class: "cuenta" }, f.id))))];
}

/* ---------- Router ---------- */
function render(forzar) {
  const h = decodeURIComponent(location.hash.slice(1)) || "inicio";
  let vista, ruta = h, foco = null;
  if (h.startsWith("f-") && DATOS.fichas[h.slice(2)]) {
    foco = h.slice(2); const t = temaDeFicha(foco); ruta = t.slug; vista = vistaTema(t, foco);
  } else if (temaPorSlug[h]) vista = vistaTema(temaPorSlug[h]);
  else if (h === "simulacro") vista = vistaSimulacro();
  else if (h === "repaso") vista = vistaRepaso();
  else if (h === "fuentes") vista = vistaFuentes();
  else { ruta = "inicio"; vista = vistaInicio(); }
  $("#vista").replaceChildren(...vista);
  construirNav(); marcarActual(ruta);
  cerrarMenu();
  if (foco) { const c = document.getElementById("f-" + foco); if (c) { c.classList.add("foco"); c.scrollIntoView({ block: "start" }); } }
  else window.scrollTo(0, 0);
}

function cerrarMenu() { $("#lateral").classList.remove("abierta"); $("#abrir-menu").setAttribute("aria-expanded", "false"); }
$("#abrir-menu").addEventListener("click", () => {
  const abierta = $("#lateral").classList.toggle("abierta");
  $("#abrir-menu").setAttribute("aria-expanded", String(abierta));
});
let espera;
$("#buscar").addEventListener("input", e => {
  clearTimeout(espera);
  const t = e.target.value.trim();
  espera = setTimeout(() => {
    if (t.length < 2) return render();
    $("#vista").replaceChildren(...vistaBusqueda(t)); marcarActual(null);
  }, 180);
});
window.addEventListener("hashchange", () => render());
render();
</script>
